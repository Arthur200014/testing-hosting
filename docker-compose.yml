services:
  board-pilot:
    build:
      context: ./platform
      dockerfile: Dockerfile.board-pilot
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      TAS_BOARD_PILOT_ORIGIN: ${TAS_BOARD_PILOT_ORIGIN:?set the approved pilot HTTPS origin}
      TAS_BOARD_PILOT_DB_HOST: ${TAS_BOARD_PILOT_DB_HOST:?set the approved PostgreSQL host}
      TAS_BOARD_PILOT_API_DB: ${TAS_BOARD_PILOT_API_DB:?set the dedicated API database URL}
      TAS_BOARD_STAGING_DB: ${TAS_BOARD_STAGING_DB:?set the dedicated board journal URL}
      TAS_BOARD_PILOT_DB_CA: ${TAS_BOARD_PILOT_DB_CA:-}
      TAS_BOARD_STAGING_SIGNING_KEY: ${TAS_BOARD_STAGING_SIGNING_KEY:?set an independent board signing key}
      BoardPrototype__SceneRootKey: ${BOARD_PILOT_SCENE_KEY:?set an independent scene key}
      Jwt__SigningKey: ${BOARD_PILOT_JWT_KEY:?set an independent login key}
      StudentCodes__Pepper: ${BOARD_PILOT_STUDENT_PEPPER:?set an independent student code pepper}
      BoardPrototype__Enabled: ${BOARD_PILOT_ENABLED:-false}
      BoardPrototype__StagingWorkspaceId: ${BOARD_PILOT_WORKSPACE_ID:-}
