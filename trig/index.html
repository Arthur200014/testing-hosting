<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Обратная связь</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background: #f0f4f0; }
        h1 { color: #2c3e50; }
        .field { background: #fff; padding: 15px; margin: 15px 0; border-radius: 10px; border: 2px solid #8fa14a; }
        label { display: block; margin: 8px 0; font-weight: bold; }
        input[type="text"], input[type="email"], textarea { width: 100%; padding: 8px; border: 2px solid #8fa14a; border-radius: 6px; box-sizing: border-box; }
        textarea { height: 120px; }
        button { background: #6b7a3a; color: #fff; border: none; padding: 12px 30px; font-size: 18px; border-radius: 8px; cursor: pointer; }
        button:hover { background: #5a6a2a; }
        .success { display: none; background: #8fa14a; color: #fff; padding: 15px; border-radius: 10px; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>📩 Обратная связь</h1>
    <p>Напишите свои вопросы, отзывы или предложения.</p>

    <form id="feedbackForm" method="POST" action="https://script.google.com/macros/s/AKfycbyLYA3n1BhdnnofZ0EuncPCPXdEzExB_fWTxIMePxOZYeFblKTMYWK0IHy7zSu0PObk/exec">
        <div class="field">
            <label>Ваше имя</label>
            <input type="text" name="Имя" placeholder="Введите ваше имя" required>
        </div>

        <div class="field">
            <label>Email для ответа</label>
            <input type="email" name="Email" placeholder="example@mail.ru" required>
        </div>

        <div class="field">
            <label>Тема</label>
            <input type="text" name="Тема" placeholder="Например: вопрос по уроку">
        </div>

        <div class="field">
            <label>Сообщение</label>
            <textarea name="Сообщение" placeholder="Напишите ваш текст..." required></textarea>
        </div>

        <button type="submit">📤 Отправить</button>
    </form>

    <div class="success" id="successMessage">✅ Спасибо! Ваше сообщение отправлено.</div>

    <script>
        const form = document.getElementById('feedbackForm');
        const scriptURL = 'https://script.google.com/macros/s/AKfycbyLYA3n1BhdnnofZ0EuncPCPXdEzExB_fWTxIMePxOZYeFblKTMYWK0IHy7zSu0PObk/exec';

        form.addEventListener('submit', e => {
            e.preventDefault();
            fetch(scriptURL, { method: 'POST', body: new FormData(form) })
                .then(response => response.json())
                .then(data => {
                    if (data.result === 'success') {
                        document.getElementById('successMessage').style.display = 'block';
                        form.reset();
                    } else {
                        alert('Ошибка при отправке. Попробуйте ещё раз.');
                    }
                })
                .catch(error => console.error('Ошибка:', error));
        });
    </script>
</body>
</html>
