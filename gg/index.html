<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест по тригонометрии</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background: #f5f0e8; }
        h1 { color: #2c1d11; }
        .question { background: #fff; padding: 15px; margin: 15px 0; border-radius: 10px; border: 2px solid #8b6239; }
        label { display: block; margin: 8px 0; }
        input[type="text"], input[type="email"] { width: 100%; padding: 8px; border: 2px solid #8b6239; border-radius: 6px; box-sizing: border-box; }
        button { background: #d99a2b; color: #fff; border: none; padding: 12px 30px; font-size: 18px; border-radius: 8px; cursor: pointer; }
        button:hover { background: #b88a22; }
        .success { display: none; background: #6b7a3a; color: #fff; padding: 15px; border-radius: 10px; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>📐 Тест по тригонометрии</h1>
    <p>Ответьте на вопросы. Все данные будут отправлены в таблицу.</p>

    <form id="testForm" method="POST" action="https://script.google.com/macros/s/AKfycbyLYA3n1BhdnnofZ0EuncPCPXdEzExB_fWTxIMePxOZYeFblKTMYWK0IHy7zSu0PObk/exec">
        <div class="question">
            <label><strong>1. Ваше имя:</strong></label>
            <input type="text" name="Имя" placeholder="Введите ваше имя" required>
        </div>

        <div class="question">
            <label><strong>2. Ваш email:</strong></label>
            <input type="email" name="Email" placeholder="example@mail.ru" required>
        </div>

        <div class="question">
            <label><strong>3. Чему равен cos 60°?</strong></label>
            <input type="text" name="cos60" placeholder="Ваш ответ">
        </div>

        <div class="question">
            <label><strong>4. Чему равен sin 45°?</strong></label>
            <input type="text" name="sin45" placeholder="Ваш ответ">
        </div>

        <div class="question">
            <label><strong>5. В какой четверти cos отрицательный, а sin положительный?</strong></label>
            <input type="text" name="chetvert" placeholder="I, II, III или IV">
        </div>

        <div class="question">
            <label><strong>6. Сколько градусов в π/4 радиан?</strong></label>
            <input type="text" name="radiany" placeholder="Ответ в градусах">
        </div>

        <button type="submit">📤 Отправить тест</button>
    </form>

    <div class="success" id="successMessage">✅ Спасибо! Ваши ответы отправлены.</div>

    <script>
        const form = document.getElementById('testForm');
        const scriptURL = 'https://script.google.com/macros/s/AKfycbyLYA3n1BhdnnofZ0EuncPCPXdEzExB_fWTxIMePxOZYeFblKTMYWK0IHy7zSu0PObk/exec';

        form.addEventListener('submit', e => {
            e.preventDefault();
            fetch(scriptURL, { method: 'POST', body: new FormData(form) })
                .then(response => response.json())
                .then(data => {
                    if (data.result === 'success') {
                        document.getElementById('successMessage').style.display = 'block';
                        form.reset();
                    } else {
                        alert('Ошибка при отправке. Попробуйте ещё раз.');
                    }
                })
                .catch(error => console.error('Ошибка:', error));
        });
    </script>
</body>
</html>
