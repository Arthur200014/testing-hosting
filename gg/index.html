<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Опрос настроения на уроке</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background: #f0f4f0; }
        h1 { color: #2c1d11; }
        .field { background: #fff; padding: 15px; margin: 15px 0; border-radius: 10px; border: 2px solid #8fa14a; }
        label { display: block; margin: 8px 0; font-weight: bold; }
        input[type="text"], input[type="email"], textarea { width: 100%; padding: 8px; border: 2px solid #8fa14a; border-radius: 6px; box-sizing: border-box; }
        textarea { height: 80px; }
        button { background: #6b7a3a; color: #fff; border: none; padding: 12px 30px; font-size: 18px; border-radius: 8px; cursor: pointer; }
        button:hover { background: #5a6a2a; }
        button:disabled { opacity: 0.65; cursor: wait; }
        .success { display: none; background: #8fa14a; color: #fff; padding: 15px; border-radius: 10px; margin-top: 20px; }
        .error-box { display: none; background: #b5471f; color: #fff; padding: 15px; border-radius: 10px; margin-top: 20px; border: 3px solid #160f09; }
        .error-box strong { display: block; margin-bottom: 8px; font-size: 18px; }
        .error-box .details { background: #160f09; padding: 10px; border-radius: 6px; font-family: monospace; font-size: 14px; margin-top: 8px; word-break: break-all; }
        .radio-group { display: flex; gap: 20px; margin-top: 8px; flex-wrap: wrap; }
        .radio-group label { display: flex; align-items: center; gap: 6px; font-weight: normal; }
    </style>
</head>
<body>
    <h1>📊 Опрос настроения на уроке</h1>
    <p>Помогите сделать уроки лучше и интереснее!</p>

    <form id="surveyForm" method="POST" action="https://script.google.com/macros/s/AKfycbyLYA3n1BhdnnofZ0EuncPCPXdEzExB_fWTxIMePxOZYeFblKTMYWK0IHy7zSu0PObk/exec">\n        <input type="hidden" name="Тема" value="Опрос настроения на уроке">
        <div class="field">
            <label>1. Ваше имя</label>
            <input type="text" name="Имя" placeholder="Введите ваше имя" required>
        </div>

        <div class="field">
            <label>2. Ваш email</label>
            <input type="email" name="Email" placeholder="example@mail.ru" required>
        </div>

        <div class="field">
            <label>3. Как вы оцениваете сложность урока?</label>
            <div class="radio-group">
                <label><input type="radio" name="Ответ_1" value="Слишком легко" required> Слишком легко</label>
                <label><input type="radio" name="Ответ_1" value="В самый раз"> В самый раз</label>
                <label><input type="radio" name="Ответ_1" value="Слишком сложно"> Слишком сложно</label>
            </div>
        </div>

        <div class="field">
            <label>4. Что вам понравилось больше всего?</label>
            <input type="text" name="Ответ_2" placeholder="Например: задачи, объяснение, примеры">
        </div>

        <div class="field">
            <label>5. Что можно улучшить?</label>
            <textarea name="Ответ_3" placeholder="Ваши идеи и пожелания..."></textarea>
        </div>

        <button type="submit" id="submitButton">📤 Отправить</button>
    </form>

    <div class="success" id="successMessage">✅ Спасибо! Ваши ответы отправлены.</div>
    <div class="error-box" id="errorBox">
        <strong>❌ Ошибка при отправке</strong>
        <div id="errorText"></div>
    </div>

    <script>
        const form = document.getElementById('surveyForm');
        const scriptURL = 'https://script.google.com/macros/s/AKfycbyLYA3n1BhdnnofZ0EuncPCPXdEzExB_fWTxIMePxOZYeFblKTMYWK0IHy7zSu0PObk/exec';
        const submitButton = document.getElementById('submitButton');
        const successDiv = document.getElementById('successMessage');
        const errorDiv = document.getElementById('errorBox');
        const errorText = document.getElementById('errorText');

        form.addEventListener('submit', async event => {
            event.preventDefault();

            successDiv.style.display = 'none';
            errorDiv.style.display = 'none';
            submitButton.disabled = true;
            submitButton.textContent = '⏳ Отправка...';

            try {
                await fetch(scriptURL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: new FormData(form)
                });

                successDiv.style.display = 'block';
                form.reset();
            } catch (error) {
                errorText.textContent =
                    'Не удалось связаться с Google Apps Script. Проверьте интернет и настройки публикации веб-приложения. ' +
                    error.message;
                errorDiv.style.display = 'block';
                console.error('❌ Ошибка запроса:', error);
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = '📤 Отправить';
            }
        });
    </script>
</body>
</html>
