name: Simultaneous mock exam load check
on:
  push:
    paths:
      - .github/workflows/codex-mock-load-check.yml
permissions:
  contents: write
jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            EGA/config
            shared/interactive/v1
            .github/workflows
      - name: Install browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run simultaneous student test
        shell: bash
        run: |
          python - <<'PYCODE'
          import base64,gzip
          from pathlib import Path
          Path('mock_load_test.mjs').write_bytes(gzip.decompress(base64.b64decode('')))
          PYCODE
          node mock_load_test.mjs
      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -- .github/workflows/codex-mock-load-check.yml
          git -c user.name=codex -c user.email=codex@users.noreply.github.com commit -m "Remove temporary mock load check"
          git push origin HEAD:main
