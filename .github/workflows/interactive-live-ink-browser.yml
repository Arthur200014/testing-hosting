name: Shared live ink browser pilot
on:
  push:
    branches: ['tas/interactive-live-ink']
    paths:
      - 'shared/interactive/v1/drawing-transport.js'
      - 'shared/interactive/v1/ink-browser-pilot.mjs'
      - '.github/workflows/interactive-live-ink-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node shared/interactive/v1/ink-browser-pilot.mjs
