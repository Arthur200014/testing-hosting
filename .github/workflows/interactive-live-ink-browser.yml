name: Shared live ink browser pilot
on:
  push:
    branches: ['tas/interactive-live-ink']
    paths:
      - 'shared/interactive/v1/drawing-transport.js'
      - 'shared/interactive/v1/drawing-transport.test.mjs'
      - 'shared/interactive/v1/ink-browser-pilot.mjs'
      - 'shared/interactive/v1/guide17-browser-pilot.mjs'
      - 'shared/interactive/v1/worksheet-pdf.js'
      - 'EGA/17/formula.html'
      - '.github/workflows/interactive-live-ink-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-save --no-package-lock playwright@1.55.0 firebase-tools@14.27.0 firebase@12.18.0 esbuild@0.28.2
      - run: npx playwright install --with-deps chromium
      - run: node shared/interactive/v1/ink-browser-pilot.mjs
      - name: Test guide 17 with isolated Firebase
        run: |
          config=$(mktemp -d)
          printf '%s\n' '{"emulators":{"database":{"host":"127.0.0.1","port":9000},"ui":{"enabled":false}},"database":{"rules":"emulator-rules.json"}}' > "$config/firebase.json"
          printf '%s\n' '{"rules":{".read":true,".write":true}}' > "$config/emulator-rules.json"
          ./node_modules/.bin/firebase emulators:exec --config "$config/firebase.json" --project demo-guide17 --only database 'node shared/interactive/v1/guide17-browser-pilot.mjs'
