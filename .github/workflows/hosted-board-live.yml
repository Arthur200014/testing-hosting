name: Hosted board live acceptance
on:
  push:
    branches: [main]
    paths:
      - 'platform/board-prototype/**'
      - 'platform/src/Platform.Api/Boards/**'
      - 'platform/lesson-board-ui.mjs'
      - 'platform/browser-session.mjs'
      - 'platform/src/Platform.Api/IdentityAccess/BrowserSessions.cs'
      - 'platform/src/Platform.Api/StudentSessions/**'
      - 'platform/src/Platform.Api/IdentityAccess/TeacherAuthentication.cs'
      - 'platform/scripts/hosted-board-browser.mjs'
      - '.github/workflows/hosted-board-live.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hosted-board-live
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser runner
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify published boards using fresh synthetic workspaces
        run: node platform/scripts/hosted-board-browser.mjs
