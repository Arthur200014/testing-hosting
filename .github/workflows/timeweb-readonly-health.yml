name: TAS Timeweb read-only health and latency
on:
  workflow_run:
    workflows: ['Homework import integration']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tas-timeweb-health
  cancel-in-progress: true

jobs:
  health:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate probe locally (synthetic HTTP)
        run: python3 -m unittest discover -s platform/scripts -p 'test_timeweb_readonly_check.py' -v
      - name: Measure Timeweb public health / anonymous authorization
        run: python3 platform/scripts/timeweb-readonly-check.py
