name: Install Variant 2 in EGE mock
on:
  push:
    paths:
      - '.github/workflows/install-variant-2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Patch embedded EGE exam
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, json, re, pathlib
          p=pathlib.Path("EGA/config/probnic.html")
          outer=p.read_text(encoding="utf-8")
          m=re.search(r"(ege:\{label:.*?htmlB64:')([^']+)(')",outer,re.S)
          assert m, "EGE payload not found"
          html=base64.b64decode(m.group(2)).decode("utf-8")
          beg=html.index("const UPLOADED_VARIANT_1=")
          end=html.index(";\nlet teacherDraftSecondPart",beg)
          topics=["Планиметрия","Векторы","Стереометрия","Вероятность","Сложная вероятность","Случайная величина","Уравнения","Преобразования выражений","Производная","Вычисления по формуле","Текстовая задача","Графики","Финансовая математика"]
          def question(n,htmltext,answer,diagram=""):
              return dict(task=n,topic=topics[n-1],source="ВАРИАНТ 2.pdf",prototypeId="VARIANT2-"+str(n),prototypeLabel="Вариант 2 · №"+str(n),text=htmltext,numeric=answer,answer=str(answer).replace(".",","),answerBlank=str(answer).replace(".",","),explain="",diagram=diagram,options=[],hint="",legacyTask=n,prototypeIndex=0)
          def svg(inner,w=600,h=330):
              return f'<svg viewBox="0 0 {w} {h}" xmlns="http://www.w3.org/2000/svg" role="img" style="width:100%;max-height:280px;background:#fff"><g stroke="#222" stroke-width="2.5" fill="none">{inner}</g></svg>'
          f1=svg('<path d="M105 260 L495 260 L415 75 L25 75 Z M25 75 L300 260"/><path d="M201 252 l8 16 M397 252 l8 16"/><g fill="#222" stroke="none" font-size="20"><text x="92" y="290">A</text><text x="15" y="62">B</text><text x="413" y="65">C</text><text x="500" y="286">D</text><text x="292" y="292">E</text></g>')
          grid=''.join(f'<path d="M{i} 20 V310 M20 {i} H580" stroke="#ddd" stroke-width="1"/>' for i in range(40,560,35))
          f2=svg(grid+'<path d="M150 275 L220 135 M185 275 L325 135" stroke="#111" stroke-width="4"/><path d="M207 143 l13 -8 -1 15 M311 140 l14 -5 -5 13" stroke="#111" stroke-width="2"/><g fill="#111" stroke="none" font-size="24"><text x="165" y="205">a</text><text x="275" y="230">b</text></g>')
          f3=svg('<path d="M75 90 L270 140 L480 80 L285 25 Z M75 90 V265 L270 315 L480 255 V80 M270 140 V315 M285 25 V205 M75 265 L285 205 L480 255"/><path d="M285 205 L385 230 L385 55 L285 25" stroke-dasharray="7 5"/><g fill="#111" stroke="none" font-size="20"><text x="55" y="85">A₁</text><text x="270" y="132">B₁</text><text x="485" y="75">C₁</text><text x="275" y="20">D₁</text><text x="60" y="285">A</text><text x="270" y="330">B</text><text x="485" y="274">C</text><text x="278" y="208">D</text><text x="394" y="55">M₁</text><text x="396" y="246">N</text></g>')
          f9=svg(grid+'<path d="M40 265 C115 195 160 270 205 230 S265 55 315 85 S390 135 455 22" stroke="#66b8f4" stroke-width="4"/><path d="M110 325 L470 15" stroke="#111" stroke-width="3"/><circle cx="180" cy="265" r="5" fill="#111"/><circle cx="395" cy="80" r="5" fill="#111"/>')
          f12=svg(grid+'<path d="M30 295 L580 145" stroke="#111" stroke-width="3"/><path d="M325 20 C340 75 375 125 460 145 S525 162 580 170 M45 220 C120 228 165 255 200 310" stroke="#111" stroke-width="3"/><circle cx="65" cy="285" r="6" fill="#111"/><text x="55" y="265" stroke="none" fill="#111" font-size="20">A</text>')
          q=[
          question(1,r"Площадь параллелограмма \(ABCD\) равна 60. Точка \(E\) — середина стороны \(AD\). Найдите площадь треугольника \(ABE\).",15,f1),
          question(2,r"На координатной плоскости изображены векторы \(\vec a\) и \(\vec b\), координатами которых являются целые числа. Найдите длину вектора \(\vec a+\vec b\).",10,f2),
          question(3,"Объём куба равен 80. Найдите объём треугольной призмы, отсекаемой от куба плоскостью, проходящей через середины двух рёбер, выходящих из одной вершины, и параллельной третьему ребру, выходящему из этой же вершины.",10,f3),
          question(4,"В чемпионате по гимнастике участвуют 45 спортсменок: 6 из России, 21 из США, остальные — из Китая. Порядок выступлений определяется жребием. Найдите вероятность того, что первой выступит спортсменка из Китая.",0.4),
          question(5,"Автоматическая линия изготавливает батарейки. Вероятность того, что батарейка неисправна, равна 0,04. Система забракует неисправную батарейку с вероятностью 0,96, а исправную по ошибке — с вероятностью 0,01. Найдите вероятность того, что случайно выбранная батарейка будет забракована.",0.048),
          question(6,"Организаторы лотереи выпустили 10 000 билетов. Выигрыши распределены следующим образом:<table border='1' style='border-collapse:collapse;width:100%;font-size:13px'><tr><th>Выигрыш, руб.</th><td>100</td><td>1000</td><td>5000</td><td>10 000</td><td>50 000</td></tr><tr><th>Число билетов</th><td>500</td><td>100</td><td>50</td><td>10</td><td>1</td></tr></table>Найдите математическое ожидание величины «выигрыш на один билет» в рублях.",55),
          question(7,r"Решите уравнение \(\sqrt[3]{x-5}=3\).",32),
          question(8,r"Найдите значение выражения \(8\log_5\sqrt[4]{5}\).",2),
          question(9,r"На рисунке изображены график функции \(y=f(x)\) и касательная к нему в точке с абсциссой \(x_0\). Найдите значение производной \(f'(x_0)\).",1.6,f9),
          question(10,r"Мотоциклист со скоростью \(v_0=60\) км/ч выезжает из города и разгоняется с постоянным ускорением \(a=32\) км/ч². Расстояние до города вычисляется по формуле \(S=v_0t+\frac{at^2}{2}\), где \(t\) — время в часах. За какое время он удалится на 154 км? Ответ дайте в минутах.",105),
          question(11,"От пристани A к пристани B, расстояние между которыми равно 240 км, отправился первый теплоход. Через 8 часов вслед за ним отправился второй со скоростью на 8 км/ч больше. Оба теплохода прибыли одновременно. Найдите скорость первого в км/ч.",12),
          question(12,r"На рисунке изображены графики функций \(f(x)=\frac{k}{x}\) и \(g(x)=ax+b\), пересекающиеся в точках \(A\) и \(B\). Найдите абсциссу точки \(B\).",10,f12),
          question(13,"В июле 2030 года планируется взять кредит 182 000 рублей на три года. Каждый январь долг увеличивается на 20% по сравнению с концом предыдущего года; с февраля по июнь каждого года выплачивается одним платежом часть долга. Кредит полностью погашается тремя равными платежами. Найдите их общую сумму в рублях.",259200)
          ]
          def part(n,topic,txt): return dict(task=n,topic=topic,source="ВАРИАНТ 2.pdf" if n!=16 else "Фото #105060",text=txt)
          p2=[
          part(14,"Уравнение",r"<b>а)</b> Решите уравнение \(5^{2\log_2^2(\sin x)}=\frac{5}{5^{\log_2(\sin x)}}\).<br><b>б)</b> Найдите все корни этого уравнения, принадлежащие отрезку \(\left[\pi;\frac{5\pi}{2}\right]\)."),
          part(15,"Стереометрия",r"В прямоугольном параллелепипеде \(ABCDA_1B_1C_1D_1\) основание \(ABCD\) — прямоугольник со сторонами 9 и 12; диагонали пересекаются в точке \(O\). Плоскость, содержащая диагональ \(AC_1\) и параллельная прямой \(B_1D\), пересекает ребро \(BB_1\) в точке \(K\). Угол между плоскостями \((ABC_1)\) и \((AC_1K)\) равен \(45^\circ\).<br><b>а)</b> Докажите, что \(\angle KOB<45^\circ\).<br><b>б)</b> Найдите объём параллелепипеда."),
          part(16,"Логарифмическое неравенство",r"Решите неравенство \[x^2\cdot\log_{125}(2-3x)+\log_{0{,}2}(9x^2-12x+4)<0.\]"),
          part(17,"Прикладная задача",r"Генератор имеет ЭДС \(\varepsilon=50\) В и внутреннее сопротивление \(r=1\) Ом. Сопротивление нагрузки \(R\) задаётся реостатом. Сила тока \(I=\frac{\varepsilon}{r+R}\). Тепловая мощность нагрузки \(P=I^2R\). Какова максимально возможная мощность?"),
          part(18,"Планиметрия",r"В равнобедренную трапецию \(ABCD\) с большим основанием \(AD\) вписаны две окружности: одна касается сторон \(AB,BC,AD\), вторая — \(BC,CD,AD\); окружности касаются друг друга внешним образом. Точка касания \(CD\) с окружностью радиуса \(r\) делит \(CD\) в отношении \(1:4\).<br><b>а)</b> Докажите, что \(r=0{,}4\cdot CD\).<br><b>б)</b> Найдите радиус окружности, описанной около трапеции, если \(AB=30\)."),
          part(19,"Параметр",r"Найдите все значения параметра \(a\), при каждом из которых система \[\begin{cases}(x^2-5x-y+3)\sqrt{x-y+3}=0,\\y=3x+a\end{cases}\] имеет ровно два различных решения."),
          part(20,"Числа и их свойства","Есть 4 камня, каждый массой 7 тонн, и 9 камней, каждый массой 22 тонны.<br><b>а)</b> Можно ли разложить все камни на две группы так, чтобы разность масс составила 8 тонн?<br><b>б)</b> Можно ли разложить камни на две группы с равными массами?<br><b>в)</b> Какое наименьшее положительное значение разности масс возможно?")
          ]
          variant=dict(id="EGE-VARIANT-2-SHKOLKOVO",name="ВАРИАНТ 2 · Школково",createdAt=0,schemaVersion=6,taskCount=13,fullTaskCount=20,maxPrimaryScore=33,durationSeconds=14100,seed=0,questions=q,secondPart=p2)
          html=html[:beg]+"const UPLOADED_VARIANT_1="+json.dumps(variant,ensure_ascii=False,separators=(",",":"))+html[end:]
          html=html.replace(">Готовый вариант №1</h3>",">ВАРИАНТ 2 · Школково</h3>")
          html=html.replace("Готовый вариант №1 · 20 заданий","ВАРИАНТ 2 · 20 заданий")
          outer=outer[:m.start(2)]+base64.b64encode(html.encode()).decode()+outer[m.end(2):]
          p.write_text(outer,encoding="utf-8")
          assert len(q)==13 and len(p2)==7 and "EGE-VARIANT-2" in html and "105060" in html
          print("Updated",p,"size",p.stat().st_size)
          
          PY
      - name: Commit updated probnic HTML
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add EGA/config/probnic.html
          git diff --cached --quiet || (git commit -m 'Load Variant 2 with updated inequality into EGE mock and screenshot mode' && git push origin HEAD:main)
