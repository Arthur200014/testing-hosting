name: Stop mock load test
on:
  push:
    paths:
      - .github/workflows/codex-stop-mock-load.yml
permissions:
  actions: write
  contents: write
jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Cancel running test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/42284662361/cancel"
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/workflows
      - name: Remove temporary workflows
        if: always()
        run: |
          if [ -d .git ]; then
            git fetch origin main
            git reset --hard origin/main
            git rm --ignore-unmatch .github/workflows/codex-stop-mock-load.yml .github/workflows/codex-mock-load-final.yml
            if ! git diff --cached --quiet; then
              git -c user.name=codex -c user.email=codex@users.noreply.github.com commit -m "Stop temporary mock load test"
              git push origin HEAD:main
            fi
          fi
