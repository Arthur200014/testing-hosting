name: Patch EGE6 shared drawing

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ege6-shared-drawing
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Patch large HTML files
        run: python tools/patch_ege6_drawing.py
      - name: Commit patched files
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "EGA/6/gaid.html" "EGA/6/что не так-1.html" "EGA/6/что не так-2.html"
          git commit -m "Fix shared drawing in large EGE 6 forms"
          git push origin HEAD:fix/ege6-shared-drawing
