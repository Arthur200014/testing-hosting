name: Repeat simultaneous mock student test
on:
  push:
    paths:
      - .github/workflows/codex-mock-load-final.yml
permissions:
  contents: write
jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            EGA/config
            shared/interactive/v1
            .github/workflows
      - name: Install browser driver
        run: timeout 120s npm install --no-save --fetch-retries=1 --fetch-timeout=60000 playwright
      - name: Run simultaneous student test
        shell: bash
        run: |
          python - <<'PYCODE'
          import base64,gzip
          from pathlib import Path
          Path('mock_load_test.mjs').write_bytes(gzip.decompress(base64.b64decode('')))
          PYCODE
          BROWSER_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$BROWSER_BIN"
          TEST_BROWSER_PATH="$BROWSER_BIN" node mock_load_test.mjs
      - name: Remove temporary workflow
        if: always()
        run: |
          if [ -d .git ]; then
            git fetch origin main
            git reset --hard origin/main
            git rm --ignore-unmatch .github/workflows/codex-mock-load-final.yml
            if ! git diff --cached --quiet; then
              git -c user.name=codex -c user.email=codex@users.noreply.github.com commit -m "Remove temporary mock load test"
              git push origin HEAD:main
            fi
          fi
