name: Fit the OGE variant 2 screenshot
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fit-oge-variant2-shot-once.yml'
permissions:
  contents: write
jobs:
  fit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Balance the first screenshot sheet
        run: |
          python3 - <<'PY'
          import base64, re
          from pathlib import Path
          path = Path('EGA/config/probnic.html')
          html = path.read_text(encoding='utf-8')
          match = re.search(r"(oge:\{[^\n]*?htmlB64:')([^']+)", html)
          assert match
          child = base64.b64decode(match[2]).decode('utf-8')
          old = 'const columns=[variant.questions.slice(0,6),variant.questions.slice(6,13),variant.questions.slice(13,19)];'
          new = ('const columns=uploadedContext\n'
                 '      ? [variant.questions.slice(0,8),variant.questions.slice(8,14),variant.questions.slice(14,19)]\n'
                 '      : [variant.questions.slice(0,6),variant.questions.slice(6,13),variant.questions.slice(13,19)];')
          assert child.count(old) == 1
          data = base64.b64encode(child.replace(old, new, 1).encode('utf-8')).decode('ascii')
          path.write_text(html[:match.start(2)] + data + html[match.end(2):], encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EGA/config/probnic.html
          git rm .github/workflows/fit-oge-variant2-shot-once.yml
          git diff --cached --check
          git commit -m "Fit all OGE variant 2 tasks on the screenshot sheet"
          git push origin HEAD:main
