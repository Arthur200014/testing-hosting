name: Apply mock form fix
on:
  push:
    paths:
      - .github/workflows/codex-mock-fix.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            EGA/config
            shared/interactive/v1
            scripts
            .ai/tasks
            .github/workflows
      - name: Apply reviewed changes
        shell: bash
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import base64,gzip,re
          files = {'shared/interactive/v1/mock-exam-persistence.js': '', 'shared/interactive/v1/mock-exam-persistence.test.mjs': '', 'scripts/mock-unified-entry-browser.mjs': '', '.ai/tasks/ege-mock-reliability.md': ''}
          for path, encoded in files.items():
              Path(path).parent.mkdir(parents=True, exist_ok=True)
              Path(path).write_bytes(gzip.decompress(base64.b64decode(encoded)))
          path=Path('EGA/config/probnic.html')
          text=path.read_text()
          for kind, old, new in [
              ('ege', 'const v=await fetchActiveVariantV13();const local=loadLocal(code,v.id);', "const v=await fetchActiveVariantV13();const completion=await window.__EGE_MOCK_PERSISTENCE__.verifyStoredCompletion(code,v.id,v.durationSeconds);if(completion==='pending'){window.__EGE_MOCK_PERSISTENCE__.showPendingCompletion(code,v.id);return}const local=loadLocal(code,v.id);"),
              ('oge', 'const v=await getActive(),local=loadLocal(code,v.id);', "const v=await getActive();const completion=await window.__OGE_MOCK_PERSISTENCE__.verifyStoredCompletion(code,v.id,v.durationSeconds);if(completion==='pending'){window.__OGE_MOCK_PERSISTENCE__.showPendingCompletion(code,v.id);return}const local=loadLocal(code,v.id);")
          ]:
              match=re.search(r'('+kind+r":\{label:.*?htmlB64:')([^']+)(')",text)
              assert match,kind
              child=base64.b64decode(match[2]).decode('utf-8')
              assert child.count(old)==1,(kind,child.count(old))
              child=child.replace(old,new)
              text=text[:match.start(2)]+base64.b64encode(child.encode()).decode()+text[match.end(2):]
          path.write_text(text)
          PYCODE
          git rm -- .github/workflows/codex-mock-fix.yml
          git add EGA/config/probnic.html shared/interactive/v1/mock-exam-persistence.js shared/interactive/v1/mock-exam-persistence.test.mjs scripts/mock-unified-entry-browser.mjs .ai/tasks/ege-mock-reliability.md
          git diff --cached --check
          node --test shared/interactive/v1/mock-exam-persistence.test.mjs
          git -c user.name=codex -c user.email=codex@users.noreply.github.com commit -m "Verify saved mock results against submitted sheet rows"
          git push origin HEAD:main
