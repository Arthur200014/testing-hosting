name: Создать встречу Яндекс Телемост

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telemost:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      TELEMOST_TOKEN: ${{ secrets.TELEMOST_TOKEN }}
    steps:
      - name: Проверить, что токен добавлен в Secrets
        shell: bash
        run: |
          if [ -z "$TELEMOST_TOKEN" ]; then
            echo "::error::В GitHub Settings → Secrets and variables → Actions добавь секрет TELEMOST_TOKEN."
            exit 1
          fi

      - name: Создать реальную встречу через API
        shell: bash
        run: |
          set -euo pipefail
          response_file="$RUNNER_TEMP/telemost-response.json"
          http_status=$(curl --silent --show-error --connect-timeout 10 --max-time 35 \
            -o "$response_file" -w '%{http_code}' \
            -X POST 'https://cloud-api.yandex.net/v1/telemost-api/conferences' \
            -H "Authorization: OAuth $TELEMOST_TOKEN" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            --data '{"waiting_room_level":"PUBLIC"}')
          export HTTP_STATUS="$http_status"
          export RESPONSE_FILE="$response_file"
          python3 - <<'PY'
          import os, json, sys
          from urllib.parse import urlsplit
          status = os.environ.get('HTTP_STATUS')
          with open(os.environ['RESPONSE_FILE'], encoding='utf-8') as f:
              data = json.load(f)
          if status != '201':
              print(f'::error::Яндекс отклонил запрос: HTTP {status}; ошибка: {str(data.get("error", ""))[:100]}')
              sys.exit(1)
          url = data.get('join_url')
          parsed = urlsplit(url) if isinstance(url, str) else None
          if not parsed or parsed.scheme != 'https' or parsed.hostname != 'telemost.yandex.ru':
              print('::error::API не вернул корректную ссылку join_url')
              sys.exit(1)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('## Встреча Яндекс Телемоста создана ✅\\n\\n')
              f.write('**Ссылка для участников:** ' + url + '\\n\\n')
              f.write('Скопируй её и отправь человеку. Эта ссылка видна в результатах запуска GitHub Actions.\\n')
          print('Встреча создана. Открой Summary этого запуска, чтобы скопировать ссылку.')
          PY
