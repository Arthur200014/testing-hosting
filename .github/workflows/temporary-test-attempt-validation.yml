name: temporary test-attempt validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temporary-test-attempt-validation.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build PostgreSQL test runner
        run: docker compose --env-file .env.example --profile test build tests

      - name: Run new test-attempt regressions
        shell: bash
        run: |
          set -euo pipefail
          FILTER='FullyQualifiedName~ReplayPreservesHistoricalProgramAfterMembershipProgramReassignment|FullyQualifiedName~DatabaseRejectsMoscowMonthKeyThatDisagreesWithCompletionInstant'
          docker compose --env-file .env.example --profile test run --rm --entrypoint sh tests -lc '
            set -eu
            filter="$1"
            for project in               tests/Platform.Api.IntegrationTests/Platform.Api.IntegrationTests.csproj               /src/tests/Platform.Api.IntegrationTests/Platform.Api.IntegrationTests.csproj               /workspace/tests/Platform.Api.IntegrationTests/Platform.Api.IntegrationTests.csproj               /app/tests/Platform.Api.IntegrationTests/Platform.Api.IntegrationTests.csproj
            do
              if [ -f "$project" ]; then
                dotnet test "$project" --no-restore --filter "$filter"
                exit $?
              fi
            done
            echo "Platform.Api.IntegrationTests.csproj not found in expected runner paths" >&2
            exit 2
          ' sh "$FILTER"

      - name: Run full PostgreSQL test runner
        run: docker compose --env-file .env.example --profile test run --rm tests

      - name: Stop test services
        if: always()
        run: docker compose --env-file .env.example --profile test down
