name: Timeweb UI-07 live acceptance
on:
  push:
    branches: [tas/ui07-timeweb-acceptance]
    paths:
      - 'platform/scripts/hosted-ui07-browser.mjs'
      - '.github/workflows/ui07-live.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hosted-ui07-live
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser runner
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify the live cabinet with fresh synthetic data
        run: node platform/scripts/hosted-ui07-browser.mjs
