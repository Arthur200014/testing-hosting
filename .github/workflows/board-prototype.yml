name: Isolated board prototype
on:
  push:
    branches: ['tas/**']
    paths:
      - 'platform/board-prototype/**'
      - '.github/workflows/board-prototype.yml'
      - 'platform/src/Platform.Api/Boards/**'
      - 'platform/calendar-real-browser.mjs'
      - 'platform/scripts/calendar-real-browser.sh'
  pull_request:
    paths:
      - 'platform/board-prototype/**'
      - '.github/workflows/board-prototype.yml'
      - 'platform/src/Platform.Api/Boards/**'
      - 'platform/calendar-real-browser.mjs'
      - 'platform/scripts/calendar-real-browser.sh'
permissions:
  contents: read
jobs:
  room-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tas_board_test
          POSTGRES_USER: board_test
          POSTGRES_PASSWORD: synthetic-board-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U board_test -d tas_board_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      BOARD_TEST_DATABASE_URL: postgres://board_test:synthetic-board-test-only@127.0.0.1:5432/tas_board_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked free transport and database dependencies
        run: npm --prefix platform/board-prototype ci --ignore-scripts --no-audit --no-fund
      - name: Verify all runtime licences and font notices
        run: npm --prefix platform/board-prototype run licenses
      - name: Real Socket.IO persistence and restart with PostgreSQL
        run: node --test platform/board-prototype/transport.test.mjs platform/board-prototype/api-access.test.mjs platform/board-prototype/reconnect.test.mjs
      - name: PostgreSQL multi-writer persistence and recovery
        run: node --test platform/board-prototype/postgres.test.mjs platform/board-prototype/files.test.mjs platform/board-prototype/checkpoint.test.mjs
      - name: Room authorization and durable replay
        run: node --test platform/board-prototype/core.test.mjs
      - name: Install isolated Chromium
        run: cd platform/board-prototype && npx playwright install --with-deps chromium
      - name: Actual Excalidraw browser persistence with PostgreSQL
        run: cd platform/board-prototype && npm run editor:browser
      - name: CI scope regression
        run: node --test scripts/tas-ci-scope.test.mjs

  editor-license-clearance:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix platform/board-prototype ci --ignore-scripts --no-audit --no-fund
      # Changes to versions, integrity, notices or font bytes require explicit review.
      - run: npm --prefix platform/board-prototype run licenses:full
      - name: Licence gate negative regressions
        run: cd platform/board-prototype && node --test licence-audit.test.mjs
      - name: Build isolated editor with retained notices
        run: cd platform/board-prototype && npm run editor:build
      - name: Verify built fonts and notice distribution
        run: cd platform/board-prototype && npm run licenses:built

  dotnet-board-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix platform/board-prototype ci --ignore-scripts --no-audit --no-fund
      - name: Install existing runner browser dependency
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: cd platform/board-prototype && npx playwright install --with-deps chromium
      - name: Actual .NET sessions, connected access revocation and restart
        env:
          TAS_BOARD_TEST_ONLY: '1'
        run: bash platform/scripts/calendar-real-browser.sh
