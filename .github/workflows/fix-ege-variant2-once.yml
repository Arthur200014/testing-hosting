name: Fix EGE variant 2 once
on:
  push:
    paths:
      - '.github/workflows/fix-ege-variant2-once.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fix embedded variant conditions and first-part solutions
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,zlib
          exec(zlib.decompress(base64.b64decode('')))
          PY
      - name: Commit variant and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EGA/config/probnic.html
          git rm -f .github/workflows/fix-ege-variant2-once.yml
          git diff --cached --check
          git commit -m "Correct EGE variant 2 math and explanations"
          git push origin HEAD:main
