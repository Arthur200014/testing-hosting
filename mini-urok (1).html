<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мини-урок: домашнее задание</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 40px 16px;
    color: #1f2937;
  }
  .card {
    max-width: 640px;
    margin: 0 auto;
    background: #fff;
    border-radius: 14px;
    padding: 32px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  h1 { font-size: 22px; margin-top: 0; }
  .lesson {
    background: #eef2ff;
    border-left: 4px solid #4f46e5;
    padding: 16px 18px;
    border-radius: 8px;
    margin-bottom: 24px;
    line-height: 1.5;
  }
  .question {
    font-weight: 600;
    margin-bottom: 12px;
  }
  label {
    display: block;
    font-size: 14px;
    margin-bottom: 6px;
    color: #374151;
  }
  input[type="text"] {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 15px;
    margin-bottom: 16px;
  }
  input[type="text"]:focus {
    outline: none;
    border-color: #4f46e5;
  }
  button {
    background: #4f46e5;
    color: #fff;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  #status {
    margin-top: 16px;
    font-size: 14px;
  }
  .ok { color: #059669; }
  .err { color: #dc2626; }
</style>
</head>
<body>

<div class="card">
  <h1>📘 Мини-урок: Части речи</h1>

  <div class="lesson">
    Существительное — это часть речи, которая отвечает на вопросы
    «кто?» или «что?» и обозначает предмет, человека, животное или явление.
    Например: <b>стол</b>, <b>учитель</b>, <b>дождь</b>.
  </div>

  <form id="quizForm">
    <label for="name">Твоё имя</label>
    <input type="text" id="name" required placeholder="Например: Аня">

    <div class="question">
      Вопрос: приведи пример существительного из сегодняшнего урока или своё слово.
    </div>
    <label for="answer">Твой ответ</label>
    <input type="text" id="answer" required placeholder="Введи слово">

    <button type="submit" id="submitBtn">Отправить ответ</button>
    <div id="status"></div>
  </form>
</div>

<script>
  // Вставь сюда свой Web app URL из Google Apps Script (Шаг 3 инструкции)
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby4JReltxpcP0rk56oRZ-UZIfZktd7V1wc5g2-RiIO1CH6bBevHTYGciYkuai6Z_Gb1/exec";

  const form = document.getElementById("quizForm");
  const statusEl = document.getElementById("status");
  const submitBtn = document.getElementById("submitBtn");

  form.addEventListener("submit", function (e) {
    e.preventDefault();

    const name = document.getElementById("name").value.trim();
    const answer = document.getElementById("answer").value.trim();

    if (!name || !answer) return;

    submitBtn.disabled = true;
    statusEl.textContent = "Отправка...";
    statusEl.className = "";

    fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors", // Apps Script не отдаёт CORS-заголовки, поэтому ответ прочитать нельзя,
                        // но данные при этом успешно записываются в таблицу
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify({ name, answer })
    })
      .then(() => {
        statusEl.textContent = "✅ Ответ отправлен, спасибо!";
        statusEl.className = "ok";
        form.reset();
      })
      .catch(() => {
        statusEl.textContent = "❌ Ошибка отправки. Проверь SCRIPT_URL и подключение.";
        statusEl.className = "err";
      })
      .finally(() => {
        submitBtn.disabled = false;
      });
  });
</script>

</body>
</html>
