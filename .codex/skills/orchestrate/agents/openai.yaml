interface:
  display_name: "Orchestrate"
  short_description: "Delegate work and verify the result"
  default_prompt: "Use $orchestrate. Before delegation, ask Jev for a bounded route over the models actually callable in this runtime. Assign explicit minimal models to bounded workers, parallelize only independent tasks, and verify the integrated result. Keep coordination in native messages instead of creating bookkeeping files."

policy:
  allow_implicit_invocation: true
