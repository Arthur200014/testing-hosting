  function localDate(timestamp){const d=new Date(timestamp);return[d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-")}
  function resultPayload(key,state=sharedState){const g=state.game,p=g.players[key],st=g.stats[key]||{},completed=Number(st.completed||0),score=Number(st.firstTryCorrect||0),percent=completed?Math.round(score/completed*100):0,finished=Number(g.finishedAt||now()),started=Number(st.startedAt||g.startedAt||finished),realId=String(p.verifiedStudentId||p.id||p.code||"");return{action:"submitTest",programId:"OGE_MATH",eventId:g.eventIds[key]||`${g.sessionId}-${key}`,studentId:realId||String(p.code||""),studentName:p.name||"Ученик",studentCode:p.code||"",testId:TEST_META.testId,testName:TEST_META.testName,topicId:TEST_META.topicId,topicName:TEST_META.topicName,taskNumber:TEST_META.taskNumber,testDate:localDate(finished),score,maxScore:completed,percent,scorePercent:percent,durationSec:Math.max(1,Math.round((finished-started)/1000)),durationSeconds:Math.max(1,Math.round((finished-started)/1000)),startedAt:new Date(started).toISOString(),finishedAt:new Date(finished).toISOString(),completedAt:new Date(finished).toISOString(),answeredCount:completed,wrongAttempts:Number(st.wrongAttempts||0),mode:g.studentLimit===2?"two_students":"one_student",schemaVersion:TEST_META.schemaVersion}}
  async function sendResult(payload){const response=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload),redirect:"follow"});let answer;try{answer=await response.json()}catch{throw new Error("Система результатов не ответила.")}if(!response.ok||!answer?.ok)throw new Error(answer?.error||"Результат не принят.");return answer}
  function readQueue(){try{const q=JSON.parse(lsGet(PENDING_RESULTS_KEY)||"[]");return Array.isArray(q)?q:[]}catch{return[]}}
  function writeQueue(q){lsSet(PENDING_RESULTS_KEY,JSON.stringify(q))}
  function queueResult(payload,key){const q=readQueue();if(!q.some(item=>item.payload?.eventId===payload.eventId))q.push({payload,key});writeQueue(q)}
  function removeQueued(eventId){writeQueue(readQueue().filter(item=>item.payload?.eventId!==eventId))}
  async function ensureSubmission(key){if(!sharedState?.game.players[key])return;const submissionRef=ref(database,`${lessonRoot()}/state/game/submissions/${key}`),stamp=now(),claim=await runTransaction(submissionRef,current=>{if(current?.status==="saved")return;if((current?.status==="sending"||current?.status==="queued")&&stamp-Number(current.updatedAt||0)<10000)return;return{status:"sending",eventId:sharedState.game.eventIds[key],updatedAt:stamp,by:role}});if(!claim.committed)return;const payload=resultPayload(key);try{if(!navigator.onLine)throw new Error("offline");await sendResult(payload);removeQueued(payload.eventId);await update(submissionRef,{status:"saved",eventId:payload.eventId,updatedAt:now()})}catch{queueResult(payload,key);await update(submissionRef,{status:"queued",eventId:payload.eventId,updatedAt:now()})}}
  async function flushPending(){if(!navigator.onLine)return;for(const item of readQueue()){try{await sendResult(item.payload);removeQueued(item.payload.eventId);if(sharedState?.game.eventIds[item.key]===item.payload.eventId)await update(ref(database,`${lessonRoot()}/state/game/submissions/${item.key}`),{status:"saved",eventId:item.payload.eventId,updatedAt:now()})}catch{break}}}
setInterval(flushPending,60000);

  function sendProgressOnClose(){if(role!=="student"||!sharedState?.game.players[playerIdKey]||!sharedState.game.startedAt)return;const s=sharedState.game.stats[playerIdKey]||{};if(!s.completed)return;const payload=resultPayload(playerIdKey);queueResult(payload,playerIdKey);try{navigator.sendBeacon(API_URL,new Blob([JSON.stringify(payload)],{type:"text/plain;charset=utf-8"}))}catch{try{fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload),keepalive:true})}catch{}}}
  
  function gridPng(){if(gridPng.cache)return gridPng.cache;const canvas=document.createElement("canvas"),W=900,H=600,dpr=2;canvas.width=W*dpr;canvas.height=H*dpr;const ctx=canvas.getContext("2d");ctx.scale(dpr,dpr);ctx.fillStyle="#fbfeff";ctx.fillRect(0,0,W,H);ctx.strokeStyle="#c6dfe7";ctx.lineWidth=2;const cell=36;for(let x=0;x<=W;x+=cell){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<=H;y+=cell){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}gridPng.cache=canvas.toDataURL("image/png");return gridPng.cache}
  
  function renderBoard(){const layer=$("boardLayer");if(!sharedState){layer.innerHTML="";return}const epoch=sharedState.boardEpoch;layer.innerHTML=Object.values(sharedState.strokes||{}).filter(s=>s&&s.epoch===epoch).map(s=>`<polyline data-stroke-id="${esc(s.id)}" points="${(s.points||[]).map(([x,y])=>`${x*innerWidth},${y*innerHeight}`).join(" ")}" fill="none" stroke="${esc(s.color)}" stroke-width="${Number(s.width)||6}" stroke-linecap="round" stroke-linejoin="round"/>`).join("")}
  let boardTool="cursor",boardDrawing=null,lastStrokeWrite=0;
  function setBoardTool(tool){boardTool=tool;document.querySelectorAll("[data-tool]").forEach(button=>button.classList.toggle("on",button.dataset.tool===tool));$("boardLayer").classList.toggle("active",tool!=="cursor")}
  async function boardPointerDown(event){if(!role||!sharedState||boardTool==="cursor")return;if(boardTool==="eraser"){const id=event.target?.dataset?.strokeId;if(id)await remove(ref(database,`${lessonRoot()}/state/strokes/${id}`));return}event.preventDefault();const id=`stroke-${uuid()}`,point=[event.clientX/innerWidth,event.clientY/innerHeight];boardDrawing={id,anchorId:"game-screen",authorId:role==="teacher"?identity.id:identity.studentId,authorName:role==="teacher"?"Учитель":identity.name,color:$("boardColor").value,width:Number($("boardWidth").value),points:[point],done:false,epoch:sharedState.boardEpoch,rev:now()};event.currentTarget.setPointerCapture(event.pointerId);await set(ref(database,`${lessonRoot()}/state/strokes/${id}`),boardDrawing)}
  function boardPointerMove(event){if(!boardDrawing)return;boardDrawing.points.push([event.clientX/innerWidth,event.clientY/innerHeight]);const stamp=now();if(stamp-lastStrokeWrite>70){lastStrokeWrite=stamp;set(ref(database,`${lessonRoot()}/state/strokes/${boardDrawing.id}`),boardDrawing)}}
  function boardPointerUp(){if(!boardDrawing)return;boardDrawing.done=true;boardDrawing.rev=now();set(ref(database,`${lessonRoot()}/state/strokes/${boardDrawing.id}`),boardDrawing);boardDrawing=null}
  async function clearAllBoard(){if(role!=="teacher"||!sharedState)return;await transactState(state=>{state.boardEpoch+=1;state.strokes={};state.version+=1;return state})}
  function initToolbar(){const toolbar=$("boardToolbar");let saved=null;try{saved=JSON.parse(lsGet(TOOLBAR_POSITION_KEY)||"null")}catch{}const save=()=>lsSet(TOOLBAR_POSITION_KEY,JSON.stringify({x:toolbar.offsetLeft,y:toolbar.offsetTop,collapsed:toolbar.classList.contains("collapsed")}));if(saved){toolbar.style.left=`${Math.max(0,Math.min(innerWidth-160,Number(saved.x)||0))}px`;toolbar.style.top=`${Math.max(0,Math.min(innerHeight-45,Number(saved.y)||0))}px`;toolbar.classList.toggle("collapsed",Boolean(saved.collapsed));$("boardCollapse").textContent=saved.collapsed?"+":"−"}document.querySelectorAll("[data-tool]").forEach(button=>button.onclick=()=>setBoardTool(button.dataset.tool));$("clearBoard").onclick=clearAllBoard;$("boardCollapse").onclick=event=>{event.stopPropagation();toolbar.classList.toggle("collapsed");$("boardCollapse").textContent=toolbar.classList.contains("collapsed")?"+":"−";save()};$("boardCollapse").onpointerdown=event=>event.stopPropagation();let drag=null;$("boardGrip").onpointerdown=event=>{if(event.target.closest("button"))return;drag={dx:event.clientX-toolbar.offsetLeft,dy:event.clientY-toolbar.offsetTop};$("boardGrip").setPointerCapture(event.pointerId)};$("boardGrip").onpointermove=event=>{if(!drag)return;toolbar.style.left=`${Math.max(0,Math.min(innerWidth-toolbar.offsetWidth,event.clientX-drag.dx))}px`;toolbar.style.top=`${Math.max(0,Math.min(innerHeight-toolbar.offsetHeight,event.clientY-drag.dy))}px`;toolbar.style.bottom="auto"};$("boardGrip").onpointerup=()=>{if(!drag)return;save();drag=null}}
  let cursorStamp=0;function teacherMouseMove(event){if(role!=="teacher"||!navigator.onLine||now()-cursorStamp<75)return;cursorStamp=now();update(ref(database,`${lessonRoot()}/messages/teacherCursor`),{x:event.clientX/innerWidth,y:event.clientY/innerHeight,at:serverTimestamp()})}
  function renderTeacherCursor(data){const cursor=$("teacherCursor");if(!data||now()-Number(data.at||0)>5000){cursor.classList.remove("show");return}cursor.style.left=`${data.x*innerWidth}px`;cursor.style.top=`${data.y*innerHeight}px`;cursor.classList.add("show")}
  function sound(type){if(muted)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ac=sound.ac||(sound.ac=new AC()),t=ac.currentTime,gain=ac.createGain(),sets={start:[[130,.2],[250,.4]],good:[[400,.12],[650,.3]],bad:[[150,.2],[82,.38]],finish:[[250,.13],[420,.3],[680,.55]]},notes=sets[type]||sets.good;gain.connect(ac.destination);gain.gain.setValueAtTime(.04,t);gain.gain.exponentialRampToValueAtTime(.0001,t+notes.at(-1)[1]+.12);notes.forEach(([frequency,duration],index)=>{const oscillator=ac.createOscillator();oscillator.type=type==="bad"?"sawtooth":"triangle";oscillator.frequency.value=frequency;oscillator.connect(gain);oscillator.start(t+index*.04);oscillator.stop(t+duration+.1)})}catch{}}
  function petals(){const box=$("petals");box.innerHTML="";for(let i=0;i<40;i++){const p=document.createElement("i");p.style.left=`${Math.random()*100}%`;p.style.animationDelay=`${Math.random()*.8}s`;p.style.background=i%3===0?"#f3a6ac":i%3===1?"#f2bd37":"#fff1d3";box.appendChild(p)}setTimeout(()=>box.innerHTML="",3900)}
  
  $("lessonLaunch").onclick=showRoleChoice;$("modalBackdrop").onclick=event=>{if(event.target===$("modalBackdrop"))closeModal()};$("panelToggle").onclick=()=>setPanelExpanded($("panelBody").hidden);$("boardLayer").addEventListener("pointerdown",boardPointerDown);$("boardLayer").addEventListener("pointermove",boardPointerMove);$("boardLayer").addEventListener("pointerup",boardPointerUp);$("boardLayer").addEventListener("pointercancel",boardPointerUp);window.addEventListener("mousemove",teacherMouseMove);window.addEventListener("online",flushPending);window.addEventListener("pagehide",sendProgressOnClose);window.addEventListener("beforeunload",sendProgressOnClose);window.addEventListener("resize",()=>{gridPng.cache=null;if($("gridPng"))$("gridPng").src=gridPng()});
