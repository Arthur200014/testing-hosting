<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#16372f">
  <title>Турнир Нефритового дворца — ОГЭ №6 · дроби и вычисления</title>
  <style>
    :root{
      --ink:#17251f;--paper:#fff8df;--jade:#45d49f;--jade2:#157b61;
      --gold:#ffd76a;--red:#db4b3f;--wood:#5e2f20;--cream:#fff6d6;
      --shadow:0 18px 55px #071e1970;--line:#472619;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Trebuchet MS,Segoe UI,system-ui,sans-serif;color:var(--ink)}
    body{
      min-height:100vh;overflow-x:hidden;
      background:
        radial-gradient(circle at 50% 18%,#d6fff0 0 6%,transparent 30%),
        linear-gradient(#83cbb4 0 27%,#4b8c73 27% 42%,#214f42 42% 100%);
    }
    body:before,body:after{content:"";position:fixed;inset:auto;pointer-events:none;z-index:-1}
    body:before{
      left:-8%;right:-8%;bottom:0;height:58vh;
      background:
        radial-gradient(ellipse at 14% 100%,#173b31 0 45%,transparent 46%),
        radial-gradient(ellipse at 89% 100%,#173b31 0 40%,transparent 41%),
        linear-gradient(8deg,transparent 40%,#28614e 41% 55%,transparent 56%);
      filter:drop-shadow(0 -18px 30px #0d2a2555)
    }
    body:after{
      top:0;left:0;width:100%;height:230px;opacity:.45;
      background:
        linear-gradient(62deg,transparent 47%,#fff9 48% 49%,transparent 50%) 0 0/190px 190px,
        radial-gradient(ellipse,#fff9 0 28%,transparent 30%) 30px 16px/320px 90px repeat-x;
      animation:mist 24s linear infinite
    }
    button,input{font:inherit}
    button{cursor:pointer}
    button:disabled{cursor:not-allowed}
    .topbar{
      width:min(1240px,calc(100% - 24px));margin:12px auto 0;min-height:54px;
      display:flex;align-items:center;justify-content:space-between;gap:12px;
      color:#fff;position:relative;z-index:20
    }
    .brand{display:flex;align-items:center;gap:10px;font-weight:1000;letter-spacing:.04em;text-shadow:0 2px 5px #173b31}
    .brand-mark{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#ffdf70,#bc7527);border:3px solid #fff2b1;box-shadow:0 5px 0 #774219;font-size:22px}
    .student-box{
      display:none;align-items:center;gap:9px;background:#092d27c9;border:1px solid #b8ffe076;
      padding:7px 8px 7px 13px;border-radius:999px;backdrop-filter:blur(10px)
    }
    .student-box b{max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .tiny-btn{border:1px solid #fff5;background:#fff1;color:#fff;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:900}
    .tiny-btn:hover:not(:disabled){background:#fff3}
    .tiny-btn:disabled{opacity:.35}
    .sound-btn{width:37px;height:37px;padding:0;font-size:17px}
    .stage{
      width:min(1240px,calc(100% - 24px));min-height:calc(100vh - 78px);margin:8px auto 16px;
      position:relative;z-index:2
    }
    .screen{
      min-height:700px;border:4px solid #291911;border-radius:26px;overflow:hidden;position:relative;
      background:
        linear-gradient(#fffae8eb,#fff5d8eb),
        repeating-linear-gradient(90deg,transparent 0 74px,#5e2f2010 75px 78px);
      box-shadow:var(--shadow),inset 0 0 0 4px #dda948;
    }
    .screen:before,.screen:after{content:"";position:absolute;top:0;bottom:0;width:24px;background:repeating-linear-gradient(#8d4d28 0 30px,#d9983e 31px 38px);z-index:6}
    .screen:before{left:0}.screen:after{right:0}
    .login-screen,.start-screen,.final-screen{display:grid;grid-template-columns:1.02fr .98fr;align-items:center;padding:52px 64px;gap:36px}
    .scroll{
      background:linear-gradient(100deg,#f6d98d,#fff9dc 9% 91%,#eec973);
      border:3px solid #8e5a25;border-radius:12px;padding:34px;box-shadow:0 15px 30px #5a351f35;position:relative
    }
    .scroll:before,.scroll:after{content:"";position:absolute;left:-18px;right:-18px;height:18px;border-radius:20px;background:linear-gradient(#c7802b,#ffda6e 45%,#8c4c1a 50%);border:2px solid #743b15}
    .scroll:before{top:-10px}.scroll:after{bottom:-10px}
    .eyebrow{display:inline-flex;padding:6px 10px;background:#16372f;color:#ffe384;border-radius:7px;font-size:12px;font-weight:1000;letter-spacing:.13em;text-transform:uppercase}
    h1{font-size:clamp(36px,5vw,66px);line-height:.93;margin:18px 0 18px;letter-spacing:-.055em}
    .lead{font-size:18px;line-height:1.55;margin:0 0 22px}
    .code-form{display:grid;gap:11px}
    .code-input{width:100%;border:3px solid #4f2a1a;border-radius:14px;background:#fffdf0;padding:15px 16px;font-size:20px;font-weight:900;text-transform:uppercase;outline:none}
    .code-input:focus{border-color:var(--jade2);box-shadow:0 0 0 4px #45d49f3d}
    .primary,.secondary{border:0;border-radius:14px;padding:14px 20px;font-weight:1000;letter-spacing:.02em;box-shadow:0 6px 0 #492617;transition:.18s transform,.18s filter}
    .primary{color:#fff;background:linear-gradient(#32b985,#167a5d);border:2px solid #0c5d47}
    .secondary{color:#351b12;background:linear-gradient(#ffe57c,#e8a83b);border:2px solid #9d5f18}
    .primary:hover,.secondary:hover{filter:brightness(1.07);transform:translateY(-2px)}
    .primary:active,.secondary:active{transform:translateY(4px);box-shadow:0 2px 0 #492617}
    .status{min-height:22px;font-size:14px;font-weight:900}
    .status.bad{color:#b42318}.status.ok{color:#087857}
    .rules{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:23px 0}
    .rule{background:#fff9;border:2px solid #7a4b2f33;border-radius:14px;padding:13px 8px;text-align:center;font-size:13px;font-weight:900;line-height:1.35}
    .rule b{font-size:22px;display:block}
    .hero-yard{min-height:550px;position:relative;display:grid;place-items:center}
    .sun{position:absolute;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,#fffbd1 0 22%,#ffdd69 50%,#ffbd4566 70%,transparent 71%);filter:blur(.2px);animation:pulse 3s ease-in-out infinite}
    .mountains{position:absolute;inset:auto 0 0;height:58%;background:linear-gradient(150deg,transparent 47%,#24483a 48%) 0 0/52% 100%,linear-gradient(210deg,transparent 47%,#16372f 48%) 100% 0/64% 100%;background-repeat:no-repeat;opacity:.8}
    .panda{
      --s:1;position:relative;width:230px;height:350px;transform:scale(var(--s));transform-origin:center bottom;
      filter:drop-shadow(0 18px 10px #142b2366);z-index:3;animation:pandaBreathe 2.4s ease-in-out infinite
    }
    .panda .body{position:absolute;left:45px;top:122px;width:143px;height:184px;border-radius:49% 49% 43% 43%;background:radial-gradient(circle at 55% 32%,#fff 0 42%,#e7e0ca 66%,#c9c0a7);border:4px solid #1c201e}
    .panda .head{position:absolute;left:37px;top:25px;width:158px;height:143px;border-radius:48% 50% 45% 45%;background:radial-gradient(circle at 56% 34%,#fff 0 58%,#ded8c5 78%);border:4px solid #1b211f;z-index:4}
    .panda .ear{position:absolute;top:11px;width:58px;height:61px;border-radius:50%;background:#161b1a;border:4px solid #0d1110;z-index:2}
    .panda .ear.l{left:35px}.panda .ear.r{right:33px}
    .eye-patch{position:absolute;top:50px;width:43px;height:58px;border-radius:58% 42% 56% 44%;background:#171b1a;transform:rotate(14deg)}
    .eye-patch.l{left:29px}.eye-patch.r{right:29px;transform:rotate(-14deg)}
    .eye-patch i{position:absolute;left:14px;top:16px;width:13px;height:17px;border-radius:50%;background:#f8eed3;box-shadow:inset 0 0 0 5px #4a7b55}
    .snout{position:absolute;left:52px;top:81px;width:53px;height:39px;border-radius:48%;background:#e7d8bd;border:2px solid #83735c}
    .nose{position:absolute;left:17px;top:2px;width:20px;height:14px;border-radius:50%;background:#101413}
    .smile{position:absolute;left:13px;top:16px;width:28px;height:13px;border-bottom:4px solid #3f211a;border-radius:50%}
    .panda .arm,.panda .leg{position:absolute;background:#171c1b;border:4px solid #0d1110;z-index:1}
    .panda .arm{top:149px;width:56px;height:126px;border-radius:55px;transform-origin:50% 15%}
    .panda .arm.l{left:21px;transform:rotate(24deg)}.panda .arm.r{right:12px;transform:rotate(-36deg)}
    .panda .leg{top:278px;width:68px;height:65px;border-radius:30px}
    .panda .leg.l{left:42px;transform:rotate(8deg)}.panda .leg.r{right:37px;transform:rotate(-8deg)}
    .pants{position:absolute;left:49px;top:247px;width:136px;height:62px;border-radius:12px 12px 38px 38px;background:linear-gradient(#c7954f,#8a5b28);border:4px solid #4d321c;z-index:5}
    .belt{position:absolute;left:-3px;right:-3px;top:2px;height:16px;background:#b7362e;border:2px solid #6e1e18}
    .hero-yard .panda{--s:1.18}
    .gong-mini{position:absolute;right:1%;top:22%;width:210px;height:210px;border-radius:50%;background:radial-gradient(circle,#fff2a0 0 8%,#e9b53b 9% 34%,#9c601c 35% 42%,#f2ca52 43% 67%,#885118 68%);border:8px solid #4c2a16;box-shadow:0 8px 0 #2e170d,0 0 35px #ffdb68}
    .gong-mini:after{content:"";position:absolute;left:-28px;right:-28px;top:-35px;bottom:-58px;border:12px solid #48291c;border-bottom-width:18px;border-top-left-radius:60px;border-top-right-radius:60px;z-index:-1}
    .mentor-row{position:absolute;left:4%;right:1%;bottom:5px;display:flex;align-items:end;justify-content:space-between;z-index:5}
    .mentor{--c:#b64936;--f:#f1c57f;position:relative;width:70px;height:105px;filter:drop-shadow(0 7px 4px #17372b88);animation:mentorBob 2.6s ease-in-out infinite}
    .mentor:nth-child(2){animation-delay:-.5s}.mentor:nth-child(3){animation-delay:-1s}.mentor:nth-child(4){animation-delay:-1.5s}.mentor:nth-child(5){animation-delay:-2s}.mentor:nth-child(6){animation-delay:-2.5s}
    .mentor .m-body{position:absolute;left:17px;bottom:0;width:39px;height:59px;border-radius:45% 45% 20% 20%;background:var(--c);border:3px solid #332018}
    .mentor .m-head{position:absolute;left:10px;top:3px;width:54px;height:55px;border-radius:48%;background:var(--f);border:3px solid #332018}
    .mentor .m-head:before,.mentor .m-head:after{content:"";position:absolute;top:19px;width:9px;height:13px;border-radius:50%;background:#17211d;box-shadow:inset 0 0 0 3px #f7df85}
    .mentor .m-head:before{left:10px}.mentor .m-head:after{right:10px}
    .mentor .m-mark{position:absolute;left:20px;top:42px;width:17px;height:5px;border-bottom:3px solid #4c2219;border-radius:50%}
    .mentor.shifu{--c:#7d3026;--f:#d48152;transform:scale(.84);transform-origin:center bottom}
    .mentor.shifu .m-head:before{box-shadow:inset 0 0 0 3px #b5d56e}
    .mentor.tiger{--c:#8d2e20;--f:#e89031}
    .mentor.tiger .m-head{background:repeating-linear-gradient(75deg,#e89031 0 9px,#4b2118 10px 13px)}
    .mentor.monkey{--c:#8f4f24;--f:#d9a15a}.mentor.monkey .m-head{border-radius:50% 50% 42% 42%}
    .mentor.crane{--c:#e7e6d9;--f:#fff}.mentor.crane{height:125px}.mentor.crane .m-head{width:38px;left:18px}.mentor.crane .m-body{height:75px;background:#e9e5d2}
    .mentor.mantis{--c:#68a836;--f:#9bd34f;transform:scale(.58);transform-origin:center bottom}
    .mentor.viper{--c:#2e8a61;--f:#5ac88b}.mentor.viper .m-body{height:72px;width:31px;left:21px;border-radius:48% 48% 60% 60%}
    .game-screen{display:grid;grid-template-rows:auto 1fr;min-height:730px;padding:28px 36px 30px}
    .game-hud{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;margin:0 10px 15px}
    .round{font-weight:1000;background:#173b31;color:#fff3b0;border-radius:999px;padding:8px 13px;white-space:nowrap}
    .progress-track{height:15px;border:3px solid #42291b;border-radius:999px;background:#d4c49a;overflow:hidden}
    .progress-fill{height:100%;width:0;background:linear-gradient(90deg,#20aa78,#92e061);transition:.35s width}
    .live-score{font-weight:1000;color:#173b31;white-space:nowrap}
    .game-layout{display:grid;grid-template-columns:minmax(390px,1.15fr) minmax(380px,.85fr);gap:22px;min-height:610px}
    .question-zone{
      display:grid;grid-template-rows:auto auto minmax(190px,1fr) auto auto;
      gap:12px;min-width:0;background:#fff9e8;border:3px solid #5d3823;border-radius:20px;padding:20px;
      box-shadow:inset 0 0 0 4px #e7c468
    }
    .proto{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;font-weight:1000;text-transform:uppercase;letter-spacing:.06em;color:#346755}
    .speaker{display:flex;align-items:center;gap:8px}
    .speaker-face{width:34px;height:34px;border-radius:50%;background:#d8893b;border:3px solid #6a341f;display:grid;place-items:center;font-size:21px}
    .statement{position:relative;background:linear-gradient(100deg,#f3d891,#fff9db 10% 90%,#e5be63);border:2px solid #8c5c27;border-radius:10px;padding:18px 22px;font-size:clamp(18px,2vw,26px);font-weight:1000;line-height:1.25;text-align:center}
    .statement:before,.statement:after{content:"";position:absolute;top:-5px;bottom:-5px;width:10px;border-radius:8px;background:#9e6528}.statement:before{left:-7px}.statement:after{right:-7px}
    .diagram{border:2px solid #b08c58;border-radius:15px;background:#fffdf6;display:grid;place-items:center;overflow:hidden;position:relative;min-height:190px}
    .diagram svg{width:100%;height:100%;max-height:280px;display:block}
    .diagram .pulse-vector{animation:vectorGlow 1.5s ease-in-out infinite}
    .diagram.solved-correct{box-shadow:inset 0 0 38px #2dc7886b}
    .diagram.solved-wrong{box-shadow:inset 0 0 38px #e04e436e}
    .hintline{font-size:13px;text-align:center;color:#6f5b46;font-weight:800;min-height:18px}
    .answer-row{display:grid;grid-template-columns:1fr 1fr;gap:15px}
    .gong-btn{
      min-height:88px;border:0;background:none;position:relative;padding:0 10px 6px;color:#fff;font-weight:1000;font-size:21px;text-shadow:0 2px #16271f;
      transition:.2s transform,.2s filter
    }
    .gong-btn .disc{position:absolute;inset:0;border:6px solid #51301d;border-radius:50%/45%;z-index:0;box-shadow:inset 0 0 0 5px #f6d96e,0 7px 0 #2e190f}
    .gong-btn.true .disc{background:radial-gradient(circle,#eaffbf 0 8%,#50cb85 9% 50%,#16775d 52%)}
    .gong-btn.false .disc{background:radial-gradient(circle,#ffe0a1 0 8%,#e65d48 9% 50%,#982b2a 52%)}
    .gong-btn span{position:relative;z-index:1}
    .gong-btn:hover:not(:disabled){transform:translateY(-3px) scale(1.02);filter:brightness(1.08)}
    .gong-btn:active:not(:disabled){transform:translateY(5px)}
    .gong-btn.used{animation:gongHit .48s ease-out}
    .gong-btn.correct .disc{box-shadow:0 0 0 10px #79e9b244,0 0 30px #39cf8e,inset 0 0 0 5px #fff9a9}
    .gong-btn.wrong .disc{box-shadow:0 0 0 10px #ee594e36,0 0 30px #e33d34,inset 0 0 0 5px #ffd98f}
    .arena{
      position:relative;border:3px solid #4b2c1c;border-radius:20px;overflow:hidden;
      background:
        radial-gradient(circle at 50% 18%,#fff2a6 0 5%,transparent 28%),
        linear-gradient(#93d3b8 0 47%,#d7ad61 48% 52%,#8b542d 53% 100%);
      box-shadow:inset 0 0 0 5px #e9c060
    }
    .arena:before{content:"";position:absolute;left:0;right:0;bottom:0;height:43%;background:repeating-linear-gradient(90deg,#8c512b 0 58px,#6d3c22 59px 62px);transform:perspective(250px) rotateX(14deg);transform-origin:bottom}
    .arena-roof{position:absolute;left:-5%;right:-5%;top:0;height:96px;background:linear-gradient(165deg,transparent 42%,#5b2319 43% 60%,transparent 61%) 0 0/120px 100%,linear-gradient(195deg,transparent 42%,#762f20 43% 60%,transparent 61%) 60px 0/120px 100%;filter:drop-shadow(0 8px 0 #3f1d16)}
    .arena .panda{--s:.98;position:absolute;left:calc(50% - 115px);bottom:42px}
    .arena .panda.hit-true{animation:pandaHitTrue .68s ease}
    .arena .panda.hit-false{animation:pandaHitFalse .68s ease}
    .arena .panda.stumble{animation:pandaStumble .75s ease}
    .arena .panda.celebrate{animation:pandaCelebrate .75s ease}
    .arena .gong-post{position:absolute;top:145px;width:120px;height:120px;border-radius:50%;border:7px solid #4a2b1b;box-shadow:0 6px 0 #2b170f,0 0 19px #ffd972}
    .arena .gong-post.true{left:18px;background:radial-gradient(circle,#efffbd 0 10%,#43c685 11% 54%,#11694f 55%)}
    .arena .gong-post.false{right:18px;background:radial-gradient(circle,#fff1ad 0 10%,#db5945 11% 54%,#94292a 55%)}
    .arena .gong-post:after{content:"";position:absolute;left:48px;top:116px;width:12px;height:210px;background:#482719;z-index:-1}
    .coach-strip{position:absolute;left:15px;right:15px;bottom:9px;height:82px;display:flex;justify-content:space-around;align-items:end;z-index:6}
    .coach-strip .mentor{transform:scale(.58);transform-origin:center bottom;margin:0 -14px}
    .speech{position:absolute;left:15px;right:15px;top:102px;z-index:7;transform:translateY(-10px);opacity:0;transition:.25s;background:#fffce8;border:3px solid #47291b;border-radius:18px;padding:12px 15px;text-align:center;font-weight:1000;box-shadow:0 8px 0 #47291b}
    .speech:after{content:"";position:absolute;left:48%;bottom:-16px;border:9px solid transparent;border-top-color:#47291b}
    .speech.show{transform:none;opacity:1}
    .feedback{
      position:absolute;left:16px;right:16px;bottom:102px;z-index:8;border-radius:14px;padding:13px 15px;
      font-size:14px;font-weight:900;line-height:1.35;opacity:0;transform:translateY(8px);transition:.25s
    }
    .feedback.show{opacity:1;transform:none}
    .feedback.ok{background:#e6ffdf;border:3px solid #13805b}.feedback.no{background:#fff0d8;border:3px solid #c84b3d}
    .feedback b{display:block;font-size:17px;margin-bottom:3px}
    .next-btn{margin-top:8px;width:100%;padding:9px;border:0;border-radius:10px;background:#173b31;color:#fff;font-weight:1000}
    .jade-tiles{display:grid;grid-template-columns:repeat(15,1fr);gap:6px;margin:4px 10px 0}
    .tile{height:10px;border-radius:5px;background:#b9a87b;border:1px solid #59422d;transition:.3s}
    .tile.current{background:#ffe26d;box-shadow:0 0 11px #ffd02f}.tile.good{background:#35cf8e;box-shadow:0 0 8px #36d594}.tile.bad{background:#d95846}
    .final-screen{text-align:center;grid-template-columns:1fr .9fr}
    .final-screen .scroll{max-width:620px;margin:auto}
    .score-ring{width:190px;height:190px;border-radius:50%;display:grid;place-items:center;margin:18px auto;position:relative;border:5px solid #4d2e1d;box-shadow:0 10px 0 #4d2e1d}
    .score-ring:before{content:"";position:absolute;inset:22px;border-radius:50%;background:#fff8df;border:3px solid #65442d}
    .score-ring b{font-size:47px;position:relative}
    .final-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:17px 0}
    .final-stat{border:2px solid #926735;background:#fff9;border-radius:12px;padding:12px}.final-stat b{font-size:23px;display:block;margin-top:4px}
    .save-status{font-weight:1000;min-height:24px;margin:15px 0}.save-status.ok{color:#087c58}.save-status.bad{color:#a63b32}
    .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
    .dragon-scroll{position:relative;min-height:510px;display:grid;place-items:center}
    .dragon-disc{width:350px;height:350px;border-radius:50%;background:conic-gradient(from 30deg,#44c994,#1e6e59,#f4d46c,#44c994);border:12px solid #4e2d1b;box-shadow:0 20px 0 #31180f,0 0 45px #8bf5c0;display:grid;place-items:center;animation:discFloat 3s ease-in-out infinite}
    .dragon-disc .panda{--s:.68;margin-top:35px}
    .confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
    .confetti i{position:absolute;top:-20px;width:10px;height:18px;background:var(--c);left:var(--x);animation:fall var(--d) linear infinite;animation-delay:var(--delay);transform:rotate(var(--r))}
    .hidden{display:none!important}
    .leaf-field{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:1}
    .leaf-field i{position:absolute;top:-12vh;left:var(--x);width:27px;height:10px;border-radius:100% 0 100% 0;background:linear-gradient(135deg,#bdf29d99,#277c55bb);filter:drop-shadow(0 2px 2px #173b3155);animation:leafFall var(--d) linear infinite;animation-delay:var(--delay);opacity:.72}
    .leaf-field i:nth-child(3n){width:20px;height:8px;background:linear-gradient(135deg,#ffe27c99,#4a9c65aa)}
    .lesson-fab,.lesson-panel{position:fixed;right:18px;bottom:18px;z-index:80;border:2px solid #ffe795;background:#123d32ee;color:#fff;border-radius:18px;box-shadow:0 10px 28px #071e1990;backdrop-filter:blur(10px)}
    .lesson-fab{padding:13px 17px;font-weight:1000}

  const APP_ID='oge-06-jade-palace-theory-truth-v2',FIXED_SESSION_ID='currentSession',TEACHER_CODE_HASH='b0a83a3919eba1d2a99034f2d94e5a47590f1710595c04bd64b5c8f21456a7c6';
const TEACHER_CODE="A7K4P9";

  function skillQuestion(p,title,truth,text,explain,visual){return{p,title,truth,text,explain,visual}}

  function bank(){
    const f=fraction,cf=complexFraction;
    return [
      // 1. Сложение десятичных дробей — разряды и запись
      skillQuestion(1,'Сложение десятичных дробей',true,'Чтобы сложить десятичные дроби столбиком, нужно расположить <b>запятую под запятой</b> и складывать одинаковые разряды.','Верно. Единицы складывают с единицами, десятые — с десятыми, сотые — с сотыми. Если знаков после запятой не хватает, справа можно дописать нули.',columnBoard('3,70','+','0,45','4,15','Одинаковые разряды стоят строго друг под другом.')),
      skillQuestion(1,'Сложение десятичных дробей',false,'При сложении десятичных дробей главное выровнять числа <b>по правому краю</b>, поэтому положение запятых не имеет значения.','Неверно. Главный ориентир — десятичная запятая. Выравнивание только по правому краю может поставить десятые под сотыми и привести к ошибке.',columnBoard('3,70','+','0,45','4,15','Сначала выровняй запятые, затем считай по разрядам.')),
      skillQuestion(1,'Сложение десятичных дробей',true,'Записи <b>2,4</b>, <b>2,40</b> и <b>2,400</b> обозначают одно и то же число, поэтому нули справа можно дописывать для удобства вычислений.','Верно. Нули справа после последней значащей цифры дробной части не изменяют значение десятичной дроби.',mathBoard('2,4 = 2,40 = 2,400','Дописывание нулей справа помогает выровнять разряды.')),

  function buildBalancedDeck(){
    const all=bank(),groups=new Map(),deck=[];
    for(const q of all){if(!groups.has(q.p))groups.set(q.p,[]);groups.get(q.p).push(q)}
    const ordered=[...groups.keys()].sort((a,b)=>a-b);
    for(const p of ordered){
      const qs=groups.get(p),trues=shuffle(qs.filter(q=>q.truth)),falses=shuffle(qs.filter(q=>!q.truth));
      if(!trues.length||!falses.length)throw new Error(`В теме ${p} нужен хотя бы один верный и один неверный тезис`);
      deck.push(pick(trues),pick(falses));
    }
    // Сохраняем парность: два соседних свитка относятся к одной теме. Это гарантирует,
    // что при двух учениках каждый получит по одному утверждению из каждой из 10 тем.
    const pairs=[];for(let i=0;i<deck.length;i+=2)pairs.push(shuffle(deck.slice(i,i+2)));
    return shuffle(pairs).flat().slice(0,TOTAL);
  }
  function storedStudent(){const studentId=localStorage.getItem('egeStudentId')||'',name=localStorage.getItem('egeStudentName')||'',code=localStorage.getItem('egeStudentCode')||'';return studentId&&code&&name&&name!=='Ученик'?{studentId:String(studentId),verifiedStudentId:String(studentId),name:String(name),code:String(code),verified:true}:null}
  function saveStudent(st){if(!st?.code||!st?.name||st.name==='Ученик')return;const id=String(st.verifiedStudentId||st.studentId||st.code);localStorage.setItem('egeStudentId',id);localStorage.setItem('egeStudentName',String(st.name));localStorage.setItem('egeStudentCode',String(st.code));localStorage.setItem(STUDENT_SAVE_KEY,JSON.stringify({studentId:id,name:String(st.name),code:String(st.code),verified:true}))}
  function parseStudent(data,code){const src=(data&&(data.student||data.data))||data||{},studentId=src.studentId||src.id||(data&&data.studentId),name=src.studentName||src.name||src.fullName||(data&&(data.studentName||data.name));const bad=data&&(data.success===false||data.valid===false||data.ok===false);if(bad||!studentId)throw new Error((data&&(data.message||data.error))||'Личный код не найден');return{studentId:String(studentId),name:String(name||'Ученик'),code:String(code)}}
  function validateStudent(code){return new Promise((resolve,reject)=>{const cb='egeValidate_'+Date.now()+'_'+Math.random().toString(36).slice(2),sc=document.createElement('script');let done=false;const clean=()=>{try{delete window[cb]}catch{}sc.remove()};const finish=(err,data)=>{if(done)return;done=true;clearTimeout(timer);clean();err?reject(err):resolve(data)};const timer=setTimeout(()=>finish(Object.assign(new Error('Сервер не ответил.'),{transient:true})),60000);window[cb]=data=>{try{finish(null,parseStudent(data,code))}catch(e){finish(Object.assign(e,{terminal:true}))}};sc.onerror=()=>finish(Object.assign(new Error('Не удалось проверить код'),{transient:true}));sc.src=API_URL+'?'+new URLSearchParams({action:'validateStudent',code,callback:cb}).toString();document.head.appendChild(sc)})}
  function normalizeState(raw){const s=raw&&typeof raw==='object'?raw:{};s.version=Number(s.version||1);s.schemaVersion=Number(s.schemaVersion||2);s.boardEpoch=Number(s.boardEpoch||0);s.strokes=s.strokes||{};s.ui=s.ui||{screen:'lobby'};s.game=s.game||{};const g=s.game;g.status=g.status||'lobby';g.studentLimit=Number(g.studentLimit)===2?2:1;g.players=g.players||{};g.deck=Array.isArray(g.deck)?g.deck:[];g.index=Number(g.index||0);g.turnKey=g.turnKey||'';g.playerOrder=Array.isArray(g.playerOrder)?g.playerOrder:[];g.stats=g.stats||{};g.attempts=g.attempts||{};g.feedback=g.feedback||null;g.eventIds=g.eventIds||{};g.submissions=g.submissions||{};return s}
  function newGameState(limit){return{status:'lobby',studentLimit:Number(limit)===2?2:1,players:{},deck:[],index:0,turnKey:'',playerOrder:[],stats:{},attempts:{},feedback:null,sessionId:uuid(),eventIds:{},submissions:{},startedAt:0,finishedAt:0,finishReason:''}}

  async function chooseAnswer(value){if(role!=='student'||!currentState)return;const base=clone(currentState),q=currentState.game.deck[currentState.game.index];try{const result=await runTransaction(stateRef(),raw=>{const s=normalizeState(raw||base),g=s.game;if(g.status!=='playing'||g.turnKey!==playerId)return;const idx=g.index;g.attempts[playerId]=g.attempts[playerId]||{};g.stats[playerId]=g.stats[playerId]||{firstTryCorrect:0,completed:0};const answer=g.attempts[playerId][idx]||{choices:[],firstAttempted:false,firstCorrect:false,resolved:false};if(answer.resolved)return;const correct=Boolean(value)===Boolean(g.deck[idx].truth),first=!answer.firstAttempted;answer.firstAttempted=true;if(first)answer.firstCorrect=correct;answer.choices=[...(answer.choices||[]),{value:Boolean(value),correct,at:Date.now()}];if(correct){answer.resolved=true;g.stats[playerId].completed=Number(g.stats[playerId].completed||0)+1;if(first)g.stats[playerId].firstTryCorrect=Number(g.stats[playerId].firstTryCorrect||0)+1}g.attempts[playerId][idx]=answer;g.feedback={index:idx,key:playerId,value:Boolean(value),correct,first,at:Date.now()};s.version++;return s},{applyLocally:false});if(result.committed){sound('gong');sound(q.truth===value?'good':'bad')}}catch(err){showGameError('Не удалось записать ответ. Проверь соединение и нажми ещё раз.');console.error('answer-transaction',err)}}
  function showGameError(text){const hint=document.querySelector('.hintline');if(!hint)return;hint.classList.add('status','bad');hint.textContent=text}
  async function finishTournamentEarly(){

    if(!confirm(`Завершить игру досрочно?\n\n${lines}\n\nНепройденные задания будут засчитаны как невыполненные. Текущие результаты всё равно отправятся в «Тесты».`))return;

  async function nextQuestion(){if(role!=='student'||!currentState)return;const base=clone(currentState);await runTransaction(stateRef(),raw=>{const s=normalizeState(raw||base),g=s.game;if(g.status!=='playing'||g.turnKey!==playerId)return;const a=g.attempts[playerId]?.[g.index];if(!a?.resolved)return;if(g.index>=TOTAL-1){g.status='finished';g.finishedAt=Date.now();s.ui.screen='final'}else{g.index++;g.turnKey=g.playerOrder[g.index%g.playerOrder.length];g.feedback=null}s.version++;return s},{applyLocally:false})}
  function confetti(){
    return `<div class="confetti">${Array.from({length:32},(_,i)=>`<i style="--x:${ri(2,98)}%;--d:${ri(4,8)}s;--delay:-${ri(0,8)}s;--r:${ri(0,180)}deg;--c:${pick(['#45d49f','#ffd76a','#db4b3f','#f5f0d0'])}"></i>`).join('')}</div>`

  function renderFinal(){
    const g=currentState.game,seconds=Math.max(1,Math.round((g.finishedAt-g.startedAt)/1000)),expected=TOTAL/g.studentLimit,early=g.finishReason==='teacher-early';
    const cards=g.playerOrder.map(k=>{const p=g.players[k],score=Number(g.stats[k]?.firstTryCorrect||0),percent=Math.round(score/expected*100),attempted=Object.values(g.attempts[k]||{}).filter(a=>a?.firstAttempted).length,sub=g.submissions[k]?.status||'pending';return`<div class="final-player"><span>Ученик №${p.slot}</span><strong>${esc(p.name)}</strong><b>${score} из ${expected} · ${percent}%</b><small>Отвечено: ${attempted} из ${expected}. ${sub==='saved'?'✓ Результат сохранён':sub==='queued'?'Нет связи — результат в очереди':'Сохраняем результат…'}</small></div>`}).join(''),allHandled=g.playerOrder.every(k=>['saved','queued'].includes(g.submissions[k]?.status));
    $('app').innerHTML=`<section class="screen final-screen">${confetti()}<div class="scroll"><span class="eyebrow">${early?'Турнир завершён досрочно':'Турнир завершён'}</span><h1>${early?'Учитель завершил испытание':'Свиток Дракона открыт!'}</h1><p><b>Результаты первой попытки</b>${early?'<br><small>Непройденные свитки учитываются как невыполненные.</small>':''}</p><div class="final-player-grid">${cards}</div><div class="final-stats"><div class="final-stat">Участников<b>${g.studentLimit}</b></div><div class="final-stat">Время турнира<b>${timeText(seconds)}</b></div></div>${role==='teacher'?`<div class="actions"><button class="primary" id="againBtn" ${allHandled?'':'disabled'}>Пройти ещё раз</button><button class="secondary" id="homeBtn" ${allHandled?'':'disabled'}>На старт</button></div>`:'<div class="save-status">Результат отправляется автоматически. Учитель может запустить новый турнир.</div>'}</div><div class="dragon-scroll"><div class="dragon-disc">${pandaModel()}</div>${mentorRow()}</div></section>`;
    if($('againBtn'))$('againBtn').onclick=restartTournament;if($('homeBtn'))$('homeBtn').onclick=resetToLobby;updateTopbar()
  }
  async function resetToLobby(){if(role!=='teacher')return;const base=clone(currentState);await runTransaction(stateRef(),raw=>{const s=normalizeState(raw||base),limit=s.game.studentLimit,players=s.game.players;s.game=newGameState(limit);s.game.players=players;s.ui.screen='lobby';s.boardEpoch++;s.strokes={};s.version++;return s},{applyLocally:false})}
  async function restartTournament(){if(role!=='teacher')return;const deck=buildBalancedDeck(),base=clone(currentState);await runTransaction(stateRef(),raw=>{const s=normalizeState(raw||base);if(!s.game.playerOrder.every(k=>['saved','queued'].includes(s.game.submissions[k]?.status)))return;seedGame(s.game,deck);s.ui.screen='game';s.version++;return s},{applyLocally:false});sound('start')}
  function readQueue(){try{const q=JSON.parse(localStorage.getItem(PENDING_KEY)||'[]');return Array.isArray(q)?q:[]}catch(_){return[]}}
  function writeQueue(q){localStorage.setItem(PENDING_KEY,JSON.stringify(q))}
  function queueResult(payload,key){const q=readQueue();if(!q.some(x=>x?.payload?.eventId===payload.eventId))q.push({payload,key,sessionId:currentState?.game?.sessionId||''});writeQueue(q)}
  function removeQueued(id){writeQueue(readQueue().filter(x=>x?.payload?.eventId!==id))}
  async function postResult(payload){const body={...payload,action:'submitTest',programId:TEST_META.programId};const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),redirect:'follow'});let answer;try{answer=await r.json()}catch(_){throw new Error('Система результатов не ответила.')}if(!r.ok||!answer?.ok)throw new Error(answer?.error||'Результат не принят.');return answer}
  function resultPayload(key,state=currentState){const g=state.game,p=g.players[key],correct=Number(g.stats[key]?.firstTryCorrect||0),total=TOTAL/g.studentLimit,scorePercent=Math.round(correct/total*100),finishedAt=Number(g.finishedAt||Date.now()),startedAt=Number(g.startedAt||finishedAt),durationSeconds=Math.max(1,Math.round((finishedAt-startedAt)/1000)),realId=String(p.verifiedStudentId||p.id||p.code||'');return{eventId:g.eventIds[key],studentId:realId||String(p.code||''),studentCode:p.code||'',testId:TEST_META.testId,testDate:localDate(),topicId:TEST_META.topicId,topicName:TEST_META.topicName,taskNumber:TEST_META.taskNumber,scorePercent,durationSeconds,schemaVersion:TEST_META.schemaVersion}}
  async function setSubmissionIfCurrent(key,eventId,status,by){const target=ref(database,`${lessonRoot()}/state/game/submissions/${key}`);await runTransaction(target,current=>{if(!current||current.eventId!==eventId)return;return{status,eventId,updatedAt:Date.now(),by}},{applyLocally:false})}
  async function submitPlayerResult(key,force=false){if(!currentState?.game?.players?.[key])return;const subRef=ref(database,`${lessonRoot()}/state/game/submissions/${key}`),eventId=currentState.game.eventIds[key],now=Date.now();const claim=await runTransaction(subRef,current=>{const c=current||{status:'pending',eventId};if(c.eventId&&c.eventId!==eventId)return;if(c.status==='saved')return;if(c.status==='sending'&&now-Number(c.updatedAt||0)<15000)return;if(!force&&c.status==='sending')return;return{status:'sending',eventId,updatedAt:now,by:role}},{applyLocally:false});if(!claim.committed)return;const payload=resultPayload(key);try{if(!navigator.onLine)throw new Error('offline');await postResult(payload);removeQueued(payload.eventId);await setSubmissionIfCurrent(key,eventId,'saved',role)}catch(_){queueResult(payload,key);await setSubmissionIfCurrent(key,eventId,'queued',role)}}
  function handleFinished(){const session=currentState.game.sessionId;if(lastFinishedSession===session)return;lastFinishedSession=session;clearTimeout(backupTimer);if(role==='student'&&playerId)submitPlayerResult(playerId);if(role==='teacher'){const backup=force=>{for(const key of currentState.game.playerOrder){if(currentState.game.submissions[key]?.status!=='saved')submitPlayerResult(key,force)}};backupTimer=setTimeout(()=>backup(false),6000);setTimeout(()=>backup(true),20000)}sound('finish')}
  async function flushPending(){if(!navigator.onLine||flushingResults)return;flushingResults=true;try{for(const item of readQueue()){if(!item?.payload?.eventId)continue;let claimed=true;if(item.key&&currentState?.game?.sessionId===item.sessionId){const target=ref(database,`${lessonRoot()}/state/game/submissions/${item.key}`),now=Date.now(),eventId=item.payload.eventId;const claim=await runTransaction(target,current=>{if(!current||current.eventId!==eventId||current.status==='saved')return;if(current.status==='sending'&&now-Number(current.updatedAt||0)<15000)return;return{status:'sending',eventId,updatedAt:now,by:role||'retry'}},{applyLocally:false});claimed=claim.committed}if(!claimed)continue;try{await postResult(item.payload);removeQueued(item.payload.eventId);if(item.key&&currentState?.game?.sessionId===item.sessionId)await setSubmissionIfCurrent(item.key,item.payload.eventId,'saved',role||'retry')}catch(_){if(item.key&&currentState?.game?.sessionId===item.sessionId)await setSubmissionIfCurrent(item.key,item.payload.eventId,'queued',role||'retry')}}}finally{flushingResults=false}}
setInterval(flushPending,60000);

  function subscribeTeacherCursor(){if(cursorUnsub)cursorUnsub();const cRef=ref(database,`${lessonRoot()}/messages/teacherCursor`);cursorUnsub=onValue(cRef,snap=>{const el=$('teacherCursor'),v=snap.val();if(role!=='student'||!v||Date.now()-Number(v.at||0)>5000){el.style.display='none';return}el.style.display='block';el.style.left=`${Number(v.x||0)*innerWidth}px`;el.style.top=`${Number(v.y||0)*innerHeight}px`})}
  function sendTeacherCursor(e){if(!connected||role!=='teacher'||Date.now()-lastCursorSent<75)return;lastCursorSent=Date.now();update(ref(database,`${lessonRoot()}/messages/teacherCursor`),{x:Math.max(0,Math.min(1,e.clientX/innerWidth)),y:Math.max(0,Math.min(1,e.clientY/innerHeight)),at:Date.now()}).catch(()=>{})}
  let boardTool='cursor',drawing=null,lastStrokeWrite=0,draggingToolbar=false,dragOffset={x:0,y:0};
  function setBoardTool(tool){boardTool=tool;document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===tool));$('boardSvg').classList.toggle('active',tool!=='cursor')}
  function boardPoint(e){const rect=$('stage').getBoundingClientRect();return[Math.max(0,Math.min(1,(e.clientX-rect.left)/Math.max(1,rect.width))),Math.max(0,Math.min(1,(e.clientY-rect.top)/Math.max(1,rect.height)))]}
  function strokeRef(id){return ref(database,`${lessonRoot()}/state/strokes/${id}`)}
  async function beginBoardStroke(e){if(!connected||!currentState||e.button>0)return;if(boardTool==='eraser'){eraseNearest(boardPoint(e));return}if(boardTool!=='pen')return;e.preventDefault();const id='stroke_'+uuid(),point=boardPoint(e);drawing={id,anchorId:'stage',authorId:role==='student'?playerId:identity.id,authorName:identity.name,color:$('boardColor').value,width:Number($('boardWidth').value),points:[point],done:false,epoch:currentState.boardEpoch,rev:Date.now()};$('boardSvg').setPointerCapture(e.pointerId);await set(strokeRef(id),drawing)}
  function moveBoardStroke(e){if(!drawing)return;e.preventDefault();const p=boardPoint(e),last=drawing.points[drawing.points.length-1];if(Math.hypot(p[0]-last[0],p[1]-last[1])<.002)return;drawing.points.push(p);if(Date.now()-lastStrokeWrite>65){lastStrokeWrite=Date.now();set(strokeRef(drawing.id),drawing).catch(()=>{})}}
  function endBoardStroke(e){if(!drawing)return;drawing.done=true;drawing.rev=Date.now();set(strokeRef(drawing.id),drawing).catch(()=>{});drawing=null;try{$('boardSvg').releasePointerCapture(e.pointerId)}catch(_){}}
  function eraseNearest(point){const strokes=Object.values(currentState?.strokes||{}).filter(s=>Number(s.epoch)===Number(currentState.boardEpoch));let best=null,bestD=.035;for(const stroke of strokes){for(const p of stroke.points||[]){const d=Math.hypot((p[0]-point[0])*1.4,p[1]-point[1]);if(d<bestD){bestD=d;best=stroke}}}if(best)remove(strokeRef(best.id)).catch(()=>{})}
  function drawBoard(){const svg=$('boardSvg'),rect=$('stage').getBoundingClientRect(),w=Math.max(1,rect.width),h=Math.max(1,rect.height);svg.setAttribute('viewBox',`0 0 ${w} ${h}`);const strokes=Object.values(currentState?.strokes||{}).filter(s=>Number(s.epoch)===Number(currentState?.boardEpoch||0));svg.innerHTML=strokes.map(s=>{const pts=(s.points||[]).map(p=>[Number(p[0])*w,Number(p[1])*h]);if(!pts.length)return'';const d=pts.map((p,i)=>`${i?'L':'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ');return`<path d="${d}" fill="none" stroke="${esc(s.color||'#e53935')}" stroke-width="${Number(s.width||6)}" stroke-linecap="round" stroke-linejoin="round"/>`}).join('')}
  async function clearBoardAll(){if(role!=='teacher'||!currentState)return;const base=clone(currentState);await runTransaction(stateRef(),raw=>{const s=normalizeState(raw||base);s.boardEpoch++;s.strokes={};s.version++;return s},{applyLocally:false})}
  function initBoard(){const svg=$('boardSvg');svg.addEventListener('pointerdown',beginBoardStroke);svg.addEventListener('pointermove',moveBoardStroke);svg.addEventListener('pointerup',endBoardStroke);svg.addEventListener('pointercancel',endBoardStroke);document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>setBoardTool(b.dataset.tool));$('clearBoard').onclick=clearBoardAll;$('boardCollapse').onclick=()=>{$('boardToolbar').classList.toggle('collapsed');$('boardCollapse').textContent=$('boardToolbar').classList.contains('collapsed')?'+':'−'};const saved=JSON.parse(localStorage.getItem(TOOLBAR_POSITION_KEY)||'null');if(saved){$('boardToolbar').style.left=saved.left+'px';$('boardToolbar').style.top=saved.top+'px'}const handle=$('boardHandle');handle.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;draggingToolbar=true;const r=$('boardToolbar').getBoundingClientRect();dragOffset={x:e.clientX-r.left,y:e.clientY-r.top};handle.setPointerCapture(e.pointerId)});handle.addEventListener('pointermove',e=>{if(!draggingToolbar)return;const panel=$('boardToolbar'),r=panel.getBoundingClientRect(),left=Math.max(0,Math.min(innerWidth-r.width,e.clientX-dragOffset.x)),top=Math.max(0,Math.min(innerHeight-r.height,e.clientY-dragOffset.y));panel.style.left=left+'px';panel.style.top=top+'px'});handle.addEventListener('pointerup',e=>{if(!draggingToolbar)return;draggingToolbar=false;const r=$('boardToolbar').getBoundingClientRect();localStorage.setItem(TOOLBAR_POSITION_KEY,JSON.stringify({left:r.left,top:r.top}));try{handle.releasePointerCapture(e.pointerId)}catch(_){}});addEventListener('resize',drawBoard)}
  async function leaveSession(clearStudent=false){verificationRun++;if(currentState?.game?.status==='playing')return;try{await remove(ref(database,`${lessonRoot()}/members/${clientId}`));if(role==='student'&&currentState?.game?.status==='lobby'&&playerId){const base=clone(currentState);await runTransaction(stateRef(),raw=>{const s=normalizeState(raw||base);delete s.game.players[playerId];s.version++;return s},{applyLocally:false})}}catch(_){}for(const unsub of[stateUnsub,membersUnsub,connectionUnsub,cursorUnsub,waitingUnsub])if(typeof unsub==='function')unsub();stateUnsub=membersUnsub=connectionUnsub=cursorUnsub=waitingUnsub=null;connected=false;role='';playerId='';currentState=null;currentMembers={};lastRenderKey='';$('lessonPanel').classList.add('hidden');$('boardToolbar').classList.add('hidden');$('lessonFab').classList.remove('hidden');$('teacherCursor').style.display='none';$('studentBox').style.display='none';if(clearStudent){['egeStudentId','egeStudentName','egeStudentCode',STUDENT_SAVE_KEY].forEach(k=>localStorage.removeItem(k));identity=null}renderIdle()}
  function sound(type){
    if(muted)return;
    try{
      const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
      const ac=sound.ac||(sound.ac=new AC()),now=ac.currentTime,g=ac.createGain();g.connect(ac.destination);
      const tones=type==='gong'?[[180,.8,'sine'],[273,.65,'sine'],[421,.4,'triangle']]:type==='bad'?[[170,.23,'sawtooth'],[90,.35,'square']]:type==='finish'?[[330,.25,'triangle'],[440,.38,'triangle'],[660,.65,'sine']]:type==='start'?[[220,.18,'triangle'],[440,.35,'triangle']]:[[520,.17,'sine'],[780,.35,'triangle']];
      g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(type==='gong'?.075:.045,now+.015);g.gain.exponentialRampToValueAtTime(.0001,now+Math.max(...tones.map(t=>t[1]))+.1);
      tones.forEach(([f,d,w],i)=>{const o=ac.createOscillator();o.type=w;o.frequency.setValueAtTime(f,now+i*.035);o.frequency.exponentialRampToValueAtTime(f*.82,now+d);o.connect(g);o.start(now+i*.035);o.stop(now+d+.1)})
    }catch(_){}
  }
  $('lessonFab').addEventListener('click',openRoleModal);
  $('switchBtn').addEventListener('click',()=>leaveSession(role==='student'));
  $('soundBtn').addEventListener('click',()=>{muted=!muted;$('soundBtn').textContent=muted?'🔇':'🔊';renderLessonPanel()});
  document.addEventListener('pointermove',sendTeacherCursor,{passive:true});
  window.addEventListener('online',flushPending);
  async function init(){initBoard();renderIdle()}
  init().catch(()=>renderIdle());
