<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ОГЭ №17 · Четырёхугольники · парный гайд</title>
<style>html,body{width:100%;height:100%;margin:0;background:#071827;overflow:hidden}iframe{display:block;width:100vw;height:100dvh;border:0}.error{position:fixed;top:12px;left:12px;padding:9px 12px;border-radius:9px;background:#f5e7dc;color:#7a2b22;display:none;font:14px system-ui}</style></head><body>
<iframe id="guide17Frame" src="./gaid-original.html" title="ОГЭ №17 · Сорок прототипов четырёхугольников" allow="autoplay;fullscreen"></iframe><div id="loadError" class="error" role="alert">Не удалось загрузить дополнительные инструменты парного урока. Исходный гайд доступен отдельно.</div>
<script>
(function(){
 const frame=document.getElementById('guide17Frame'),fail=document.getElementById('loadError');
 function loadScript(doc,src){return new Promise((resolve,reject)=>{const s=doc.createElement('script');s.src=src;s.onload=resolve;s.onerror=()=>reject(Error('Не удалось загрузить '+src));doc.body.append(s)})}
 frame.addEventListener('load',async()=>{
  try{
   const doc=frame.contentDocument;
   if(!doc||!doc.body)throw Error('Нет доступа к содержимому');
   // Scripts run inside the original same-origin document, preserving its layout,
   // Firebase identity, drawings and navigation rather than replacing them.
   await loadScript(doc,'./pair17-bridge.js');
   await loadScript(doc,'./pair17-bank.js');
   await loadScript(doc,'./pair17-extension.js');
  }catch(e){console.warn('ОГЭ17 pair loader',e);fail.style.display='block'}
 });
})();
</script></body></html>
