.rider{position:absolute;z-index:4;bottom:28px;width:66px;height:116px}.rider.hiccup{left:75px}.rider.astrid{left:150px}.rider-head{position:absolute;left:18px;top:0;width:32px;height:36px;border:3px solid #31231c;border-radius:48%;background:#d9ac83}.rider.hiccup .rider-head:before{content:"";position:absolute;inset:-8px -5px 12px;background:#513623;clip-path:polygon(0 18%,32% 0,48% 12%,72% 0,100% 30%,88% 68%,10% 72%)}.rider.astrid .rider-head:before{content:"";position:absolute;inset:-7px -4px 12px;background:#e2c67d;clip-path:polygon(0 26%,50% 0,100% 22%,88% 72%,8% 74%)}.rider-body{position:absolute;left:10px;top:32px;width:48px;height:63px;border:3px solid #231a17;border-radius:12px 12px 18px 18px;background:#50392c}.rider.astrid .rider-body{background:#365868}.rider-leg{position:absolute;top:88px;width:16px;height:29px;border:3px solid #211918;background:#342721}.rider-leg.left{left:15px}.rider-leg.right{right:15px}.rider-arm{position:absolute;top:42px;width:14px;height:51px;border:3px solid #211918;border-radius:8px;background:#654635;transform-origin:top}.rider-arm.left{left:2px;transform:rotate(20deg)}.rider-arm.right{right:2px;transform:rotate(-28deg)}.axe{position:absolute;right:-18px;top:16px;width:5px;height:90px;background:#392923;transform:rotate(-15deg)}.axe:after{content:"";position:absolute;left:-15px;top:0;width:35px;height:21px;background:#b9c8c8;clip-path:polygon(0 0,100% 18%,72% 100%,13% 72%)}

function makeDeck(limit){
  const count=Number(limit)===2?20:10;
  const candidates=taskBank().map(make=>make());
  const chosen=[];const used=new Set();
  // First cover as many chapter families as possible.
  for(const chapter of shuffle(Object.keys(CHAPTER_META))){
    if(chosen.length>=count)break;const options=candidates.filter(t=>t.chapter===chapter&&!used.has(t.prototypeId));if(options.length){const t=pick(options);chosen.push(t);used.add(t.prototypeId)}
  }
  for(const t of shuffle(candidates)){if(chosen.length>=count)break;if(!used.has(t.prototypeId)){chosen.push(t);used.add(t.prototypeId)}}
  while(chosen.length<count){const t=pick(candidates);chosen.push(clone(t))}
  const deck=[];
  if(Number(limit)===2){
    const left=shuffle(chosen.slice(0,10)),right=shuffle(chosen.slice(10,20));
    for(let i=0;i<10;i++){left[i].slot=1;right[i].slot=2;deck.push(left[i],right[i])}
  }else{for(const t of shuffle(chosen.slice(0,10))){t.slot=1;deck.push(t)}}
  return deck;
}

async function pushDrawingSnapshot(stroke){if(!stroke)return;try{await set(ref(database,`${lessonRoot()}/state/strokes/${stroke.id}`),stroke)}catch(_){}}
function pointSegmentDistancePx(p,a,b,rect){const px=p[0]*rect.width,py=p[1]*rect.height,ax=a[0]*rect.width,ay=a[1]*rect.height,bx=b[0]*rect.width,by=b[1]*rect.height,dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy,t=l2?Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/l2)):0;return Math.hypot(px-(ax+t*dx),py-(ay+t*dy))}
function eraseAlong(from,to,svgEl){const rect=svgEl.getBoundingClientRect(),travel=Math.hypot((to[0]-from[0])*rect.width,(to[1]-from[1])*rect.height),steps=Math.max(1,Math.ceil(travel/4)),samples=Array.from({length:steps+1},(_,i)=>[from[0]+(to[0]-from[0])*i/steps,from[1]+(to[1]-from[1])*i/steps]),epoch=Number(latestState?.boardEpoch||0),ids=[];for(const [id,s] of Object.entries(latestState?.strokes||{})){if(!s||Number(s.epoch)!==epoch||s.anchorId!=='game-screen'||locallyHiddenStrokes.has(id)||eraseInFlight.has(id))continue;const pts=s.points||[],radius=10+Math.max(1,Number(s.width)||6)/2;let hit=false;for(const sample of samples){if(pts.length===1?pointSegmentDistancePx(sample,pts[0],pts[0],rect)<=radius:pts.some((q,i)=>i&&pointSegmentDistancePx(sample,pts[i-1],q,rect)<=radius)){hit=true;break}}if(hit)ids.push(id)}ids.forEach(eraseStrokeById)}
async function eraseStrokeById(id){if(!id||eraseInFlight.has(id))return;eraseInFlight.add(id);locallyHiddenStrokes.add(id);renderBoard();try{await remove(ref(database,`${lessonRoot()}/state/strokes/${id}`))}catch(_){locallyHiddenStrokes.delete(id);renderBoard()}finally{eraseInFlight.delete(id)}}
async function undoLastOwnStroke(){if(!latestState)return;if(drawingStroke){const id=drawingStroke.id;drawingStroke=null;await eraseStrokeById(id);return}const mine=Object.values(latestState.strokes||{}).filter(s=>s&&Number(s.epoch)===Number(latestState.boardEpoch||0)&&s.authorId===participantId&&!locallyHiddenStrokes.has(s.id)).sort((a,b)=>Number(b.rev||0)-Number(a.rev||0));if(mine[0])await eraseStrokeById(mine[0].id)}
async function clearBoard(){if(participantRole!=='teacher')return;await runTransaction(stateRef(),current=>{const state=normalizeState(current);if(!state)return;state.boardEpoch++;state.strokes={};state.version++;return state})}
function initBoardToolbar(){document.querySelectorAll('[data-board-tool]').forEach(b=>b.onclick=()=>{boardTool=b.dataset.boardTool;document.querySelectorAll('[data-board-tool]').forEach(x=>x.classList.toggle('active',x===b));renderBoard()});$('clearBoardBtn').onclick=clearBoard;$('clearBoardBtnTop').onclick=clearBoard;$('boardCollapseBtn').onclick=()=>{$('boardToolbar').classList.toggle('collapsed');$('boardCollapseBtn').textContent=$('boardToolbar').classList.contains('collapsed')?'+':'−'};const saved=(()=>{try{return JSON.parse(storageGet('local',TOOLBAR_POSITION_KEY)||'null')}catch(_){return null}})();if(saved){$('boardToolbar').style.left=saved.left+'px';$('boardToolbar').style.top=saved.top+'px';$('boardToolbar').style.bottom='auto';$('boardToolbar').style.right='auto'}$('boardDragHandle').onpointerdown=e=>{if(e.target.closest('button'))return;const tb=$('boardToolbar'),r=tb.getBoundingClientRect();toolbarDrag={dx:e.clientX-r.left,dy:e.clientY-r.top,id:e.pointerId};$('boardDragHandle').setPointerCapture(e.pointerId)};$('boardDragHandle').onpointermove=e=>{if(!toolbarDrag)return;const tb=$('boardToolbar'),x=Math.max(0,Math.min(innerWidth-tb.offsetWidth,e.clientX-toolbarDrag.dx)),y=Math.max(0,Math.min(innerHeight-tb.offsetHeight,e.clientY-toolbarDrag.dy));tb.style.left=x+'px';tb.style.top=y+'px';tb.style.right='auto';tb.style.bottom='auto'};$('boardDragHandle').onpointerup=()=>{if(!toolbarDrag)return;toolbarDrag=null;const r=$('boardToolbar').getBoundingClientRect();storageSet('local',TOOLBAR_POSITION_KEY,JSON.stringify({left:r.left,top:r.top}))}}
function initTeacherCursorForCurrentScreen(){const game=document.querySelector('[data-board-anchor="game-screen"]');if(!game)return;game.addEventListener('pointermove',e=>{if(participantRole!=='teacher'||!latestState||latestState.game.status!=='playing'||boardTool!=='cursor')return;const now=Date.now();if(now-cursorLastSent<75)return;cursorLastSent=now;const r=game.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;set(ref(database,`${lessonRoot()}/messages/teacherCursor`),{anchorId:'game-screen',x:Math.max(0,Math.min(1,x)),y:Math.max(0,Math.min(1,y)),at:now}).catch(()=>{})})}
const Sound=(()=>{let ac=null;function tone(f,d=.1,type='sine',g=.04,delay=0){if(muted)return;if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime+delay,o=ac.createOscillator(),v=ac.createGain();o.type=type;o.frequency.value=f;v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v);v.connect(ac.destination);o.start(t);o.stop(t+d)}return{good(){tone(160,.35,'sawtooth',.045);tone(620,.16,'triangle',.05,.08);tone(940,.2,'sine',.04,.2)},bad(){tone(118,.23,'sawtooth',.045);tone(82,.28,'square',.025,.08)}}})();
function toggleSound(){muted=!muted;$('soundBtn').textContent=muted?'× БЕЗ ЗВУКА':'♫ ЗВУК'}
async function switchStudent(){if(latestState?.game?.status==='playing')return;const oldKey=currentViewerKey();if(participantRole==='student'&&oldKey&&latestState?.game?.status==='lobby'){try{await runTransaction(stateRef(),current=>{const state=normalizeState(current);if(!state||state.game.status!=='lobby'||!state.game.players[oldKey])return state;delete state.game.players[oldKey];delete state.game.stats[oldKey];delete state.game.attempts[oldKey];delete state.game.eventIds[oldKey];delete state.game.submissions[oldKey];state.game.playerOrder=Object.entries(state.game.players).sort((a,b)=>Number(a[1].slot)-Number(b[1].slot)).map(([k])=>k);state.version++;return state})}catch(_){}}await disconnectParticipant();clearStudent();showStudentCodeForm()}
$('lessonLauncher').onclick=showRoleChoice;$('soundBtn').onclick=toggleSound;$('newSessionBtn').onclick=showModeChoice;$('finishEarlyBtn').onclick=finishEarly;$('switchStudentBtn').onclick=switchStudent;$('switchBtn').onclick=switchStudent;$('leaveSessionBtn').onclick=disconnectParticipant;window.addEventListener('online',flushPending);window.addEventListener('beforeunload',unloadSubmit);window.addEventListener('pagehide',unloadSubmit);document.addEventListener('keydown',e=>{if(!(e.ctrlKey||e.metaKey)||String(e.key).toLowerCase()!=='z'||e.target.closest?.('input,textarea,[contenteditable="true"]'))return;e.preventDefault();undoLastOwnStroke()});setInterval(()=>flushPending().catch(()=>{}),60000);initBoardToolbar();renderLanding();currentStudent=savedStudent();identityCheckText=currentStudent?.verified?'✓ подтверждён':'';flushPending().catch(()=>{});
