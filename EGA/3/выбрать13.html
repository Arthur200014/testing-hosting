<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071a27">
  <title>ЕГЭ №3 — Академия драконьих формул</title>
  <style>
    :root{
      --night:#071a27;--night2:#0f3442;--sky:#22677a;--ice:#7edeea;--plasma:#9c66ff;
      --ember:#ff7138;--gold:#f1c75b;--paper:#f3ead1;--ink:#172329;--green:#35b778;
      --red:#d94343;--muted:#65737a;--shadow:0 20px 52px rgba(0,0,0,.4);--line:#10191d;
    }
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
    body{background:
      radial-gradient(circle at 15% 5%,rgba(126,222,234,.14),transparent 23rem),
      radial-gradient(circle at 88% 82%,rgba(255,113,56,.15),transparent 28rem),
      linear-gradient(150deg,#031018,#0b2b39 54%,#102e2f)}
    button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}

    .top{position:sticky;top:0;z-index:90;display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(5,16,24,.92);border-bottom:3px solid rgba(241,199,91,.7);backdrop-filter:blur(10px)}
    .brand{display:flex;align-items:center;gap:10px;color:#f9e9ba;font-weight:950;letter-spacing:.03em}
    .brand-badge{display:grid;place-items:center;width:44px;height:44px;border:3px solid #071014;border-radius:50%;background:var(--gold);font-size:22px}
    .brand small{display:block;color:#b7d7dc;font-size:10px;letter-spacing:.12em}
    .top .spacer{flex:1}
    .student-pill-top{display:none;align-items:center;gap:8px;padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.08);color:#fff;font-size:12px}
    .student-pill-top b{color:#fff7d0}
    .tiny,.sound-btn,.tool-btn,.small-btn{border:2px solid rgba(255,255,255,.45);border-radius:10px;background:rgba(255,255,255,.08);color:#fff;font-size:12px;font-weight:850;padding:8px 11px}
    .small-btn{padding:6px 10px}
    .tiny:disabled,.tool-btn:disabled{opacity:.35;cursor:not-allowed}

    #app{min-height:calc(100vh - 67px)}
    .screen{min-height:calc(100vh - 67px);padding:14px}
    .center-screen{display:grid;place-items:center}
    .panel{width:min(1180px,100%);border:4px solid #0d1519;border-radius:21px;background:var(--paper);box-shadow:10px 10px 0 rgba(0,0,0,.32),var(--shadow)}
    .auth-card,.start-card,.result-card,.wait-card{position:relative;max-width:860px;padding:clamp(23px,4vw,44px);overflow:hidden;text-align:center}
    .nordic-border{height:18px;margin:-44px -44px 26px;background:repeating-linear-gradient(135deg,#7f3528 0 20px,#df9a42 20px 29px,#193c45 29px 49px)}
    .eyebrow{font-size:12px;font-weight:950;letter-spacing:.17em;text-transform:uppercase;color:#7b3529}
    h1,h2,p{margin-top:0}h1{margin-bottom:10px;font-size:clamp(35px,6.5vw,70px);line-height:.89;letter-spacing:-.055em}h2{font-size:clamp(28px,4vw,46px);letter-spacing:-.04em}
    .lead{max-width:680px;margin:13px auto 22px;color:#58666c;font-weight:680;line-height:1.5}
    .primary,.ghost{border:3px solid #121b1e;border-radius:12px;font-weight:950;transition:transform .15s,box-shadow .15s}
    .primary{padding:13px 21px;background:var(--gold);color:#172126;box-shadow:5px 5px 0 #121b1e}
    .ghost{padding:11px 17px;background:white}.primary:hover:not(:disabled),.ghost:hover:not(:disabled),.small-btn:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:7px 7px 0 #121b1e}
    .message{min-height:22px;margin:10px 0 0;font-size:13px;font-weight:800;color:var(--muted)}.message.error,.status.bad{color:var(--red)}.message.ok{color:#17784b}.message.pending{color:#9a6400}
    .rules{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}.rules div{padding:13px 8px;border:3px solid #c7b68d;border-radius:13px;background:#fffdf3;font-size:13px;font-weight:850}
    .student-start-pill{display:inline-flex;align-items:center;gap:10px;margin:2px 0 17px;padding:8px 10px 8px 14px;border-radius:999px;background:#dcebed;font-size:13px}

    .hero-scene{position:relative;width:min(760px,100%);height:220px;margin:0 auto 16px;border:4px solid #10191d;border-radius:18px;overflow:hidden;background:
      radial-gradient(circle at 75% 30%,rgba(164,102,255,.3),transparent 16%),
      linear-gradient(#316c79,#9bc2b7 58%,#273b35 59%);box-shadow:7px 7px 0 rgba(0,0,0,.24)}
    .hero-scene:before{content:"";position:absolute;left:-5%;right:-5%;bottom:0;height:55px;background:linear-gradient(150deg,#263832 0 35%,#182a27 36% 62%,#31473e 63%);clip-path:polygon(0 70%,18% 20%,36% 60%,55% 12%,72% 57%,87% 23%,100% 67%,100% 100%,0 100%)}
    .moon{position:absolute;right:52px;top:23px;width:50px;height:50px;border-radius:50%;background:#d9f1e4;box-shadow:0 0 25px #d9f1e4}
    .night-dragon{position:absolute;z-index:3;right:24px;bottom:10px;width:310px;height:180px;animation:dragonCruise 3.6s ease-in-out infinite;filter:drop-shadow(0 10px 7px rgba(0,0,0,.35))}
    .dragon-svg{display:block;width:100%;height:100%;overflow:visible}
    .dragon-svg .outline{stroke:#050a0d;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
    .dragon-svg .skin{fill:#18252d}.dragon-svg .skin-dark{fill:#0d171d}.dragon-svg .skin-light{fill:#263943}
    .dragon-svg .wing-far{fill:#0c171d;transform-box:fill-box;transform-origin:88% 78%;animation:wingFar 1.18s cubic-bezier(.42,0,.58,1) infinite}
    .dragon-svg .wing-near{fill:#15242b;transform-box:fill-box;transform-origin:88% 79%;animation:wingNear 1.18s cubic-bezier(.42,0,.58,1) infinite}
    .dragon-svg .wing-rib{fill:none;stroke:#344b55;stroke-width:3;stroke-linecap:round;vector-effect:non-scaling-stroke}
    .dragon-svg .tail-group{transform-box:fill-box;transform-origin:100% 50%;animation:tailSway 2.15s ease-in-out infinite}
    .dragon-svg .head-group{transform-box:fill-box;transform-origin:18% 72%;animation:headWatch 4.5s ease-in-out infinite}
    .dragon-svg .eye{fill:#aaff45;stroke:#071014;stroke-width:3;filter:drop-shadow(0 0 5px #aaff45);transform-box:fill-box;transform-origin:center;animation:eyeBlink 5.2s infinite}
    .dragon-svg .pupil{fill:#061014;transform-box:fill-box;transform-origin:center;animation:pupilScan 4.5s ease-in-out infinite}
    .dragon-svg .tail-fin-natural{fill:#18252d}.dragon-svg .tail-fin-red{fill:#b63e32;stroke:#4b1714}
    .name-tag{position:absolute;bottom:5px;padding:4px 7px;border:2px solid #10191d;border-radius:7px;background:rgba(244,237,213,.9);font-size:10px;font-weight:950}.name-tag.t{right:73px}
    @keyframes dragonCruise{0%,100%{transform:translateY(1px) rotate(-1deg)}48%{transform:translateY(-10px) rotate(1.4deg)}}
    @keyframes wingNear{0%,100%{transform:rotate(9deg) scaleY(.82)}46%{transform:rotate(-15deg) scaleY(1.08)}63%{transform:rotate(-20deg) scaleY(1.12)}}
    @keyframes wingFar{0%,100%{transform:rotate(-5deg) scaleY(.8)}48%{transform:rotate(13deg) scaleY(1.06)}}
    @keyframes tailSway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(7deg)}}
    @keyframes headWatch{0%,60%,100%{transform:rotate(0)}72%{transform:rotate(-4deg)}84%{transform:rotate(3deg)}}
    @keyframes eyeBlink{0%,45%,48%,100%{transform:scaleY(1)}46.5%{transform:scaleY(.08)}}
    @keyframes pupilScan{0%,55%,100%{transform:translateX(0)}70%{transform:translateX(3px)}}

    #gameScreen{display:flex;justify-content:center}.game-wrap{width:min(1280px,100%);margin:0 auto}
    .hud{display:grid;grid-template-columns:auto minmax(180px,1fr) auto auto;align-items:center;gap:11px;margin-bottom:11px;color:white}.hud-chip{padding:8px 11px;border-radius:10px;background:rgba(255,255,255,.1);font-size:12px;font-weight:900}.progress{height:13px;border:2px solid rgba(255,255,255,.65);border-radius:999px;overflow:hidden;background:#061016}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ice),var(--plasma),var(--ember));transition:width .35s}
    .academy{position:relative;width:100%;padding:14px;overflow:hidden}.academy.shake{animation:screenShake .45s ease}@keyframes screenShake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
    .mission-head{display:flex;align-items:center;gap:10px;margin-bottom:9px}.chapter-tag{padding:6px 10px;border-radius:9px;background:#285b67;color:white;font-size:11px;font-weight:950;text-transform:uppercase;letter-spacing:.06em}.mission-no{margin-left:auto;color:var(--muted);font-size:12px;font-weight:950}
    .question-card{display:grid;grid-template-columns:168px 1fr;gap:13px;align-items:center;padding:11px 14px;border:4px solid #10191d;border-radius:15px;background:linear-gradient(100deg,#efe2ba,#fffdf0);font-size:clamp(14px,1.35vw,17px);font-weight:740;line-height:1.4}
    .shape-thumb{display:grid;place-items:center;width:158px;height:118px;border:3px solid #132126;border-radius:12px;background:#0d2b36;overflow:hidden}.shape-thumb img{width:100%;height:100%;display:block;object-fit:contain}
    .battle-grid{display:grid;grid-template-columns:minmax(390px,.78fr) minmax(530px,1.22fr);gap:12px;margin-top:11px}
    .dragon-arena{position:relative;min-height:365px;border:4px solid #10191d;border-radius:16px;overflow:hidden;background:
      radial-gradient(circle at 80% 35%,rgba(155,103,255,.15),transparent 23%),
      linear-gradient(#173f4d 0 55%,#354a3e 56% 75%,#1c2925 76%)}
    .dragon-arena:before{content:"";position:absolute;left:0;right:0;bottom:64px;height:90px;background:#263832;clip-path:polygon(0 70%,18% 25%,34% 63%,53% 14%,68% 64%,86% 22%,100% 67%,100% 100%,0 100%)}
    .arena-dragon{position:absolute;z-index:4;left:-8px;bottom:69px;width:min(72%,330px);height:198px;transform-origin:55% 65%;animation:arenaCruise 3.2s ease-in-out infinite;filter:drop-shadow(0 12px 7px rgba(0,0,0,.42))}
    .arena-dragon.fly{animation:dragonAttack 1.55s cubic-bezier(.28,.03,.2,1)}
    .arena-dragon:after{content:"";position:absolute;left:12%;top:47%;width:85%;height:48%;opacity:0;pointer-events:none;background:repeating-linear-gradient(174deg,transparent 0 15px,rgba(213,247,255,.62) 16px 18px,transparent 19px 31px);clip-path:polygon(0 28%,100% 0,100% 100%,0 73%)}
    .arena-dragon.fly:after{animation:speedTrails 1.55s ease forwards}.arena-dragon.fly .wing-near,.arena-dragon.fly .wing-far{animation-duration:.34s}
    .arena-dragon.fly .head-group{animation:attackHead 1.55s ease forwards}.arena-dragon.fly .eye{animation:attackEyes 1.55s ease forwards}.arena-dragon.fly .mouth-line{animation:openMouth 1.55s ease forwards}
    .arena-dragon.smoke{animation:dragonCough 1s ease}.arena-dragon.smoke .head-group{animation:coughHead 1s ease}.arena-dragon.smoke .wing-near,.arena-dragon.smoke .wing-far{animation-duration:.7s}
    @keyframes arenaCruise{0%,100%{transform:translate(0,2px) rotate(-1deg)}50%{transform:translate(5px,-10px) rotate(1.4deg)}}
    @keyframes dragonAttack{0%{transform:translate(0,2px) rotate(-1deg)}20%{transform:translate(-12px,8px) rotate(3deg) scale(.97)}44%{transform:translate(45px,-24px) rotate(-7deg) scale(1.08)}66%{transform:translate(55px,-20px) rotate(-5deg) scale(1.1)}100%{transform:translate(0,2px) rotate(-1deg)}}
    @keyframes attackHead{0%,28%{transform:rotate(0)}45%,70%{transform:rotate(-7deg) translateX(5px)}100%{transform:rotate(0)}}
    @keyframes attackEyes{0%,100%{fill:#aaff45;filter:drop-shadow(0 0 5px #aaff45)}38%,72%{fill:#e8ff9c;filter:drop-shadow(0 0 11px #cfff56)}}
    @keyframes openMouth{0%,30%,100%{transform:scaleY(1)}43%,76%{transform:scaleY(3.2)}}
    @keyframes speedTrails{0%,18%,100%{opacity:0;transform:translateX(-10px)}36%,66%{opacity:.75;transform:translateX(-36px)}}
    @keyframes dragonCough{0%,100%{transform:translate(0,2px)}20%,52%{transform:translate(-8px,4px) rotate(3deg)}36%,68%{transform:translate(7px,-2px) rotate(-3deg)}82%{transform:translate(-3px,1px)}}
    @keyframes coughHead{0%,100%{transform:rotate(0)}28%{transform:rotate(9deg) translateX(-3px)}48%{transform:rotate(-8deg)}68%{transform:rotate(7deg)}}
    .target-gate{position:absolute;right:31px;bottom:71px;width:105px;height:170px;border:12px solid #695340;border-bottom-width:22px;border-radius:40px 40px 0 0;box-shadow:inset 0 0 0 4px #27383a,0 0 0 4px #172126}.target-gate:after{content:"РУНА";position:absolute;left:14px;right:14px;top:55px;padding:8px 0;border:3px solid var(--gold);border-radius:8px;color:var(--gold);font-size:11px;font-weight:950;text-align:center;background:#192a2e}
    .guide-bubble{position:absolute;z-index:5;left:15px;top:15px;max-width:220px;padding:9px 11px;border:3px solid #10191d;border-radius:14px 14px 14px 3px;background:rgba(246,237,211,.95);font-size:12px;font-weight:800;box-shadow:4px 4px 0 rgba(0,0,0,.25)}.guide-bubble b{color:#7f3528}
    .fire-beam{position:absolute;z-index:8;left:55%;right:12%;bottom:43%;height:19px;border-radius:80% 12px 12px 80%;opacity:0;transform:scaleX(0);transform-origin:left;background:linear-gradient(90deg,#fff 0 8%,#dff8ff 15%,var(--beam,#9561ff) 53%,rgba(117,65,255,0) 100%);box-shadow:0 0 7px #fff,0 0 17px var(--beam,#9561ff),0 0 32px var(--beam,#9561ff)}
    .fire-beam:before{content:"";position:absolute;left:-23px;top:50%;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle,#fff 0 16%,#dffaff 17% 32%,var(--beam,#9561ff) 45%,transparent 69%);transform:translateY(-50%) scale(0);filter:drop-shadow(0 0 15px var(--beam,#9561ff))}
    .fire-beam:after{content:"";position:absolute;right:-15px;top:50%;width:60px;height:60px;border-radius:50%;border:4px solid var(--beam,#9561ff);opacity:0;transform:translateY(-50%) scale(.2);box-shadow:0 0 18px var(--beam,#9561ff),inset 0 0 18px var(--beam,#9561ff)}
    .fire-beam.blast{animation:plasmaStream 1.55s ease forwards}.fire-beam.blast:before{animation:plasmaCharge 1.55s ease forwards}.fire-beam.blast:after{animation:plasmaImpact 1.55s ease forwards}
    @keyframes plasmaStream{0%,32%{opacity:0;transform:scaleX(0)}42%{opacity:1;transform:scaleX(.08)}52%,72%{opacity:1;transform:scaleX(1)}83%{opacity:.75;transform:scaleX(1.05)}100%{opacity:0;transform:scaleX(1.08)}}
    @keyframes plasmaCharge{0%,16%{transform:translateY(-50%) scale(0);opacity:0}25%{transform:translateY(-50%) scale(.35);opacity:1}38%{transform:translateY(-50%) scale(1.12);opacity:1}48%{transform:translateY(-50%) scale(.25);opacity:.7}100%{transform:translateY(-50%) scale(0);opacity:0}}
    @keyframes plasmaImpact{0%,49%{opacity:0;transform:translateY(-50%) scale(.2)}58%{opacity:1;transform:translateY(-50%) scale(.7)}76%{opacity:.85;transform:translateY(-50%) scale(1.35)}100%{opacity:0;transform:translateY(-50%) scale(2.1)}}
    .particle{position:absolute;z-index:9;width:var(--size,10px);height:var(--size,10px);border-radius:50%;pointer-events:none;box-shadow:0 0 9px currentColor;animation:particleFly 1.15s cubic-bezier(.14,.57,.34,1) forwards}@keyframes particleFly{0%{transform:translate(0,0) scale(.2);opacity:0}14%{opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(.05);opacity:0}}
    .smoke-puff{position:absolute;z-index:8;left:53%;bottom:42%;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d4dadd,#7a898e 62%,rgba(39,51,55,.1));opacity:0;filter:blur(1px)}.smoke-puff.show{animation:puff 1.25s ease forwards}@keyframes puff{0%,10%{opacity:0;transform:scale(.2)}25%{opacity:.85;transform:scale(.8)}100%{opacity:0;transform:translate(90px,-70px) scale(3.6)}}
    .runes-panel{display:flex;flex-direction:column;min-width:0}.prompt-mini{margin:0 0 8px;font-size:12px;font-weight:950;color:#4c5e64;letter-spacing:.06em}.runes{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;flex:1}
    .rune-btn{position:relative;display:grid;grid-template-columns:38px 1fr;align-items:center;gap:9px;min-height:126px;padding:11px;border:4px solid #10191d;border-radius:15px;background:radial-gradient(circle at 85% 10%,rgba(126,222,234,.16),transparent 30%),#fffdf2;color:var(--ink);text-align:left;box-shadow:5px 5px 0 #74878c;transition:transform .15s,box-shadow .15s,background .2s}
    .rune-btn:hover:not(:disabled){transform:translateY(-3px);box-shadow:5px 8px 0 #566b70}.rune-btn:focus-visible{outline:5px solid var(--ice);outline-offset:2px}
    .rune-symbol{display:grid;place-items:center;width:36px;height:42px;border:3px solid #122126;border-radius:50% 50% 9px 9px;background:#d4e7e6;font-size:21px;font-weight:950}.rune-copy b{display:block;margin-bottom:5px;color:#713426;font-size:12px}.rune-copy span{display:block;font-family:Georgia,"Times New Roman",serif;font-size:clamp(14px,1.2vw,17px);font-weight:800;line-height:1.25}
    .rune-btn.correct{border-color:#157349;background:#dff6e9;box-shadow:5px 5px 0 #157349}.rune-btn.wrong{border-color:#9d232a;background:#ffdede;box-shadow:5px 5px 0 #9d232a}.rune-btn.muted{opacity:.47}
    .feedback{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:11px;min-height:70px;margin-top:11px;padding:9px 11px;border:4px solid #10191d;border-radius:15px;background:#e6e3d5}.feedback.good{background:#dff6e9}.feedback.bad{background:#ffe9ba}.feedback-icon{font-size:30px}.feedback b{display:block;font-size:14px}.feedback span{font-size:12px;color:#54646a;font-weight:720}.next-btn{padding:10px 14px}
    .save-status{margin-top:12px;font-size:14px;font-weight:900}.save-status.ok{color:#17784b}.save-status.bad{color:#a52e2e}
    .shared-players{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:20px 0}.shared-player-card{padding:14px;border:3px solid #c7b68d;border-radius:14px;background:#fffdf3;text-align:left}.shared-player-card.empty{opacity:.66;border-style:dashed}.shared-player-card small{display:block;color:#6b6b60;font-weight:900;text-transform:uppercase;letter-spacing:.07em}.shared-player-card b{display:block;font-size:18px;margin-top:4px}
    .lobby-message{font-weight:800;color:#4b5b61}.player-results{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:18px 0}.player-result-box{padding:14px;border:3px solid #c3b68f;border-radius:14px;background:#fffdf3}.player-result-box span{display:block;color:#5f6e73;font-weight:800}.player-result-box b{display:block;margin:5px 0;font-size:20px}.player-result-box strong{display:block;font-size:28px;color:#214a38}

    .board-toolbar{position:fixed;right:12px;bottom:12px;z-index:95;width:270px;border:3px solid #0d1519;border-radius:16px;background:#fff8eb;box-shadow:0 10px 28px rgba(0,0,0,.34)}
    .board-toolbar.hidden{display:none}.board-toolbar.collapsed .board-tools{display:none}.board-toolbar-head{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#173f4d;color:#fff;border-radius:12px 12px 0 0;cursor:move;font-weight:900}.board-tools{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:10px}.tool-btn{background:#1c3f4c;border:2px solid #17313a;padding:7px 9px}.tool-btn.active{background:#f1c75b;color:#162126;border-color:#6e5821}#boardColor{width:38px;height:34px;border:none;background:none;padding:0}#boardWidth{width:82px}
    .board-layer{position:absolute;inset:0;z-index:20;pointer-events:none}.board-layer.active{pointer-events:auto}.board-layer polyline{fill:none;stroke-linecap:round;stroke-linejoin:round}.board-layer.eraser polyline{cursor:pointer}
    .teacher-cursor{position:absolute;z-index:58;left:0;top:0;display:none;pointer-events:none;transform:translate(-7px,-7px)}.teacher-cursor.show{display:block}.teacher-cursor i{display:block;width:14px;height:14px;border:3px solid #fff;border-radius:50%;background:#d84f45;box-shadow:0 1px 5px #0007}.teacher-cursor span{position:absolute;left:13px;top:11px;padding:2px 5px;border-radius:6px;background:#193328;color:#fff;font-size:9px;font-weight:1000;white-space:nowrap}
    .session-panel{display:none;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;background:rgba(255,255,255,.06);border-bottom:1px solid rgba(255,255,255,.12)}
    .connection-chip,.participant-chip{padding:8px 10px;border-radius:999px;background:rgba(255,255,255,.08);color:#fff;font-size:12px;font-weight:900}.connection-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;background:#d94343}.connection-dot.online{background:#35b778}.session-panel .grow{flex:1}.participant-list{display:flex;gap:8px;flex-wrap:wrap}.participant-chip.offline{opacity:.5}
    .offline-banner{position:sticky;top:67px;z-index:89;padding:10px 14px;text-align:center;background:#9d232a;color:white;font-weight:900}

    .modal-backdrop{position:fixed;inset:0;z-index:110;display:grid;place-items:center;background:rgba(0,0,0,.42)}

function parseStudent(data,code){const src=(data&&(data.student||data.data||data.result))||data||{},studentId=src.studentId??src.id??data?.studentId,name=src.studentName??src.name??src.fullName??data?.studentName??data?.name,bad=data&&(data.success===false||data.valid===false||data.ok===false);if(bad||studentId===undefined||studentId===null||studentId===''){const e=new Error((data&&(data.message||data.error))||'Личный код не найден');e.terminal=true;throw e}return{studentId:String(studentId),verifiedStudentId:String(studentId),name:String(name||'Ученик'),code:String(code),verified:true}}

    makeTask('prism','Сечение через среднюю линию','prismCut',`Объём треугольной призмы равен ${v}. Через среднюю линию основания проведена плоскость параллельно боковым рёбрам. Нужно найти объём отсечённой малой призмы.`,'k = 1/2 → Sосн × 1/4 → V × 1/4',['k = 1/2 → V × 1/2','k = 1/2 → V × 1/8','Sбок = Pосн·h → V × 2'],'Средняя линия уменьшает линейные размеры основания в 2 раза, площадь — в 4 раза. Высота призмы прежняя, поэтому объём тоже равен четверти.',{v}),

    makeTask('pyramid','Объём пирамиды','pyramidVolume',`Площадь основания пирамиды равна ${s}, высота равна ${h}. Требуется найти её объём.`,'V = ⅓Sосн·h',['V = Sосн·h','V = ⅓Pосн·h','V = Sосн·h²'],'Пирамида занимает треть объёма призмы с теми же основанием и высотой.',{s,h}),

function mixChapters(tasks){for(let attempt=0;attempt<600;attempt++){const candidate=shuffle(tasks);if(candidate.every((t,i)=>i===0||t.chapter!==candidate[i-1].chapter))return candidate}return shuffle(tasks)}
function makeDeck(limit){const count=Number(limit)===2?30:15;let pool=[];while(pool.length<count)pool.push(...buildCycle());return mixChapters(pool).slice(0,count)}
function newGameState(studentLimit=1){const limit=Number(studentLimit)===2?2:1;return{version:1,schemaVersion:SCHEMA_VERSION,boardEpoch:0,strokes:{},ui:{screen:'lobby'},game:{status:'lobby',studentLimit:limit,players:{},playerOrder:[],deck:makeDeck(limit),index:0,turnKey:'',stats:{},attempts:{},question:newQuestion(),eventIds:{},submissions:{},sessionId:uuid(),startedAt:0,finishedAt:0,endedEarly:false}}}
function normalizeState(s){if(!s||typeof s!=='object')return null;s.version=Number(s.version||1);s.schemaVersion=Number(s.schemaVersion||SCHEMA_VERSION);s.boardEpoch=Number(s.boardEpoch||0);s.strokes=s.strokes||{};s.ui=s.ui||{screen:'lobby'};s.game=s.game||{};const g=s.game;g.players=g.players||{};g.playerOrder=Array.isArray(g.playerOrder)?g.playerOrder:[];g.stats=g.stats||{};g.attempts=g.attempts||{};g.eventIds=g.eventIds||{};g.submissions=g.submissions||{};g.deck=Array.isArray(g.deck)?g.deck:[];g.question=g.question||newQuestion();g.question.wrongChoices=Array.isArray(g.question.wrongChoices)?g.question.wrongChoices:[];if(g.question.firstTryCorrect===undefined)g.question.firstTryCorrect=null;return s}

function renderGame(state){const g=state.game,q=g.deck[g.index],qs=g.question,turn=g.players[g.turnKey],viewerKey=currentViewerKey(),viewerStats=g.stats[viewerKey]||{score:0,completed:0},canAct=canCurrentStudentAct(g)&&!qs.resolved,wrongChoices=Array.isArray(qs.wrongChoices)?qs.wrongChoices:[],turnText=turn?.name||'—';const meta=CHAPTER_META[q.chapter];const zones=q.options.map((o,i)=>{const isCorrect=String(o)===String(q.answer);let cls=''; if(qs.resolved&&isCorrect)cls='correct'; else if(wrongChoices.includes(o))cls='wrong'; else if(qs.resolved)cls='muted'; const disabled=!canAct||wrongChoices.includes(o); return `<button class="rune-btn ${cls}" type="button" data-value="${esc(o)}" ${disabled?'disabled':''}><span class="rune-symbol">${RUNE_SYMBOLS[i]}</span><span class="rune-copy"><b>Руна ${String.fromCharCode(65+i)}</b><span>${esc(o)}</span></span></button>`}).join(''); const feedbackTitle=!qs.attempted?'Прочитай, что требуется найти':qs.lastCorrect?'Руна активирована!':'Выбрана другая техника'; const feedbackText=!qs.attempted?'Сопоставь условие с нужным свойством или цепочкой формул.':qs.resolved?q.explain:'Эта руна не подходит. Попробуй другой закон — ход остаётся у тебя.'; const feedbackCls=!qs.attempted?'':(qs.lastCorrect?'good':'bad'); const feedbackIcon=!qs.attempted?'ᚱ':(qs.lastCorrect?'🔥':'💨'); $('app').innerHTML=`<section id="gameScreen" class="screen game" data-board-anchor="game-screen"><div class="game-wrap"><div class="hud"><div class="hud-chip">МИССИЯ <b>${g.index+1}</b>/${g.deck.length}</div><div class="progress"><i style="width:${g.index/g.deck.length*100}%"></i></div><div class="hud-chip">🔥 <b>${viewerKey?viewerStats.score:Object.values(g.stats).reduce((a,s)=>a+Number(s.score||0),0)}</b></div><div class="hud-chip chapter-hud">Ход: <b>${esc(turnText)}</b></div></div><article id="academy" class="panel academy" style="background:var(--paper)"><svg id="boardLayer" class="board-layer" viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-label="Общ function renderResult(state){const g=state.game,order=g.playerOrder.length?g.playerOrder:Object.keys(g.players).sort((a,b)=>Number(g.players[a].slot)-Number(g.players[b].slot)); const cards=order.map(k=>{const p=g.players[k],st=g.stats[k]||{score:0,completed:0},completed=Number(st.completed||0),score=Number(st.score||0),pct=completed?Math.round(score/completed*100):0;return`<div class="player-result-box"><span>Ученик ${p.slot}</span><b>${esc(p.name)}</b><strong>${score}/${completed}</strong><span>${pct}% · выполнено ${completed} утверждений</span></div>`}).join(''); $('app').innerHTML=`<section class="screen center-screen"><div class="panel result-card"><div class="nordic-border"></div><div class="eyebrow">Испытание завершено</div><h2>${g.endedEarly?'ТЕКУЩИЙ ПРОГРЕСС СОХРАНЁН':'РУНИЧЕСКИЙ АРХИВ ОТКРЫТ'}</h2><p class="lead">${g.endedEarly?'Учитель завершил урок досрочно. Для каждого ученика сохранён фактически заработанный результат.':'Все выполненные задания отправляются в систему результатов.'}</p><div class="player-results">${cards}</div><div id="saveStatus" class="save-status">Сохраняем результаты…</div><div style="margin-top:16px">${participantRole==='teacher'?'<button id="againBtn" class="primary">Новое занятие</button>':''}</div></div></section>`; if($('againBtn'))$('againBtn').onclick=showModeChoice; renderSubmissionStatus(); }

function readQueue(){try{const q=JSON.parse(localStorage.getItem(PENDING_RESULTS_KEY)||'[]');return Array.isArray(q)?q:[]}catch(_){return[]}}
function writeQueue(q){localStorage.setItem(PENDING_RESULTS_KEY,JSON.stringify(q))}
function queueResult(p){const q=readQueue();if(!q.some(x=>x?.eventId===p.eventId))q.push(p);writeQueue(q)}
function removeQueued(id){writeQueue(readQueue().filter(x=>x?.eventId!==id))}
async function postResult(payload){const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});let answer;try{answer=await r.json()}catch{throw new Error('Система результатов не ответила.')}if(!r.ok||!answer?.ok)throw new Error(answer?.error||'Результат не принят.');return answer}
async function flushPending(){if(!navigator.onLine)return;for(const p of readQueue()){try{await postResult(p);removeQueued(p.eventId)}catch(_){}}}
function buildResultPayload(state,key,partial=false){const g=state.game,p=g.players[key];if(!p)return null;const st=g.stats[key]||{score:0,completed:0},score=Number(st.score||0),completed=Number(st.completed||0),percent=completed?Math.round(score/completed*100):0,finishedAt=g.finishedAt||Date.now(),durationSec=g.startedAt?Math.max(0,Math.floor((finishedAt-g.startedAt)/1000)):0;return{action:'submitTest',programId:'EGE_MATH',eventId:g.eventIds[key]||uuid(),studentId:String(p.verifiedStudentId||p.studentId||p.studentCode||''),studentName:p.name||'Ученик',studentCode:p.studentCode||'',testId:TEST_META.testId,testName:TEST_META.testName,topicId:TEST_META.topicId,topicName:TEST_META.topicName,taskNumber:TEST_META.taskNumber,testDate:localDate(),score,maxScore:completed,percent,durationSec,startedAt:g.startedAt?new Date(g.startedAt).toISOString():'',finishedAt:new Date(finishedAt).toISOString(),completedAt:new Date(finishedAt).toISOString(),answersCount:completed,attemptsCount:completed,mode:g.studentLimit,studentLimit:g.studentLimit,endedEarly:!!g.endedEarly||partial,scorePercent:percent,durationSeconds:durationSec,correctCount:score,totalQuestions:completed,schemaVersion:TEST_META.schemaVersion}}
async function claimSubmission(key,allowStale=true){const sr=ref(database,`${lessonRoot()}/state/game/submissions/${key}`);const result=await runTransaction(sr,current=>{if(current?.status==='saved')return;const stale=current?.status==='sending'&&Date.now()-Number(current.updatedAtMs||0)>5000;if(current?.status==='sending'&&!stale&&!allowStale)return;return{status:'sending',eventId:latestState?.game?.eventIds?.[key]||'',sendingBy:browserClientId,updatedAtMs:Date.now()}});return result.committed}
async function sendPlayerResult(key,backup=false){if(!latestState)return;const payload=buildResultPayload(latestState,key);if(!payload)return;try{if(!await claimSubmission(key,backup))return;await postResult(payload);removeQueued(payload.eventId);await set(ref(database,`${lessonRoot()}/state/game/submissions/${key}`),{status:'saved',eventId:payload.eventId,updatedAtMs:Date.now()})}catch(_){queueResult(payload);try{await set(ref(database,`${lessonRoot()}/state/game/submissions/${key}`),{status:'queued',eventId:payload.eventId,updatedAtMs:Date.now()})}catch(__){}}}
function handleFinishedState(){if(!latestState||latestState.game.status!=='finished')return;handledFinishedSession=latestState.game.sessionId;if(participantRole==='student'){const key=currentViewerKey();if(key)sendPlayerResult(key,false)}if(participantRole==='teacher'){clearTimeout(backupTimer);backupTimer=setTimeout(()=>{if(!latestState)return;Object.keys(latestState.game.players).forEach(k=>{if(latestState.game.submissions[k]?.status!=='saved')sendPlayerResult(k,true)})},4000)}}
function renderSubmissionStatus(){const el=$('saveStatus');if(!el||!latestState)return;const vals=Object.keys(latestState.game.players).map(k=>latestState.game.submissions[k]?.status||'');if(vals.length&&vals.every(v=>v==='saved')){el.className='save-status ok';el.textContent='✓ Результаты сохранены'}else if(vals.some(v=>v==='queued')){el.className='save-status bad';el.textContent='Нет связи: результат стоит в очереди отправки'}else{el.className='save-status';el.textContent='Сохраняем результаты…'}}
function unloadSubmit(){if(unloadHandled||!latestState||participantRole!=='student'||latestState.game.status==='lobby')return;unloadHandled=true;const key=currentViewerKey();if(!key||latestState.game.submissions[key]?.status==='saved')return;const payload=buildResultPayload(latestState,key,latestState.game.status!=='finished');if(!payload||payload.maxScore===0)return;queueResult(payload);try{const blob=new Blob([JSON.stringify(payload)],{type:'text/plain;charset=utf-8'});if(navigator.sendBeacon)navigator.sendBeacon(API_URL,blob);else fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),keepalive:true}).catch(()=>{})}catch(_){}}
function renderBoard(){const svgEl=$('boardLayer');if(!svgEl||!latestState)return;const epoch=Number(latestState.boardEpoch||0);for(const id of [...optimisticallyErased])if(!latestState.strokes?.[id])optimisticallyErased.delete(id);const map=new Map(Object.entries(latestState.strokes||{}).filter(([id,s])=>s&&Number(s.epoch)===epoch&&s.anchorId==='game-screen'&&!optimisticallyErased.has(id)));if(drawingStroke&&Number(drawingStroke.epoch)===epoch)map.set(drawingStroke.id,drawingStroke);svgEl.innerHTML=[...map.values()].map(s=>`<polyline data-stroke-id="${esc(s.id)}" points="${(s.points||[]).map(p=>`${Number(p[0])*1000},${Number(p[1])*1000}`).join(' ')}" stroke="${esc(s.color||'#d84f45')}" stroke-width="${Math.max(2,Number(s.width)||6)}"/>`).join('');svgEl.classList.toggle('active',boardTool!=='cursor');svgEl.classList.toggle('eraser',boardTool==='eraser')}
function bindBoardAnchor(){const svgEl=$('boardLayer');if(!svgEl)return;svgEl.classList.toggle('active',boardTool!=='cursor');const point=e=>{const r=svgEl.getBoundingClientRect();return[Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))]};svgEl.onpointerdown=e=>{if(!participantRole||!latestState||boardTool==='cursor')return;e.preventDefault();const pt=point(e);svgEl.setPointerCapture(e.pointerId);if(boardTool==='eraser'){eraserActive=true;lastEraserPoint=pt;eraseAlongFirst(pt,pt);return}if(boardTool!=='pencil')return;drawingStroke={id:'stroke-'+uuid(),anchorId:'game-screen',authorId:participantId,authorName:participantName,color:$('boardColor').value,width:Number($('boardWidth').value),points:[pt],done:false,epoch:latestState.boardEpoch,rev:Date.now()};lastStrokePush=Date.now();renderBoard();pushDrawingStroke(clone(drawingStroke))};svgEl.onpointermove=e=>{const pt=point(e);if(boardTool==='eraser'&&eraserActive){eraseAlongFirst(lastEraserPoint||pt,pt);lastEraserPoint=pt;return}if(!drawingStroke||boardTool!=='pencil')return;const last=drawingStroke.points[drawingStroke.points.length-1];if(Math.hypot(pt[0]-last[0],pt[1]-last[1])<.002)return;drawingStroke.points.push(pt);drawingStroke.rev=Date.now();renderBoard();if(Date.now()-lastStrokePush>=55){lastStrokePush=Date.now();pushDrawingStroke(clone(drawingStroke))}};const end=e=>{if(eraserActive){eraserActive=false;lastEraserPoint=null;try{svgEl.releasePointerCapture(e.pointerId)}catch{}return}if(!drawingStroke)return;const finalStroke=clone({...drawingStroke,done:true,rev:Date.now()});drawingStroke=null;renderBoard();pushDrawingStroke(finalStroke);try{svgEl.releasePointerCapture(e.pointerId)}catch{}};svgEl.onpointerup=end;svgEl.onpointercancel=end}
async function pushDrawingStroke(stroke){if(!stroke||!latestState)return;try{await set(ref(database,`${lessonRoot()}/state/strokes/${stroke.id}`),clone(stroke))}catch{}}
function firstPointSegmentDistancePx(p,a,b,r){const px=p[0]*r.width,py=p[1]*r.height,ax=a[0]*r.width,ay=a[1]*r.height,bx=b[0]*r.width,by=b[1]*r.height,dx=bx-ax,dy=by-ay,len=dx*dx+dy*dy;if(!len)return Math.hypot(px-ax,py-ay);const u=Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/len)),qx=ax+u*dx,qy=ay+u*dy;return Math.hypot(px-qx,py-qy)}
function firstStrokeHits(s,p,r){const pts=s?.points||[],radius=13+Math.max(1,Number(s?.width)||6)*1.2;if(!pts.length)return false;if(pts.length===1)return firstPointSegmentDistancePx(p,pts[0],pts[0],r)<=radius;for(let i=1;i<pts.length;i++)if(firstPointSegmentDistancePx(p,pts[i-1],pts[i],r)<=radius)return true;return false}
async function eraseAtFirstPoint(p){if(!latestState)return;const svgEl=$('boardLayer');if(!svgEl)return;const r=svgEl.getBoundingClientRect(),epoch=Number(latestState.boardEpoch||0),ids=[];for(const [id,s] of Object.entries(latestState.strokes||{})){if(!s||Number(s.epoch)!==epoch||s.anchorId!=='game-screen'||optimisticallyErased.has(id))continue;if(firstStrokeHits(s,p,r))ids.push(id)}if(!ids.length)return;ids.forEach(id=>optimisticallyErased.add(id));renderBoard();try{await update(ref(database,`${lessonRoot()}/state/strokes`),Object.fromEntries(ids.map(id=>[id,null])))}catch{ids.forEach(id=>optimisticallyErased.delete(id));renderBoard()}}
function eraseAlongFirst(a,b){const svgEl=$('boardLayer');if(!svgEl)return;const r=svgEl.getBoundingClientRect(),dist=Math.hypot((b[0]-a[0])*r.width,(b[1]-a[1])*r.height),steps=Math.max(1,Math.ceil(dist/8));for(let i=0;i<=steps;i++){const u=i/steps;eraseAtFirstPoint([a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u])}}
async function undoLastStroke(){if(!latestState||!participantId)return;const epoch=Number(latestState.boardEpoch||0),strokes=Object.values(latestState.strokes||{}).filter(s=>s&&Number(s.epoch)===epoch&&s.anchorId==='game-screen'&&String(s.authorId||'')===String(participantId)&&!optimisticallyErased.has(s.id)).sort((a,b)=>Number(b.rev||0)-Number(a.rev||0));const s=strokes[0];if(!s)return;optimisticallyErased.add(s.id);renderBoard();try{await set(ref(database,`${lessonRoot()}/state/strokes/${s.id}`),null)}catch{optimisticallyErased.delete(s.id);renderBoard()}}

async function clearBoard(){if(participantRole!=='teacher')return;await runTransaction(stateRef(),current=>{const state=normalizeState(current);if(!state)return;state.boardEpoch++;state.strokes={};state.version++;return state})}
function initBoardToolbar(){document.querySelectorAll('[data-board-tool]').forEach(b=>b.onclick=()=>{boardTool=b.dataset.boardTool;document.querySelectorAll('[data-board-tool]').forEach(x=>x.classList.toggle('active',x===b));renderBoard()}); $('clearBoardBtn').onclick=clearBoard; $('clearBoardBtnTop').onclick=clearBoard; $('boardCollapseBtn').onclick=()=>{$('boardToolbar').classList.toggle('collapsed');$('boardCollapseBtn').textContent=$('boardToolbar').classList.contains('collapsed')?'+':'−'}; const saved=(()=>{try{return JSON.parse(localStorage.getItem(TOOLBAR_POSITION_KEY)||'null')}catch(_){return null}})(); if(saved){$('boardToolbar').style.left=saved.left+'px';$('boardToolbar').style.top=saved.top+'px';$('boardToolbar').style.bottom='auto';$('boardToolbar').style.right='auto'} $('boardDragHandle').onpointerdown=e=>{if(e.target.closest('button'))return;const tb=$('boardToolbar'),r=tb.getBoundingClientRect();toolbarDrag={dx:e.clientX-r.left,dy:e.clientY-r.top,id:e.pointerId};$('boardDragHandle').setPointerCapture(e.pointerId)}; $('boardDragHandle').onpointermove=e=>{if(!toolbarDrag)return;const tb=$('boardToolbar'),x=Math.max(0,Math.min(innerWidth-tb.offsetWidth,e.clientX-toolbarDrag.dx)),y=Math.max(0,Math.min(innerHeight-tb.offsetHeight,e.clientY-toolbarDrag.dy));tb.style.left=x+'px';tb.style.top=y+'px';tb.style.right='auto';tb.style.bottom='auto'}; $('boardDragHandle').onpointerup=()=>{if(!toolbarDrag)return;toolbarDrag=null;const r=$('boardToolbar').getBoundingClientRect();localStorage.setItem(TOOLBAR_POSITION_KEY,JSON.stringify({left:r.left,top:r.top}))}}
function initTeacherCursorForCurrentScreen(){const game=document.querySelector('.game[data-board-anchor]');if(!game)return;game.addEventListener('pointermove',e=>{if(participantRole!=='teacher'||!latestState||latestState.game.status!=='playing'||boardTool!=='cursor')return;const now=Date.now();if(now-cursorLastSent<75)return;cursorLastSent=now;const r=game.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;set(ref(database,`${lessonRoot()}/messages/teacherCursor`),{anchorId:'game-screen',x:Math.max(0,Math.min(1,x)),y:Math.max(0,Math.min(1,y)),at:now}).catch(()=>{})})}

function fireEffect(color){const dragon=$('arenaDragon'),beam=$('fireBeam'); if(!dragon||!beam)return;dragon.classList.add('fly');beam.classList.add('blast'); const arena=document.querySelector('.dragon-arena'); setTimeout(()=>{if(!arena)return;const impactX=Math.round(arena.clientWidth*.84),impactY=Math.round(arena.clientHeight*.45); for(let i=0;i<34;i++){const p=document.createElement('i');p.className='particle';p.style.left=(impactX+rnd(-10,10))+'px';p.style.bottom=(impactY+rnd(-8,8))+'px'; p.style.color=i%4===0?'#fff':color;p.style.background='currentColor';p.style.setProperty('--size',rnd(5,13)+'px'); p.style.setProperty('--dx',rnd(-105,115)+'px');p.style.setProperty('--dy',rnd(-105,95)+'px');arena.appendChild(p);setTimeout(()=>p.remove(),1250)}},690); setTimeout(()=>{dragon.classList.remove('fly');beam.classList.remove('blast')},1700)}
function smokeEffect(){const dragon=$('arenaDragon'),puff=$('smokePuff'),acad=$('academy'); if(!dragon||!puff||!acad)return;dragon.classList.add('smoke');puff.classList.add('show');acad.classList.add('shake'); const arena=document.querySelector('.dragon-arena'); setTimeout(()=>{if(!arena)return;for(let i=0;i<7;i++){const p=document.createElement('i');p.className='smoke-puff show';p.style.left=(arena.clientWidth*.54+rnd(-8,12))+'px';p.style.bottom=(arena.clientHeight*.43+rnd(-7,9))+'px';p.style.animationDelay=(i*.07)+'s';p.style.transform=`scale(${.45+i*.08})`;arena.appendChild(p);setTimeout(()=>p.remove(),1800)}},110); setTimeout(()=>{dragon.classList.remove('smoke');puff.classList.remove('show');acad.classList.remove('shake')},1350)}
function toggleSound(){muted=!muted;$('soundBtn').textContent=muted?'× БЕЗ ЗВУКА':'♫ ЗВУК'}
async function switchStudent(){if(latestState?.game?.status==='playing')return;stopBackgroundValidation();const oldKey=currentViewerKey();if(participantRole==='student'&&oldKey&&latestState?.game?.status==='lobby'){try{await runTransaction(stateRef(),current=>{const state=normalizeState(current);if(!state||state.game.status!=='lobby'||!state.game.players[oldKey])return state;delete state.game.players[oldKey];delete state.game.stats[oldKey];delete state.game.attempts[oldKey];delete state.game.eventIds[oldKey];delete state.game.submissions[oldKey];state.game.playerOrder=Object.entries(state.game.players).sort((a,b)=>Number(a[1].slot)-Number(b[1].slot)).map(([k])=>k);state.version++;return state})}catch(_){}}await disconnectParticipant();participantPlayerKey='';verificationStatus='';clearStudent();showStudentCodeForm()}

$('lessonLauncher').onclick=showRoleChoice; $('soundBtn').onclick=toggleSound; $('newSessionBtn').onclick=showModeChoice; $('finishEarlyBtn').onclick=finishEarly; $('switchStudentBtn').onclick=switchStudent; $('switchBtn').onclick=switchStudent; $('leaveSessionBtn').onclick=disconnectParticipant; window.addEventListener('online',flushPending); window.addEventListener('beforeunload',unloadSubmit); window.addEventListener('pagehide',unloadSubmit); window.addEventListener('keydown',e=>{if(!(e.ctrlKey||e.metaKey)||String(e.key).toLowerCase()!=='z'||e.shiftKey)return;if(e.target?.matches?.('input,textarea,[contenteditable="true"]'))return;e.preventDefault();undoLastStroke().catch(()=>{})}); setInterval(()=>flushPending().catch(()=>{}),60000); initBoardToolbar();

renderLanding();
const restoredRole=sessionStorage.getItem(SESSION_ROLE_KEY); currentStudent=savedStudent();
if(restoredRole==='teacher'){sessionStorage.removeItem(SESSION_ROLE_KEY)}
else if(restoredRole==='student'&&currentStudent){participantRole='student';participantId='';participantPlayerKey='';participantName=currentStudent.name||'Ученик';participantColor='#5cc57d';verificationStatus=currentStudent.verified?'✓ подтверждён':'';connectParticipant().then(()=>attemptJoinStudent()).catch(()=>{sessionStorage.removeItem(SESSION_ROLE_KEY);participantRole='';renderLanding()})}
</script>
