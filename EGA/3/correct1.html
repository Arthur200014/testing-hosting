    .quiz-zone{display:flex;flex-direction:column;min-width:0}.statement-card{display:grid;grid-template-columns:150px 1fr;gap:13px;align-items:center;min-height:250px;padding:14px;border:4px solid var(--line);border-radius:16px;background:rgba(255,253,242,.95);box-shadow:6px 6px 0 rgba(20,36,43,.52)}.diagram{display:grid;place-items:center;width:140px;height:135px;border-radius:13px;background:#173f51}.diagram svg{width:128px;height:120px}.diagram .wire{fill:rgba(115,225,230,.07);stroke:#83e4e9;stroke-width:2.3}.diagram .hot{fill:rgba(244,195,78,.08);stroke:#f5c751;stroke-width:3}.diagram .dash{fill:none;stroke:#83e4e9;stroke-width:2;stroke-dasharray:5 5}.diagram text{fill:#fff0a1;font-size:9px;font-weight:900}.statement-label{margin-bottom:6px;color:#82382f;font-size:11px;font-weight:950;letter-spacing:.12em}.part-2 .statement-label{color:#225f7c}.statement-text{font-size:clamp(18px,2vw,25px);font-weight:850;line-height:1.27}

/* Совместная версия */
body{min-height:100vh}
#app{position:relative;z-index:3}
.lesson-shell{width:min(1240px,calc(100% - 24px));margin:auto;padding:13px}
.start-layout,.lobby-layout,.final-layout{display:grid;grid-template-columns:minmax(420px,.95fr) minmax(420px,1.05fr);gap:18px;align-items:stretch}
.start-card,.lobby-card,.final-card{padding:28px}
.start-card h1,.lobby-card h1,.final-card h1{margin:7px 0 12px;font-size:clamp(38px,5vw,64px);line-height:.92}
.dragon-hero{position:relative;min-height:520px;border:4px solid var(--line);border-radius:20px;overflow:hidden;background:linear-gradient(var(--sky1),var(--sky2) 66%,var(--ground) 67%)}
.dragon-hero:after{content:"";position:absolute;left:-5%;right:-5%;bottom:-1px;height:74px;background:var(--ground);clip-path:polygon(0 66%,14% 12%,29% 70%,45% 20%,60% 64%,78% 9%,100% 69%,100% 100%,0 100%)}
.dragon-hero .dragon-wrap{bottom:55px;width:390px}
.dragon-hero .mentor{max-width:300px}
.seats{display:grid;gap:10px;margin:18px 0}.seat{display:flex;align-items:center;gap:12px;padding:12px;border:3px dashed #92784e;border-radius:13px;background:#fff8}.seat b{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--gold);border:2px solid var(--line)}.seat.filled{border-style:solid;background:#d8f0e3}
.host-actions,.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}
.game-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:9px;color:white;font-weight:900}.game-foot .danger{background:#a3313c;color:white}
.retry-note{margin-top:8px;padding:9px 12px;border:3px solid #9d3b3b;border-radius:11px;background:#ffe5d7;color:#8b2d2d;font-weight:950}
.waiting-turn{display:grid;place-items:center;min-height:520px;text-align:center}.waiting-turn .panel{width:min(760px,100%);padding:30px}.waiting-turn h1{font-size:clamp(38px,6vw,66px);margin:8px 0}
.feedback.good,.feedback.bad{display:grid}.feedback .next{display:block}
.timer.retry{background:#fff0c8;color:#7a5420}.timer.retry i{display:none}
.result-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:16px 0}.result-card{display:grid;gap:4px;padding:15px;border:3px solid #c3a262;border-radius:14px;background:#fff8}.result-card span{font-weight:950}.result-card b{font-size:36px}.result-card small{line-height:1.35}.result-card em{font-style:normal;font-size:12px;font-weight:900;color:#327151}
.board-clear{grid-column:1/-1!important}
.lesson-card .code{width:100%;padding:14px 17px;border:3px solid var(--line);border-radius:13px;background:#fffef8;text-align:center;font-size:18px;font-weight:900;outline:none}.lesson-card .code-form{display:grid;gap:11px}
@media(max-width:930px){.start-layout,.lobby-layout,.final-layout{grid-template-columns:1fr}.dragon-hero{min-height:340px}.dragon-hero .dragon-wrap{width:310px;bottom:15px}}
@media(max-width:620px){.lesson-shell{width:100%;padding:7px}.start-card,.lobby-card,.final-card{padding:20px}.dragon-hero{min-height:300px}.game-foot{align-items:stretch;flex-direction:column}.result-grid{grid-template-columns:1fr}}

function makeDeck(limit){
  const ordered=shuffle(FACT_PAIRS);
  const pickA=ordered.map((pair,i)=>pair[i%2===0?0:1]);
  const pickB=ordered.map((pair,i)=>pair[i%2===0?1:0]);
  if(Number(limit)===2){
    const deck=[];
    for(let i=0;i<ordered.length;i++)deck.push(pickA[i].id,pickB[i].id);
    return deck;
  }
  return pickA.map(x=>x.id);
}

async function tryJoinStudent(){
  if(joinInFlight||role!=="student"||!student?.code)return "blocked";
  joinInFlight=true;
  try{
    const ss=await get(stateRef());
    if(!ss.exists()){serverState=null;return "waiting"}
    const initial=normalizeState(ss.val());serverState=initial;
    const ms=await get(membersRef()),members=ms.exists()?ms.val()||{}:{};
    const activeCodes=new Set(Object.values(members).filter(m=>m&&m.online&&m.role==="student"&&m.code).map(m=>String(m.code).trim().toUpperCase()));
    const pk=playerKey(student.code),candidateEventId=uuid(),now=Date.now();
    const result=await runTransaction(stateRef(),current=>{
      const s=normalizeState(current||clone(initial)),g=s.game;
      const existing=g.players[pk];
      if(existing){
        existing.lastSeen=now;
        if(student.studentId)existing.studentId=student.studentId;
        if(student.name)existing.name=student.name;
        existing.code=student.code;existing.verified=Boolean(student.verified);
        g.eventIds[pk]=g.eventIds[pk]||candidateEventId;s.version++;return s
      }
      if(g.status!=="lobby")return;
      for(const [key,p] of Object.entries(g.players)){
        const pcode=String(p.code||"").trim().toUpperCase();
        const stale=!activeCodes.has(pcode)&&now-(Number(p.lastSeen)||Number(p.joinedAt)||0)>10000;
        if(stale){delete g.players[key];delete g.stats[key];delete g.attempts[key];delete g.eventIds[key];delete g.submissions[key]}
      }
      if(Object.keys(g.players).length>=g.studentLimit)return;
      const used=new Set(Object.values(g.players).map(p=>Number(p.slot)));let slot=1;while(used.has(slot)&&slot<=g.studentLimit)slot++;
      if(slot>g.studentLimit)return;
      g.players[pk]={studentId:student.studentId||"",name:`Ученик ${slot}`,code:student.code,slot,verified:Boolean(student.verified),joinedAt:now,lastSeen:now};
      g.stats[pk]={firstTryCorrect:0,completed:0,attemptCount:0};g.attempts[pk]={};g.eventIds[pk]=candidateEventId;s.version++;return s
    });
    if(!result.committed){
      const reread=await get(stateRef());if(!reread.exists()){serverState=null;return "waiting"}
      const after=normalizeState(reread.val());serverState=after;
      if(after.game.players?.[pk]){participantPlayerKey=pk;return "joined"}
      if(after.game.status!=="lobby"){showToast("Игра уже началась. Нового участника сейчас добавить нельзя.","bad");return "blocked"}
      if(Object.keys(after.game.players||{}).length>=after.game.studentLimit){showToast("Все места действительно заняты.","bad");return "blocked"}
      showToast("Не удалось занять место. Повторите вход.","bad");showRetryJoin?.();return "blocked"
    }
    serverState=normalizeState(result.snapshot.val());participantPlayerKey=pk;return "joined"
  }catch(e){
    showToast?.("Не удалось подключиться к занятию. Можно повторить вход.","bad");showRetryJoin?.();return "blocked"
  }finally{joinInFlight=false}
}

  const tb=$('boardToolbar');let pos={right:18,bottom:18};try{pos={...pos,...JSON.parse(localStorage.getItem(TOOLBAR_POSITION_KEY)||'{}')}}catch{}tb.style.right=(pos.right??18)+'px';tb.style.bottom=(pos.bottom??18)+'px';
  tb.innerHTML=`<div class="board-head" id="boardDragHandle"><b>Доска</b><button class="tiny" id="boardCollapse">−</button></div><div class="board-tools"><button data-board-tool="cursor" title="Курсор">↖</button><button data-board-tool="pencil" title="Карандаш">✎</button><button data-board-tool="eraser" title="Ластик">⌫</button><input id="boardColor" type="color" value="${boardColor}" title="Цвет"><input id="boardWidth" type="range" min="2" max="12" value="${boardWidth}" title="Толщина"><button class="board-clear" id="boardClear" title="Очистить всю общую доску">🗑 Очистить всё</button></div>`;
  document.querySelectorAll('[data-board-tool]').forEach(b=>b.onclick=()=>{boardTool=b.dataset.boardTool;setBoardPointerMode()});$('boardColor').oninput=e=>boardColor=e.target.value;$('boardWidth').oninput=e=>boardWidth=Number(e.target.value);$('boardClear').onclick=()=>{if(role==='teacher')clearBoard();else showToast('Полностью очищать доску может только учитель.')};$('boardCollapse').onclick=()=>{toolbarCollapsed=!toolbarCollapsed;tb.classList.toggle('collapsed',toolbarCollapsed);$('boardCollapse').textContent=toolbarCollapsed?'+':'−'};makeToolbarDraggable(tb,$('boardDragHandle'));setBoardPointerMode()
}
function makeToolbarDraggable(tb,handle){let sx=0,sy=0,startR=0,startB=0,drag=false;handle.addEventListener('pointerdown',e=>{if(e.target.tagName==='BUTTON')return;drag=true;sx=e.clientX;sy=e.clientY;const r=tb.getBoundingClientRect();startR=innerWidth-r.right;startB=innerHeight-r.bottom;handle.setPointerCapture(e.pointerId)});handle.addEventListener('pointermove',e=>{if(!drag)return;const nr=Math.max(0,Math.min(innerWidth-tb.offsetWidth,startR-(e.clientX-sx))),nb=Math.max(0,Math.min(innerHeight-tb.offsetHeight,startB-(e.clientY-sy)));tb.style.right=nr+'px';tb.style.bottom=nb+'px'});handle.addEventListener('pointerup',()=>{if(!drag)return;drag=false;localStorage.setItem(TOOLBAR_POSITION_KEY,JSON.stringify({right:parseFloat(tb.style.right)||0,bottom:parseFloat(tb.style.bottom)||0}))})}
function installTeacherCursorTracking(anchor){anchor.onpointermove=role==='teacher'?e=>{if(boardTool!=='cursor'||Date.now()-lastCursorPush<75)return;lastCursorPush=Date.now();const r=anchor.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;update(ref(database,`${lessonRoot()}/messages/teacherCursor`),{x,y,at:Date.now(),visible:true}).catch(()=>{})}:null;anchor.onpointerleave=role==='teacher'?()=>update(ref(database,`${lessonRoot()}/messages/teacherCursor`),{visible:false,at:Date.now()}).catch(()=>{}):null}
function updateTeacherCursor(){const c=$('teacherCursor');if(!c)return;if(role!=='student'||!remoteTeacherCursor?.visible){c.classList.remove('show');return}const anchor=document.querySelector('[data-board-anchor="main-screen"]');if(!anchor)return;const r=anchor.getBoundingClientRect();c.style.left=(r.left+remoteTeacherCursor.x*r.width)+'px';c.style.top=(r.top+remoteTeacherCursor.y*r.height)+'px';c.classList.add('show')}

function sound(type){if(muted)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ac=sound.ac||(sound.ac=new AC()),now=ac.currentTime,g=ac.createGain(),sets={start:[[150,.18],[310,.4]],good:[[430,.12],[720,.3]],bad:[[145,.2],[73,.38]],finish:[[270,.13],[450,.3],[760,.56]]},set=sets[type]||sets.good;g.connect(ac.destination);g.gain.setValueAtTime(.04,now);g.gain.exponentialRampToValueAtTime(.0001,now+set[set.length-1][1]+.12);set.forEach(([f,d],i)=>{const o=ac.createOscillator();o.type=type==='bad'?'sawtooth':'triangle';o.frequency.value=f;o.connect(g);o.start(now+i*.04);o.stop(now+d+.1)})}catch{}}

$('lessonJoinBtn').addEventListener('click',openRoleModal);

window.addEventListener('online',async()=>{online=true;updateSessionPanel();await flushPendingResults();if(role==='student'&&serverState&&!serverState.game.players[participantPlayerKey])tryJoinStudent().catch(()=>{});renderFromState(true)});
window.addEventListener('offline',()=>{online=false;updateSessionPanel();renderFromState(true)});
window.addEventListener('resize',updateTeacherCursor);
window.addEventListener('pagehide',bestEffortPartialSubmit);
window.addEventListener('beforeunload',bestEffortPartialSubmit);
document.addEventListener('keydown',e=>{if(!(e.ctrlKey||e.metaKey)||String(e.key).toLowerCase()!=='z'||e.target.closest?.('input,textarea,[contenteditable="true"]'))return;e.preventDefault();undoLastOwnStroke()});
setInterval(()=>flushPendingResults().catch(()=>{}),60000);

initBoardToolbar();renderPublic();flushPendingResults();

  </script>
