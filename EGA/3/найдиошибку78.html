async function hostStartGame(){if(role!=='teacher'||!serverState)return;const initial=clone(serverState);await runTransaction(stateRef(),current=>{const s=normalizeState(current||clone(initial)),g=s.game;if(g.status!=='lobby')return s;const ordered=Object.entries(g.players).sort((a,b)=>(a[1].slot||9)-(b[1].slot||9)).map(([k])=>k);if(ordered.length<g.studentLimit)return;g.playerOrder=ordered.slice(0,g.studentLimit);g.turnKey=ownerKey(g,0);g.status='playing';s.ui.screen='game';g.startedAt=Date.now();g.finishedAt=0;g.endedEarly=false;g.index=0;g.taskResolved=false;g.feedback=null;g.results={};for(const pk of g.playerOrder){g.stats[pk]=g.stats[pk]||{firstTryCorrect:0,completed:0,attemptCount:0};g.attempts[pk]=g.attempts[pk]||{}}s.version++;return s});sound('start')}
async function chooseStepShared(i){if(role!=='student'||!serverState||!participantPlayerKey)return;const initial=clone(serverState),t=currentTask(initial);if(!t)return;try{const res=await runTransaction(stateRef(),current=>{const s=normalizeState(current||clone(initial)),g=s.game;if(g.status!=='playing'||g.turnKey!==participantPlayerKey||g.taskResolved)return;const live=g.deck[g.index];g.stats[participantPlayerKey]=g.stats[participantPlayerKey]||{firstTryCorrect:0,completed:0,attemptCount:0};g.attempts[participantPlayerKey]=g.attempts[participantPlayerKey]||{};const a=g.attempts[participantPlayerKey][g.index]||{tries:0,wrongPicks:[]};a.wrongPicks=Array.isArray(a.wrongPicks)?a.wrongPicks:[];if(i!==live.errorIndex&&a.wrongPicks.includes(i))return s;a.tries=(Number(a.tries)||0)+1;g.stats[participantPlayerKey].attemptCount=(Number(g.stats[participantPlayerKey].attemptCount)||0)+1;if(i!==live.errorIndex){a.wrongPicks.push(i);g.attempts[participantPlayerKey][g.index]=a;g.feedback={correct:false,by:participantPlayerKey,at:Date.now()};s.version++;return s}g.attempts[participantPlayerKey][g.index]=a;const clean=a.tries===1;g.taskResolved=true;g.results[g.index]={by:participantPlayerKey,clean,at:Date.now()};g.stats[participantPlayerKey].completed=(Number(g.stats[participantPlayerKey].completed)||0)+1;if(clean)g.stats[participantPlayerKey].firstTryCorrect=(Number(g.stats[participantPlayerKey].firstTryCorrect)||0)+1;g.feedback={correct:true,by:participantPlayerKey,at:Date.now()};s.version++;return s});if(!res.committed)showToast('Состояние изменилось. Повтори выбор.','bad');else sound(i===t.errorIndex?'good':'bad')}catch{showToast(online?'Не удалось отправить выбор. Повтори.':'Нет сети. Дождись восстановления связи.','bad')}}
async function nextTaskShared(){if(role!=='student'||!serverState)return;const initial=clone(serverState);await runTransaction(stateRef(),current=>{const s=normalizeState(current||clone(initial)),g=s.game;if(g.status!=='playing'||g.turnKey!==participantPlayerKey||!g.taskResolved)return;const next=g.index+1;if(next>=g.deck.length){g.status='finished';g.finishedAt=Date.now();g.endedEarly=false;g.turnKey='';g.feedback=null;s.ui.screen='final'}else{g.index=next;g.taskResolved=false;g.feedback=null;g.turnKey=ownerKey(g,next);s.boardEpoch=(Number(s.boardEpoch)||0)+1;s.strokes={}}s.version++;return s})}
async function teacherFinishLesson(){if(role!=='teacher'||!serverState||serverState.game.status!=='playing')return;if(!confirm('Завершить занятие сейчас? В результат попадут только полностью пройденные свитки каждого ученика.'))return;const initial=clone(serverState);try{const res=await runTransaction(stateRef(),current=>{const s=normalizeState(current||clone(initial));if(s.game.status!=='playing')return s;s.game.status='finished';s.game.finishedAt=Date.now();s.game.endedEarly=true;s.game.turnKey='';s.game.feedback=null;s.ui.screen='final';s.version++;return s});if(!res.committed)return;serverState=normalizeState(res.snapshot.val());renderFromState(true);await Promise.all((serverState.game.playerOrder||[]).map(pk=>ensureSubmission(pk)));scheduleTeacherBackup()}catch{showToast(online?'Не удалось завершить занятие. Повтори.':'Нет сети. Дождись восстановления связи и повтори.','bad')}}

async function tryJoinStudent(){if(joinInFlight||role!=='student'||!student)return;joinInFlight=true;try{const ss=await get(stateRef());if(!ss.exists()){serverState=null;renderWaitingTeacher();return}const initial=normalizeState(ss.val());serverState=initial;const ms=await get(membersRef()),members=ms.exists()?ms.val()||{}:{},activeIds=new Set(Object.values(members).filter(m=>m&&m.online&&m.role==='student'&&m.studentId).map(m=>String(m.studentId))),pk=playerKey(student.studentId),candidateEventId=uuid(),now=Date.now();const result=await runTransaction(stateRef(),current=>{const s=normalizeState(current||clone(initial)),g=s.game,existingKey=Object.keys(g.players).find(k=>String(g.players[k]?.studentId)===String(student.studentId));if(existingKey){const p=g.players[existingKey];p.name=student.name;p.code=student.code;p.lastSeen=now;g.eventIds[existingKey]=g.eventIds[existingKey]||candidateEventId;s.version++;return s}if(g.status!=='lobby')return;for(const [key,p] of Object.entries(g.players)){const stale=!activeIds.has(String(p.studentId))&&now-(Number(p.lastSeen)||Number(p.joinedAt)||0)>10000;if(stale&&g.status==='lobby'){delete g.players[key];delete g.stats[key];delete g.attempts[key];delete g.eventIds[key];delete g.submissions[key]}}if(Object.keys(g.players).length>=g.studentLimit)return;const used=new Set(Object.values(g.players).map(p=>Number(p.slot)));let slot=1;while(used.has(slot)&&slot<=g.studentLimit)slot++;if(slot>g.studentLimit)return;g.players[pk]={studentId:student.studentId,name:student.name,code:student.code,slot,joinedAt:now,lastSeen:now};g.stats[pk]={firstTryCorrect:0,completed:0,attemptCount:0};g.attempts[pk]={};g.eventIds[pk]=candidateEventId;s.version++;return s});if(!result.committed){const reread=await get(stateRef());if(!reread.exists()){serverState=null;renderWaitingTeacher();return}const after=normalizeState(reread.val()),found=Object.keys(after.game.players).find(k=>String(after.game.players[k]?.studentId)===String(student.studentId));if(found){participantPlayerKey=found;serverState=after;await registerPresence();renderFromState(true);return}if(after.game.status!=='lobby'){showToast('Игра уже началась. Войти новым участником сейчас нельзя.','bad');return}if(Object.keys(after.game.players).length>=after.game.studentLimit){showToast('Все места действительно заняты.','bad');return}showToast('Вход не завершён из-за одновременного изменения. Повтори вход.','bad');showRetryJoin();return}const after=normalizeState(result.snapshot.val()),found=Object.keys(after.game.players).find(k=>String(after.game.players[k]?.studentId)===String(student.studentId));if(!found){showToast('Не удалось закрепить место.','bad');showRetryJoin();return}participantPlayerKey=found;serverState=after;await registerPresence();renderFromState(true)}catch{showToast(online?'Не удалось подключиться к занятию. Можно повторить вход.':'Нет сети. Подключение продолжится после восстановления.','bad');showRetryJoin()}finally{joinInFlight=false}}

function openStudentLoginForm(){$('lessonModal').innerHTML=`<div class="lesson-card"><button class="modal-x" id="closeModalBtn">×</button><span class="tag">Вход ученика</span><h2>Личный код</h2><form class="code-form" id="studentLoginForm"><input class="code" id="studentCodeInput" maxlength="40" autocomplete="one-time-code" placeholder="ЛИЧНЫЙ КОД"><button class="primary">Проверить код</button><div class="status" id="studentLoginStatus"></div></form></div>`;$('closeModalBtn').onclick=closeLessonModal;$('studentLoginForm').onsubmit=handleStudentLogin}
async function handleStudentLogin(e){e.preventDefault();const input=$('studentCodeInput'),btn=e.submitter,status=$('studentLoginStatus'),code=input.value.trim();if(!code){status.className='status bad';status.textContent='Введи личный код';return}input.disabled=btn.disabled=true;status.textContent='Проверяем код…';try{student=await validateStudent(code);saveStudent(student);await flushPendingResults();connectStudent(student)}catch(err){status.className='status bad';status.textContent=err.message||'Код не подтверждён';input.disabled=btn.disabled=false}}
async function connectStudent(s){student=s;saveStudent(s);role='student';participantName=s.name;participantPlayerKey=playerKey(s.studentId);closeLessonModal();showConnectedUI();startSessionListeners();await tryJoinStudent();if(!serverState)renderWaitingTeacher()}
async function switchStudent(){if(serverState?.game?.status==='playing'){showToast('Во время игры менять ученика нельзя.','bad');return}await cleanupPresence();stopSessionListeners();role='';participantId='';participantPlayerKey='';clearStoredStudent();hideConnectedUI();renderPublic();openRoleModal();setTimeout(openStudentLogin,0)}
function showConnectedUI(){$('lessonJoinBtn').classList.add('hidden');$('sessionPanel').classList.add('show');$('boardToolbar').classList.add('show');updateSessionPanel()}
function hideConnectedUI(){$('lessonJoinBtn').classList.remove('hidden');$('sessionPanel').classList.remove('show');$('boardToolbar').classList.remove('show')}
function updateSessionPanel(){const p=$('sessionPanel');if(!p)return;if(!role){p.classList.remove('show');return}const onlineStudents=Object.values(membersSnapshot).filter(m=>m&&m.online&&m.role==='student').length,status=!online?'офлайн':serverState?.game?.status==='playing'?'игра идёт':serverState?.game?.status==='finished'?'завершено':serverState?'лобби':'ждём учителя',teacherFinish=role==='teacher'&&serverState?.game?.status==='playing'?'<button class="tiny danger" id="panelFinishLesson">Завершить занятие</button>':'';p.innerHTML=`<span class="session-dot ${online?'on':''}"></span><b>${role==='teacher'?'Учитель':esc(student?.name||'Ученик')}</b><small>${status}${serverState?` · учеников онлайн: ${onlineStudents}`:''}</small>${teacherFinish}${role==='student'?'<button class="tiny" id="panelSwitchStudent">Сменить ученика</button>':''}`;if($('panelSwitchStudent'))$('panelSwitchStudent').onclick=switchStudent;if($('panelFinishLesson'))$('panelFinishLesson').onclick=teacherFinishLesson}
function showToast(text,type=''){const t=$('globalToast');if(!t)return;t.textContent=text;t.className='global-toast show '+type;clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>t.className='global-toast',3000)}

function readQueue(){try{const q=JSON.parse(localStorage.getItem(PENDING_RESULTS_KEY)||'[]');return Array.isArray(q)?q:[]}catch{return[]}}
function writeQueue(q){localStorage.setItem(PENDING_RESULTS_KEY,JSON.stringify(q))}
function queueResult(payload,pk){const q=readQueue();if(!q.some(x=>x?.payload?.eventId===payload.eventId))q.push({payload,playerKey:pk});writeQueue(q)}
function removeQueued(eventId){writeQueue(readQueue().filter(x=>x?.payload?.eventId!==eventId))}
async function postResult(payload){const response=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),redirect:'follow'});let answer;try{answer=await response.json()}catch{throw new Error('Система результатов не ответила.')}if(!response.ok||!answer?.ok)throw new Error(answer?.error||'Результат не принят.');return answer}
function resultPayload(s,pk){const g=s.game,p=g.players[pk],st=g.stats[pk]||{},completed=Number(st.completed)||0,score=Number(st.firstTryCorrect)||0,maxScore=g.endedEarly?completed:assignedTotal(s,pk),percent=maxScore?Math.round(score/maxScore*100):0,finished=g.finishedAt||Date.now(),started=g.startedAt||finished,durationSec=Math.max(1,Math.round((finished-started)/1000));return{action:'submitTest',programId:'EGE_MATH',eventId:g.eventIds[pk]||`${g.sessionId}-${pk}`,studentId:p?.studentId||'',studentName:p?.name||'',studentCode:p?.code||'',testId:TEST_META.testId,testName:TEST_META.testName,topicId:TEST_META.topicId,topicName:TEST_META.topicName,taskNumber:TEST_META.taskNumber,testDate:localDate(),score,maxScore,percent,scorePercent:percent,durationSec,durationSeconds:durationSec,startedAt:nowIso(started),finishedAt:nowIso(finished),completedAt:nowIso(finished),answeredCount:completed,attemptCount:Number(st.attemptCount)||0,studentMode:g.studentLimit,mode:g.studentLimit===2?'two':'one',schemaVersion:SCHEMA_VERSION,roomCode:FIXED_SESSION_ID}}
async function claimSubmission(pk){const sref=ref(database,`${lessonRoot()}/state/game/submissions/${pk}`),eventId=serverState?.game?.eventIds?.[pk];if(!eventId)return false;const res=await runTransaction(sref,current=>{if(current?.status==='saved')return;if(current?.status==='sending'&&Date.now()-(Number(current.updatedAt)||0)<8000)return;return{eventId,status:'sending',updatedAt:Date.now()}});return res.committed}
async function markSubmission(pk,status,error=''){try{await update(ref(database,`${lessonRoot()}/state/game/submissions/${pk}`),{status,error,updatedAt:Date.now()})}catch{}}
async function ensureSubmission(pk){if(!pk||submissionInFlight.has(pk)||!serverState||serverState.game.status!=='finished')return;if(serverState.game.submissions?.[pk]?.status==='saved')return;submissionInFlight.add(pk);const snapshot=clone(serverState),payload=resultPayload(snapshot,pk);try{const claimed=await claimSubmission(pk);if(!claimed){submissionInFlight.delete(pk);return}if(!navigator.onLine)throw new Error('offline');await postResult(payload);removeQueued(payload.eventId);await markSubmission(pk,'saved','')}catch(err){queueResult(payload,pk);await markSubmission(pk,'queued',String(err?.message||'offline'))}finally{submissionInFlight.delete(pk)}}
async function flushPendingResults(){if(!navigator.onLine)return;for(const item of readQueue()){const payload=item?.payload,pk=item?.playerKey;if(!payload?.eventId)continue;try{await postResult(payload);removeQueued(payload.eventId);if(serverState?.game?.eventIds?.[pk]===payload.eventId)await markSubmission(pk,'saved','')}catch{}}}
function scheduleTeacherBackup(){if(role!=='teacher'||teacherBackupTimer)return;teacherBackupTimer=setTimeout(async()=>{teacherBackupTimer=null;if(!serverState||serverState.game.status!=='finished')return;for(const pk of serverState.game.playerOrder||[])if(serverState.game.submissions?.[pk]?.status!=='saved')await ensureSubmission(pk)},5000)}
function bestEffortPartialSubmit(){if(partialSent||role!=='student'||!serverState||serverState.game.status!=='playing'||!participantPlayerKey)return;partialSent=true;const s=clone(serverState),payload=resultPayload({...s,game:{...s.game,endedEarly:true,finishedAt:Date.now()}},participantPlayerKey);payload.partial=true;queueResult(payload,participantPlayerKey);try{const blob=new Blob([JSON.stringify(payload)],{type:'text/plain;charset=utf-8'});navigator.sendBeacon?.(API_URL,blob)}catch{}}


function attachBoardLayer(){const anchor=document.querySelector('[data-board-anchor="main-screen"]');if(!anchor)return;let board=$('sharedBoard');if(board)board.remove();board=document.createElementNS('http://www.w3.org/2000/svg','svg');board.id='sharedBoard';board.setAttribute('viewBox','0 0 1000 1000');board.setAttribute('preserveAspectRatio','none');board.classList.add('shared-board');anchor.appendChild(board);setBoardPointerMode();renderBoardStrokes();board.addEventListener('pointerdown',boardPointerDown);board.addEventListener('pointermove',boardPointerMove);board.addEventListener('pointerup',boardPointerUp);board.addEventListener('pointercancel',boardPointerUp);installTeacherCursorTracking(anchor);updateTeacherCursor()}
function setBoardPointerMode(){const b=$('sharedBoard');if(b)b.style.pointerEvents=boardTool==='cursor'?'none':'auto';document.querySelectorAll('[data-board-tool]').forEach(x=>x.classList.toggle('active',x.dataset.boardTool===boardTool))}
function pointFromEvent(e){const anchor=document.querySelector('[data-board-anchor="main-screen"]'),r=anchor.getBoundingClientRect();return[(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]}
function boardPointerDown(e){if(boardTool==='cursor'||!serverState)return;e.preventDefault();const p=pointFromEvent(e);if(boardTool==='eraser'){eraseNearest(p);return}activeStroke={id:'stroke-'+uuid(),anchorId:'main-screen',authorId:participantId||role,authorName:participantName||role,color:boardColor,width:boardWidth,points:[p],done:false,epoch:serverState.boardEpoch||0,rev:Date.now()};e.currentTarget.setPointerCapture(e.pointerId);pushStroke()}
function boardPointerMove(e){if(!activeStroke||boardTool!=='pencil')return;const p=pointFromEvent(e),last=activeStroke.points[activeStroke.points.length-1];if(Math.hypot(p[0]-last[0],p[1]-last[1])<.002)return;activeStroke.points.push(p);activeStroke.rev=Date.now();renderBoardStrokes();if(Date.now()-lastStrokePush>70){lastStrokePush=Date.now();pushStroke()}}
function boardPointerUp(){if(!activeStroke)return;activeStroke.done=true;activeStroke.rev=Date.now();pushStroke();activeStroke=null}
async function pushStroke(){if(!activeStroke||!serverState)return;try{await set(ref(database,`${lessonRoot()}/state/strokes/${activeStroke.id}`),clone(activeStroke))}catch{}}
function renderBoardStrokes(){const b=$('sharedBoard');if(!b||!serverState)return;const epoch=serverState.boardEpoch||0,strokes=Object.values(serverState.strokes||{}).filter(s=>s&&s.epoch===epoch);if(activeStroke&&!strokes.some(s=>s.id===activeStroke.id))strokes.push(activeStroke);b.innerHTML=strokes.map(s=>{const pts=(s.points||[]).map(([x,y])=>`${Math.max(0,Math.min(1,x))*1000},${Math.max(0,Math.min(1,y))*1000}`).join(' ');return pts?`<polyline points="${pts}" fill="none" stroke="${esc(s.color||'#e53935')}" stroke-width="${Math.max(1,Number(s.width)||6)*2.2}" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`:''}).join('')}
async function eraseNearest(p){if(!serverState)return;const entries=Object.entries(serverState.strokes||{}).filter(([,s])=>s?.epoch===(serverState.boardEpoch||0));let best=null,bestD=.04;for(const [id,s] of entries)for(const q of s.points||[]){const d=Math.hypot(p[0]-q[0],p[1]-q[1]);if(d<bestD){bestD=d;best=id}}if(best)try{await set(ref(database,`${lessonRoot()}/state/strokes/${best}`),null)}catch{}}
async function clearBoard(){if(role!=='teacher'||!serverState)return;const initial=clone(serverState);await runTransaction(stateRef(),current=>{const s=normalizeState(current||clone(initial));s.boardEpoch=(Number(s.boardEpoch)||0)+1;s.strokes={};s.version++;return s})}
function initBoardToolbar(){const tb=$('boardToolbar');let pos={right:18,bottom:18};try{pos={...pos,...JSON.parse(localStorage.getItem(TOOLBAR_POSITION_KEY)||'{}')}}catch{}tb.style.right=(pos.right??18)+'px';tb.style.bottom=(pos.bottom??18)+'px';tb.innerHTML=`<div class="board-head" id="boardDragHandle"><b>Доска</b><button class="tiny" id="boardCollapse">−</button></div><div class="board-tools"><button data-board-tool="cursor" title="Курсор">↖</button><button data-board-tool="pencil" title="Карандаш">✎</button><button data-board-tool="eraser" title="Ластик">⌫</button><input id="boardColor" type="color" value="${boardColor}" title="Цвет"><input id="boardWidth" type="range" min="2" max="12" value="${boardWidth}" title="Толщина"><button class="board-clear" id="boardClear" title="Очистить всю общую доску">🗑 Очистить всё</button></div>`;document.querySelectorAll('[data-board-tool]').forEach(b=>b.onclick=()=>{boardTool=b.dataset.boardTool;setBoardPointerMode()});$('boardColor').oninput=e=>boardColor=e.target.value;$('boardWidth').oninput=e=>boardWidth=Number(e.target.value);$('boardClear').onclick=()=>{if(role==='teacher')clearBoard();else showToast('Полностью очищать доску может только учитель.','bad')};$('boardCollapse').onclick=()=>{toolbarCollapsed=!toolbarCollapsed;tb.classList.toggle('collapsed',toolbarCollapsed);$('boardCollapse').textContent=toolbarCollapsed?'+':'−'};makeToolbarDraggable(tb,$('boardDragHandle'));setBoardPointerMode()}
function makeToolbarDraggable(tb,handle){let sx=0,sy=0,startR=0,startB=0,drag=false;handle.addEventListener('pointerdown',e=>{if(e.target.tagName==='BUTTON')return;drag=true;sx=e.clientX;sy=e.clientY;const r=tb.getBoundingClientRect();startR=innerWidth-r.right;startB=innerHeight-r.bottom;handle.setPointerCapture(e.pointerId)});handle.addEventListener('pointermove',e=>{if(!drag)return;const nr=Math.max(0,Math.min(innerWidth-tb.offsetWidth,startR-(e.clientX-sx))),nb=Math.max(0,Math.min(innerHeight-tb.offsetHeight,startB-(e.clientY-sy)));tb.style.right=nr+'px';tb.style.bottom=nb+'px'});handle.addEventListener('pointerup',()=>{if(!drag)return;drag=false;localStorage.setItem(TOOLBAR_POSITION_KEY,JSON.stringify({right:parseFloat(tb.style.right)||0,bottom:parseFloat(tb.style.bottom)||0}))})}
function installTeacherCursorTracking(anchor){anchor.onpointermove=role==='teacher'?e=>{if(boardTool!=='cursor'||Date.now()-lastCursorPush<75)return;lastCursorPush=Date.now();const r=anchor.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;update(ref(database,`${lessonRoot()}/messages/teacherCursor`),{x,y,at:Date.now(),visible:true}).catch(()=>{})}:null;anchor.onpointerleave=role==='teacher'?()=>update(ref(database,`${lessonRoot()}/messages/teacherCursor`),{visible:false,at:Date.now()}).catch(()=>{}):null}
function updateTeacherCursor(){const c=$('teacherCursor');if(!c)return;if(role!=='student'||!remoteTeacherCursor?.visible){c.classList.remove('show');return}const anchor=document.querySelector('[data-board-anchor="main-screen"]');if(!anchor)return;const r=anchor.getBoundingClientRect();c.style.left=(r.left+remoteTeacherCursor.x*r.width)+'px';c.style.top=(r.top+remoteTeacherCursor.y*r.height)+'px';c.classList.add('show')}



function sound(type){if(muted)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ac=sound.ac||(sound.ac=new AC()),now=ac.currentTime,g=ac.createGain(),sets={start:[[120,.2],[240,.36]],good:[[390,.13],[690,.31]],bad:[[155,.2],[74,.38]],finish:[[250,.14],[390,.29],[630,.58]]},set=sets[type]||sets.good;g.connect(ac.destination);g.gain.setValueAtTime(.045,now);g.gain.exponentialRampToValueAtTime(.0001,now+set[set.length-1][1]+.1);set.forEach(([f,d],i)=>{const o=ac.createOscillator();o.type=type==='bad'?'sawtooth':'triangle';o.frequency.setValueAtTime(f,now+i*.04);o.connect(g);o.start(now+i*.04);o.stop(now+d+.1)})}catch{}}


// Инициализация: все постоянные элементы существуют ещё до загрузки Firebase.
$('lessonJoinBtn').onclick=openRoleModal;
$('soundBtn').onclick=()=>{muted=!muted;$('soundBtn').textContent=muted?'× БЕЗ ЗВУКА':'♫ ЗВУК'};
window.addEventListener('online',async()=>{online=true;updateSessionPanel();await flushPendingResults();if(role==='student'&&serverState&&!serverState.game.players[participantPlayerKey])tryJoinStudent().catch(()=>{});renderFromState(true)});
window.addEventListener('offline',()=>{online=false;updateSessionPanel();renderFromState(true)});
window.addEventListener('resize',()=>updateTeacherCursor());
window.addEventListener('pagehide',bestEffortPartialSubmit);
window.addEventListener('beforeunload',bestEffortPartialSubmit);
initBoardToolbar();renderPublic();flushPendingResults();
</script>
