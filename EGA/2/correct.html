<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#16372f">
  <title>Турнир Нефритового дворца — теория задания №2</title>
  <style>
    :root{
      --ink:#17251f;--paper:#fff8df;--jade:#45d49f;--jade2:#157b61;
      --gold:#ffd76a;--red:#db4b3f;--wood:#5e2f20;--cream:#fff6d6;
      --shadow:0 18px 55px #071e1970;--line:#472619;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Trebuchet MS,Segoe UI,system-ui,sans-serif;color:var(--ink)}
    body{
      min-height:100vh;overflow-x:hidden;
      background:
        radial-gradient(circle at 50% 18%,#d6fff0 0 6%,transparent 30%),
        linear-gradient(#83cbb4 0 27%,#4b8c73 27% 42%,#214f42 42% 100%);
    }
    body:before,body:after{content:"";position:fixed;inset:auto;pointer-events:none;z-index:-1}
    body:before{
      left:-8%;right:-8%;bottom:0;height:58vh;
      background:
        radial-gradient(ellipse at 14% 100%,#173b31 0 45%,transparent 46%),
        radial-gradient(ellipse at 89% 100%,#173b31 0 40%,transparent 41%),
        linear-gradient(8deg,transparent 40%,#28614e 41% 55%,transparent 56%);
      filter:drop-shadow(0 -18px 30px #0d2a2555)
    }
    body:after{
      top:0;left:0;width:100%;height:230px;opacity:.45;
      background:
        linear-gradient(62deg,transparent 47%,#fff9 48% 49%,transparent 50%) 0 0/190px 190px,
        radial-gradient(ellipse,#fff9 0 28%,transparent 30%) 30px 16px/320px 90px repeat-x;
      animation:mist 24s linear infinite
    }
    button,input{font:inherit}
    button{cursor:pointer}
    button:disabled{cursor:not-allowed}
    .topbar{
      width:min(1240px,calc(100% - 24px));margin:12px auto 0;min-height:54px;
      display:flex;align-items:center;justify-content:space-between;gap:12px;
      color:#fff;position:relative;z-index:20
    }
    .brand{display:flex;align-items:center;gap:10px;font-weight:1000;letter-spacing:.04em;text-shadow:0 2px 5px #173b31}
    .brand-mark{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#ffdf70,#bc7527);border:3px solid #fff2b1;box-shadow:0 5px 0 #774219;font-size:22px}
    .student-box{
      display:none;align-items:center;gap:9px;background:#092d27c9;border:1px solid #b8ffe076;
      padding:7px 8px 7px 13px;border-radius:999px;backdrop-filter:blur(10px)
    }
    .student-box b{max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .tiny-btn{border:1px solid #fff5;background:#fff1;color:#fff;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:900}
    .tiny-btn:hover:not(:disabled){background:#fff3}
    .tiny-btn:disabled{opacity:.35}
    .sound-btn{width:37px;height:37px;padding:0;font-size:17px}
    .stage{
      width:min(1240px,calc(100% - 24px));min-height:calc(100vh - 78px);margin:8px auto 16px;
      position:relative;z-index:2
    }
    .screen{
      min-height:700px;border:4px solid #291911;border-radius:26px;overflow:hidden;position:relative;
      background:
        linear-gradient(#fffae8eb,#fff5d8eb),
        repeating-linear-gradient(90deg,transparent 0 74px,#5e2f2010 75px 78px);
      box-shadow:var(--shadow),inset 0 0 0 4px #dda948;
    }
    .screen:before,.screen:after{content:"";position:absolute;top:0;bottom:0;width:24px;background:repeating-linear-gradient(#8d4d28 0 30px,#d9983e 31px 38px);z-index:6}
    .screen:before{left:0}.screen:after{right:0}
    .login-screen,.start-screen,.final-screen{display:grid;grid-template-columns:1.02fr .98fr;align-items:center;padding:52px 64px;gap:36px}
    .scroll{
      background:linear-gradient(100deg,#f6d98d,#fff9dc 9% 91%,#eec973);
      border:3px solid #8e5a25;border-radius:12px;padding:34px;box-shadow:0 15px 30px #5a351f35;position:relative
    }
    .scroll:before,.scroll:after{content:"";position:absolute;left:-18px;right:-18px;height:18px;border-radius:20px;background:linear-gradient(#c7802b,#ffda6e 45%,#8c4c1a 50%);border:2px solid #743b15}
    .scroll:before{top:-10px}.scroll:after{bottom:-10px}
    .eyebrow{display:inline-flex;padding:6px 10px;background:#16372f;color:#ffe384;border-radius:7px;font-size:12px;font-weight:1000;letter-spacing:.13em;text-transform:uppercase}
    h1{font-size:clamp(36px,5vw,66px);line-height:.93;margin:18px 0 18px;letter-spacing:-.055em}
    .lead{font-size:18px;line-height:1.55;margin:0 0 22px}
    .code-form{display:grid;gap:11px}
    .code-input{width:100%;border:3px solid #4f2a1a;border-radius:14px;background:#fffdf0;padding:15px 16px;font-size:20px;font-weight:900;text-transform:uppercase;outline:none}
    .code-input:focus{border-color:var(--jade2);box-shadow:0 0 0 4px #45d49f3d}
    .primary,.secondary{border:0;border-radius:14px;padding:14px 20px;font-weight:1000;letter-spacing:.02em;box-shadow:0 6px 0 #492617;transition:.18s transform,.18s filter}
    .primary{color:#fff;background:linear-gradient(#32b985,#167a5d);border:2px solid #0c5d47}
    .secondary{color:#351b12;background:linear-gradient(#ffe57c,#e8a83b);border:2px solid #9d5f18}
    .primary:hover,.secondary:hover{filter:brightness(1.07);transform:translateY(-2px)}
    .primary:active,.secondary:active{transform:translateY(4px);box-shadow:0 2px 0 #492617}
    .status{min-height:22px;font-size:14px;font-weight:900}
    .status.bad{color:#b42318}.status.ok{color:#087857}
    .rules{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:23px 0}
    .rule{background:#fff9;border:2px solid #7a4b2f33;border-radius:14px;padding:13px 8px;text-align:center;font-size:13px;font-weight:900;line-height:1.35}
    .rule b{font-size:22px;display:block}
    .hero-yard{min-height:550px;position:relative;display:grid;place-items:center}
    .sun{position:absolute;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,#fffbd1 0 22%,#ffdd69 50%,#ffbd4566 70%,transparent 71%);filter:blur(.2px);animation:pulse 3s ease-in-out infinite}
    .mountains{position:absolute;inset:auto 0 0;height:58%;background:linear-gradient(150deg,transparent 47%,#24483a 48%) 0 0/52% 100%,linear-gradient(210deg,transparent 47%,#16372f 48%) 100% 0/64% 100%;background-repeat:no-repeat;opacity:.8}
    .panda{
      --s:1;position:relative;width:230px;height:350px;transform:scale(var(--s));transform-origin:center bottom;
      filter:drop-shadow(0 18px 10px #142b2366);z-index:3;animation:pandaBreathe 2.4s ease-in-out infinite
    }
    .panda .body{position:absolute;left:45px;top:122px;width:143px;height:184px;border-radius:49% 49% 43% 43%;background:radial-gradient(circle at 55% 32%,#fff 0 42%,#e7e0ca 66%,#c9c0a7);border:4px solid #1c201e}
    .panda .head{position:absolute;left:37px;top:25px;width:158px;height:143px;border-radius:48% 50% 45% 45%;background:radial-gradient(circle at 56% 34%,#fff 0 58%,#ded8c5 78%);border:4px solid #1b211f;z-index:4}
    .panda .ear{position:absolute;top:11px;width:58px;height:61px;border-radius:50%;background:#161b1a;border:4px solid #0d1110;z-index:2}
    .panda .ear.l{left:35px}.panda .ear.r{right:33px}
    .eye-patch{position:absolute;top:50px;width:43px;height:58px;border-radius:58% 42% 56% 44%;background:#171b1a;transform:rotate(14deg)}
    .eye-patch.l{left:29px}.eye-patch.r{right:29px;transform:rotate(-14deg)}
    .eye-patch i{position:absolute;left:14px;top:16px;width:13px;height:17px;border-radius:50%;background:#f8eed3;box-shadow:inset 0 0 0 5px #4a7b55}
    .snout{position:absolute;left:52px;top:81px;width:53px;height:39px;border-radius:48%;background:#e7d8bd;border:2px solid #83735c}
    .nose{position:absolute;left:17px;top:2px;width:20px;height:14px;border-radius:50%;background:#101413}
    .smile{position:absolute;left:13px;top:16px;width:28px;height:13px;border-bottom:4px solid #3f211a;border-radius:50%}
    .panda .arm,.panda .leg{position:absolute;background:#171c1b;border:4px solid #0d1110;z-index:1}
    .panda .arm{top:149px;width:56px;height:126px;border-radius:55px;transform-origin:50% 15%}
    .panda .arm.l{left:21px;transform:rotate(24deg)}.panda .arm.r{right:12px;transform:rotate(-36deg)}
    .panda .leg{top:278px;width:68px;height:65px;border-radius:30px}
    .panda .leg.l{left:42px;transform:rotate(8deg)}.panda .leg.r{right:37px;transform:rotate(-8deg)}
    .pants{position:absolute;left:49px;top:247px;width:136px;height:62px;border-radius:12px 12px 38px 38px;background:linear-gradient(#c7954f,#8a5b28);border:4px solid #4d321c;z-index:5}
    .belt{position:absolute;left:-3px;right:-3px;top:2px;height:16px;background:#b7362e;border:2px solid #6e1e18}
    .hero-yard .panda{--s:1.18}
    .gong-mini{position:absolute;right:1%;top:22%;width:210px;height:210px;border-radius:50%;background:radial-gradient(circle,#fff2a0 0 8%,#e9b53b 9% 34%,#9c601c 35% 42%,#f2ca52 43% 67%,#885118 68%);border:8px solid #4c2a16;box-shadow:0 8px 0 #2e170d,0 0 35px #ffdb68}
    .gong-mini:after{content:"";position:absolute;left:-28px;right:-28px;top:-35px;bottom:-58px;border:12px solid #48291c;border-bottom-width:18px;border-top-left-radius:60px;border-top-right-radius:60px;z-index:-1}
    .mentor-row{position:absolute;left:4%;right:1%;bottom:5px;display:flex;align-items:end;justify-content:space-between;z-index:5}
    .mentor{--c:#b64936;--f:#f1c57f;position:relative;width:70px;height:105px;filter:drop-shadow(0 7px 4px #17372b88);animation:mentorBob 2.6s ease-in-out infinite}
    .mentor:nth-child(2){animation-delay:-.5s}.mentor:nth-child(3){animation-delay:-1s}.mentor:nth-child(4){animation-delay:-1.5s}.mentor:nth-child(5){animation-delay:-2s}.mentor:nth-child(6){animation-delay:-2.5s}
    .mentor .m-body{position:absolute;left:17px;bottom:0;width:39px;height:59px;border-radius:45% 45% 20% 20%;background:var(--c);border:3px solid #332018}
    .mentor .m-head{position:absolute;left:10px;top:3px;width:54px;height:55px;border-radius:48%;background:var(--f);border:3px solid #332018}
    .mentor .m-head:before,.mentor .m-head:after{content:"";position:absolute;top:19px;width:9px;height:13px;border-radius:50%;background:#17211d;box-shadow:inset 0 0 0 3px #f7df85}
    .mentor .m-head:before{left:10px}.mentor .m-head:after{right:10px}
    .mentor .m-mark{position:absolute;left:20px;top:42px;width:17px;height:5px;border-bottom:3px solid #4c2219;border-radius:50%}
    .mentor.shifu{--c:#7d3026;--f:#d48152;transform:scale(.84);transform-origin:center bottom}
    .mentor.shifu .m-head:before{box-shadow:inset 0 0 0 3px #b5d56e}
    .mentor.tiger{--c:#8d2e20;--f:#e89031}
    .mentor.tiger .m-head{background:repeating-linear-gradient(75deg,#e89031 0 9px,#4b2118 10px 13px)}
    .mentor.monkey{--c:#8f4f24;--f:#d9a15a}.mentor.monkey .m-head{border-radius:50% 50% 42% 42%}
    .mentor.crane{--c:#e7e6d9;--f:#fff}.mentor.crane{height:125px}.mentor.crane .m-head{width:38px;left:18px}.mentor.crane .m-body{height:75px;background:#e9e5d2}
    .mentor.mantis{--c:#68a836;--f:#9bd34f;transform:scale(.58);transform-origin:center bottom}
    .mentor.viper{--c:#2e8a61;--f:#5ac88b}.mentor.viper .m-body{height:72px;width:31px;left:21px;border-radius:48% 48% 60% 60%}
    .game-screen{display:grid;grid-template-rows:auto 1fr;min-height:730px;padding:28px 36px 30px}
    .game-hud{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;margin:0 10px 15px}
    .round{font-weight:1000;background:#173b31;color:#fff3b0;border-radius:999px;padding:8px 13px;white-space:nowrap}
    .progress-track{height:15px;border:3px solid #42291b;border-radius:999px;background:#d4c49a;overflow:hidden}
    .progress-fill{height:100%;width:0;background:linear-gradient(90deg,#20aa78,#92e061);transition:.35s width}
    .live-score{font-weight:1000;color:#173b31;white-space:nowrap}
    .game-layout{display:grid;grid-template-columns:minmax(390px,1.15fr) minmax(380px,.85fr);gap:22px;min-height:610px}
    .question-zone{
      display:grid;grid-template-rows:auto auto minmax(190px,1fr) auto auto;
      gap:12px;min-width:0;background:#fff9e8;border:3px solid #5d3823;border-radius:20px;padding:20px;
      box-shadow:inset 0 0 0 4px #e7c468
    }
    .proto{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;font-weight:1000;text-transform:uppercase;letter-spacing:.06em;color:#346755}
    .speaker{display:flex;align-items:center;gap:8px}
    .speaker-face{width:34px;height:34px;border-radius:50%;background:#d8893b;border:3px solid #6a341f;display:grid;place-items:center;font-size:21px}
    .statement{position:relative;background:linear-gradient(100deg,#f3d891,#fff9db 10% 90%,#e5be63);border:2px solid #8c5c27;border-radius:10px;padding:18px 22px;font-size:clamp(18px,2vw,26px);font-weight:1000;line-height:1.25;text-align:center}
    .statement:before,.statement:after{content:"";position:absolute;top:-5px;bottom:-5px;width:10px;border-radius:8px;background:#9e6528}.statement:before{left:-7px}.statement:after{right:-7px}
    .diagram{border:2px solid #b08c58;border-radius:15px;background:#fffdf6;display:grid;place-items:center;overflow:hidden;position:relative;min-height:190px}
    .diagram svg{width:100%;height:100%;max-height:280px;display:block}
    .diagram .pulse-vector{animation:vectorGlow 1.5s ease-in-out infinite}
    .diagram.solved-correct{box-shadow:inset 0 0 38px #2dc7886b}
    .diagram.solved-wrong{box-shadow:inset 0 0 38px #e04e436e}
    .hintline{font-size:13px;text-align:center;color:#6f5b46;font-weight:800;min-height:18px}
    .answer-row{display:grid;grid-template-columns:1fr 1fr;gap:15px}
    .gong-btn{
      min-height:88px;border:0;background:none;position:relative;padding:0 10px 6px;color:#fff;font-weight:1000;font-size:21px;text-shadow:0 2px #16271f;
      transition:.2s transform,.2s filter
    }
    .gong-btn .disc{position:absolute;inset:0;border:6px solid #51301d;border-radius:50%/45%;z-index:0;box-shadow:inset 0 0 0 5px #f6d96e,0 7px 0 #2e190f}
    .gong-btn.true .disc{background:radial-gradient(circle,#eaffbf 0 8%,#50cb85 9% 50%,#16775d 52%)}
    .gong-btn.false .disc{background:radial-gradient(circle,#ffe0a1 0 8%,#e65d48 9% 50%,#982b2a 52%)}
    .gong-btn span{position:relative;z-index:1}
    .gong-btn:hover:not(:disabled){transform:translateY(-3px) scale(1.02);filter:brightness(1.08)}
    .gong-btn:active:not(:disabled){transform:translateY(5px)}
    .gong-btn.used{animation:gongHit .48s ease-out}
    .gong-btn.correct .disc{box-shadow:0 0 0 10px #79e9b244,0 0 30px #39cf8e,inset 0 0 0 5px #fff9a9}
    .gong-btn.wrong .disc{box-shadow:0 0 0 10px #ee594e36,0 0 30px #e33d34,inset 0 0 0 5px #ffd98f}
    .arena{
      position:relative;border:3px solid #4b2c1c;border-radius:20px;overflow:hidden;
      background:
        radial-gradient(circle at 50% 18%,#fff2a6 0 5%,transparent 28%),
        linear-gradient(#93d3b8 0 47%,#d7ad61 48% 52%,#8b542d 53% 100%);
      box-shadow:inset 0 0 0 5px #e9c060
    }
    .arena:before{content:"";position:absolute;left:0;right:0;bottom:0;height:43%;background:repeating-linear-gradient(90deg,#8c512b 0 58px,#6d3c22 59px 62px);transform:perspective(250px) rotateX(14deg);transform-origin:bottom}
    .arena-roof{position:absolute;left:-5%;right:-5%;top:0;height:96px;background:linear-gradient(165deg,transparent 42%,#5b2319 43% 60%,transparent 61%) 0 0/120px 100%,linear-gradient(195deg,transparent 42%,#762f20 43% 60%,transparent 61%) 60px 0/120px 100%;filter:drop-shadow(0 8px 0 #3f1d16)}
    .arena .panda{--s:.98;position:absolute;left:calc(50% - 115px);bottom:42px}
    .arena .panda.hit-true{animation:pandaHitTrue .68s ease}
    .arena .panda.hit-false{animation:pandaHitFalse .68s ease}
    .arena .panda.stumble{animation:pandaStumble .75s ease}
    .arena .panda.celebrate{animation:pandaCelebrate .75s ease}
    .arena .gong-post{position:absolute;top:145px;width:120px;height:120px;border-radius:50%;border:7px solid #4a2b1b;box-shadow:0 6px 0 #2b170f,0 0 19px #ffd972}
    .arena .gong-post.true{left:18px;background:radial-gradient(circle,#efffbd 0 10%,#43c685 11% 54%,#11694f 55%)}
    .arena .gong-post.false{right:18px;background:radial-gradient(circle,#fff1ad 0 10%,#db5945 11% 54%,#94292a 55%)}
    .arena .gong-post:after{content:"";position:absolute;left:48px;top:116px;width:12px;height:210px;background:#482719;z-index:-1}
    .coach-strip{position:absolute;left:15px;right:15px;bottom:9px;height:82px;display:flex;justify-content:space-around;align-items:end;z-index:6}
    .coach-strip .mentor{transform:scale(.58);transform-origin:center bottom;margin:0 -14px}
    .speech{position:absolute;left:15px;right:15px;top:102px;z-index:7;transform:translateY(-10px);opacity:0;transition:.25s;background:#fffce8;border:3px solid #47291b;border-radius:18px;padding:12px 15px;text-align:center;font-weight:1000;box-shadow:0 8px 0 #47291b}
    .speech:after{content:"";position:absolute;left:48%;bottom:-16px;border:9px solid transparent;border-top-color:#47291b}
    .speech.show{transform:none;opacity:1}
    .feedback{
      position:absolute;left:16px;right:16px;bottom:102px;z-index:8;border-radius:14px;padding:13px 15px;
      font-size:14px;font-weight:900;line-height:1.35;opacity:0;transform:translateY(8px);transition:.25s
    }
    .feedback.show{opacity:1;transform:none}
    .feedback.ok{background:#e6ffdf;border:3px solid #13805b}.feedback.no{background:#fff0d8;border:3px solid #c84b3d}
    .feedback b{display:block;font-size:17px;margin-bottom:3px}
    .next-btn{margin-top:8px;width:100%;padding:9px;border:0;border-radius:10px;background:#173b31;color:#fff;font-weight:1000}
    .jade-tiles{display:grid;grid-template-columns:repeat(15,1fr);gap:6px;margin:4px 10px 0}
    .tile{height:10px;border-radius:5px;background:#b9a87b;border:1px solid #59422d;transition:.3s}
    .tile.current{background:#ffe26d;box-shadow:0 0 11px #ffd02f}.tile.good{background:#35cf8e;box-shadow:0 0 8px #36d594}.tile.bad{background:#d95846}
    .final-screen{text-align:center;grid-template-columns:1fr .9fr}
    .final-screen .scroll{max-width:620px;margin:auto}
    .score-ring{width:190px;height:190px;border-radius:50%;display:grid;place-items:center;margin:18px auto;position:relative;border:5px solid #4d2e1d;box-shadow:0 10px 0 #4d2e1d}
    .score-ring:before{content:"";position:absolute;inset:22px;border-radius:50%;background:#fff8df;border:3px solid #65442d}
    .score-ring b{font-size:47px;position:relative}
    .final-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:17px 0}
    .final-stat{border:2px solid #926735;background:#fff9;border-radius:12px;padding:12px}.final-stat b{font-size:23px;display:block;margin-top:4px}
    .save-status{font-weight:1000;min-height:24px;margin:15px 0}.save-status.ok{color:#087c58}.save-status.bad{color:#a63b32}
    .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
    .dragon-scroll{position:relative;min-height:510px;display:grid;place-items:center}
    .dragon-disc{width:350px;height:350px;border-radius:50%;background:conic-gradient(from 30deg,#44c994,#1e6e59,#f4d46c,#44c994);border:12px solid #4e2d1b;box-shadow:0 20px 0 #31180f,0 0 45px #8bf5c0;display:grid;place-items:center;animation:discFloat 3s ease-in-out infinite}
    .dragon-disc .panda{--s:.68;margin-top:35px}
    .confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
    .confetti i{position:absolute;top:-20px;width:10px;height:18px;background:var(--c);left:var(--x);animation:fall var(--d) linear infinite;animation-delay:var(--delay);transform:rotate(var(--r))}
    .hidden{display:none!important}
    @keyframes mist{to{background-position:190px 0,320px 16px}}
    @keyframes pulse{50%{transform:scale(1.05);filter:brightness(1.1)}}
    @keyframes pandaBreathe{50%{transform:scale(var(--s)) translateY(-5px) rotate(1deg)}}
    @keyframes mentorBob{50%{translate:0 -5px}}
    @keyframes vectorGlow{50%{filter:drop-shadow(0 0 5px #22be83);opacity:.65}}
    @keyframes gongHit{35%{transform:scale(1.08) rotate(2deg)}70%{transform:scale(.96) rotate(-2deg)}}
    @keyframes pandaHitTrue{35%{transform:translateX(-115px) rotate(-12deg) scale(.98)}65%{transform:translateX(-96px) rotate(6deg) scale(.98)}}
    @keyframes pandaHitFalse{35%{transform:translateX(115px) rotate(12deg) scale(.98)}65%{transform:translateX(96px) rotate(-6deg) scale(.98)}}

<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">☯</span><span>НЕФРИТОВЫЙ ДВОРЕЦ · ЕГЭ №2</span></div>
    <div class="student-box" id="studentBox">
      <span>Ученик: <b id="studentName"></b></span>
      <button class="tiny-btn" id="switchBtn">Сменить ученика</button>
      <button class="tiny-btn sound-btn" id="soundBtn" aria-label="Звуки">🔊</button>
    </div>
  </header>
  <main class="stage" id="app"></main>
  <script>
  'use strict';

  const API_URL='https://script.google.com/macros/s/AKfycbw6iYfojO8VgkHU63peD2vWLybGyDm9AsYZ6TaLA_EFD4j56nQlY5SqpRANPVeTwVsj/exec';
  const TEST_META={
    testId:'EGE-02-JADE-PALACE-TRUE-FALSE-15',
    topicId:'task-02',
    topicName:'Векторы',
    taskNumber:2,
    schemaVersion:1
  };
  const TOTAL=15,PENDING_KEY='egePendingTestResults',$=id=>document.getElementById(id);
  let student=null,questions=[],index=0,firstTryCorrect=0,questionAttempted=false,questionResolved=false;
  let startedAt=0,attemptEventId='',resultSubmitted=false,gameActive=false,muted=false,roundResults=[];

  function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
  function pick(a){return a[Math.floor(Math.random()*a.length)]}
  function ri(min,max){return Math.floor(Math.random()*(max-min+1))+min}
  function signed(n){return n<0?'−'+Math.abs(n):String(n)}
  function uuid(){if(window.crypto&&typeof crypto.randomUUID==='function')return crypto.randomUUID();return'evt-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)+'-'+Math.random().toString(36).slice(2)}
  function localDate(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  function duration(){return Math.max(1,Math.round((Date.now()-startedAt)/1000))}
  function timeText(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}

  function pandaModel(extra=''){
    return `<div class="panda ${extra}" id="${extra==='arena-panda'?'arenaPanda':''}" aria-label="Панда-воин">
      <i class="ear l"></i><i class="ear r"></i>
      <div class="head"><i class="eye-patch l"><i></i></i><i class="eye-patch r"><i></i></i><i class="snout"><i class="nose"></i><i class="smile"></i></i></div>
      <i class="arm l"></i><i class="arm r"></i><i class="leg l"></i><i class="leg r"></i>
      <div class="body"></div><div class="pants"><i class="belt"></i></div>
    </div>`
  }
  function mentor(type,label){
    return `<div class="mentor ${type}" title="${label}" aria-label="${label}"><i class="m-body"></i><i class="m-head"></i><i class="m-mark"></i></div>`
  }
  function mentorRow(cls='mentor-row'){
    return `<div class="${cls}">${mentor('shifu','Мастер Шифу')}${mentor('tiger','Тигрица')}${mentor('monkey','Обезьяна')}${mentor('crane','Журавль')}${mentor('mantis','Богомол')}${mentor('viper','Гадюка')}</div>`
  }
  function heroYard(){
    return `<div class="hero-yard"><i class="sun"></i><i class="mountains"></i><i class="gong-mini"></i>${pandaModel()}${mentorRow()}</div>`
  }

  function gridSvg(vectors=[],opts={}){
    const W=520,H=240,cx=260,cy=120,scale=22,id='arr'+Math.random().toString(36).slice(2);
    const lines=[];
    for(let x=18;x<W;x+=scale)lines.push(`<path d="M${x} 0V${H}"/>`);
    for(let y=10;y<H;y+=scale)lines.push(`<path d="M0 ${y}H${W}"/>`);
    const arrows=vectors.map((v,i)=>{
      const from=v.from||[0,0],to=v.to||[v.x,v.y],x1=cx+from[0]*scale,y1=cy-from[1]*scale,x2=cx+to[0]*scale,y2=cy-to[1]*scale;
      return `<g class="pulse-vector"><path d="M${x1} ${y1}L${x2} ${y2}" stroke="${v.color||['#e34b3f','#168c6b','#e9aa2d'][i%3]}" stroke-width="7" marker-end="url(#${id}${i})"/><text x="${(x1+x2)/2+8}" y="${(y1+y2)/2-8}" fill="#162a23" font-size="22" font-weight="900">${v.label||''}</text></g>
      <defs><marker id="${id}${i}" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="${v.color||['#e34b3f','#168c6b','#e9aa2d'][i%3]}"/></marker></defs>`;
    }).join('');
    const angle=opts.angle?`<path d="M${cx+48} ${cy}A48 48 0 0 0 ${cx+34} ${cy-34}" fill="none" stroke="#b47419" stroke-width="5"/><text x="${cx+47}" y="${cy-27}" font-size="18" font-weight="900">α</text>`:'';
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Координатная плоскость с векторами"><g stroke="#7f9b8e45" stroke-width="1">${lines.join('')}</g><path d="M15 ${cy}H505M${cx} 10V230" stroke="#253f35" stroke-width="3"/><path d="M500 ${cy-6}l10 6-10 6M${cx-6} 16l6-10 6 10" fill="none" stroke="#253f35" stroke-width="3"/>${angle}${arrows}</svg>`
  }
  function formulaSvg(main,sub){
    return `<svg viewBox="0 0 520 240" role="img" aria-label="Формула"><defs><radialGradient id="jade"><stop stop-color="#e4ffca"/><stop offset="1" stop-color="#3fbd84"/></radialGradient></defs><circle cx="260" cy="120" r="92" fill="url(#jade)" stroke="#2b5b49" stroke-width="7"/><circle cx="260" cy="120" r="112" fill="none" stroke="#e0b64b" stroke-width="9" stroke-dasharray="12 9" class="pulse-vector"/><text x="260" y="112" text-anchor="middle" font-size="30" font-weight="1000" fill="#17372c">${main}</text><text x="260" y="151" text-anchor="middle" font-size="19" font-weight="900" fill="#24483b">${sub||''}</text></svg>`
  }
  function triangleSvg(x,y){
    return `<svg viewBox="0 0 520 240" role="img" aria-label="Прямоугольный треугольник длины вектора"><defs><marker id="triarr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#d84b3d"/></marker></defs><path d="M125 188H405V42Z" fill="#52c99528" stroke="#315847" stroke-width="5"/><path d="M125 188L405 42" stroke="#d84b3d" stroke-width="8" marker-end="url(#triarr)" class="pulse-vector"/><path d="M385 188v-20h20" fill="none" stroke="#315847" stroke-width="4"/><text x="265" y="217" font-size="22" text-anchor="middle" font-weight="900">${x}</text><text x="425" y="120" font-size="22" font-weight="900">${y}</text><text x="245" y="96" font-size="25" font-weight="1000">|a|</text></svg>`
  }
  function diagramFor(q){
    if(q.diagram==='length')return triangleSvg(q.data.x,q.data.y);
    if(q.diagram==='formula')return formulaSvg(q.data.main,q.data.sub);
    if(q.diagram==='angle')return gridSvg(q.data.vectors,{angle:true});
    return gridSvg(q.data.vectors||[]);
  }

  function bank(){
    const a=ri(2,5),b=ri(2,5),x=ri(2,4),y=ri(2,4);
    return [
      {p:1,title:'Координаты и операции',truth:true,text:`Координаты вектора <i>AB</i> находятся как «конец минус начало»: <b>(${signed(b)}−${signed(a)}; ${signed(-y)}−${signed(x)})</b>.`,explain:'Для AB всегда вычитаем координаты точки A из координат точки B.',diagram:'grid',data:{vectors:[{from:[a,x],to:[b,-y],label:'AB'}]}},
      {p:1,title:'Координаты и операции',truth:false,text:'Чтобы найти координаты вектора <i>AB</i>, нужно из координат точки <i>A</i> вычесть координаты точки <i>B</i>.',explain:'Наоборот: AB = B − A. Начало вычитаем из конца.',diagram:'grid',data:{vectors:[{from:[-3,-2],to:[3,3],label:'AB'}]}},
      {p:1,title:'Координаты и операции',truth:true,text:`Если <i>a</i> = (${a}; ${-b}) и <i>b</i> = (${x}; ${y}), то координаты <i>a</i> + <i>b</i> складываются по компонентам.`,explain:'Складываем отдельно x-координаты и отдельно y-координаты.',diagram:'grid',data:{vectors:[{x:a,y:-b,label:'a'},{x:x,y:y,label:'b'}]}},
      {p:1,title:'Координаты и операции',truth:false,text:'При умножении вектора на число умножается только его первая координата.',explain:'На число умножается каждая координата вектора.',diagram:'formula',data:{main:'k(aₓ; aᵧ)',sub:'= (kaₓ; kaᵧ)'}},
      {p:1,title:'Координаты и операции',truth:true,text:'Если перенести вектор параллельно самому себе, не меняя длину и направление, его координаты не изменятся.',explain:'Координаты вектора задают его смещение, а не положение на плоскости.',diagram:'grid',data:{vectors:[{from:[-4,-3],to:[-1,1],label:'a'},{from:[1,-2],to:[4,2],label:'a'}]}},
      {p:1,title:'Координаты и операции',truth:false,text:'У противоположных векторов совпадают обе координаты.',explain:'У противоположного вектора обе координаты меняют знак.',diagram:'grid',data:{vectors:[{x:4,y:2,label:'a'},{x:-4,y:-2,label:'−a'}]}},

      {p:2,title:'Длина вектора',truth:true,text:'Длина вектора <i>a</i> = (aₓ; aᵧ) вычисляется по формуле √(aₓ² + aᵧ²).',explain:'Координаты являются катетами, а длина вектора — гипотенузой.',diagram:'length',data:{x:3,y:4}},
      {p:2,title:'Длина вектора',truth:false,text:'Длина вектора (3; 4) равна 3 + 4 = 7.',explain:'Нужно применить теорему Пифагора: √(3² + 4²) = 5.',diagram:'length',data:{x:3,y:4}},
      {p:2,title:'Длина вектора',truth:true,text:'Длина любого вектора неотрицательна, а у нулевого вектора она равна нулю.',explain:'Длина — это расстояние, поэтому отрицательной она быть не может.',diagram:'formula',data:{main:'|a| ≥ 0',sub:'|a| = 0 ⇔ a = 0'}},
      {p:2,title:'Длина вектора',truth:false,text:'Для любого числа k верно равенство |k·a| = k·|a|.',explain:'Правильно: |k·a| = |k|·|a|. При отрицательном k нужен модуль.',diagram:'formula',data:{main:'|k·a|',sub:'= |k|·|a|'}},
      {p:2,title:'Длина вектора',truth:false,text:'Для любых векторов всегда выполняется |a + b| = |a| + |b|.',explain:'Обычно действует только неравенство треугольника. Равенство бывает не всегда.',diagram:'grid',data:{vectors:[{x:4,y:0,label:'a'},{x:0,y:3,label:'b'},{x:4,y:3,label:'a+b'}]}},
      {p:2,title:'Длина вектора',truth:true,text:'У векторов (3; 4) и (−3; −4) одинаковая длина.',explain:'При возведении координат в квадрат знаки исчезают: обе длины равны 5.',diagram:'grid',data:{vectors:[{x:3,y:4,label:'a'},{x:-3,y:-4,label:'−a'}]}},

      {p:3,title:'Скалярное произведение',truth:true,text:'Скалярное произведение по координатам равно aₓbₓ + aᵧbᵧ.',explain:'Перемножаем соответствующие координаты и складываем результаты.',diagram:'formula',data:{main:'a · b',sub:'= aₓbₓ + aᵧbᵧ'}},
      {p:3,title:'Скалярное произведение',truth:false,text:'Скалярное произведение двух векторов всегда положительно.',explain:'Оно положительно для острого угла, равно нулю для 90° и отрицательно для тупого.',diagram:'angle',data:{vectors:[{x:4,y:1,label:'a'},{x:-2,y:4,label:'b'}]}},
      {p:3,title:'Скалярное произведение',truth:true,text:'Если ненулевые векторы перпендикулярны, их скалярное произведение равно нулю.',explain:'При угле 90° имеем cos 90° = 0, поэтому a·b = 0.',diagram:'grid',data:{vectors:[{x:4,y:0,label:'a'},{x:0,y:4,label:'b'}]}},
      {p:3,title:'Скалярное произведение',truth:false,text:'Для любого вектора выполняется a · a = |a|.',explain:'Правильно: a · a = |a|².',diagram:'formula',data:{main:'a · a',sub:'= |a|²'}},
      {p:3,title:'Скалярное произведение',truth:true,text:'Скалярное произведение распределяется относительно сложения: a·(b+c) = a·b + a·c.',explain:'Это распределительное свойство позволяет раскрывать скобки.',diagram:'formula',data:{main:'a·(b+c)',sub:'= a·b + a·c'}},
      {p:3,title:'Скалярное произведение',truth:false,text:'Если угол между ненулевыми векторами тупой, их скалярное произведение положительно.',explain:'Косинус тупого угла отрицателен, поэтому и скалярное произведение отрицательно.',diagram:'angle',data:{vectors:[{x:4,y:1,label:'a'},{x:-4,y:2,label:'b'}]}},

      {p:4,title:'Векторы на рисунке',truth:true,text:'На координатной сетке координаты вектора определяются смещением от его начала к концу.',explain:'Считаем движение по x и по y с учётом направления стрелки.',diagram:'grid',data:{vectors:[{from:[-3,-2],to:[2,3],label:'a'}]}},
      {p:4,title:'Векторы на рисунке',truth:false,text:'Если стрелка направлена влево и вверх, обе координаты вектора отрицательны.',explain:'Влево означает x < 0, а вверх означает y > 0.',diagram:'grid',data:{vectors:[{from:[3,-2],to:[-2,3],label:'a'}]}},
      {p:4,title:'Векторы на рисунке',truth:true,text:'При смене направления стрелки на противоположное обе координаты вектора меняют знак.',explain:'Вектор BA противоположен вектору AB: BA = −AB.',diagram:'grid',data:{vectors:[{from:[-3,-2],to:[3,2],label:'AB'},{from:[3,2],to:[-3,-2],label:'BA'}]}},
      {p:4,title:'Векторы на рисунке',truth:false,text:'Координаты вектора на рисунке равны координатам точки, в которой находится наконечник стрелки.',explain:'Это верно только при начале в начале координат. В общем случае нужен «конец минус начало».',diagram:'grid',data:{vectors:[{from:[-3,-2],to:[2,3],label:'a'}]}},
      {p:4,title:'Векторы на рисунке',truth:true,text:'Два одинаково направленных и равных по длине вектора имеют одинаковые координаты, даже если нарисованы в разных местах.',explain:'Положение вектора не влияет на его координаты.',diagram:'grid',data:{vectors:[{from:[-4,-3],to:[-1,1],label:'a'},{from:[1,-2],to:[4,2],label:'b'}]}},
      {p:4,title:'Векторы на рисунке',truth:false,text:'Если вектор на клетчатом рисунке стал в два раза длиннее в том же направлении, его координаты не изменились.',explain:'При растяжении в два раза обе координаты также умножаются на 2.',diagram:'grid',data:{vectors:[{x:2,y:1,label:'a'},{x:4,y:2,label:'2a'}]}},

      {p:5,title:'Угол и рисунок',truth:true,text:'Перенос векторов к общему началу не изменяет угол между ними.',explain:'Параллельный перенос сохраняет длину и направление каждого вектора.',diagram:'angle',data:{vectors:[{x:4,y:0,label:'a'},{x:3,y:3,label:'b'}]}},
      {p:5,title:'Угол и рисунок',truth:false,text:'Если векторы направлены в противоположные стороны, косинус угла между ними равен 1.',explain:'Между ними 180°, поэтому cos 180° = −1.',diagram:'grid',data:{vectors:[{x:4,y:0,label:'a'},{x:-4,y:0,label:'b'}]}},
      {p:5,title:'Угол и рисунок',truth:true,text:'Положительное скалярное произведение ненулевых векторов означает, что угол между ними острый.',explain:'Знак произведения совпадает со знаком косинуса угла.',diagram:'angle',data:{vectors:[{x:4,y:0,label:'a'},{x:3,y:3,label:'b'}]}},
      {p:5,title:'Угол и рисунок',truth:false,text:'Чтобы найти угол между векторами на рисунке, обязательно нужно сохранить точки их начала на прежних местах.',explain:'Векторы можно параллельно перенести к общей точке — угол не изменится.',diagram:'grid',data:{vectors:[{from:[-4,-3],to:[-1,0],label:'a'},{from:[2,-2],to:[2,2],label:'b'}]}},
      {p:5,title:'Угол и рисунок',truth:true,text:'Если a·b = −|a||b| для ненулевых векторов, то они направлены противоположно.',explain:'Тогда cos α = −1, значит α = 180°.',diagram:'formula',data:{main:'a·b = −|a||b|',sub:'α = 180°'}},
      {p:5,title:'Угол и рисунок',truth:false,text:'Если скалярное произведение равно нулю, то хотя бы один из векторов обязательно нулевой.',explain:'Два ненулевых перпендикулярных вектора также имеют скалярное произведение 0.',diagram:'grid',data:{vectors:[{x:4,y:0,label:'a'},{x:0,y:4,label:'b'}]}}
    ];
  }
  function buildQuestions(){
    const all=bank(),selected=[];
    for(let p=1;p<=5;p++){
      const group=shuffle(all.filter(q=>q.p===p)),truth=group.find(q=>q.truth),lie=group.find(q=>!q.truth);
      const third=group.find(q=>q!==truth&&q!==lie);
      selected.push(truth,lie,third);
    }
    let set=shuffle(selected),trueCount=set.filter(q=>q.truth).length;
    if(trueCount<7||trueCount>8){
      const target=trueCount<7,trueBank=shuffle(all.filter(q=>q.truth===target&&!set.includes(q)));
      for(let i=0;i<set.length&&(trueCount<7||trueCount>8);i++){
        const replacement=trueBank.find(q=>q.p===set[i].p);
        if(replacement&&set[i].truth!==target){set[i]=replacement;trueCount+=target?1:-1}
      }
    }
    return set;
  }

  function storedStudent(){const studentId=localStorage.getItem('egeStudentId');return studentId?{studentId,name:localStorage.getItem('egeStudentName')||'Ученик',code:localStorage.getItem('egeStudentCode')||''}:null}
  function saveStudent(s){localStorage.setItem('egeStudentId',s.studentId);localStorage.setItem('egeStudentName',s.name);localStorage.setItem('egeStudentCode',s.code)}
  function parseStudent(data,code){
    const src=(data&&(data.student||data.data))||data||{},studentId=src.studentId||src.id||(data&&data.studentId),name=src.studentName||src.name||src.fullName||(data&&(data.studentName||data.name));
    const bad=data&&(data.success===false||data.valid===false||data.ok===false);
    if(bad||!studentId)throw new Error((data&&(data.message||data.error))||'Личный код не найден');
    return{studentId:String(studentId),name:String(name||'Ученик'),code:String(code)}
  }
  function validateStudent(code){
    return new Promise((resolve,reject)=>{
      const cb='egeValidate_'+Date.now()+'_'+Math.random().toString(36).slice(2),s=document.createElement('script');let done=false;
      const clean=()=>{delete window[cb];s.remove()};
      const timer=setTimeout(()=>{if(done)return;done=true;clean();reject(new Error('Сервер не ответил. Проверь интернет'))},12000);
      window[cb]=data=>{if(done)return;done=true;clearTimeout(timer);clean();try{resolve(parseStudent(data,code))}catch(e){reject(e)}};
      s.onerror=()=>{if(done)return;done=true;clearTimeout(timer);clean();reject(new Error('Не удалось проверить код'))};
      s.src=API_URL+'?'+new URLSearchParams({action:'validateStudent',code,callback:cb}).toString();
      document.head.appendChild(s)
    })
  }
  function updateStudent(){
    const box=$('studentBox');box.style.display=student?'flex':'none';
    if(student)$('studentName').textContent=student.name;
    $('switchBtn').disabled=gameActive
  }
  function readQueue(){try{const q=JSON.parse(localStorage.getItem(PENDING_KEY)||'[]');return Array.isArray(q)?q:[]}catch(_){return[]}}
  function writeQueue(q){localStorage.setItem(PENDING_KEY,JSON.stringify(q))}
  function queueResult(p){const q=readQueue();if(!q.some(x=>x&&x.eventId===p.eventId))q.push(p);writeQueue(q)}
  function removeQueued(id){writeQueue(readQueue().filter(x=>!x||x.eventId!==id))}
  async function postResult(p){
    const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p),redirect:'follow'});
    if(!r.ok)throw new Error('submit')
  }
  async function flushPending(){
    if(!navigator.onLine)return;
    const queue=readQueue();
    for(const p of queue){
      if(!p||!p.eventId)continue;
      try{await postResult(p);removeQueued(p.eventId)}catch(_){}
    }
  }
  function setSave(cls,text){const e=$('saveStatus');if(e){e.className='save-status '+cls;e.textContent=text}}
  async function submitOnce(scorePercent,durationSeconds){
    if(resultSubmitted||!student)return;
    resultSubmitted=true;
    const payload={
      action:'submitTest',
      eventId:attemptEventId,
      studentId:student.studentId,
      testId:TEST_META.testId,
      testDate:localDate(),
      topicId:TEST_META.topicId,
      topicName:TEST_META.topicName,
      taskNumber:TEST_META.taskNumber,
      scorePercent,
      durationSeconds,
      schemaVersion:TEST_META.schemaVersion
    };
    setSave('','Сохраняем результат…');
    try{
      if(!navigator.onLine)throw new Error('offline');
      await postResult(payload);removeQueued(payload.eventId);setSave('ok','✓ Результат сохранён')
    }catch(_){
      queueResult(payload);setSave('bad','Нет связи: результат сохранён на устройстве и отправится позже')
    }
  }

  function renderLogin(prefill=''){
    gameActive=false;student=null;updateStudent();
    $('app').innerHTML=`<section class="screen login-screen">
      <div class="scroll"><span class="eyebrow">Допуск во дворец</span><h1>Турнир истины</h1>
        <p class="lead">Введи личный код ученика. Имя загрузится автоматически — вводить его не нужно.</p>
        <form class="code-form" id="loginForm">
          <input class="code-input" id="codeInput" maxlength="40" autocomplete="one-time-code" placeholder="ЛИЧНЫЙ КОД" value="${esc(prefill)}">
          <button class="primary" id="loginBtn">Проверить код</button><div class="status" id="loginStatus"></div>
        </form>
      </div>${heroYard()}</section>`;
    $('loginForm').addEventListener('submit',handleLogin);
    if(prefill)setTimeout(()=>$('loginForm').requestSubmit(),0)
  }
  async function handleLogin(e){
    e.preventDefault();const input=$('codeInput'),btn=$('loginBtn'),status=$('loginStatus'),code=input.value.trim();
    if(!code){status.className='status bad';status.textContent='Введи личный код';return}
    input.disabled=btn.disabled=true;status.textContent='Мастер проверяет код…';
    try{student=await validateStudent(code);saveStudent(student);updateStudent();await flushPending();renderStart()}
    catch(err){status.className='status bad';status.textContent=err.message||'Код не подтверждён';input.disabled=btn.disabled=false;input.focus()}
  }
  function changeStudent(){
    if(gameActive)return;
    ['egeStudentId','egeStudentName','egeStudentCode'].forEach(k=>localStorage.removeItem(k));
    renderLogin()
  }
  function renderStart(){
    gameActive=false;updateStudent();
    $('app').innerHTML=`<section class="screen start-screen">
      <div class="scroll"><span class="eyebrow">ЕГЭ №2 · Векторы</span><h1>Испытание Дракона</h1>
        <p class="lead">Пятнадцать свитков проверят теорию пяти прототипов. Выбирай гонг «Верно» или «Неверно» и зажги все нефритовые плитки.</p>
        <div class="rules">
          <div class="rule"><b>15</b>утверждений</div><div class="rule"><b>5</b>прототипов</div><div class="rule"><b>∞</b>без таймера</div>
        </div>
        <p><b>Важно:</b> успешность считается только по первому удару. После ошибки нужно ударить по правильному гонгу, но балл за свиток уже не начисляется.</p>
        <button class="primary" id="startBtn">Начать турнир</button>
      </div>${heroYard()}</section>`;
    $('startBtn').addEventListener('click',startGame)
  }
  function startGame(){
    questions=buildQuestions();index=0;firstTryCorrect=0;questionAttempted=false;questionResolved=false;
    startedAt=Date.now();attemptEventId=uuid();resultSubmitted=false;roundResults=[];
    gameActive=true;updateStudent();sound('start');renderQuestion()
  }
  function tiles(){
    return Array.from({length:TOTAL},(_,i)=>`<i class="tile ${roundResults[i]===true?'good':roundResults[i]===false?'bad':i===index?'current':''}"></i>`).join('')
  }
  function renderQuestion(){
    questionAttempted=false;questionResolved=false;const q=questions[index];
    $('app').innerHTML=`<section class="screen game-screen">
      <div class="game-hud"><span class="round">Свиток ${index+1} / ${TOTAL}</span><div class="progress-track"><div class="progress-fill" style="width:${index/TOTAL*100}%"></div></div><span class="live-score">Сразу верно: <b id="liveScore">${firstTryCorrect}</b></span></div>
      <div class="game-layout">
        <section class="question-zone">
          <div class="proto"><span>Прототип ${q.p} · ${q.title}</span><span class="speaker"><i class="speaker-face">${['🐾','🐯','🐒','🕊️','🐍'][q.p-1]}</i>Утверждение мастера</span></div>
          <div class="statement">${q.text}</div>
          <div class="diagram" id="diagram">${diagramFor(q)}</div>
          <div class="hintline" id="hintline">Выбери один гонг. Первый удар определяет балл.</div>
          <div class="answer-row">
            <button class="gong-btn true" data-answer="true"><i class="disc"></i><span>✓ ВЕРНО</span></button>
            <button class="gong-btn false" data-answer="false"><i class="disc"></i><span>✕ НЕВЕРНО</span></button>
          </div>
        </section>
        <aside class="arena">
          <i class="arena-roof"></i><i class="gong-post true"></i><i class="gong-post false"></i>
          <div class="speech" id="speech">Слушай формулу, а не интуицию!</div>
          ${pandaModel('arena-panda')}
          <div class="feedback" id="feedback"></div>${mentorRow('coach-strip')}
        </aside>
      </div><div class="jade-tiles">${tiles()}</div>
    </section>`;
    document.querySelectorAll('.gong-btn').forEach(b=>b.addEventListener('click',()=>choose(b.dataset.answer==='true',b)))
  }
  function registerChoice(isCorrect){
    const first=!questionAttempted;
    questionAttempted=true;
    if(isCorrect&&first)firstTryCorrect++;
    if(isCorrect)questionResolved=true;
    return{first,scored:isCorrect&&first}
  }
  function choose(value,button){
    if(questionResolved)return;
    const q=questions[index],ok=value===q.truth,panda=$('arenaPanda'),speech=$('speech'),feedback=$('feedback'),diagram=$('diagram');
    const attempt=registerChoice(ok),first=attempt.first;
    button.classList.remove('used');void button.offsetWidth;button.classList.add('used');
    panda.classList.remove('hit-true','hit-false','stumble','celebrate');void panda.offsetWidth;panda.classList.add(value?'hit-true':'hit-false');
    sound('gong');
    if(ok){
      button.classList.add('correct');
      document.querySelectorAll('.gong-btn').forEach(b=>b.disabled=true);
      roundResults[index]=attempt.scored;
      $('liveScore').textContent=firstTryCorrect;diagram.classList.add('solved-correct');
      setTimeout(()=>{panda.classList.add('celebrate');speech.textContent=first?'Отличный удар с первой попытки!':'Теперь техника верная!';speech.classList.add('show');sound('good')},340);
      feedback.className='feedback show ok';
      feedback.innerHTML=`<b>${first?'✓ Верно с первой попытки':'✓ Свиток пройден после исправления'}</b>${q.explain}<button class="next-btn" id="nextBtn">${index===TOTAL-1?'Открыть Свиток Дракона':'Следующий свиток →'}</button>`;
      $('nextBtn').addEventListener('click',nextQuestion)
    }else{
      button.disabled=true;button.classList.add('wrong');roundResults[index]=false;diagram.classList.add('solved-wrong');
      setTimeout(()=>{panda.classList.add('stumble');speech.textContent=q.truth?'Мастер говорит: это всё-таки верно!':'Мастер говорит: это всё-таки неверно!';speech.classList.add('show');sound('bad')},340);
      feedback.className='feedback show no';
      feedback.innerHTML=`<b>✕ Первый удар неверный</b>${q.explain}<br><strong>Теперь нажми правильный гонг, чтобы завершить свиток.</strong>`;
      $('hintline').textContent='Бал за этот свиток уже не начисляется, но решение нужно завершить.'
    }
  }
  function nextQuestion(){index++;if(index>=TOTAL)finish();else renderQuestion()}
  function confetti(){
    return `<div class="confetti">${Array.from({length:32},(_,i)=>`<i style="--x:${ri(2,98)}%;--d:${ri(4,8)}s;--delay:-${ri(0,8)}s;--r:${ri(0,180)}deg;--c:${pick(['#45d49f','#ffd76a','#db4b3f','#f5f0d0'])}"></i>`).join('')}</div>`
  }
  function finish(){
    gameActive=false;updateStudent();const seconds=duration(),score=Math.round(firstTryCorrect/TOTAL*100);
    $('app').innerHTML=`<section class="screen final-screen">${confetti()}
      <div class="scroll"><span class="eyebrow">Турнир завершён</span><h1>${score>=87?'Воин Дракона!':score>=67?'Крепкая техника!':'Шифу зовёт на тренировку'}</h1>
        <div class="score-ring" style="background:conic-gradient(#35c98c ${score}%,#d7c89c 0)"><b>${score}%</b></div>
        <p><b>Успешность с первой попытки</b></p>
        <div class="final-stats"><div class="final-stat">Верно сразу<b>${firstTryCorrect} из ${TOTAL}</b></div><div class="final-stat">Время прохождения<b>${timeText(seconds)}</b></div></div>
        <div class="save-status" id="saveStatus">Сохраняем результат…</div>
        <div class="actions"><button class="primary" id="againBtn">Пройти ещё раз</button><button class="secondary" id="homeBtn">На старт</button></div>
      </div><div class="dragon-scroll"><div class="dragon-disc">${pandaModel()}</div>${mentorRow()}</div>
    </section>`;
    $('againBtn').addEventListener('click',startGame);$('homeBtn').addEventListener('click',renderStart);
    sound('finish');submitOnce(score,seconds)
  }
  function sound(type){
    if(muted)return;
    try{
      const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
      const ac=sound.ac||(sound.ac=new AC()),now=ac.currentTime,g=ac.createGain();g.connect(ac.destination);
      const tones=type==='gong'?[[180,.8,'sine'],[273,.65,'sine'],[421,.4,'triangle']]:type==='bad'?[[170,.23,'sawtooth'],[90,.35,'square']]:type==='finish'?[[330,.25,'triangle'],[440,.38,'triangle'],[660,.65,'sine']]:type==='start'?[[220,.18,'triangle'],[440,.35,'triangle']]:[[520,.17,'sine'],[780,.35,'triangle']];
      g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(type==='gong'?.075:.045,now+.015);g.gain.exponentialRampToValueAtTime(.0001,now+Math.max(...tones.map(t=>t[1]))+.1);
      tones.forEach(([f,d,w],i)=>{const o=ac.createOscillator();o.type=w;o.frequency.setValueAtTime(f,now+i*.035);o.frequency.exponentialRampToValueAtTime(f*.82,now+d);o.connect(g);o.start(now+i*.035);o.stop(now+d+.1)})
    }catch(_){}
  }
  $('switchBtn').addEventListener('click',changeStudent);
  $('soundBtn').addEventListener('click',()=>{muted=!muted;$('soundBtn').textContent=muted?'🔇':'🔊'});
  window.addEventListener('online',flushPending);
  async function init(){
    const code=new URLSearchParams(location.search).get('code');
    if(code){renderLogin(code);return}
    student=storedStudent();
    if(student){updateStudent();await flushPending();renderStart()}else renderLogin()
  }
  init();
  </script>
</body>
</html>
