<style>
:root{--ink:#262211;--cream:#fff8d9;--line:#423b1d;--red:#d62929;--yellow:#ffd229;--green:#70b84a;--ok:#42bd50;--bad:#e94338}
*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{font-family:Trebuchet MS,Arial,sans-serif;color:var(--ink);background:linear-gradient(#79d7ff 0 62%,#dff6ff 62% 66%,#8fc954 66% 78%,#734522 78%);overflow-x:hidden}
button,input{font:inherit}button{touch-action:manipulation}.cloud{position:fixed;z-index:-1;width:160px;height:45px;border-radius:40px;background:#fff;opacity:.7;animation:fly 25s linear infinite}.cloud:before,.cloud:after{content:"";position:absolute;border-radius:50%;background:#fff;bottom:0}.cloud:before{width:70px;height:70px;left:22px}.cloud:after{width:82px;height:82px;right:15px}.c1{top:12%;left:-190px}.c2{top:34%;left:-260px;animation-delay:-13s;transform:scale(.7)}@keyframes fly{to{left:110vw}}
.top{width:min(1180px,calc(100% - 22px));margin:11px auto 0;display:flex;gap:9px;align-items:center;position:relative;z-index:5}.logo,.student,.mute,.pill{border:3px solid var(--line);border-radius:14px;background:var(--cream);box-shadow:0 5px 0 var(--line);font-weight:1000}.logo{padding:9px 13px}.student{margin-left:auto;padding:6px 7px 6px 11px;display:none;align-items:center;gap:8px;font-size:14px}.student button,.mute{border:0;border-radius:9px;background:#ffe16a;padding:7px 9px;font-weight:1000;cursor:pointer}.student button:disabled{opacity:.35}.mute{border:3px solid var(--line);box-shadow:0 5px 0 var(--line);min-width:47px}
.shell{width:min(1180px,calc(100% - 22px));margin:15px auto 34px}.hud{display:none;align-items:center;gap:9px;margin-bottom:11px}.pill{padding:7px 10px;font-size:13px}.track{height:18px;flex:1;border:3px solid var(--line);border-radius:20px;background:#fff;overflow:hidden}.track i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffe33b,#ff9c25,#ed4036);transition:.35s}
.screen{min-height:650px;display:grid;place-items:center}.panel{width:100%;background:rgba(255,251,228,.97);border:4px solid var(--line);border-radius:26px;box-shadow:0 14px 0 rgba(49,54,21,.25);padding:clamp(18px,4vw,36px);overflow:hidden}.start{display:grid;grid-template-columns:1fr 300px;align-items:center;gap:20px}.tag{display:inline-block;background:#292e38;color:#fff;padding:6px 11px;border-radius:999px;font-size:13px;font-weight:1000}h1{font-size:clamp(37px,6vw,69px);line-height:.9;letter-spacing:-2px;text-transform:uppercase;margin:14px 0}.lead{font-size:19px;line-height:1.45}.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:18px 0}.rule{background:#e9f4c9;border:2px solid #788c43;border-radius:13px;padding:10px;font-size:13px;font-weight:1000}
.primary,.secondary{border:3px solid #6d3d13;border-radius:14px;padding:13px 20px;font-weight:1000;cursor:pointer;box-shadow:0 6px 0 #6d3d13}.primary{background:var(--yellow)}.secondary{background:#fff}.primary:active,.secondary:active{transform:translateY(4px);box-shadow:0 2px 0 #6d3d13}
.login{max-width:520px;text-align:center;margin:auto}.login h1{font-size:45px}.code{width:100%;border:4px solid var(--line);border-radius:14px;padding:15px;text-align:center;font-size:22px;font-weight:1000;text-transform:uppercase;margin:12px 0}.status{min-height:27px;margin-top:11px;font-weight:1000}.status.bad{color:#b01f1b}.status.ok{color:#187b28}
.game{padding:0;min-height:650px}.bomb-layout,.error-layout{display:grid;grid-template-columns:350px 1fr;min-height:650px}.character-zone{position:relative;background:radial-gradient(circle at 50% 40%,#5e6875,#262b34 68%);border-right:7px solid #71451f;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px}.character-zone:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(120deg,transparent 0 35px,rgba(255,255,255,.025) 36px 38px)}
.big-bird{width:310px;max-width:100%;filter:drop-shadow(0 14px 0 rgba(0,0,0,.22));z-index:1;transform-origin:50% 80%;animation:pant .7s ease-in-out infinite alternate}.big-bird.urgent{animation:pant .26s ease-in-out infinite alternate}.big-bird.explode{animation:explode .65s forwards}.big-bird.safe{animation:calm .8s}
@keyframes pant{to{transform:scale(1.035,.975) translateY(4px)}}@keyframes explode{30%{transform:scale(1.25) rotate(8deg);filter:brightness(2.7) drop-shadow(0 0 30px #ffb31d)}100%{transform:scale(.25);opacity:0}}@keyframes calm{50%{transform:translateY(-16px) rotate(-5deg)}}
.puff{position:absolute;z-index:2;color:#fff;font-size:32px;font-weight:1000;opacity:0;animation:puff 1.2s infinite}.p1{left:16%;top:30%}.p2{right:12%;top:23%;animation-delay:.55s}@keyframes puff{0%{opacity:0;transform:scale(.3)}45%{opacity:.8}100%{opacity:0;transform:translateY(-35px) scale(1.5)}}
.fuse-wrap{z-index:2;width:90%;margin-top:-13px}.fuse-label{color:#fff;text-align:center;font-weight:1000;margin-bottom:6px}.fuse{height:20px;border:3px solid #17191d;border-radius:14px;background:#464a52;overflow:hidden;position:relative}.fuse i{display:block;height:100%;width:100%;background:repeating-linear-gradient(135deg,#f0ad22 0 9px,#c96c17 10px 18px);transition:width .2s linear}.spark{position:absolute;right:0;top:50%;transform:translate(45%,-50%);font-size:25px;filter:drop-shadow(0 0 7px #fff);animation:spark .25s infinite alternate}@keyframes spark{to{transform:translate(45%,-50%) scale(1.3) rotate(12deg)}}
.work-zone{padding:22px 25px 28px;background:#fff8df;display:flex;flex-direction:column}.work-head{display:flex;gap:8px;align-items:center}.proto{background:var(--red);color:#fff;border-radius:999px;padding:7px 10px;font-size:13px;font-weight:1000}.timer{margin-left:auto;border-radius:50%;width:61px;height:61px;background:conic-gradient(var(--yellow) 100%,#d7d7c6 0);display:grid;place-items:center;position:relative}.timer:after{content:"";position:absolute;inset:6px;border-radius:50%;background:#fff8df}.timer b{z-index:1;font-size:21px}.timer.danger{animation:danger .35s infinite alternate}@keyframes danger{to{transform:scale(1.08);filter:drop-shadow(0 0 8px #ff3529)}}
.problem{background:#fff;border:3px solid #7a744a;border-radius:16px;padding:15px;margin:13px 0;box-shadow:0 5px 0 #b7ac73}.problem small{display:block;text-transform:uppercase;font-weight:1000;color:#776c42;margin-bottom:5px}.formula{font:700 clamp(19px,2.5vw,28px) Georgia,serif;line-height:1.35}.step-dots{display:flex;gap:7px;margin:0 0 12px}.step-dot{height:10px;flex:1;border-radius:7px;background:#d8d7c3}.step-dot.done{background:var(--ok)}.step-dot.now{background:var(--yellow);box-shadow:0 0 0 2px #9f7216}.prompt{text-align:center;font-size:19px;font-weight:1000;margin:3px 0 11px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{min-height:70px;border:3px solid #4c4a2c;border-radius:14px;background:#fff;box-shadow:0 5px 0 #4c4a2c;padding:10px;font-weight:900;font-size:16px;cursor:pointer}.choice:hover{background:#fff0a9;transform:translateY(-2px)}.choice:disabled{cursor:default}.choice.correct{background:#c6f3b1;border-color:#237333}.choice.wrong{background:#ffc7c0;border-color:#aa251f}.feedback{text-align:center;min-height:52px;padding-top:11px;font-weight:1000}.feedback small{display:block;margin-top:3px}
.pig-zone{background:radial-gradient(circle at 50% 35%,#b9ee75,#5a9e38 70%);border-right:7px solid #71451f;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:10px}.big-pig{width:330px;max-width:100%;filter:drop-shadow(0 14px 0 rgba(32,55,15,.25));transform-origin:50% 80%}.big-pig.laugh{animation:laugh .18s 6 alternate}.big-pig.hit{animation:hit .35s 2 alternate}@keyframes laugh{to{transform:rotate(6deg) translateY(-5px)}}@keyframes hit{to{transform:translateX(13px) rotate(5deg);filter:drop-shadow(-8px 12px 0 rgba(32,55,15,.2))}}
.speech{position:absolute;top:26px;right:16px;background:#fff;border:3px solid var(--line);border-radius:18px;padding:10px 13px;font-weight:1000;max-width:150px;text-align:center;opacity:0;transform:scale(.7);transition:.2s}.speech.show{opacity:1;transform:scale(1)}.speech:after{content:"";position:absolute;left:20px;bottom:-14px;border:8px solid transparent;border-top-color:var(--line)}
.solution{display:grid;gap:9px}.solution-step{display:grid;grid-template-columns:42px 1fr;align-items:center;gap:9px;text-align:left;border:3px solid #716c44;border-radius:14px;background:#fff;padding:9px;box-shadow:0 4px 0 #aaa06b;cursor:pointer}.solution-step:hover{background:#fff0ac}.solution-step:disabled{cursor:default}.solution-step .num{width:34px;height:34px;border-radius:50%;background:#313743;color:#fff;display:grid;place-items:center;font-weight:1000}.solution-step.correct-pick{background:#c7f2b4;border-color:#227a30}.solution-step.wrong-pick{background:#ffc6c1;border-color:#a6221c}.solution-step.reveal{background:#ffe986;border-color:#a77a0a}.instruction{text-align:center;text-transform:uppercase;font-size:13px;letter-spacing:1px;font-weight:1000;color:#746a43;margin:0 0 10px}
.bruise{opacity:0}.bruise.show{opacity:1}.result{text-align:center;max-width:880px;margin:auto}.result h1{font-size:48px}.score{width:170px;height:170px;border-radius:50%;margin:15px auto;display:grid;place-items:center;position:relative;background:conic-gradient(var(--ok) 0%,#dde2cc 0)}.score:after{content:"";position:absolute;inset:15px;border-radius:50%;background:var(--cream)}.score b{z-index:1;font-size:43px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:560px;margin:15px auto}.stat{background:#fff;border:2px solid #8b855e;border-radius:13px;padding:10px}.stat b{display:block;font-size:22px}.actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}.save-status{min-height:28px;margin:11px 0;font-weight:1000}.save-status.ok{color:#16842b}.save-status.bad{color:#ae1d18}
@media(max-width:820px){.bomb-layout,.error-layout{grid-template-columns:1fr}.character-zone,.pig-zone{min-height:285px;border-right:0;border-bottom:7px solid #71451f}.big-bird,.big-pig{width:230px}.fuse-wrap{width:70%}.work-zone{padding:16px}.screen{min-height:600px}.start{grid-template-columns:1fr}.start .hero-char{grid-row:1;width:190px;margin:auto}.rules{grid-template-columns:1fr}.choices{grid-template-columns:1fr}.top{flex-wrap:wrap}.student{order:3;width:100%;justify-content:space-between}.solution-step{padding:7px}.speech{right:8%;top:12px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

<script>
'use strict';
const MODE='error-basic';
const API_URL='https://script.google.com/macros/s/AKfycbw6iYfojO8VgkHU63peD2vWLybGyDm9AsYZ6TaLA_EFD4j56nQlY5SqpRANPVeTwVsj/exec';
const PENDING_KEY='egePendingTestResults',TOTAL=20,$=id=>document.getElementById(id);
const CONFIG=MODE==='bomb'?{
 title:'Спасти Бомба',tag:'ИГРА 1 · ПРОТОТИПЫ 1–4',intro:'Птица пыхтит, а фитиль уже горит. Решай не весь пример сразу — выбирай только следующий правильный шаг.',
 meta:{testId:'EGE-12-BOMB-RECALL-PROTOTYPES-1-4',topicId:'task-12',topicName:'Экстремумы: базовые прототипы',taskNumber:12,schemaVersion:1}
}:MODE==='error-basic'?{
 title:'Найди ошибку: база',tag:'ОТДЕЛЬНАЯ ИГРА · ПРОТОТИПЫ 1–4',intro:'Перед тобой полная задача и решение ученика. В одной строке впервые появляется ошибка — найди её раньше смеющейся свиньи. Время не ограничено.',
 meta:{testId:'EGE-12-FIND-FIRST-ERROR-PROTOTYPES-1-4',topicId:'task-12',topicName:'Экстремумы: поиск ошибок в базовых прототипах',taskNumber:12,schemaVersion:1}
}:{
 title:'Найди ошибку свиньи',tag:'ИГРА 2 · ПРОТОТИПЫ 5–7',intro:'Свинья испортила один шаг в каждом решении. Найди ошибку: за верный удар у неё появится новый синяк.',
 meta:{testId:'EGE-12-PIG-REACTOR-RECALL-PROTOTYPES-5-7',topicId:'task-12',topicName:'Экстремумы: сложные прототипы',taskNumber:12,schemaVersion:1}
};
const TEST_META=CONFIG.meta;
document.title=CONFIG.title+' — задание №12';$('logo').textContent=CONFIG.title.toUpperCase();
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i;i--){const j=ri(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=n=>String(Number.isInteger(n)?n:+n.toFixed(2)).replace('-', '−').replace('.',',');
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function options(answer,wrong){return shuffle([String(answer),...wrong.map(String)].filter((v,i,a)=>a.indexOf(v)===i).slice(0,4))}
function stage(prompt,answer,wrong,why){return{prompt,answer:String(answer),options:options(answer,wrong),why}}
function task(proto,problem,stages){return{proto,problem,stages}}

function birdSvg(cls='hero-char'){
 return `<svg class="${cls}" viewBox="0 0 340 350" aria-hidden="true">
 <defs><radialGradient id="bb" cx="35%" cy="25%"><stop stop-color="#626977"/><stop offset="1" stop-color="#171a22"/></radialGradient></defs>
 <g transform="translate(170 190)"><path d="M-18-126Q-2-160 18-126" fill="none" stroke="#302618" stroke-width="12"/><circle cx="20" cy="-139" r="10" fill="#ffce25"/>
 <path d="M-112 26L-150 45L-115 62" fill="#252936" stroke="#201b11" stroke-width="8"/><path d="M112 26L150 45L115 62" fill="#252936" stroke="#201b11" stroke-width="8"/>
 <circle r="116" fill="url(#bb)" stroke="#2c2617" stroke-width="10"/><ellipse cy="57" rx="76" ry="50" fill="#646b76"/>
 <path d="M-85-48L-18-27M85-48L18-27" stroke="#17140e" stroke-width="18" stroke-linecap="round"/>
 <circle cx="-43" cy="-26" r="31" fill="#fff" stroke="#272113" stroke-width="7"/><circle cx="43" cy="-26" r="31" fill="#fff" stroke="#272113" stroke-width="7"/>
 <circle cx="-32" cy="-25" r="10"/><circle cx="32" cy="-25" r="10"/><path d="M-30 16L0 0L39 17L0 42Z" fill="#f2af19" stroke="#2b2415" stroke-width="8"/>
 <path d="M-38 78Q0 96 38 78" fill="none" stroke="#2c2617" stroke-width="8" stroke-linecap="round"/>
 </g></svg>`
}
function pigSvg(){
 return `<svg class="big-pig" id="bigPig" viewBox="0 0 360 390" aria-hidden="true">
 <defs><radialGradient id="pg" cx="35%" cy="20%"><stop stop-color="#baf078"/><stop offset="1" stop-color="#65a93e"/></radialGradient></defs>
 <g transform="translate(180 215)"><path d="M-92-100L-125-157L-53-126M92-100L125-157L53-126" fill="#79bb48" stroke="#315c25" stroke-width="10"/>
 <circle r="132" fill="url(#pg)" stroke="#315c25" stroke-width="11"/><circle cx="-48" cy="-39" r="31" fill="#fff" stroke="#315c25" stroke-width="7"/><circle cx="48" cy="-39" r="31" fill="#fff" stroke="#315c25" stroke-width="7"/><circle cx="-39" cy="-35" r="9"/><circle cx="39" cy="-35" r="9"/>
 <ellipse cy="28" rx="61" ry="48" fill="#91d15d" stroke="#315c25" stroke-width="9"/><ellipse cx="-22" cy="26" rx="8" ry="13" fill="#315c25"/><ellipse cx="22" cy="26" rx="8" ry="13" fill="#315c25"/>
 <path d="M-52 87Q0 120 52 87" fill="#fff" stroke="#315c25" stroke-width="8"/><path d="M-25 91V110M25 91V110" stroke="#315c25" stroke-width="6"/>
 <g class="bruise" id="bruise1"><ellipse cx="-84" cy="29" rx="24" ry="17" fill="#7453a8" opacity=".8"/><path d="M-102 18L-85 4M-83 45L-67 31" stroke="#462c79" stroke-width="5"/></g>
 <g class="bruise" id="bruise2"><ellipse cx="83" cy="-72" rx="22" ry="16" fill="#5c54a7" opacity=".8"/><path d="M69-77L92-59M76-91L99-73" stroke="#352e79" stroke-width="5"/></g>
 <g class="bruise" id="bruise3"><path d="M-18-116L-4-91L10-116L26-91" fill="none" stroke="#8f251f" stroke-width="8"/><circle cx="4" cy="-103" r="7" fill="#e43c31"/></g>
 <g class="bruise" id="bruise4"><path d="M65 69L86 54M71 84L94 69M-76-54L-98-71M-68-70L-90-89" stroke="#8f251f" stroke-width="7"/></g>
 </g></svg>`
}
function buildBombTasks(){
 const q=[];
 for(let i=0;i<5;i++){
  if(i%2===0){const h=ri(-6,7),c=ri(-9,12);q.push(task('Многочлен',`Найдите наименьшее значение: <b>y = (x ${h<0?'+ '+(-h):'− '+h})² ${c>=0?'+ '+c:'− '+(-c)}</b>`,[
   stage('Какой первый шаг?','Найти производную', ['Подставить x = 0','Раскрыть таблицу значений','Найти логарифм'],'Для экстремума начинаем с производной.'),
   stage('Какая производная? ',`y′ = 2(x ${h<0?'+ '+(-h):'− '+h})`,[`y′ = x ${h<0?'+ '+(-h):'− '+h}`,`y′ = 2x ${h<0?'− '+(-h):'+ '+h}`,'y′ = 2'], 'Производная квадрата: 2(x−h).'),
   stage('Что записать в ответ?',fmt(c),[fmt(h),fmt(-h),fmt(c+2)],`В вершине квадрат равен нулю, поэтому y = ${c}.`)
  ]))}
  else{const a=ri(2,7);q.push(task('Многочлен',`Найдите точку минимума: <b>y = x³ − ${3*a*a}x + ${ri(-9,9)}</b>`,[
   stage('Что делаем сначала?','Находим y′',['Подставляем x = 1','Ищем область определения','Делим на x'],'Точка экстремума находится через производную.'),
   stage('Какие критические точки?',`x = −${a} и x = ${a}`,[`x = 0 и x = ${a}`,`x = −${a*a} и x = ${a*a}`,`x = ${a}`],`y′ = 3(x²−${a*a}), корни ±${a}.`),
   stage('Какой корень даёт минимум?',fmt(a),[fmt(-a),'0',fmt(a*a)],'У кубической функции с положительным старшим коэффициентом больший корень — минимум.')
  ]))}
 }
 for(let i=0;i<5;i++){const m=pick([2,4,6,8,10]),k=3*m/2,c=ri(-9,20);q.push(task('Корень',`Найдите точку минимума: <b>y = x√x − ${fmt(k)}x ${c>=0?'+ '+c:'− '+(-c)}</b>`,[
  stage('Во что удобно превратить x√x?','x<sup>3/2</sup>',['x²','√x','x<sup>1/2</sup>'],'x·x^(1/2) = x^(3/2).'),
  stage('Какое уравнение получим из y′ = 0?',`1,5√x = ${fmt(k)}`,[`√x = ${fmt(k)}`,`1,5x = ${fmt(k)}`,`x² = ${fmt(k)}`],'(x^(3/2))′ = 1,5√x.'),
  stage('Какова точка минимума?',fmt(m*m),[fmt(m),fmt(k*k),fmt(m*m+4)],`√x = ${m}, поэтому x = ${m*m}.`)
 ]))}
 for(let i=0;i<5;i++){const s=ri(3,15),a=s*s;const neg=i%2===1;q.push(task('Дробь',`Найдите точку ${neg?'минимума':'максимума'}: <b>y = ${neg?'−':''}x/(x² + ${a})</b>`,[
  stage('Что определяет знак y′?','Числитель производной',['Знаменатель производной','Сам x','Число 2'],'Знаменатель после дифференцирования — положительный квадрат.'),
  stage('Какие критические точки?',`x = −${s} и x = ${s}`,[`x = 0 и x = ${s}`,`x = −${a} и x = ${a}`,`только x = ${s}`],`Получаем x² = ${a}, значит x = ±${s}.`),
  stage(`Какой корень даёт ${neg?'минимум':'максимум'}?`,fmt(s),[fmt(-s),'0',fmt(a)],`${neg?'Минус перед дробью переворачивает знаки, но минимум':'У исходной дроби максимум'} находится при x = +${s}.`)
 ]))}
 for(let i=0;i<5;i++){const a=ri(2,10),k=ri(3,14);q.push(task('Логарифм',`Найдите точку максимума: <b>y = ${k}ln(x + ${a}) − ${k}x + ${ri(-12,12)}</b>`,[

}
function nextTask(){index++;stageIndex=0;taskClean=true;if(index>=TOTAL)finish();else renderCurrent()}
function finish(){clearInterval(timerId);gameActive=false;updateStudent();$('progress').style.width='100%';const seconds=duration(),score=Math.round(firstTryCorrect/TOTAL*100);$('screen').innerHTML=`<div class="panel result"><span class="tag">ИГРА ЗАВЕРШЕНА</span><h1>${score>=80?'Отличная работа!':score>=55?'Хорошая тренировка!':'Нужен ещё один заход!'}</h1><div class="score" style="background:conic-gradient(${MODE==='bomb'?'#d62929':'#70b84a'} ${score}%,#dde2cc 0)"><b>${score}%</b></div><p>Успешность с первой попытки</p><div class="stats"><div class="stat">Верно сразу<b>${firstTryCorrect} из ${TOTAL}</b></div><div class="stat">Время<b>${timeText(seconds)}</b></div></div><div class="save-status" id="saveStatus">Сохраняем результат…</div><div class="actions"><button class="primary" id="againBtn">Играть ещё раз</button><button class="secondary" id="homeBtn">На старт</button></div></div>`;$('againBtn').addEventListener('click',startGame);$('homeBtn').addEventListener('click',renderStart);sound('finish');submitOnce(score,seconds)}
function sound(type){if(muted)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ac=sound.ac||(sound.ac=new AC()),o=ac.createOscillator(),g=ac.createGain(),now=ac.currentTime,map={start:[180,420,.22],step:[430,760,.13],boom:[120,38,.5],hit:[210,90,.18],laugh:[480,250,.3],finish:[420,820,.42]},m=map[type]||map.step;o.type=type==='boom'||type==='laugh'?'sawtooth':'triangle';o.connect(g);g.connect(ac.destination);o.frequency.setValueAtTime(m[0],now);o.frequency.exponentialRampToValueAtTime(m[1],now+m[2]);g.gain.setValueAtTime(.07,now);g.gain.exponentialRampToValueAtTime(.001,now+m[2]);o.start();o.stop(now+m[2])}catch(_){}}
$('switchBtn').addEventListener('click',changeStudent);$('muteBtn').addEventListener('click',()=>{muted=!muted;$('muteBtn').textContent=muted?'🔇':'🔊'});window.addEventListener('online',flushPending);window.addEventListener('beforeunload',()=>clearInterval(timerId));
async function init(){const code=new URLSearchParams(location.search).get('code');if(code){renderLogin(code);return}currentStudent=storedStudent();if(currentStudent){updateStudent();await flushPending();renderStart()}else renderLogin()}init();
</script>
