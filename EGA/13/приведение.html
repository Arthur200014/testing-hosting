    @keyframes bigBreathe{0%,100%{transform:scaleY(1) translateY(0)}50%{transform:scaleY(1.018) translateY(-3px)}}@keyframes bigBlink{0%,43%,47%,100%{transform:scaleY(1)}45%{transform:scaleY(.08)}}@keyframes oneBlink{0%,56%,60%,100%{transform:scaleY(1)}58%{transform:scaleY(.06)}}@keyframes pupilTrack{0%,100%{transform:translateX(-5px)}45%,65%{transform:translateX(7px)}}@keyframes bigMumble{0%,100%{transform:scaleY(.75)}50%{transform:scaleY(1.12)}}@keyframes leftArmIdle{0%,100%{transform:rotate(28deg)}50%{transform:rotate(19deg)}}@keyframes operateLever{0%,100%{transform:rotate(-18deg)}50%{transform:rotate(-38deg)}}@keyframes oneBob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-7px) rotate(1.5deg)}}@keyframes oneWave{0%,100%{transform:rotate(32deg)}50%{transform:rotate(12deg)}}@keyframes oneWaveR{0%,100%{transform:rotate(148deg)}50%{transform:rotate(169deg)}}
    @keyframes bigJump{0%,100%{transform:translateY(0) rotate(0)}36%{transform:translateY(-43px) rotate(-5deg)}65%{transform:translateY(-8px) rotate(4deg)}}@keyframes bigArmUpL{35%,60%{transform:rotate(-62deg)}100%{transform:rotate(28deg)}}@keyframes bigArmUpR{35%,60%{transform:rotate(-118deg)}100%{transform:rotate(-18deg)}}@keyframes happyMouth{35%,65%{transform:scale(1.28,1.5)}100%{transform:scaleY(.75)}}@keyframes oneVictory{0%,100%{transform:translateY(0) rotate(0)}38%{transform:translateY(-55px) rotate(13deg)}67%{transform:translateY(-9px) rotate(-8deg)}}@keyframes oneCheerL{35%,65%{transform:rotate(-76deg)}100%{transform:rotate(32deg)}}@keyframes oneCheerR{35%,65%{transform:rotate(236deg)}100%{transform:rotate(148deg)}}
    @keyframes bigRecoil{20%{transform:translate(-20px,9px) scale(.92,1.06)}40%{transform:translate(13px,2px) rotate(3deg)}65%{transform:translate(-8px,5px) rotate(-2deg)}}@keyframes coverFaceL{25%,70%{transform:translate(47px,-35px) rotate(-38deg)}100%{transform:rotate(28deg)}}@keyframes coverFaceR{25%,70%{transform:translate(-47px,-35px) rotate(218deg)}100%{transform:rotate(-18deg)}}@keyframes eyesWide{25%,75%{transform:scale(1.18,1.3)}100%{transform:scale(1)}}@keyframes shockMouth{25%,75%{transform:scale(.72,1.7);border-radius:50%}100%{transform:scaleY(.75)}}@keyframes onePanic{18%,58%{transform:translateX(-15px) rotate(-11deg) scale(.92,1.08)}38%,78%{transform:translateX(12px) rotate(9deg)}}@keyframes overDoor{from{transform:translateX(-120px)}to{transform:translateX(calc(100vw + 180px))}}@keyframes energyFloat{from{transform:translate(-35px,-35px);opacity:.15}to{transform:translate(95px,70px);opacity:1}}@keyframes steamRise{from{transform:translateY(0) scale(.6);opacity:0}30%{opacity:.65}to{transform:translateY(-120vh) scale(1.8);opacity:0}}@keyframes sparkDrop{0%,70%{opacity:0;transform:translateY(0)}75%{opacity:1}100%{opacity:0;transform:translateY(130px)}}
    @media(max-width:970px){.login,.start,.final{grid-template-columns:1fr}.factory-hero{min-height:530px}.question-zone{grid-template-columns:1fr}.arrival{min-height:475px}.question-door{width:250px}.console{max-width:720px;margin:auto}.factory{min-height:1120px}.monster-stage{bottom:35px}}
    @media(max-width:620px){.top{padding:8px}.brand span:last-child{display:none}.student{max-width:80%;flex-wrap:wrap;justify-content:flex-end;font-size:10px}.login,.start,.final{padding:27px 14px}.panel{padding:28px 18px}.rules{grid-template-columns:1fr}.game{padding:9px}.hud{grid-template-columns:1fr auto}.track{grid-column:1/-1;grid-row:2}.factory{padding:12px;min-height:1060px}.question-zone{gap:12px}.arrival{min-height:435px}.question-door{width:220px}.answers{gap:10px}.answer{min-height:135px;border-width:5px;font-size:19px}.console{padding:15px}.monster-stage{scale:.72;transform-origin:left bottom}.feedback{font-size:12px}.stats{grid-template-columns:1fr}.sky-rail{top:68px}.mini-door{top:82px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
  </style>

<body>
  <div class="factory-overlay" id="overlay" aria-hidden="true"></div>
  <header class="top">
    <div class="brand"><span class="brand-mark"></span><span>ФАБРИКА ФОРМУЛ · ЕГЭ №13</span></div>
    <div class="student" id="studentBox"><span>Ученик: <b id="studentName"></b></span><button class="tiny" id="switchBtn">Сменить ученика</button><button class="tiny" id="soundBtn">Звук</button></div>
  </header>
  <main id="app"></main>
  <script>
  'use strict';
  const API_URL='https://script.google.com/macros/s/AKfycbw6iYfojO8VgkHU63peD2vWLybGyDm9AsYZ6TaLA_EFD4j56nQlY5SqpRANPVeTwVsj/exec';
  const TEST_META={testId:'EGE-13-MONSTER-REDUCTION-DOORS-32',topicId:'task-13',topicName:'Тригонометрические уравнения: формулы приведения',taskNumber:13,schemaVersion:1};
  const TOTAL=32,PENDING_KEY='egePendingTestResults',$=id=>document.getElementById(id);
  let student=null,questions=[],index=0,questionAttempted=false,firstTryCorrect=0,startedAt=0,attemptEventId='',resultSubmitted=false,gameActive=false,locked=false,muted=false;
  const FUNCS=[
    {id:'sin',label:'sin',family:'sc'},
    {id:'cos',label:'cos',family:'sc'},
    {id:'tan',label:'tg',family:'tc'},
    {id:'cot',label:'ctg',family:'tc'}
  ];
  const OFFSETS=[
    {k:1,s:-1,label:'π/2 − α'},{k:1,s:1,label:'π/2 + α'},
    {k:2,s:-1,label:'π − α'},{k:2,s:1,label:'π + α'},
    {k:3,s:-1,label:'3π/2 − α'},{k:3,s:1,label:'3π/2 + α'},
    {k:4,s:-1,label:'2π − α'},{k:4,s:1,label:'2π + α'}
  ];
  const rint=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
  function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=rint(0,i);[x[i],x[j]]=[x[j],x[i]]}return x}
  function trigValue(fn,x){if(fn==='sin')return Math.sin(x);if(fn==='cos')return Math.cos(x);if(fn==='tan')return Math.tan(x);return 1/Math.tan(x)}
  function resultFor(fn,k,s){const a=.371,actual=trigValue(fn,k*Math.PI/2+s*a),pool=(fn==='sin'||fn==='cos')?['sin','cos']:['tan','cot'];let best=null;for(const out of pool)for(const sign of[1,-1]){const value=sign*trigValue(out,a),error=Math.abs(value-actual);if(!best||error<best.error)best={out,sign,error}}return best}
  function displayResult(out,sign){const f=FUNCS.find(x=>x.id===out).label;return(sign<0?'−':'')+f+' α'}
  function buildBank(){const bank=[];for(const fn of FUNCS)for(const off of OFFSETS){const result=resultFor(fn.id,off.k,off.s),universe=fn.family==='sc'?['sin α','−sin α','cos α','−cos α']:['tg α','−tg α','ctg α','−ctg α'];bank.push({id:fn.id+'-'+off.k+'-'+(off.s>0?'p':'m'),expression:fn.label+'('+off.label+')',correct:displayResult(result.out,result.sign),options:shuffle(universe),kind:'Формула приведения'})}return shuffle(bank)}
  function overlay(){let h='<i class="sky-rail"></i>';const colors=['#a878c8','#61cbd0','#ef9e5f','#9dd64d','#ef6b85'];for(let i=0;i<7;i++)h+=`<i class="mini-door" style="--door:${colors[i%colors.length]};left:${rint(-15,70)}%;--dur:${rint(12,21)}s;--delay:-${rint(0,20)}s"></i>`;for(let i=0;i<18;i++)h+=`<i class="energy" style="left:${rint(2,97)}%;top:${rint(17,94)}%;--dur:${rint(3,8)}s;--delay:-${rint(0,8)}s"></i>`;for(let i=0;i<6;i++)h+=`<i class="steam" style="left:${rint(0,92)}%;--dur:${rint(9,17)}s;--delay:-${rint(0,16)}s"></i>`;for(let i=0;i<9;i++)h+=`<i class="spark" style="left:${rint(4,96)}%;--dur:${rint(2,6)}s;--delay:-${rint(0,6)}s"></i>`;$('overlay').innerHTML=h}
  function hero(){return '<div class="factory-hero"><i class="hero-wall"></i><i class="hero-pipe"></i><i class="hero-door"></i><i class="canister"></i></div>'}
  function monsters(){return '<div class="monster-stage" id="monsterStage"><div class="monster-big"><i class="big-horn left"></i><i class="big-horn right"></i><div class="big-body"><i class="big-brow left"></i><i class="big-brow right"></i><span class="big-eye left"><i class="big-pupil"></i></span><span class="big-eye right"><i class="big-pupil"></i></span><i class="big-mouth"></i></div><i class="big-arm left"><b class="big-paw"></b></i><i class="big-arm right"><b class="big-paw"></b></i><i class="big-leg left"></i><i class="big-leg right"></i></div><div class="monster-one"><i class="one-horn left"></i><i class="one-horn right"></i><div class="one-body"><span class="one-eye"><i class="one-pupil"></i></span><i class="one-mouth"></i></div><i class="one-arm left"></i><i class="one-arm right"></i><i class="one-leg left"></i><i class="one-leg right"></i></div></div>'}
  function storedStudent(){const studentId=localStorage.getItem('egeStudentId');return studentId?{studentId,name:localStorage.getItem('egeStudentName')||'Ученик',code:localStorage.getItem('egeStudentCode')||''}:null}
  function saveStudent(s){localStorage.setItem('egeStudentId',s.studentId);localStorage.setItem('egeStudentName',s.name);localStorage.setItem('egeStudentCode',s.code)}
  function parseStudent(data,code){const src=(data&&(data.student||data.data))||data||{},studentId=src.studentId||src.id||(data&&data.studentId),name=src.studentName||src.name||src.fullName||(data&&(data.studentName||data.name)),bad=data&&(data.success===false||data.valid===false||data.ok===false);if(bad||!studentId)throw new Error((data&&(data.message||data.error))||'Личный код не найден');return{studentId:String(studentId),name:String(name||'Ученик'),code:String(code)}}
  function validateStudent(code){return new Promise((resolve,reject)=>{const cb='egeValidate_'+Date.now()+'_'+Math.random().toString(36).slice(2),s=document.createElement('script');let done=false;const clean=()=>{delete window[cb];s.remove()},timer=setTimeout(()=>{if(done)return;done=true;clean();reject(new Error('Сервер не ответил. Проверь интернет'))},12000);window[cb]=data=>{if(done)return;done=true;clearTimeout(timer);clean();try{resolve(parseStudent(data,code))}catch(e){reject(e)}};s.onerror=()=>{if(done)return;done=true;clearTimeout(timer);clean();reject(new Error('Не удалось проверить код'))};s.src=API_URL+'?'+new URLSearchParams({action:'validateStudent',code,callback:cb});document.head.appendChild(s)})}
  function updateStudent(){const box=$('studentBox');box.style.display=student?'flex':'none';if(student)$('studentName').textContent=student.name;$('switchBtn').disabled=gameActive}
  function readQueue(){try{const q=JSON.parse(localStorage.getItem(PENDING_KEY)||'[]');return Array.isArray(q)?q:[]}catch(_){return[]}}
  function writeQueue(q){localStorage.setItem(PENDING_KEY,JSON.stringify(q))}
  function queueResult(p){const q=readQueue();if(!q.some(x=>x&&x.eventId===p.eventId))q.push(p);writeQueue(q)}
  function removeQueued(id){writeQueue(readQueue().filter(x=>!x||x.eventId!==id))}
  async function postResult(p){const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p),redirect:'follow'});if(!r.ok)throw new Error('submit')}
  async function flushPending(){if(!navigator.onLine)return;for(const p of readQueue()){if(!p||!p.eventId)continue;try{await postResult(p);removeQueued(p.eventId)}catch(_){}}}
  function uuid(){if(window.crypto&&typeof crypto.randomUUID==='function')return crypto.randomUUID();return'evt-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)+'-'+Math.random().toString(36).slice(2)}
  function localDate(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  function elapsed(){return Math.max(1,Math.round((Date.now()-startedAt)/1000))}
  function timeText(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
  function setSave(cls,text){const e=$('saveStatus');if(e){e.className='save-status '+cls;e.textContent=text}}
  async function submitOnce(scorePercent,durationSeconds){if(resultSubmitted||!student)return;resultSubmitted=true;const payload={action:'submitTest',eventId:attemptEventId,studentId:student.studentId,testId:TEST_META.testId,testDate:localDate(),topicId:TEST_META.topicId,topicName:TEST_META.topicName,taskNumber:TEST_META.taskNumber,scorePercent,durationSeconds,schemaVersion:TEST_META.schemaVersion};setSave('','Сохраняем результат…');try{if(!navigator.onLine)throw new Error('offline');await postResult(payload);removeQueued(payload.eventId);setSave('ok','✓ Результат сохранён')}catch(_){queueResult(payload);setSave('bad','Нет связи: результат сохранён на устройстве и отправится позже')}}
  function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function renderLogin(prefill=''){gameActive=false;student=null;updateStudent();$('app').innerHTML=`<section class="screen login"><div class="panel"><span class="tag">Пропуск на фабрику</span><h1>Фабрика формул</h1><p class="lead">Введи личный код ученика. Имя загрузится автоматически.</p><form class="code-form" id="loginForm"><input class="code" id="codeInput" maxlength="40" autocomplete="one-time-code" placeholder="ЛИЧНЫЙ КОД" value="${esc(prefill)}"><button class="primary" id="loginBtn">Проверить пропуск</button><div class="status" id="loginStatus"></div></form></div>${hero()}</section>`;$('loginForm').addEventListener('submit',handleLogin);if(prefill)setTimeout(()=>$('loginForm').requestSubmit(),0)}
  async function handleLogin(e){e.preventDefault();const input=$('codeInput'),btn=$('loginBtn'),status=$('loginStatus'),code=input.value.trim();if(!code){status.className='status bad';status.textContent='Введи личный код';return}input.disabled=btn.disabled=true;status.textContent='Проверяем пропуск…';try{student=await validateStudent(code);saveStudent(student);updateStudent();await flushPending();renderStart()}catch(err){status.className='status bad';status.textContent=err.message||'Код не подтверждён';input.disabled=btn.disabled=false;input.focus()}}
  function renderStart(){gameActive=false;updateStudent();$('app').innerHTML=`<section class="screen start"><div class="panel"><span class="tag">Тренажёр примерно на 10 минут</span><h1>Смена начинается</h1><p class="lead">На дверь вылетает выражение. Выбери правильную формулу приведения из четырёх вариантов.</p><div class="rules"><div class="rule"><b>32</b>выражения</div><div class="rule"><b>4</b>варианта</div><div class="rule"><b>8</b>типов углов</div></div><p>После ошибки можно продолжить выбор, но успешность этого выражения с первой попытки уже не засчитывается. Ограничения по времени нет.</p><button class="primary" id="startBtn">Запустить конвейер</button></div>${hero()}</section>`;$('startBtn').addEventListener('click',startGame)}
  function startGame(){questions=buildBank();index=0;questionAttempted=false;firstTryCorrect=0;startedAt=Date.now();attemptEventId=uuid();resultSubmitted=false;gameActive=true;locked=false;updateStudent();sound('start');renderQuestion()}
  function renderQuestion(){questionAttempted=false;locked=false;const q=questions[index];$('app').innerHTML=`<section class="screen game"><div class="hud"><span class="hud-chip">Дверь ${index+1} / ${TOTAL}</span><div class="track"><i style="width:${index/TOTAL*100}%"></i></div><span class="hud-chip">Верно сразу: <b id="liveScore">${firstTryCorrect}</b></span></div><div class="factory"><div class="question-zone"><div class="arrival"><i class="rail"></i><i class="claw"></i><div class="question-door" id="questionDoor"><span class="expression">${esc(q.expression)}</span><span class="question-kind">${esc(q.kind)}</span></div></div><div class="console"><h2>Выбери правильную дверь</h2><p>Как преобразуется выражение?</p><div class="answers">${q.options.map(x=>`<button class="answer" data-value="${esc(x)}"><span>${esc(x)}</span></button>`).join('')}</div><div class="feedback" id="feedback">Фабрика ждёт решения</div></div></div>${monsters()}</div></section>`;document.querySelectorAll('.answer').forEach(b=>b.addEventListener('click',()=>chooseAnswer(b)))}
  function chooseAnswer(button){if(locked||button.disabled)return;const q=questions[index],value=button.dataset.value,first=!questionAttempted;questionAttempted=true;if(value===q.correct){locked=true;if(first)firstTryCorrect++;button.classList.add('correct');document.querySelectorAll('.answer').forEach(b=>b.disabled=true);$('liveScore').textContent=firstTryCorrect;const f=$('feedback');f.className='feedback good';f.textContent=first?'Верно с первой попытки — дверь заряжена.':'Правильная дверь найдена. Конвейер продолжает работу.';react('cheer');sound('good');setTimeout(()=>{$('questionDoor').classList.add('exit');setTimeout(nextQuestion,520)},650)}else{button.classList.add('wrong');button.disabled=true;const f=$('feedback');f.className='feedback bad';f.textContent='Не эта дверь. Проверь: меняется ли функция и какой знак у неё в четверти.';react('panic');sound('bad')}}
  function react(cls){const s=$('monsterStage');if(!s)return;s.classList.remove('cheer','panic');void s.offsetWidth;s.classList.add(cls);setTimeout(()=>s&&s.classList.remove(cls),750)}
  function nextQuestion(){index++;if(index>=TOTAL)finish();else renderQuestion()}
  function finish(){gameActive=false;updateStudent();const seconds=elapsed(),score=Math.round(firstTryCorrect/TOTAL*100);$('app').innerHTML=`<section class="screen final"><div class="panel"><span class="tag">Смена завершена</span><h1>${score>=85?'Главный механик формул!':score>=60?'Конвейер настроен':'Нужна ещё одна смена'}</h1><div class="ring" style="background:conic-gradient(#9ed84c ${score}%,#bfd0df 0)"><b>${score}%</b></div><p><b>Успешность с первой попытки</b></p><div class="stats"><div class="stat">Верно сразу<b>${firstTryCorrect} из ${TOTAL}</b></div><div class="stat">Время прохождения<b>${timeText(seconds)}</b></div></div><div class="save-status" id="saveStatus">Сохраняем результат…</div><div class="actions"><button class="primary" id="againBtn">Новая смена</button><button class="secondary" id="homeBtn">На старт</button></div></div>${hero()}</section>`;$('againBtn').addEventListener('click',startGame);$('homeBtn').addEventListener('click',renderStart);sound('finish');submitOnce(score,seconds)}
  function changeStudent(){if(gameActive)return;['egeStudentId','egeStudentName','egeStudentCode'].forEach(k=>localStorage.removeItem(k));renderLogin()}
  function sound(type){if(muted)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ac=sound.ac||(sound.ac=new AC()),now=ac.currentTime,g=ac.createGain(),sets={good:[[420,.12],[640,.28]],bad:[[150,.18],[95,.34]],start:[[180,.15],[300,.32]],finish:[[260,.12],[460,.29],[690,.48]]},set=sets[type]||[[300,.1]];g.connect(ac.destination);g.gain.setValueAtTime(.045,now);g.gain.exponentialRampToValueAtTime(.0001,now+set[set.length-1][1]+.13);set.forEach(([f,d],i)=>{const o=ac.createOscillator();o.type=type==='bad'?'sawtooth':'triangle';o.frequency.value=f;o.connect(g);o.start(now+i*.04);o.stop(now+d+.08)})}catch(_){}}
  $('switchBtn').addEventListener('click',changeStudent);$('soundBtn').addEventListener('click',()=>{muted=!muted;$('soundBtn').textContent=muted?'Без звука':'Звук'});window.addEventListener('online',flushPending);overlay();
  async function init(){const code=new URLSearchParams(location.search).get('code');if(code){renderLogin(code);return}student=storedStudent();if(student){updateStudent();await flushPending();renderStart()}else renderLogin()}init();
  </script>
</body>
