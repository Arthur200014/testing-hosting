lateX(-100px)}to{transform:translateX(calc(100vw + 170px))}}@keyframes cableSwing{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}@keyframes sparkFall{0%,70%{opacity:0;transform:translateY(0)}75%{opacity:1}100%{opacity:0;transform:translateY(150px)}}@keyframes steamRise{from{transform:translateY(0) scale(.6);opacity:0}30%{opacity:.65}to{transform:translateY(-120vh) scale(1.8);opacity:0}}

<body>
  <div class="overfx" id="overfx" aria-hidden="true"></div>
  <header class="top">
    <div class="brand"><span class="brand-mark"></span><span>ДИСПЕТЧЕРСКАЯ КОРНЕЙ · ЕГЭ №13</span></div>
    <div class="student" id="studentBox"><span>Ученик: <b id="studentName"></b></span><button class="tiny" id="switchBtn">Сменить ученика</button><button class="tiny" id="soundBtn">Звук</button></div>
  </header>
  <main id="app"></main>
  <script>
  'use strict';
  const API_URL='https://script.google.com/macros/s/AKfycbw6iYfojO8VgkHU63peD2vWLybGyDm9AsYZ6TaLA_EFD4j56nQlY5SqpRANPVeTwVsj/exec';
  const TEST_META={testId:'EGE-13-MONSTER-TRIG-ROOT-DISPATCH-15',topicId:'task-13',topicName:'Тригонометрические уравнения',taskNumber:13,schemaVersion:1};
  const PENDING_KEY='egePendingTestResults',TOTAL=15,$=id=>document.getElementById(id);
  let student=null,phase='start',guidedIndex=0,stepIndex=0,quizIndex=0,quizQuestions=[],currentFailed=false,stepLocked=false,firstTryCorrect=0,startedAt=0,eventId='',submitted=false,gameActive=false,muted=false,selectedQuads=new Set();
  const FORM={sin:'sin',cos:'cos',tan:'tg',cot:'ctg'},QUAD_NAMES={1:'I',2:'II',3:'III',4:'IV'};
  const ANGLES={
    'π/6':{deg:30,comp:'5π/6',plus:'7π/6',twominus:'11π/6'},
    'π/4':{deg:45,comp:'3π/4',plus:'5π/4',twominus:'7π/4'},
    'π/3':{deg:60,comp:'2π/3',plus:'4π/3',twominus:'5π/3'}
  };
  const rint=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
  function fixedMix(a,key=''){const x=[...a],shift=[...key].reduce((s,c)=>s+c.charCodeAt(0),0)%Math.max(1,x.length);return x.slice(shift).concat(x.slice(0,shift))}
  function solution(fn,sign,a){const m=ANGLES[a];if(fn==='sin')return sign>0?`x = ${a} + 2πn; x = ${m.comp} + 2πn`:`x = ${m.plus} + 2πn; x = ${m.twominus} + 2πn`;if(fn==='cos')return sign>0?`x = ±${a} + 2πn`:`x = ±${m.comp} + 2πn`;return sign>0?`x = ${a} + πn`:`x = −${a} + πn`}
  function makeQ(fn,sign,value,a,id){const m=ANGLES[a];let quads,roots;if(fn==='sin'){quads=sign>0?[1,2]:[3,4];roots=sign>0?[a,m.comp]:[m.plus,m.twominus]}else if(fn==='cos'){quads=sign>0?[1,4]:[2,3];roots=sign>0?[a,m.twominus]:[m.comp,m.plus]}else{quads=sign>0?[1,3]:[2,4];roots=sign>0?[a,m.plus]:[m.comp,m.twominus]}return{id,fn,sign,value,a,alphaDeg:m.deg,tex:`${FORM[fn]} x = ${sign<0?'−':''}${value}`,quads,roots,general:solution(fn,sign,a)}}
  const GUIDED=[
    makeQ('sin',1,'1/2','π/6','g1'),
    makeQ('cos',-1,'√2/2','π/4','g2'),
    makeQ('tan',-1,'√3','π/3','g3'),
    makeQ('sin',-1,'√3/2','π/3','g4'),
    makeQ('cot',1,'√3','π/6','g5')
  ];
  const POOL=[
    makeQ('sin',1,'1/2','π/6','s1'),makeQ('sin',1,'√2/2','π/4','s2'),makeQ('sin',1,'√3/2','π/3','s3'),makeQ('sin',-1,'1/2','π/6','s4'),makeQ('sin',-1,'√2/2','π/4','s5'),makeQ('sin',-1,'√3/2','π/3','s6'),
    makeQ('cos',1,'1/2','π/3','c1'),makeQ('cos',1,'√2/2','π/4','c2'),makeQ('cos',1,'√3/2','π/6','c3'),makeQ('cos',-1,'1/2','π/3','c4'),makeQ('cos',-1,'√2/2','π/4','c5'),makeQ('cos',-1,'√3/2','π/6','c6'),
    makeQ('tan',1,'1','π/4','t1'),makeQ('tan',1,'√3','π/3','t2'),makeQ('tan',1,'1/√3','π/6','t3'),makeQ('tan',-1,'1','π/4','t4'),makeQ('tan',-1,'√3','π/3','t5'),makeQ('tan',-1,'1/√3','π/6','t6'),
    makeQ('cot',1,'1','π/4','o1'),makeQ('cot',1,'√3','π/6','o2'),makeQ('cot',1,'1/√3','π/3','o3'),makeQ('cot',-1,'1','π/4','o4'),makeQ('cot',-1,'√3','π/6','o5'),makeQ('cot',-1,'1/√3','π/3','o6')
  ];
  const FIXED_QUIZ_IDS=['s1','c5','t1','o2','s5','c3','t5','o4','s3','c1','t3','o6','s6','c4','t4'];
  function buildQuiz(){return FIXED_QUIZ_IDS.map(id=>POOL.find(q=>q.id===id))}
  function wrongSolutions(q){const a=q.a,m=ANGLES[a];let candidates;if(q.fn==='sin'||q.fn==='cos'){candidates=[solution('sin',1,a),solution('sin',-1,a),solution('cos',1,a),solution('cos',-1,a),`x = ${a} + πn`]}else candidates=[solution(q.fn,-q.sign,a),`x = ${q.sign>0?a:'−'+a} + 2πn`,`x = ±${a} + 2πn`,`x = ${m.comp} + 2πn`];return fixedMix([...new Set(candidates.filter(x=>x!==q.general))],q.id+'wrong').slice(0,3)}
  function answerOptions(q){return fixedMix([q.general,...wrongSolutions(q)],q.id+'answers')}
  function pairOptions(q){const a=q.a,m=ANGLES[a],pairs=[{qs:[1,2],v:[a,m.comp]},{qs:[3,4],v:[m.plus,m.twominus]},{qs:[1,4],v:[a,m.twominus]},{qs:[2,3],v:[m.comp,m.plus]},{qs:[1,3],v:[a,m.plus]},{qs:[2,4],v:[m.comp,m.twominus]}],correct=pairs.find(p=>sameSet(p.qs,q.quads)),others=fixedMix(pairs.filter(p=>p!==correct),q.id+'pairs').slice(0,3);return fixedMix([correct,...others],q.id+'pair-options').map(p=>({value:p.v.join('|'),label:p.v.join(' и ')}))}
  function sameSet(a,b){return a.length===b.length&&a.every(x=>b.includes(x))}
  function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function overfx(){let h='<i class="ceiling-pipe"></i>';for(let i=0;i<7;i++)h+=`<i class="energy-capsule" style="left:${rint(-20,65)}%;--dur:${rint(11,20)}s;--delay:-${rint(0,20)}s"></i>`;for(let i=0;i<5;i++)h+=`<i class="hanging-cable" style="left:${rint(5,95)}%;--dur:${rint(3,7)}s;--delay:-${rint(0,7)}s"></i>`;for(let i=0;i<10;i++)h+=`<i class="fx-spark" style="left:${rint(3,97)}%;--dur:${rint(2,6)}s;--delay:-${rint(0,6)}s"></i>`;for(let i=0;i<6;i++)h+=`<i class="steam" style="left:${rint(0,93)}%;--dur:${rint(9,16)}s;--delay:-${rint(0,16)}s"></i>`;$('overfx').innerHTML=h}
  function hero(){return '<div class="hero"><i class="hero-rig"></i><i class="hero-pipe"></i><i class="hero-reactor"></i><i class="hero-tank"></i></div>'}
  function theoryCircle(step){const base='<circle class="tv-circle" cx="130" cy="105" r="72"/><line class="tv-axis" x1="35" y1="105" x2="225" y2="105"/><line class="tv-axis" x1="130" y1="15" x2="130" y2="195"/><text class="tv-label" x="205" y="96">cos x</text><text class="tv-label" x="139" y="25">sin x</text>';let extra='';if(step===1)extra='<line class="tv-focus" x1="130" y1="20" x2="130" y2="190"/><text class="tv-small" x="139" y="44">нужная ось</text>';if(step===2)extra='<line class="tv-focus" x1="130" y1="20" x2="130" y2="190"/><circle class="tv-dot" cx="130" cy="69" r="7"/><text class="tv-label" x="140" y="65">1/2</text>';if(step===3)extra='<circle class="tv-dot" cx="130" cy="69" r="7"/><line class="tv-level" x1="61" y1="69" x2="199" y2="69"/><circle class="tv-dot" cx="68" cy="69" r="7"/><circle class="tv-dot" cx="192" cy="69" r="7"/><text class="tv-small" x="76" y="60">перпендикуляр</text>';if(step===4)extra='<line class="tv-level" x1="61" y1="69" x2="199" y2="69"/><line class="tv-ray" x1="130" y1="105" x2="192" y2="69"/><line class="tv-ray" x1="130" y1="105" x2="68" y2="69"/><circle class="tv-dot" cx="68" cy="69" r="7"/><circle class="tv-dot" cx="192" cy="69" r="7"/><text class="tv-label" x="188" y="57">π/6</text><text class="tv-label" x="43" y="57">5π/6</text>';return '<div class="theory-visual"><svg viewBox="0 0 260 205" role="img" aria-label="Шаг '+step+' решения на тригонометрической окружности">'+base+extra+'</svg></div>'}
  function theoryWindow(){return `<dialog class="theory-dialog" id="theoryDialog"><div class="theory-head"><span class="tag">Перед стартом</span><h2>Алгоритм решения на окружности</h2><button class="theory-close" id="theoryClose" type="button">Закрыть</button></div><div class="theory-body"><p class="theory-intro">Покажем алгоритм на примере <b>sin x = 1/2</b>. Для другой функции меняются выбранная ось или линия, но последовательность остаётся той же.</p><div class="theory-grid"><article class="theory-step"><b>1</b><h3>Определяем нужную ось по функции</h3><p>Для <b>sin x</b> выбираем вертикальную ось. Для <b>cos x</b> — горизонтальную. Для tg и ctg используем соответствующие линии тангенсов и котангенсов.</p>${theoryCircle(1)}</article><article class="theory-step"><b>2</b><h3>Находим нашу координату на оси</h3><p>Отмечаем на выбранной оси значение из уравнения. В примере это точка <b>1/2</b> на оси синуса.</p>${theoryCircle(2)}</article><article class="theory-step"><b>3</b><h3>Проводим перпендикуляр до окружности</h3><p>Через найденную координату проводим прямую, перпендикулярную выбранной оси, до точек пересечения с окружностью.</p>${theoryCircle(3)}</article><article class="theory-step"><b>4</b><h3>Расположение координат соответствует расположению углов</h3><p>Точки пересечения показывают направления нужных углов. Для <b>sin x=1/2</b> это <b>π/6</b> и <b>5π/6</b>. По ним записываем общие решения.</p>${theoryCircle(4)}</article></div><div class="theory-note"><b>Главная мысль:</b> сначала работаем с координатой на оси, затем с прямой и точками на окружности — и только после этого называем углы. Не подбираем четверти наугад.</div><div class="theory-actions"><button class="primary" id="theoryContinue" type="button">Понятно — к тренажёру</button></div></div></dialog>`}
  function crew(){return '<div class="crew" id="crew"><div class="operator"><i class="op-horn l"></i><i class="op-horn r"></i><div class="op-body"><i class="op-eye l"></i><i class="op-eye r"></i><i class="op-mouth"></i></div><i class="op-arm l"></i><i class="op-arm r"></i><i class="op-leg l"></i><i class="op-leg r"></i></div><i class="runner-track"></i><div class="runner"><div class="runner-body"><i class="runner-eye"></i><i class="runner-mouth"></i></div><i class="root-can"></i><i class="runner-leg l"></i><i class="runner-leg r"></i></div></div>'}
  function storedStudent(){const studentId=localStorage.getItem('egeStudentId');return studentId?{studentId,name:localStorage.getItem('egeStudentName')||'Ученик',code:localStorage.getItem('egeStudentCode')||''}:null}
  function saveStudent(s){localStorage.setItem('egeStudentId',s.studentId);localStorage.setItem('egeStudentName',s.name);localStorage.setItem('egeStudentCode',s.code)}
  function parseStudent(data,code){const src=(data&&(data.student||data.data))||data||{},studentId=src.studentId||src.id||(data&&data.studentId),name=src.studentName||src.name||src.fullName||(data&&(data.studentName||data.name)),bad=data&&(data.success===false||data.valid===false||data.ok===false);if(bad||!studentId)throw new Error((data&&(data.message||data.error))||'Личный код не найден');return{studentId:String(studentId),name:String(name||'Ученик'),code:String(code)}}
  function validateStudent(code){return new Promise((resolve,reject)=>{const cb='egeValidate_'+Date.now()+'_'+Math.random().toString(36).slice(2),s=document.createElement('script');let done=false;const clean=()=>{delete window[cb];s.remove()},timer=setTimeout(()=>{if(done)return;done=true;clean();reject(new Error('Сервер не ответил. Проверь интернет'))},12000);window[cb]=data=>{if(done)return;done=true;clearTimeout(timer);clean();try{resolve(parseStudent(data,code))}catch(e){reject(e)}};s.onerror=()=>{if(done)return;done=true;clearTimeout(timer);clean();reject(new Error('Не удалось проверить код'))};s.src=API_URL+'?'+new URLSearchParams({action:'validateStudent',code,callback:cb});document.head.appendChild(s)})}
  function updateStudent(){const box=$('studentBox');box.style.display=student?'flex':'none';if(student)$('studentName').textContent=student.name;$('switchBtn').disabled=gameActive}
  function readQueue(){try{const q=JSON.parse(localStorage.getItem(PENDING_KEY)||'[]');return Array.isArray(q)?q:[]}catch(_){return[]}}
  function writeQueue(q){localStorage.setItem(PENDING_KEY,JSON.stringify(q))}
  function queueResult(p){const q=readQueue();if(!q.some(x=>x&&x.eventId===p.eventId))q.push(p);writeQueue(q)}
  function removeQueued(id){writeQueue(readQueue().filter(x=>!x||x.eventId!==id))}
  async function postResult(p){const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p),redirect:'follow'});if(!r.ok)throw new Error('submit')}
  async function flushPending(){if(!navigator.onLine)return;for(const p of readQueue()){if(!p||!p.eventId)continue;try{await postResult(p);removeQueued(p.eventId)}catch(_){}}}
  function uuid(){if(window.crypto&&typeof crypto.randomUUID==='function')return crypto.randomUUID();return'evt-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)}
  function localDate(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  function elapsed(){return Math.max(1,Math.round((Date.now()-startedAt)/1000))}
  function timeText(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
  function setSave(cls,text){const e=$('saveStatus');if(e){e.className='save-status '+cls;e.textContent=text}}
  async function submitOnce(score,duration){if(submitted||!student)return;submitted=true;const p={action:'submitTest',eventId,studentId:student.studentId,testId:TEST_META.testId,testDate:localDate(),topicId:TEST_META.topicId,topicName:TEST_META.topicName,taskNumber:TEST_META.taskNumber,scorePercent:score,durationSeconds:duration,schemaVersion:TEST_META.schemaVersion};setSave('','Сохраняем результат…');try{if(!navigator.onLine)throw new Error('offline');await postResult(p);removeQueued(p.eventId);setSave('ok','✓ Результат сохранён')}catch(_){queueResult(p);setSave('bad','Нет связи: результат сохранён на устройстве и отправится позже')}}
  function renderLogin(prefill=''){gameActive=false;student=null;updateStudent();$('app').innerHTML=`<section class="screen login"><div class="panel"><span class="tag">Вход в диспетчерскую</span><h1>Диспетчерская корней</h1><p class="lead">Введи личный код ученика. Имя загрузится автоматически.</p><form class="code-form" id="loginForm"><input class="code" id="codeInput" maxlength="40" autocomplete="one-time-code" placeholder="ЛИЧНЫЙ КОД" value="${esc(prefill)}"><button class="primary" id="loginBtn">Проверить пропуск</button><div class="status" id="loginStatus"></div></form></div>${hero()}</section>`;$('loginForm').addEventListener('submit',handleLogin);if(prefill)setTimeout(()=>$('loginForm').requestSubmit(),0)}
  async function handleLogin(e){e.preventDefault();const input=$('codeInput'),btn=$('loginBtn'),status=$('loginStatus'),code=input.value.trim();if(!code){status.className='status bad';status.textContent='Введи личный код';return}input.disabled=btn.disabled=true;status.textContent='Проверяем пропуск…';try{student=await validateStudent(code);saveStudent(student);updateStudent();await flushPending();renderStart()}catch(err){status.className='status bad';status.textContent=err.message||'Код не подтверждён';input.disabled=btn.disabled=false;input.focus()}}
  function renderStart(){phase='start';gameActive=false;updateStudent();$('app').innerHTML=`<section class="screen start"><div class="panel"><span class="tag">Тренажёр тригонометрических уравнений</span><h1>Найди все корни</h1><p class="lead">Пятнадцать фиксированных уравнений на sin, cos, tg и ctg. Для каждого выбери полное общее решение.</p><div class="rules"><div class="rule"><b>15</b>уравнений</div><div class="rule"><b>4</b>варианта</div><div class="rule"><b>1</b>фиксированный набор</div></div><p>Уравнения и их порядок всегда одинаковые. Ошибку можно исправить, но такое уравнение уже не засчитывается с первой попытки. Таймера нет.</p><button class="secondary theory-open" id="theoryBtn" type="button">Краткая теория</button><button class="primary" id="startBtn" type="button">Запустить тренажёр</button></div>${hero()}</section>${theoryWindow()}`;$('startBtn').addEventListener('click',startSession);const d=$('theoryDialog'),close=()=>d.close();$('theoryBtn').onclick=()=>d.showModal();$('theoryClose').onclick=close;$('theoryContinue').onclick=close;d.addEventListener('cancel',e=>{e.preventDefault();close()});d.showModal()}
  function startSession(){phase='quiz';quizIndex=0;quizQuestions=buildQuiz();currentFailed=false;stepLocked=false;firstTryCorrect=0;startedAt=Date.now();eventId=uuid();submitted=false;gameActive=true;updateStudent();sound('start');renderQuiz()}
  function renderGuided(){const q=GUIDED[guidedIndex],progress=(guidedIndex*4+stepIndex)/(GUIDED.length*4+15)*100;$('app').innerHTML=`<section class="screen game"><div class="hud"><span class="chip">Обучение ${guidedIndex+1}/5 · Шаг ${stepIndex+1}/4</span><div class="track"><i style="width:${progress}%"></i></div><span class="chip">Верно сразу: <b>${firstTryCorrect}</b></span></div><div class="lab"><div class="workspace"><div class="reactor-panel"><div class="reactor-frame"><svg class="circle-svg" id="circle" viewBox="0 0 400 400"></svg></div></div><div class="operator-console"><span class="phase-tag">Подробная отработка</span><div class="equation">${esc(q.tex)}</div><div class="step-title" id="stepTitle"></div><div class="explain" id="explain"></div><div id="controls"></div><div class="feedback" id="feedback">Система ждёт решения</div><div class="next-row"><button class="primary hidden" id="nextBtn">Следующий шаг</button></div></div></div>${crew()}</div></section>`;stepLocked=false;selectedQuads=new Set();drawCircle(q,stepIndex);renderStepControls(q)}
  function renderStepControls(q){const title=$('stepTitle'),text=$('explain'),box=$('controls');if(stepIndex===0){title.textContent='Шаг 1 — Определи функцию и знак';text.innerHTML=`В уравнении нужно заметить функцию <b>${FORM[q.fn]}</b> и знак правой части. Сейчас значение ${q.sign>0?'<b>положительное</b>':'<b>отрицательное</b>'}. Выбери функцию.`;box.innerHTML=`<div class="options">${fixedMix(['sin','cos','tan','cot'],q.id+'functions').map(fn=>`<button class="option" data-fn="${fn}">${FORM[fn]} x</button>`).join('')}</div>`;box.querySelectorAll('.option').forEach(b=>b.onclick=()=>checkSimple(b,b.dataset.fn===q.fn,`Верно: работаем с ${FORM[q.fn]}, значение ${q.sign>0?'положительное':'отрицательное'}.`))}
    else if(stepIndex===1){title.textContent='Шаг 2 — Найди опорный угол α';text.innerHTML=`Опорный угол всегда берём <b>острым</b>. Вспомни табличное значение: ${FORM[q.fn]} α = ${q.value}. Какой угол подходит?`;box.innerHTML=`<div class="options">${fixedMix(['π/6','π/4','π/3','π/2'],q.id+'angles').map(a=>`<button class="option" data-a="${a}">α = ${a}</button>`).join('')}</div>`;box.querySelectorAll('.option').forEach(b=>b.onclick=()=>checkSimple(b,b.dataset.a===q.a,`Опорный угол найден: α = ${q.a} (${q.alphaDeg}°).`))}
    else if(stepIndex===2){title.textContent='Шаг 3 — Выбери четверти';text.innerHTML=`Сначала смотри только на знак функции. ${FORM[q.fn]} x ${q.sign>0?'> 0':'< 0'}. Выбери <b>две четверти</b>, где выполняется этот знак.`;box.innerHTML=`<div class="quadrants">${[1,2,3,4].map(n=>`<button class="quad-btn" data-q="${n}"><b>${QUAD_NAMES[n]}</b>четверть</button>`).join('')}</div><div class="next-row"><button class="secondary" id="quadCheck">Проверить четверти</button></div>`;box.querySelectorAll('.quad-btn').forEach(b=>b.onclick=()=>{const n=+b.dataset.q;selectedQuads.has(n)?selectedQuads.delete(n):selectedQuads.add(n);b.classList.toggle('selected');drawCircle(q,stepIndex,[...selectedQuads])});$('quadCheck').onclick=()=>checkQuadrants(q)}
    else{title.textContent='Шаг 4 — Получи углы из α';text.innerHTML=`Опорный угол <b>α = ${q.a}</b>. Не вспоминай готовую пару: подставь α в формулу каждой выбранной четверти. Затем выбери оба корня на одном обороте.`;box.innerHTML=`<div class="formula-board">${[[1,'α'],[2,'π − α'],[3,'π + α'],[4,'2π − α']].map(([n,f])=>`<div class="formula-cell ${q.quads.includes(n)?'active':''}"><b>${QUAD_NAMES[n]}</b>: ${f}</div>`).join('')}</div><div class="options">${pairOptions(q).map(p=>`<button class="option" data-pair="${p.value}">${p.label}</button>`).join('')}</div>`;box.querySelectorAll('.option').forEach(b=>b.onclick=()=>checkRoots(b,q))}
  }
  function markFailed(){currentFailed=true}
  function checkSimple(button,ok,message){if(stepLocked||button.disabled)return;if(ok){stepLocked=true;button.classList.add('correct');document.querySelectorAll('.option').forEach(b=>b.disabled=true);good(message);react('cheer');sound('good');showNext()}else{markFailed();button.classList.add('wrong');button.disabled=true;bad('Пока неверно. Сопоставь запись уравнения с выбранным элементом.');react('panic');sound('bad')}}
  function checkQuadrants(q){if(stepLocked)return;const picked=[...selectedQuads].sort(),correct=[...q.quads].sort();if(sameSet(picked,correct)){stepLocked=true;good(`${FORM[q.fn]} ${q.sign>0?'положителен':'отрицателен'} в ${q.quads.map(n=>QUAD_NAMES[n]).join(' и ')} четвертях.`);drawCircle(q,stepIndex,q.quads);react('cheer');sound('good');showNext()}else{markFailed();bad('Неверный набор четвертей. Проверь знак функции на каждой четверти.');react('panic');sound('bad')}}
  function checkRoots(button,q){if(stepLocked||button.disabled)return;const roots=button.dataset.pair.split('|');if(sameSet(roots,q.roots)){stepLocked=true;button.classList.add('correct');document.querySelectorAll('.option').forEach(b=>b.disabled=true);good(`Корни на одном обороте: ${q.roots.join(' и ')}. Общее решение: ${q.general}, n ∈ Z.`);drawCircle(q,stepIndex,q.quads,true);transferRoots(q.roots);react('cheer');sound('good');if(!currentFailed)firstTryCorrect++;showNext(guidedIndex===4?'Перейти к практике':'Следующее уравнение')}else{markFailed();button.classList.add('wrong');button.disabled=true;bad('Один или оба угла построены не из тех четвертей. Используй четыре формулы над вариантами.');react('panic');sound('bad')}}
  function good(t){const f=$('feedback');f.className='feedback good';f.textContent=t}function bad(t){const f=$('feedback');f.className='feedback bad';f.textContent=t}
  function showNext(label='Следующий шаг'){const b=$('nextBtn');b.textContent=label;b.classList.remove('hidden');b.onclick=nextGuided}
  function nextGuided(){if(stepIndex<3){stepIndex++;renderGuided()}else if(guidedIndex<4){guidedIndex++;stepIndex=0;currentFailed=false;renderGuided()}else renderBridge()}
  function drawCircle(q,step,active=[],roots=false){const svg=$('circle');if(!svg)return;const sectors=[[200,200,200,35,365,200,1],[200,200,35,200,200,35,2],[200,200,200,365,35,200,3],[200,200,365,200,200,365,4]];let h=sectors.map(([cx,cy,x1,y1,x2,y2,n])=>`<path class="quad ${active.includes(n)||step>=3&&q.quads.includes(n)?'active':''}" d="M${cx} ${cy}L${x1} ${y1}A165 165 0 0 ${n===1||n===3?1:0} ${x2} ${y2}Z"/>`).join('');h+=`<circle class="unit" cx="200" cy="200" r="165"/><line class="axis" x1="20" y1="200" x2="380" y2="200"/><line class="axis" x1="200" y1="20" x2="200" y2="380"/><text class="qtext" x="310" y="92">I</text><text class="qtext" x="87" y="92">II</text><text class="qtext" x="83" y="325">III</text><text class="qtext" x="310" y="325">IV</text>`;const a=q.alphaDeg*Math.PI/180,px=200+165*Math.cos(a),py=200-165*Math.sin(a);h+=`<line class="formula-ray" x1="200" y1="200" x2="${px}" y2="${py}"/><text class="angle-label" x="${200+76*Math.cos(a)}" y="${200-76*Math.sin(a)-8}">α</text>`;if(step>=2)h+=`<line class="scan-beam" x1="200" y1="200" x2="365" y2="200"/>`;if(roots)q.quads.forEach((quad,i)=>{const deg=quad===1?q.alphaDeg:quad===2?180-q.alphaDeg:quad===3?180+q.alphaDeg:360-q.alphaDeg,r=deg*Math.PI/180,x=200+165*Math.cos(r),y=200-165*Math.sin(r),lx=200+190*Math.cos(r),ly=200-190*Math.sin(r);h+=`<line class="root-ray" x1="200" y1="200" x2="${x}" y2="${y}"/><circle class="root-dot" cx="${x}" cy="${y}" r="10"/><text class="angle-label" x="${lx}" y="${ly}">${q.roots[i]}</text>`});svg.innerHTML=h}
  function transferRoots(roots){const lab=document.querySelector('.lab');if(!lab)return;roots.forEach((r,i)=>{const e=document.createElement('i');e.className='root-transfer';e.textContent=r;e.style.animationDelay=i*.16+'s';lab.appendChild(e);setTimeout(()=>e.remove(),1300)})}
  function react(cls){const c=$('crew');if(!c)return;c.classList.remove('cheer','panic');void c.offsetWidth;c.classList.add(cls);setTimeout(()=>c&&c.classList.remove(cls),850)}
  function renderBridge(){phase='bridge';gameActive=true;updateStudent();$('app').innerHTML=`<section class="screen bridge"><div class="panel"><span class="tag">Обучение завершено</span><h1>Алгоритм собран</h1><p class="lead">Теперь каждое уравнение решается одной цепочкой:</p><div class="rules"><div class="rule"><b>1</b>функция и знак</div><div class="rule"><b>2–3</b>α и четверти</div><div class="rule"><b>4</b>углы и серии</div></div><p>В следующих 15 заданиях выбирай сразу полное общее решение. Ошибка не останавливает практику, но задание не засчитывается с первой попытки.</p><button class="primary" id="quizBtn">Запустить самостоятельную смену</button></div>${hero()}</section>`;$('quizBtn').onclick=()=>{phase='quiz';quizIndex=0;renderQuiz()}}
  function renderQuiz(){const q=quizQuestions[quizIndex],progress=quizIndex/TOTAL*100;$('app').innerHTML=`<section class="screen game"><div class="hud"><span class="chip">Уравнение ${quizIndex+1}/${TOTAL}</span><div class="track"><i style="width:${progress}%"></i></div><span class="chip">Верно сразу: <b>${firstTryCorrect}</b></span></div><div class="lab"><div class="quiz-layout"><div class="quiz-reactor"><div class="quiz-orb" id="quizOrb"><div class="quiz-equation">${esc(q.tex)}</div></div></div><div class="quiz-console"><span class="phase-tag">Полное решение</span><h2>Выбери все корни уравнения</h2><div class="answer-grid">${answerOptions(q).map(x=>`<button class="answer" data-answer="${esc(x)}">${esc(x)}</button>`).join('')}</div><div class="feedback" id="feedback">Найди опорный угол, четверти и общее решение</div><div class="next-row"><button class="primary hidden" id="quizNext">Следующее уравнение</button></div></div></div>${crew()}</div></section>`;currentFailed=false;stepLocked=false;document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>checkQuiz(b,q))}
  function numericValue(v){return{'1/2':.5,'√2/2':Math.SQRT1_2,'√3/2':Math.sqrt(3)/2,'1':1,'√3':Math.sqrt(3),'1/√3':1/Math.sqrt(3)}[v]}
  function rootDegree(q,quad){return quad===1?q.alphaDeg:quad===2?180-q.alphaDeg:quad===3?180+q.alphaDeg:360-q.alphaDeg}
  function showQuizCircle(q){const orb=$('quizOrb');if(!orb)return;orb.classList.add('solved');const points=q.quads.map((quad,i)=>{const deg=rootDegree(q,quad),r=deg*Math.PI/180,x=200+150*Math.cos(r),y=200-150*Math.sin(r),lx=200+177*Math.cos(r),ly=200-177*Math.sin(r);return{deg,x,y,lx,ly,label:q.roots[i]}});let line='';const value=q.sign*numericValue(q.value);if(q.fn==='sin'){const y=200-value*150;line=`<line class="solution-line" x1="50" y1="${y}" x2="350" y2="${y}"/>`}else if(q.fn==='cos'){const x=200+value*150;line=`<line class="solution-line" x1="${x}" y1="50" x2="${x}" y2="350"/>`}else{const a=points[0],b=points[1];line=`<line class="solution-line" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>`}const roots=points.map(p=>`<line class="solution-ray" x1="200" y1="200" x2="${p.x}" y2="${p.y}"/><circle class="solution-root" cx="${p.x}" cy="${p.y}" r="10"/><text class="root-name" x="${p.lx}" y="${p.ly}">${p.label}</text>`).join('');orb.innerHTML=`<div class="circle-eq">${esc(q.tex)}</div><svg class="quiz-circle" viewBox="0 0 400 400"><circle class="base" cx="200" cy="200" r="150"/><line class="axis" x1="28" y1="200" x2="372" y2="200"/><line class="axis" x1="200" y1="28" x2="200" y2="372"/><text class="qname" x="307" y="92">I</text><text class="qname" x="82" y="92">II</text><text class="qname" x="77" y="321">III</text><text class="qname" x="304" y="321">IV</text>${line}${roots}</svg>`}
  function checkQuiz(button,q){if(stepLocked||button.disabled)return;if(button.dataset.answer===q.general){stepLocked=true;if(!currentFailed)firstTryCorrect++;button.classList.add('correct');document.querySelectorAll('.answer').forEach(b=>b.disabled=true);good(`Верно. Прямая пересекает окружность в точках ${q.roots.join(' и ')}.`);showQuizCircle(q);transferRoots(q.roots);react('cheer');sound('good');const next=$('quizNext');next.textContent=quizIndex===TOTAL-1?'Завершить тренажёр':'Следующее уравнение';next.classList.remove('hidden');next.onclick=()=>{quizIndex++;if(quizIndex>=TOTAL)finish();else renderQuiz()}}else{currentFailed=true;button.classList.add('wrong');button.disabled=true;bad('Неверное множество корней. Проверь знак, четверти и период функции.');react('panic');sound('bad')}}
  function finish(){phase='final';gameActive=false;updateStudent();const seconds=elapsed(),score=Math.round(firstTryCorrect/TOTAL*100);$('app').innerHTML=`<section class="screen final"><div class="panel"><span class="tag">Смена завершена</span><h1>${score>=85?'Главный диспетчер корней!':score>=60?'Маршрут почти настроен':'Нужен ещё один запуск'}</h1><div class="ring" style="background:conic-gradient(#a5da4d ${score}%,#bfd0df 0)"><b>${score}%</b></div><p><b>Успешность с первой попытки</b></p><div class="stats"><div class="stat">Верно сразу<b>${firstTryCorrect} из ${TOTAL}</b></div><div class="stat">Время прохождения<b>${timeText(seconds)}</b></div></div><div class="save-status" id="saveStatus">Сохраняем результат…</div><div class="actions"><button class="primary" id="againBtn">Пройти заново</button><button class="secondary" id="homeBtn">На старт</button></div></div>${hero()}</section>`;$('againBtn').onclick=startSession;$('homeBtn').onclick=renderStart;sound('finish');submitOnce(score,seconds)}
  function changeStudent(){if(gameActive)return;['egeStudentId','egeStudentName','egeStudentCode'].forEach(k=>localStorage.removeItem(k));renderLogin()}
  function sound(type){if(muted)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ac=sound.ac||(sound.ac=new AC()),now=ac.currentTime,g=ac.createGain(),sets={good:[[430,.12],[650,.29]],bad:[[150,.18],[92,.35]],start:[[180,.15],[310,.34]],finish:[[260,.12],[470,.29],[710,.49]]},set=sets[type]||[[300,.1]];g.connect(ac.destination);g.gain.setValueAtTime(.043,now);g.gain.exponentialRampToValueAtTime(.0001,now+set[set.length-1][1]+.13);set.forEach(([f,d],i)=>{const o=ac.createOscillator();o.type=type==='bad'?'sawtooth':'triangle';o.frequency.value=f;o.connect(g);o.start(now+i*.04);o.stop(now+d+.08)})}catch(_){}}
  $('switchBtn').onclick=changeStudent;$('soundBtn').onclick=()=>{muted=!muted;$('soundBtn').textContent=muted?'Без звука':'Звук'};window.addEventListener('online',flushPending);overfx();
  async function init(){const code=new URLSearchParams(location.search).get('code');if(code){renderLogin(code);return}student=storedStudent();if(student){updateStudent();await flushPending();renderStart()}else renderLogin()}init();
  </script>
