<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Итоговый тест по программной инженерии</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f7fa;
    color: #1a1a2e;
    margin: 0;
    padding: 20px;
    line-height: 1.6;
  }
  .container { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 1.6em; margin-bottom: 8px; }
  .subtitle { color: #666; margin-bottom: 24px; font-size: 0.95em; }
  .question-card {
    background: #fff;
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    border: 2px solid transparent;
    transition: border-color 0.3s;
  }
  .question-card.correct { border-color: #2ecc71; }
  .question-card.incorrect { border-color: #e74c3c; }
  .q-number {
    display: inline-block;
    background: #4361ee;
    color: #fff;
    border-radius: 50%;
    width: 28px;
    height: 28px;
    text-align: center;
    line-height: 28px;
    font-weight: 700;
    font-size: 0.85em;
    margin-right: 10px;
  }
  .q-text { font-weight: 600; font-size: 1.05em; margin-bottom: 16px; }
  .context {
    background: #f0f4ff;
    border-left: 4px solid #4361ee;
    padding: 12px 16px;
    margin-bottom: 16px;
    border-radius: 0 8px 8px 0;
    font-size: 0.92em;
    color: #333;
  }
  .option {
    display: flex;
    align-items: flex-start;
    padding: 12px 16px;
    margin-bottom: 8px;
    border: 2px solid #e0e4ec;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
    background: #fff;
  }
  .option:hover { border-color: #4361ee; background: #f8faff; }
  .option.selected { border-color: #4361ee; background: #eef2ff; }
  .option.correct-answer { border-color: #2ecc71; background: #eafaf1; }
  .option.wrong-answer { border-color: #e74c3c; background: #fdedec; }
  .option input { margin-top: 4px; margin-right: 12px; flex-shrink: 0; }
  .option label { cursor: pointer; flex: 1; }
  .option.disabled { cursor: default; }
  .option.disabled:hover { background: inherit; }
  .btn {
    display: inline-block;
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    font-size: 0.95em;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    margin-right: 8px;
    margin-top: 8px;
  }
  .btn-check { background: #4361ee; color: #fff; }
  .btn-check:hover { background: #3651d4; }
  .btn-check:disabled { background: #c0c8d8; cursor: not-allowed; }
  .btn-terms { background: #f0f4ff; color: #4361ee; }
  .btn-terms:hover { background: #e0e8ff; }
  .btn-reset { background: #f5f7fa; color: #666; }
  .btn-reset:hover { background: #e8ecf2; }
  .explanation {
    display: none;
    margin-top: 16px;
    padding: 16px;
    background: #fafbfc;
    border-radius: 8px;
    border-left: 4px solid #4361ee;
    font-size: 0.94em;
  }
  .explanation.show { display: block; }
  .explanation h4 { margin: 0 0 12px 0; font-size: 1em; }
  .explanation .verdict { font-weight: 700; margin-bottom: 12px; }
  .verdict.ok { color: #2ecc71; }
  .verdict.fail { color: #e74c3c; }
  .explanation table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 0.9em; }
  .explanation th, .explanation td { border: 1px solid #e0e4ec; padding: 6px 10px; text-align: left; }
  .explanation th { background: #f0f4ff; }
  .terms-panel {
    display: none;
    margin-top: 12px;
    padding: 16px;
    background: #fffbea;
    border-radius: 8px;
    border-left: 4px solid #f39c12;
    font-size: 0.93em;
  }
  .terms-panel.show { display: block; }
  .terms-panel dt { font-weight: 700; margin-top: 10px; color: #b9770e; }
  .terms-panel dd { margin: 2px 0 0 0; padding-left: 0; }
  .progress {
    background: #fff;
    border-radius: 12px;
    padding: 16px 24px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }
  .progress-info { font-weight: 600; }
  .progress-bar {
    height: 8px;
    background: #e0e4ec;
    border-radius: 4px;
    overflow: hidden;
    flex: 1;
    min-width: 200px;
    margin-left: 16px;
  }
  .progress-fill {
    height: 100%;
    background: #4361ee;
    width: 0%;
    transition: width 0.3s;
  }
  .footer-actions { text-align: center; margin: 32px 0; }
  .score {
    font-size: 1.1em;
    font-weight: 700;
    text-align: center;
    padding: 16px;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    margin-bottom: 20px;
    display: none;
  }
  .score.show { display: block; }
  @media (max-width: 600px) {
    body { padding: 12px; }
    .question-card { padding: 16px; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>Итоговый тест по программной инженерии</h1>
  <p class="subtitle">17 вопросов · случайный порядок · бесконечные попытки</p>

  <div class="progress">
    <span class="progress-info" id="progressInfo">Отвечено: 0 из 17</span>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <div class="score" id="score"></div>

  <div id="quiz"></div>

  <div class="footer-actions">
    <button class="btn btn-reset" onclick="location.reload()">🔄 Перемешать и начать заново</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    id: 1,
    context: "Выбор между монолитом и микросервисами для нового продукта (маленькая команда, быстрый MVP, возможный сильный рост позже).",
    question: "Какие утверждения верны?",
    correct: [2, 4],
    options: [
      { n: 1, text: "Микросервисы автоматически решают проблемы консистентности данных." },
      { n: 2, text: "Монолит часто предпочтителен на ранних стадиях: ускоряет разработку, упрощает деплой и снижает операционные издержки." },
      { n: 3, text: "Микросервисы исключают необходимость CI/CD и тестирования, потому что сервисы автономны." },
      { n: 4, text: "Если ожидается быстрая эволюция нескольких независимых доменов и нужны автономные команды — стоит рассмотреть микросервисы." },
      { n: 5, text: "Микросервисная архитектура предполагает сильную связанность между командами разработки." }
    ],
    terms: {
      "Монолит": "Приложение, собранное в один большой кусок кода и разворачиваемое как единое целое. Внутри могут быть разные модули, но живут они в одном проекте и одной БД.",
      "Микросервисы": "Архитектура, где приложение разбито на много маленьких независимых сервисов. Каждый отвечает за свою узкую область, имеет свою БД и деплоится отдельно.",
      "MVP": "Minimum Viable Product — минимально жизнеспособный продукт. Первая рабочая версия с минимумом функций, но уже полезная.",
      "CI/CD": "Непрерывная интеграция и доставка. Автоматическая сборка, тестирование и деплой кода.",
      "Консистентность данных": "Согласованность данных. Когда во всех местах системы данные не противоречат друг другу.",
      "Связанность (coupling)": "Насколько сильно компоненты зависят друг от друга. Сильная = меняешь одно, ломается другое.",
      "Автономные команды": "Команды, которые сами отвечают за свой сервис: сами пишут, тестируют, деплоят."
    },
    explanation: "Вариант 2 верен: маленькая команда → нет ресурсов на инфраструктуру микросервисов; быстрый MVP → монолит быстрее: один проект, один деплой, одна база. Операционные издержки ниже.\n\nВариант 4 верен: здесь есть условие «если» — микросервисы оправданы, когда есть несколько независимых доменов и автономные команды, которые могут деплоить независимо.\n\nВариант 1 неверен: микросервисы наоборот усложняют консистентность — у каждого своя БД, нужны саги и компенсации. Слово «автоматически» — красный флаг.\n\nВариант 3 неверен: CI/CD и тесты нужны ещё больше — каждый сервис надо отдельно собирать и тестировать.\n\nВариант 5 неверен: микросервисы — про слабую связанность и автономные команды, а не сильную.",
    table: [
      [1, "❌", "Консистентность усложняется, не решается сама"],
      [2, "✅", "Монолит на старте: скорость, простота, меньше затрат"],
      [3, "❌", "CI/CD и тесты нужны больше"],
      [4, "✅", "Микросервисы — при независимых доменах и автономных командах"],
      [5, "❌", "Микросервисы — про слабую связанность"]
    ]
  },
  {
    id: 2,
    context: "Крупный интернет-магазин на монолите. Выделяют сервис заказов. Оформление заказа — распределённая транзакция: проверка склада, резервирование, списание оплаты, подтверждение. Планируют Strangler Fig, DDD и Kafka. Бизнес допускает кратковременную неконсистентность, но итоговая согласованность обязательна.",
    question: "Какие утверждения верны?",
    correct: [2, 3, 5, 6],
    options: [
      { n: 1, text: "DDD не применим при миграции с монолита, потому что ограниченные контексты невозможно выделить из унаследованной кодовой базы." },
      { n: 2, text: "Apache Kafka в данной архитектуре выступает реплицированным логом событий, позволяя сервисам асинхронно общаться, а за счёт настраиваемого retention предоставляет возможность перестроения состояния и аудита." },
      { n: 3, text: "Для распределённой транзакции заказа целесообразно использовать сагу с компенсирующими действиями, так как 2PC неприемлем из-за длительной блокировки и снижения доступности." },
      { n: 4, text: "Для гарантии атомарности всей операции необходимо использовать строгий двухфазный коммит между сервисами заказов, оплаты и склада." },
      { n: 5, text: "Выделение микросервиса заказов должно опираться на bounded context «Заказы», что обеспечит сильную когезию и отделение от контекстов «Склад» и «Оплата»." },
      { n: 6, text: "Применение паттерна Strangler Fig позволяет постепенно переключить трафик с монолита на новый сервис заказов через API-шлюз." },
      { n: 7, text: "Strangler Fig требует одномоментного отключения монолита и переключения всего трафика на микросервис." },
      { n: 8, text: "В рамках саги не нужны компенсирующие действия, поскольку асинхронная природа Kafka исключает возможность сбоев бизнес-логики." }
    ],
    terms: {
      "Strangler Fig": "Паттерн постепенной миграции с монолита на микросервисы. Ставим API-шлюз, постепенно переключаем трафик на новые сервисы. Старое отключаем только когда всё перенесено.",
      "API-шлюз": "Единая точка входа для запросов. Решает, куда направить запрос: в старый монолит или новый сервис.",
      "DDD": "Domain-Driven Design — проектирование от бизнес-домена, а не от технологий.",
      "Bounded context": "Граница, внутри которой термины и модель имеют одно конкретное значение. Пример: «товар» на складе и «товар» в продажах — разные вещи.",
      "Распределённая транзакция": "Операция, затрагивающая несколько сервисов/баз и должна выполниться как единое целое.",
      "2PC": "Two-Phase Commit, двухфазный коммит. Сначала все «готовятся», потом все «подтверждают». Долго блокирует и снижает доступность.",
      "Сага": "Разбиение большой транзакции на цепочку маленьких шагов с компенсациями при сбое.",
      "Оркестрация": "В саге есть центральный координатор, который управляет шагами.",
      "Хореография": "В саге нет центрального координатора — сервисы сами подписываются на события.",
      "Компенсирующее действие": "«Откат» уже выполненного шага. Пример: зарезервировали товар → оплата не прошла → снять резерв.",
      "Eventual consistency": "Итоговая согласованность. Данные временно могут расходиться, но со временем приходят к согласованному состоянию.",
      "Retention": "Сколько времени Kafka хранит сообщения независимо от того, прочитали их или нет.",
      "Когезия": "Насколько элементы внутри модуля связаны по смыслу. Высокая = всё по делу."
    },
    explanation: "Вариант 2 верен: Kafka — реплицированный лог, retention позволяет перечитывать события для аудита и перестроения состояния.\n\nВариант 3 верен: заказ затрагивает несколько сервисов → нужна сага с компенсациями. 2PC долго блокирует и снижает доступность — не подходит.\n\nВариант 5 верен: DDD разбивает домен на bounded contexts. Микросервис выделяют по границе контекста — тогда внутри сильная когезия, снаружи слабая связанность.\n\nВариант 6 верен: Strangler Fig — постепенная миграция через API-шлюз, риски минимальны.\n\nВариант 1 неверен: DDD как раз применяют при миграции, чтобы понять границы.\n\nВариант 4 неверен: 2PC не единственный способ, и он не подходит из-за снижения доступности.\n\nВариант 7 неверен: Strangler Fig — полная противоположность одномоментному переключению.\n\nВариант 8 неверен: компенсации в саге обязательны. Kafka не исключает сбои бизнес-логики.",
    table: [
      [1, "❌", "DDD применим, контексты выделить можно"],
      [2, "✅", "Kafka = реплицированный лог, retention для аудита"],
      [3, "✅", "Сага с компенсациями; 2PC неприемлем"],
      [4, "❌", "2PC не единственный и не подходит"],
      [5, "✅", "Bounded context «Заказы» → когезия, отделение"],
      [6, "✅", "Strangler Fig = постепенное переключение"],
      [7, "❌", "Strangler Fig не про одномоментное отключение"],
      [8, "❌", "Компенсации в саге обязательны"]
    ]
  },
  {
    id: 3,
    context: "Сервис бронирования билетов. В пиковые минуты нагрузка растёт в 20 раз, пользователи логинятся с мобильных, после перезапуска инстанса сессии теряются.",
    question: "Укажите верные решения.",
    correct: [2, 3, 6],
    options: [
      { n: 1, text: "Чем больше TTL, тем лучше для фактора консистентности данных." },
      { n: 2, text: "Для снижения нагрузки применять cache-aside с TTL и продуманной стратегией инвалидирования." },
      { n: 3, text: "Приложение держать stateless, а user session/state выносить вовне." },
      { n: 4, text: "Sticky sessions всегда полностью решают проблему горизонтального масштабирования." },
      { n: 5, text: "Приложение реализовать как stateful." },
      { n: 6, text: "Для сессий и короткоживущих данных можно использовать Redis как распределённое хранилище." }
    ],
    terms: {
      "Нагрузка": "Сколько запросов одновременно приходит в систему.",
      "Инстанс": "Один запущенный экземпляр приложения.",
      "Сессия": "Данные о том, что пользователь залогинен и его состояние.",
      "Sticky sessions": "Балансировщик направляет запросы одного пользователя всегда на один и тот же сервер.",
      "Stateless": "Приложение не хранит состояние между запросами. Любой инстанс обработает любой запрос.",
      "Stateful": "Приложение хранит состояние. Запросы пользователя надо направлять на тот же сервер.",
      "Cache-aside": "Паттерн кэширования: сначала смотрим в кэш, если нет — идём в базу и кладём в кэш.",
      "TTL": "Time To Live — время жизни записи в кэше.",
      "Инвалидирование": "Удаление/обновление записи в кэше при изменении данных в базе.",
      "Redis": "Быстрая БД в оперативной памяти. Часто используется как общее хранилище для сессий."

    explanation: "Вариант 2 верен: нагрузка ×20 → база не выдержит. Cache-aside разгружает базу, TTL и инвалидирование следят за свежестью данных.\n\nВариант 3 верен: сессии теряются при перезапуске, потому что хранятся внутри инстанса. Решение: сделать приложение stateless, а сессии вынести во внешнее хранилище.\n\nВариант 6 верен: Redis — быстрое хранилище в памяти, доступное всем инстансам. Идеален для сессий и короткоживущих данных.\n\nВариант 1 неверен: большой TTL → данные долго не обновляются → риск отдать устаревшее.\n\nВариант 4 неверен: sticky sessions мешают масштабированию. «Всегда полностью» — красный флаг.\n\nВариант 5 неверен: stateful — это и есть причина потери сессий.",
    table: [

      { n: 4, text: "Трейсы не применяются в распределённых системах из-за отсутствия технической возможности отследить связи между вызовами." },

    explanation: "Вариант 2 верен: монолит — один процесс, один лог, один деплой. Отладка, мониторинг, CI/CD проще.\n\nВариант 3 верен: в условии трудности с масштабированием отдельных модулей. Микросервисы позволяют масштабировать только нагруженный сервис и деплоить независимо.\n\nВариант 5 верен: микросервисы общаются по сети → сетевые задержки. Сервисы меняются → нужен service discovery. Наблюдать надо за множеством → распределённый мониторинг.\n\nВариант 1 неверен: микросервисы наоборот создают проблему распределённых транзакций. Атомарность только внутри одного сервиса.\n\nВариант 4 неверен: монолит можно развернуть в Kubernetes как один под. «Невозможно» — прямо неверно.",
    table: [
      [1, "❌", "Микросервисы создают распределённые транзакции"],
      [2, "✅", "Монолит проще в отладке/мониторинге/CI-CD"],
      [3, "✅", "Микросервисы: независимое масштабирование"],
      [4, "❌", "Монолит можно катить в Kubernetes"],
      [5, "✅", "Микросервисы: задержки, service discovery, мониторинг"]
    ]
  }
];

// --- Логика теста ---
let state = {}; // { questionId: { selected: [n], checked: bool } }

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function render() {
  const quiz = document.getElementById('quiz');
  quiz.innerHTML = '';
  const order = shuffle(QUESTIONS);
  order.forEach((q, idx) => {
    const card = document.createElement('div');
    card.className = 'question-card';
    card.dataset.qid = q.id;
    card.innerHTML = `
      <div><span class="q-number">${idx + 1}</span><span class="q-text">${q.question}</span></div>
      <div class="context">${q.context}</div>
      <div class="options"></div>
      <div>
        <button class="btn btn-terms" data-action="terms">📖 Термины</button>
        <button class="btn btn-check" data-action="check">✅ Проверить</button>
      </div>
      <div class="terms-panel" data-role="terms-panel"></div>
      <div class="explanation" data-role="explanation"></div>
    `;
    const optionsEl = card.querySelector('.options');
    q.options.forEach(opt => {
      const div = document.createElement('div');
      div.className = 'option';
      div.dataset.n = opt.n;
      div.innerHTML = `<input type="checkbox" id="q${q.id}_o${opt.n}"><label for="q${q.id}_o${opt.n}">${opt.n}. ${opt.text}</label>`;
      div.addEventListener('click', (e) => {
        if (state[q.id]?.checked) return;
        if (e.target.tagName !== 'INPUT') {
          const cb = div.querySelector('input');
          cb.checked = !cb.checked;
        }
        div.classList.toggle('selected', div.querySelector('input').checked);
      });
      optionsEl.appendChild(div);
    });

    // Terms panel
    const termsPanel = card.querySelector('[data-role="terms-panel"]');
    termsPanel.innerHTML = '<strong>Термины:</strong><dl>' +
      Object.entries(q.terms).map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('') +
      '</dl>';

    // Buttons
    card.querySelector('[data-action="terms"]').addEventListener('click', () => {
      termsPanel.classList.toggle('show');
    });
    card.querySelector('[data-action="check"]').addEventListener('click', () => checkAnswer(q, card));

    quiz.appendChild(card);
  });
  updateProgress();
}

function checkAnswer(q, card) {
  if (state[q.id]?.checked) return;
  const selected = [];
  card.querySelectorAll('.option').forEach(div => {
    if (div.querySelector('input').checked) selected.push(parseInt(div.dataset.n));
  });
  if (selected.length === 0) {
    alert('Выберите хотя бы один вариант.');
    return;
  }
  state[q.id] = { selected, checked: true };

  const correct = q.correct;
  const isCorrect = selected.length === correct.length && selected.every(n => correct.includes(n));

  card.classList.add(isCorrect ? 'correct' : 'incorrect');
  card.querySelectorAll('.option').forEach(div => {
    const n = parseInt(div.dataset.n);
    div.classList.add('disabled');
    div.querySelector('input').disabled = true;
    if (correct.includes(n)) div.classList.add('correct-answer');
    if (selected.includes(n) && !correct.includes(n)) div.classList.add('wrong-answer');
  });

  // Explanation
  const exp = card.querySelector('[data-role="explanation"]');
  const verdict = isCorrect
    ? '<div class="verdict ok">✅ Верно!</div>'
    : '<div class="verdict fail">❌ Неверно. Правильные: ' + correct.join(', ') + '</div>';
  const table = '<table><tr><th>№</th><th></th><th>Почему</th></tr>' +
    q.table.map(row => `<tr><td>${row[0]}</td><td>${row[1]}</td><td>${row[2]}</td></tr>`).join('') +
    '</table>';
  exp.innerHTML = verdict + '<div>' + q.explanation.replace(/\n\n/g, '</p><p>').replace(/^/, '<p>') + '</p></div>' + table;
  exp.classList.add('show');

  card.querySelector('[data-action="check"]').disabled = true;
  updateProgress();
}

function updateProgress() {
  const total = QUESTIONS.length;
  const answered = Object.keys(state).filter(id => state[id]?.checked).length;
  document.getElementById('progressInfo').textContent = `Отвечено: ${answered} из ${total}`;
  document.getElementById('progressFill').style.width = (answered / total * 100) + '%';

  const scoreEl = document.getElementById('score');
  if (answered === total) {
    let correctCount = 0;
    QUESTIONS.forEach(q => {
      const s = state[q.id];
      if (!s) return;
      const isCorrect = s.selected.length === q.correct.length && s.selected.every(n => q.correct.includes(n));
      if (isCorrect) correctCount++;
    });
    scoreEl.textContent = `🎯 Результат: ${correctCount} из ${total} (${Math.round(correctCount/total*100)}%)`;
    scoreEl.classList.add('show');
  }
}

render();
</script>
