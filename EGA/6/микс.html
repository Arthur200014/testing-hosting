<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#087ea4"><title>Подводный блиц · выбор способа · ЕГЭ №9</title><style>
:root{
  --sky:#59d7e6;--water:#179fc4;--deep:#075e8c;--navy:#073e63;
  --sand:#f4dc8e;--sand2:#d6b96e;--ink:#173948;--paper:#fffbed;
  --yellow:#ffd83d;--orange:#f49b2c;--green:#4bc65d;--red:#f0534b;
  --pink:#f47cb0;--purple:#9b6ad6;--wood:#a96530;--wood2:#73441f;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Trebuchet MS","Arial Rounded MT Bold",system-ui,sans-serif;color:var(--ink)}
body{overflow:hidden;background:var(--deep);user-select:none}
button,input{font:inherit}
button{-webkit-tap-highlight-color:transparent}
.hidden{display:none!important}
#game{position:fixed;inset:0;overflow:hidden;background:
  radial-gradient(circle at 17% 12%,rgba(255,255,255,.38) 0 2px,transparent 3px),
  radial-gradient(circle at 73% 17%,rgba(255,255,255,.22) 0 3px,transparent 4px),
  linear-gradient(180deg,var(--sky),var(--water) 43%,var(--deep))}
#game::before{content:"";position:absolute;inset:-20% -15% 30%;pointer-events:none;
  background:repeating-conic-gradient(from 178deg at 50% -5%,rgba(255,255,255,.15) 0 7deg,transparent 8deg 20deg);
  filter:blur(6px);animation:rays 9s ease-in-out infinite alternate}
@keyframes rays{to{transform:translateX(3%) skewX(4deg);opacity:.65}}
.seafloor{position:absolute;left:-5%;right:-5%;bottom:-8%;height:27%;
  background:linear-gradient(var(--sand),var(--sand2));border-radius:50% 45% 0 0/34% 32% 0 0;
  box-shadow:0 -8px 25px rgba(6,63,86,.18)}
.seafloor::before{content:"";position:absolute;inset:15% 2% 0;
  background-image:radial-gradient(#b89850 1.5px,transparent 2px);background-size:34px 25px;opacity:.42}
.scene{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.flower{position:absolute;width:96px;height:96px;opacity:.35;animation:drift 7s ease-in-out infinite alternate}
.flower::before,.flower::after{content:"";position:absolute;inset:24px;border:7px solid #eaf6b0;border-radius:50%}
.flower::after{transform:rotate(60deg);border-radius:45%}
.f1{left:6%;top:16%;transform:scale(.8)}.f2{right:7%;top:23%;transform:scale(1.15);animation-delay:-3s}
.f3{left:58%;top:5%;transform:scale(.5);animation-delay:-6s}
@keyframes drift{to{translate:0 -12px;rotate:8deg}}
.coral{position:absolute;bottom:7%;font-size:clamp(70px,10vw,150px);filter:saturate(.8);transform-origin:bottom;animation:sway 4s ease-in-out infinite alternate}
.c1{left:2%;color:var(--pink)}.c2{right:2%;color:var(--purple);animation-delay:-2s}
@keyframes sway{to{transform:rotate(4deg)}}
.rock{position:absolute;bottom:9%;width:110px;height:65px;background:#8ca2a2;border:5px solid #597b7e;
  border-radius:55% 45% 18% 20%;box-shadow:inset 12px 8px rgba(255,255,255,.16)}
.r1{left:15%}.r2{right:18%;width:72px;height:48px}
.bubble{position:absolute;bottom:-40px;border:2px solid rgba(255,255,255,.72);border-radius:50%;
  background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.8),transparent 45%);
  animation:rise linear infinite}
@keyframes rise{0%{translate:0 0;opacity:0}10%{opacity:.9}100%{translate:25px -112vh;opacity:0}}
.jelly{position:absolute;font-size:50px;opacity:.55;animation:jelly 12s ease-in-out infinite}
.j1{left:4%;top:42%}.j2{right:6%;top:50%;animation-delay:-6s}
@keyframes jelly{50%{translate:20px -30px;rotate:8deg}}

.hud{position:absolute;z-index:20;left:18px;right:18px;top:14px;display:grid;
  grid-template-columns:auto minmax(170px,1fr) auto auto;align-items:center;gap:12px}
.pill{height:48px;display:flex;align-items:center;gap:8px;padding:0 16px;border-radius:18px;
  color:#fff;font-weight:900;background:rgba(4,58,89,.72);border:3px solid rgba(255,255,255,.45);
  box-shadow:0 5px 0 rgba(3,45,70,.5);backdrop-filter:blur(5px)}
.pill small{font-size:10px;letter-spacing:.08em;opacity:.72;text-transform:uppercase}
.iconbtn{width:48px;padding:0;justify-content:center;border:0;cursor:pointer}

.sign{position:absolute;z-index:9;left:50%;top:76px;translate:-50% 0;width:min(700px,88vw);
  transform-origin:50% -35px;animation:sign 4.8s ease-in-out infinite alternate}
@keyframes sign{from{rotate:-1deg}to{rotate:1deg}}
.rope{position:absolute;top:-42px;width:7px;height:46px;border-radius:9px;
  background:repeating-linear-gradient(45deg,#d4b16c 0 4px,#8e632d 4px 8px)}
.rope.a{left:19%}.rope.b{right:19%}
.board{position:relative;padding:13px 22px 15px;text-align:center;color:#fff6c9;
  background:linear-gradient(165deg,#a96934,#7b4822);border:7px solid #5a341b;border-radius:18px;
  box-shadow:inset 0 0 0 3px rgba(255,225,146,.2),0 10px 20px rgba(0,0,0,.26)}
.board::after{content:"";position:absolute;inset:8px;border:2px dashed rgba(255,231,171,.28);border-radius:8px}
.eyebrow{position:relative;z-index:1;font-size:11px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:#ffd94d}
#prototype{position:relative;z-index:1;margin-top:2px;font-weight:900;font-size:clamp(15px,2.1vw,20px)}

.stage{position:absolute;z-index:12;left:50%;top:30%;translate:-50% 0;width:min(860px,92vw)}
.card{position:relative;background:linear-gradient(180deg,#fffdf3,#fff4c9);border:5px solid #ffd64a;
  border-radius:24px;padding:22px 25px 20px;box-shadow:0 16px 0 rgba(5,60,82,.3),0 25px 44px rgba(4,42,63,.25);
  transform-origin:center;animation:cardIn .52s cubic-bezier(.2,1.35,.5,1) both}
.card::before{content:"";position:absolute;left:50%;top:-14px;translate:-50% 0;width:94px;height:28px;
  background:rgba(255,233,112,.72);border:2px dashed rgba(169,116,24,.45);rotate:-2deg}
@keyframes cardIn{from{opacity:0;transform:translate(var(--fly-x,0),var(--fly-y,-70px)) rotate(var(--fly-r,-4deg)) scale(.7)}
  to{opacity:1;transform:none}}
.qmeta{display:flex;align-items:center;justify-content:space-between;gap:12px;color:#50818e;
  font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.06em}
.source{padding:4px 9px;border-radius:99px;background:#dff4ec;color:#23835a}
.question{margin:12px 0 16px;font-size:clamp(16px,2.05vw,21px);font-weight:850;line-height:1.38;color:#153946}
.formula{white-space:nowrap;font-family:Georgia,"Times New Roman",serif;font-size:1.04em}
.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.answer{position:relative;min-height:66px;padding:10px;border:3px solid #77c8d6;border-radius:17px;background:#f7ffff;
  color:#11425a;font-weight:900;font-size:clamp(17px,2.5vw,23px);cursor:pointer;
  box-shadow:0 6px 0 #3c98ab;transition:transform .12s,box-shadow .12s,background .15s}
.answer::before{content:attr(data-letter);position:absolute;left:9px;top:9px;width:23px;height:23px;display:grid;
  place-items:center;border-radius:50%;background:#d7f4f7;color:#267a8c;font-size:11px}
.answer:hover:not(:disabled){transform:translateY(-3px);box-shadow:0 9px 0 #3c98ab}
.answer:active:not(:disabled){transform:translateY(5px);box-shadow:0 1px 0 #3c98ab}
.answer:disabled{cursor:default}
.answer.correct{border-color:#35ac4c;background:#dff8d9;box-shadow:0 6px 0 #26883b;color:#1c742e}
.answer.wrong{border-color:#e14d48;background:#ffe0d9;box-shadow:0 6px 0 #b83a35;color:#a12424;animation:shake .35s}
@keyframes shake{20%,60%{translate:-7px 0}40%,80%{translate:7px 0}}
.tools{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px}
.hintbtn,.nextbtn{border:0;border-radius:14px;padding:11px 17px;font-weight:900;cursor:pointer}
.hintbtn{color:#754812;background:#ffe17b;box-shadow:0 5px 0 #c99a2a}
.hintbtn:active,.nextbtn:active{translate:0 4px;box-shadow:0 1px 0 rgba(0,0,0,.25)}
.nextbtn{margin-left:auto;color:white;background:#45bd59;box-shadow:0 5px 0 #288b39}
.feedback{display:none;margin-top:15px;padding:12px 14px;border-radius:14px;font-weight:800;line-height:1.35}
.feedback.show{display:block;animation:open .24s ease-out}
.feedback.good{background:#dcf7da;color:#1e7431}.feedback.bad{background:#ffe2dd;color:#9d2b29}
.hintbox{display:none;margin-top:13px;padding:12px 14px;border-radius:14px;background:#fff1a9;
  color:#704c13;font-weight:800;line-height:1.38;border:2px dashed #d5a83d}
.hintbox.show{display:block;animation:open .24s ease-out}
@keyframes open{from{opacity:0;translate:0 -6px}}

.overlay{position:absolute;z-index:100;inset:0;display:grid;place-items:center;padding:24px;
  background:radial-gradient(circle at 50% 20%,rgba(23,159,196,.57),rgba(3,49,78,.92));backdrop-filter:blur(5px)}
.panel{width:min(590px,94vw);max-height:94vh;overflow:auto;padding:29px;border:7px solid var(--wood2);
  border-radius:28px;background:linear-gradient(180deg,#fffdf1,#ffe6a1);text-align:center;
  box-shadow:inset 0 0 0 4px #fff8dc,0 24px 60px rgba(0,0,0,.42)}
.logo{font-size:58px;line-height:1;filter:drop-shadow(0 5px 0 rgba(4,67,91,.23));animation:logo 2.6s ease-in-out infinite}
@keyframes logo{50%{translate:0 -7px;rotate:4deg}}
h1{margin:8px 0 3px;font-size:clamp(31px,6vw,51px);line-height:.98;color:#138bb4;
  text-shadow:0 3px 0 #fff,0 6px 0 rgba(6,86,117,.18)}
.lead{margin:8px auto 16px;color:#3b6670;font-weight:800;line-height:1.4}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:17px 0}
.rule{padding:11px 8px;border-radius:15px;background:rgba(23,144,178,.1);font-size:12px;font-weight:900;color:#315d67}
.rule b{display:block;font-size:22px;margin-bottom:3px}
.studentrow{display:flex;align-items:center;justify-content:center;gap:9px;margin:4px 0 16px;font-weight:900;color:#1c7996}
.change{border:0;background:none;text-decoration:underline;color:#6d7d7d;font-size:12px;font-weight:900;cursor:pointer}
.mainbtn{border:0;border-radius:17px;padding:14px 34px;color:white;font-size:21px;font-weight:900;cursor:pointer;
  background:linear-gradient(#6ada72,#39b94c);box-shadow:0 8px 0 #248a35,0 13px 22px rgba(0,0,0,.18)}
.mainbtn:hover{translate:0 -2px}.mainbtn:active{translate:0 6px;box-shadow:0 2px 0 #248a35}
.codeLabel{display:block;text-align:left;margin:15px 2px 7px;font-weight:900;color:#41656c}
.codeInput{width:100%;padding:13px 16px;border:3px solid #8fc9d4;border-radius:14px;background:#fff;
  color:#17455b;text-align:center;text-transform:uppercase;font-size:23px;font-weight:900;letter-spacing:.1em;outline:0}
.codeInput:focus{border-color:#1b9cbd;box-shadow:0 0 0 5px rgba(27,156,189,.16)}
.authmsg{min-height:22px;margin:9px 0;font-size:13px;font-weight:800;color:#657b80}
.authmsg.error{color:#bd3531}.authmsg.ok{color:#288c3a}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:17px 0}
.stat{padding:12px 6px;border:3px solid #efc644;border-radius:16px;background:#fffdf6}
.stat b{display:block;font-size:27px;color:#087fa5}.stat span{font-size:10px;color:#688087;text-transform:uppercase;font-weight:900}
.save{margin:11px 0 16px;padding:9px;border-radius:12px;background:rgba(17,129,162,.09);font-size:13px;font-weight:900;color:#447079}
.save.saved{background:#dff4d9;color:#287936}.save.queued{background:#fff1b9;color:#7f6116}
.summary{margin:8px 0 17px;font-weight:800;color:#496b71;line-height:1.4}
.streak{position:fixed;z-index:80;left:50%;top:50%;translate:-50% -50%;font-size:clamp(32px,7vw,70px);
  font-weight:1000;color:#fff04c;-webkit-text-stroke:3px #77491c;paint-order:stroke fill;
  pointer-events:none;animation:streak .8s ease-out forwards}
@keyframes streak{0%{opacity:0;scale:.4;rotate:-8deg}25%{opacity:1;scale:1.15}100%{opacity:0;translate:-50% -130%;scale:.9}}

@media(max-width:700px){
  .hud{left:8px;right:8px;top:8px;gap:6px;grid-template-columns:auto 1fr auto auto}
  .pill{height:42px;padding:0 10px;border-width:2px;border-radius:14px}.pill small{display:none}
  .iconbtn{width:42px}
  .sign{top:61px}.stage{top:25%;width:94vw}.card{padding:18px 15px 15px}
  .card{max-height:72vh;overflow-y:auto}
  .question{margin:10px 0 13px;max-height:26vh;overflow:auto}
  .answers{grid-template-columns:1fr;gap:8px}.answer{min-height:50px;font-size:18px}
  .tools{margin-top:11px}.panel{padding:22px 17px}.rules{grid-template-columns:1fr 1fr}
  .rule:last-child{grid-column:1/-1}.coral{opacity:.55}
}
@media(max-height:700px) and (min-width:701px){
  .sign{top:65px}.stage{top:29%}.card{padding:17px 20px 15px}
  .question{font-size:16px;margin:8px 0 11px}.answer{min-height:52px}.tools{margin-top:11px}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-iteration-count:1!important}}

/* Игровой режим: движущийся пузырь и иголки-ответы */
.hud{grid-template-columns:auto auto 48px;justify-content:end}
.arena{position:absolute;z-index:12;left:0;right:0;top:128px;bottom:154px;overflow:hidden}
.problem-bubble{position:absolute;width:min(570px,82vw);min-height:280px;padding:50px 58px 46px;
  display:flex;flex-direction:column;justify-content:center;isolation:isolate;
  border:5px solid rgba(229,253,255,.92);border-radius:50%;
  background:radial-gradient(circle at 28% 19%,rgba(255,255,255,.92) 0 3%,rgba(255,255,255,.2) 4% 10%,transparent 11%),
    radial-gradient(circle at 50% 52%,rgba(244,255,251,.89),rgba(181,243,249,.76) 58%,rgba(68,200,224,.52));
  box-shadow:inset 20px 17px 32px rgba(255,255,255,.72),inset -22px -24px 35px rgba(26,143,183,.28),
    0 0 0 7px rgba(255,255,255,.16),0 22px 40px rgba(3,62,91,.3);
  will-change:left,top;transition:filter .15s}
.problem-bubble::before{content:"";position:absolute;z-index:-1;inset:5%;border:2px solid rgba(255,255,255,.52);
  border-radius:50%;animation:breathe 2.2s ease-in-out infinite alternate}
.problem-bubble::after{content:"";position:absolute;right:18%;top:13%;width:16%;height:8%;
  border-top:7px solid rgba(255,255,255,.62);border-radius:50%;rotate:24deg}
@keyframes breathe{to{inset:3%;opacity:.6}}
.problem-bubble.target{filter:drop-shadow(0 0 18px #fff45c) brightness(1.08)}
.problem-bubble.wobble{animation:bubbleWobble .42s ease}
@keyframes bubbleWobble{20%{transform:scale(1.04) rotate(2deg)}45%{transform:scale(.97) rotate(-2deg)}75%{transform:scale(1.02)}}
.problem-bubble.pop{animation:bubblePop .55s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes bubblePop{0%{opacity:1;transform:scale(1)}55%{opacity:.9;transform:scale(1.16)}
  100%{opacity:0;transform:scale(1.48);filter:blur(8px)}}
.problem-bubble .qmeta{position:relative;z-index:2;justify-content:center;margin-bottom:5px}
.problem-bubble .source{background:rgba(255,255,255,.55)}
.problem-bubble .question{position:relative;z-index:2;margin:7px 0 0;max-height:150px;overflow:auto;
  text-align:center;font-size:clamp(15px,1.75vw,19px);line-height:1.35;text-shadow:0 1px rgba(255,255,255,.8)}
.problem-bubble .hintbox{position:relative;z-index:2;margin:10px 0 0;padding:9px 12px;
  max-height:86px;overflow:auto;text-align:center;background:rgba(255,241,169,.82);font-size:13px}
.needle-dock{position:absolute;z-index:25;left:0;right:0;bottom:12px;display:flex;align-items:flex-end;
  justify-content:center;gap:clamp(12px,3vw,42px);padding:0 16px;pointer-events:none}
.needle{position:relative;pointer-events:auto;width:min(210px,28vw);height:78px;padding:9px 40px 9px 12px;
  border:4px solid #684328;border-radius:18px 10px 10px 18px;color:#482c17;
  background:linear-gradient(180deg,#ffd95d,#f3a82f);font-weight:1000;font-size:clamp(16px,2vw,22px);
  box-shadow:0 7px 0 #a75d26,0 12px 20px rgba(3,51,72,.3);cursor:grab;touch-action:none;
  transition:filter .15s,transform .15s,box-shadow .15s;transform-origin:center}
.needle::before{content:"";position:absolute;right:-50px;top:31px;width:54px;height:8px;
  background:linear-gradient(#f5ffff,#7f9ca4);border:2px solid #546c73;border-left:0;border-radius:0 8px 8px 0}
.needle::after{content:"";position:absolute;right:-65px;top:28px;width:0;height:0;
  border-top:7px solid transparent;border-bottom:7px solid transparent;border-left:17px solid #dff7fa;
  filter:drop-shadow(2px 0 #536b72)}
.needle:nth-child(2){background:linear-gradient(180deg,#ff97bd,#e65b95);box-shadow:0 7px 0 #a73569,0 12px 20px rgba(3,51,72,.3)}
.needle:nth-child(3){background:linear-gradient(180deg,#8ae585,#47bd61);box-shadow:0 7px 0 #24853c,0 12px 20px rgba(3,51,72,.3)}
.needle:hover{transform:translateY(-3px) rotate(-1deg);filter:brightness(1.05)}
.needle.dragging{position:fixed;z-index:200;margin:0;cursor:grabbing;transform:rotate(-8deg) scale(1.05);
  transition:none;box-shadow:0 16px 28px rgba(0,0,0,.35)}
.needle.snap{transition:left .32s cubic-bezier(.3,1.5,.5,1),top .32s,transform .32s}
.needle.wrong{animation:needleWrong .4s}
@keyframes needleWrong{25%,75%{filter:hue-rotate(135deg) saturate(1.8);transform:rotate(8deg)}50%{transform:rotate(-8deg)}}
.game-tools{position:absolute;z-index:28;left:50%;bottom:112px;translate:-50% 0;display:flex;
  align-items:center;justify-content:center;gap:12px}
.game-message{min-width:210px;max-width:min(620px,70vw);padding:10px 15px;border-radius:15px;
  background:rgba(4,58,89,.8);border:2px solid rgba(255,255,255,.45);color:white;
  font-size:13px;font-weight:900;text-align:center;backdrop-filter:blur(5px)}
.game-message:empty{display:none}
.hintbtn{white-space:nowrap}
.burst-drop{position:fixed;z-index:210;width:14px;height:14px;border:3px solid rgba(255,255,255,.8);
  border-radius:50%;pointer-events:none;animation:dropBurst .65s ease-out forwards}
@keyframes dropBurst{to{translate:var(--dx) var(--dy);scale:.15;opacity:0}}

@media(max-width:700px){
  .hud{grid-template-columns:auto auto 42px}
  .arena{top:108px;bottom:230px}
  .problem-bubble{width:91vw;min-height:300px;padding:47px 30px 42px}
  .problem-bubble .question{max-height:158px;font-size:15px}
  .needle-dock{bottom:10px;flex-direction:column;align-items:flex-start;gap:9px;padding-left:18px}
  .needle{width:calc(100vw - 88px);max-width:none;height:58px;font-size:17px;padding-right:35px}
  .needle::before{top:21px}.needle::after{top:18px}
  .game-tools{bottom:205px;width:94vw}.game-message{max-width:58vw}
}


/* ===== currentSession / выбор способа ===== */
body{overflow:hidden}
#game{isolation:isolate}
.scene-top{position:fixed;inset:0;z-index:7;pointer-events:none;overflow:hidden}
.swim-fish{position:absolute;left:-120px;top:var(--y);font-size:var(--s);opacity:.68;filter:drop-shadow(0 4px 4px #075e8c55);animation:fishAcross var(--d) linear infinite;animation-delay:var(--delay)}
.swim-fish.rev{left:auto;right:-120px;animation-name:fishAcrossR}
@keyframes fishAcross{from{transform:translateX(-10vw) scaleX(1)}to{transform:translateX(125vw) scaleX(1)}}
@keyframes fishAcrossR{from{transform:translateX(10vw) scaleX(-1)}to{transform:translateX(-125vw) scaleX(-1)}}
.fx-bubble{position:absolute;bottom:-30px;border:2px solid #ffffffcc;border-radius:50%;background:radial-gradient(circle at 28% 23%,#fff 0 8%,#ffffff30 12%,transparent 56%);animation:fxRise var(--d) linear infinite;animation-delay:var(--delay);opacity:.72}
@keyframes fxRise{from{transform:translate(0,0) scale(.8);opacity:0}10%{opacity:.72}to{transform:translate(var(--drift),-115vh) scale(1.25);opacity:0}}

/* публичная комната / лобби */
.system-overlay{position:absolute;z-index:105;inset:0;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 50% 15%,rgba(53,200,225,.48),rgba(3,49,78,.9));backdrop-filter:blur(5px)}
.system-overlay.hidden{display:none!important}
.system-panel{width:min(720px,95vw);max-height:92vh;overflow:auto;padding:26px;border:7px solid var(--wood2);border-radius:28px;background:linear-gradient(180deg,#fffdf1,#ffe6a1);box-shadow:inset 0 0 0 4px #fff8dc,0 24px 60px #0006;text-align:center}
.system-panel h1{font-size:clamp(30px,6vw,50px)}
.session-kicker{display:inline-block;padding:6px 10px;border-radius:99px;background:#0f89ad;color:white;font-size:11px;font-weight:1000;letter-spacing:.08em;text-transform:uppercase}

 {id:'q01',source:1,prototype:'Квадратный корень · перевод единиц',text:`Расстояние до горизонта вычисляется по формуле <span class="formula">l = √(2Rh)</span>, где <span class="formula">R = 6400 км</span>. У подножия площадки горизонт виден на 4 км. На сколько метров нужно подняться, чтобы расстояние увеличилось до 28 км?`,hint:'Не вычисляй ответ сразу: сначала вырази высоту h через l и R, затем сравни две высоты.',correct:`<strong>Выразить высоту из формулы</strong>h = l²/(2R) → отдельно получить h для 28 км и 4 км → найти разность высот → в самом конце перевести километры в метры.`,wrong:[`<strong>Сначала найти среднее расстояние</strong>(28+4)/2 → подставить его вместо l → из одной высоты сразу получить требуемый подъём.`,`<strong>Возвести разность расстояний в квадрат</strong>(28−4)² → разделить на 2R → считать это сразу разностью высот.`]},
 {id:'q02',source:2,prototype:'Рациональное неравенство · эффект Доплера',text:`Частота сигнала равна <span class="formula">f = 170·(c + 12)/(c − 6)</span>. При какой максимальной скорости <span class="formula">c</span> частота будет не меньше 180 Гц?`,hint:'Сначала зафиксируй область c > 6 и знак знаменателя.',correct:`<strong>Учесть c &gt; 6</strong>по смыслу знаменатель c−6 положителен → домножить неравенство на c−6 без смены знака → собрать c в одной части → получить допустимый промежуток и взять его максимальную границу.`,wrong:[`<strong>Сразу приравнять f к 180</strong>решить только уравнение и любой найденный корень объявить ответом, не рассматривая неравенство и максимальную границу.`,`<strong>Перенести всё в одну дробь</strong>затем автоматически считать, что знаменатель отрицателен, поменять знак неравенства и выбрать минимальную границу.`]},
 {id:'q03',source:3,prototype:'Показательная зависимость · полураспад',text:`Масса изотопа меняется по закону <span class="formula">m(t) = 50·2<sup>−t/5</sup></span>. Через сколько минут масса станет равной 12,5 мг?`,hint:'После деления обеих частей на 50 справа получится простая степень двойки.',correct:`<strong>Оставить степень одну</strong>разделить равенство на 50 → представить 12,5/50 как 1/4 = 2⁻² → при одинаковом основании 2 приравнять показатели → решить линейное уравнение для t.`,wrong:[`<strong>Раскрыть отрицательную степень как минус</strong>заменить 2⁻ᵗ⁄⁵ на −2ᵗ⁄⁵ → перенести 50 и решить полученное линейное уравнение.`,`<strong>Сразу взять логарифм десятичный</strong>от обеих частей исходного равенства, не отделяя множитель 50 и не используя красивое отношение 1/4.`]},
 {id:'q04',source:4,prototype:'Квадратное уравнение · равноускоренное движение',text:`Путь мотоциклиста задаётся формулой <span class="formula">S = 90t + 16t²/2</span>, где время <span class="formula">t</span> измеряется в часах. За сколько минут он удалится на 72 км?`,hint:'Подставь S=72: неизвестная останется и в t, и в t².',correct:`<strong>Составить квадратное уравнение</strong>подставить S=72 и привести к виду at²+bt+c=0 → найти корни → отрицательный/неподходящий по смыслу отбросить → положительное время в часах перевести в минуты.`,wrong:[`<strong>Считать движение равномерным</strong>выбросить слагаемое 16t²/2 → использовать только t=S/v → затем перевести часы в минуты.`,`<strong>Сначала извлечь квадратный корень</strong>из обеих частей 72=90t+8t² → получить линейное равенство для √t и выбрать больший корень.`]},
 {id:'q05',source:5,prototype:'Логарифмическая формула · работа газа',text:`Работа сжатия воздуха равна <span class="formula">A = ανT·log₂(p₂/p₁)</span>. Дано: <span class="formula">A = 15960</span>, <span class="formula">α = 13,3</span>, <span class="formula">ν = 2</span>, <span class="formula">T = 300</span>, <span class="formula">p₁ = 1,75</span>. Найди p₂.`,hint:'Сначала нужно выразить сам логарифм, а уже потом «снимать» его.',correct:`<strong>Сначала выразить log₂</strong>разделить A на ανT → получить log₂(p₂/p₁)=число → перейти к степени p₂/p₁=2^число → умножить на p₁ и найти p₂.`,wrong:[`<strong>Сразу убрать log₂</strong>записать p₂/p₁ = 2ᴬ, не деля A на коэффициент ανT → затем найти p₂.`,`<strong>Разложить логарифм частного</strong>как log₂p₂ / log₂p₁ → подставить числа и решить пропорцию.`]},
 {id:'q06',source:11,prototype:'Тригонометрическое неравенство · время полёта',text:`Время полёта мяча равно <span class="formula">t = 2v₀sinα/g</span>. При каком наименьшем угле α время будет не меньше 3,2 с, если v₀=16 м/с, g=10 м/с²?`,hint:'После подстановки сравни требуемое значение sinα с диапазоном значений синуса.',correct:`<strong>Получить неравенство для sinα</strong>подставить v₀, g и t≥3,2 → сократить коэффициенты → сравнить требование с максимальным значением sinα=1 → выбрать наименьший угол из физически допустимого диапазона.`,wrong:[`<strong>Заменить sinα на α</strong>считать, что при небольших углах sinα=α без оговорок → решить линейное неравенство и перевести число в градусы.`,`<strong>Использовать cosα</strong>заменить sin на cos по формуле приведения → решить cosα≥1 и взять α=0° как время максимального полёта.`]},
 {id:'q07',source:12,prototype:'Степенное уравнение · адиабатическое сжатие',text:`Для газа выполняется <span class="formula">p₁V₁<sup>1,4</sup> = p₂V₂<sup>1,4</sup></span>. Дано p₁=1, V₁=294,4 л, p₂=128. Найди V₂.`,hint:'Удобно сначала собрать отношение V₁/V₂ и заменить 1,4 на 7/5.',correct:`<strong>Собрать отношение объёмов</strong>(V₁/V₂)^1,4 = p₂/p₁ =128 → заменить 1,4 на 7/5 и 128 на 2⁷ → возвести обе части в степень 5/7 → найти V₁/V₂, затем V₂.`,wrong:[`<strong>Сократить степени объёмов</strong>считать V₁^1,4/V₂^1,4 = (V₁−V₂)^1,4 → извлечь степень и найти разность объёмов.`,`<strong>Возвести обе части в 7/5</strong>после получения отношения в степени 7/5 ещё раз увеличить степень до 49/25, а затем делить V₁ на результат.`]},
 {id:'q08',source:17,prototype:'Рациональное неравенство · сопротивление',text:`При параллельном соединении <span class="formula">Rобщ = 72R/(72 + R)</span>. Какое наименьшее R нужно, чтобы Rобщ ≥ 8 Ом?`,hint:'При R>0 знаменатель 72+R точно положителен.',correct:`<strong>Использовать положительность знаменателя</strong>при R&gt;0 имеем 72+R&gt;0 → домножить неравенство без смены знака → перенести слагаемые с R → получить нижнюю границу R и взять наименьшее допустимое значение.`,wrong:[`<strong>Домножить и поменять знак</strong>считать 72+R отрицательным → развернуть ≥ в ≤ → выбрать верхнюю границу R.`,`<strong>Приравнять знаменатель к нулю</strong>найти R=−72 и использовать расстояние от этой точки до 8 как минимальное сопротивление.`]},
 {id:'q09',source:18,prototype:'Формула линзы · система ограничений',text:`Для чёткого изображения <span class="formula">1/d₁ + 1/d₂ = 1/20</span>. d₂ можно менять от 100 до 120 см. На каком наименьшем d₁ нужно поставить лампочку?`,hint:'Сначала вырази d₁ через d₂; после этого используй допустимый диапазон d₂.',correct:`<strong>Выразить d₁ как функцию d₂</strong>из формулы получить d₁=20d₂/(d₂−20) → на d₂∈[100;120] эта величина уменьшается → для минимального d₁ взять максимальное d₂=120 и подставить.`,wrong:[`<strong>Взять середину диапазона</strong>d₂=(100+120)/2 → подставить 110 и считать полученное d₁ автоматически минимальным.`,`<strong>Минимизировать знаменатель</strong>взять наименьшее d₂=100, потому что меньший знаменатель якобы всегда делает всю дробь меньше.`]},
 {id:'q10',source:22,prototype:'Тригонометрическая формула · энергия',text:`Скорость груза: <span class="formula">v = 1,5cos(2πt/2)</span>. Энергия: <span class="formula">E = mv²/2</span>, m=0,16 кг. Найди энергию через 20 с.`,hint:'Сначала упрости аргумент косинуса и используй периодичность.',correct:`<strong>Сначала найти скорость</strong>подставить t=20 → упростить аргумент до 20π=2π·10 → по периодичности получить cos=1 → найти v → затем подставить v в E=mv²/2.`,wrong:[`<strong>Сразу подставить t в энергию</strong>заменить v² на t² и вычислить E=mt²/2, не используя формулу скорости.`,`<strong>Перевести 20π в градусы</strong>считать 20π как 20° → найти cos20° → затем энергию.`]},
 {id:'q11',source:30,prototype:'Квадратное неравенство · длина промежутка',text:`Высота мяча <span class="formula">h(t)=2+13t−5t²</span>. Сколько секунд мяч будет на высоте не менее 8 м?`,hint:'Нужно не только найти моменты h=8, но и ответить на «сколько длится».',correct:`<strong>Решить квадратное неравенство</strong>2+13t−5t²≥8 → найти два граничных корня → определить промежуток времени, где парабола удовлетворяет ≥8 → ответом взять длину этого промежутка t₂−t₁.`,wrong:[`<strong>Решить только h=8</strong>найти меньший корень и записать его как длительность пребывания выше 8 м.`,`<strong>Найти вершину параболы</strong>координату t вершины сразу считать длительностью, не находя границы h=8.`]},
 {id:'q12',source:31,prototype:'Дробная степень · закон идеального газа',text:`Для газа <span class="formula">pV<sup>5/3</sup> = 6,4·10⁶</span>. Какой объём при p=2·10⁵ Па?`,hint:'После деления на p получается V^(5/3)=красивое число.',correct:`<strong>Изолировать степень V</strong>разделить на p → получить V^(5/3)=32=2⁵ → возвести обе части в обратную степень 3/5 → упростить (2⁵)^(3/5) и получить V.`,wrong:[`<strong>Умножить показатели 5/3 и 5/3</strong>возвести обе части ещё раз в 5/3 → затем извлечь квадратный корень.`,`<strong>Разделить V на 5/3</strong>трактовать показатель как обычный множитель: V·5/3=32 → решить линейное уравнение.`]},
 {id:'q13',source:35,prototype:'Четвёртая степень · Стефан–Больцман',text:`Мощность звезды <span class="formula">P=σST⁴</span>. Дано σ=5,7·10⁻⁸, S=(1/18)·10²¹, P=4,104·10²⁷. Найди T.`,hint:'Сначала полностью вычисли P/(σS), не округляя промежуточно.',correct:`<strong>Выразить T⁴</strong>T⁴=P/(σS) → отдельно аккуратно обработать числовые коэффициенты и степени 10 → получить точное значение T⁴ → взять положительный корень четвёртой степени, так как температура T&gt;0.`,wrong:[`<strong>Извлечь квадратный корень дважды до деления</strong>сначала взять √P, √σ и √S по отдельности, округлить, затем повторно извлечь корень.`,`<strong>Считать T⁴ как 4T</strong>разделить найденное значение правой части на 4 и считать результат температурой.`]},
 {id:'q14',source:36,prototype:'Квадратичное неравенство · выручка',text:`Спрос q=65−5p, выручка r(p)=pq. Определи наибольшую цену p, при которой выручка не меньше 150 тыс. рублей.`,hint:'Подставь q в r и получи квадратное неравенство по p.',correct:`<strong>Составить неравенство выручки</strong>p(65−5p)≥150 → перенести всё и упростить до квадратного неравенства → найти корни → определить допустимый промежуток между ними → взять его наибольшую границу.`,wrong:[`<strong>Максимизировать только спрос</strong>сделать q=65−5p как можно больше, взять минимальное p и не учитывать условие r≥150.`,`<strong>Решить уравнение r=150</strong>найти два корня и автоматически выбрать меньший, потому что он встречается первым.`]},
 {id:'q15',source:62,prototype:'Логарифм · разряд конденсатора',text:`Время разряда <span class="formula">t=aRC·log₂(U₀/U)</span>. a=0,8, R=8·10⁶, C=6·10⁻⁶, U₀=34 кВ, t=76,8 с. Найди U.`,hint:'Сначала вычисли весь коэффициент aRC; единицы 10⁶ и 10⁻⁶ сократятся.',correct:`<strong>Сначала вычислить коэффициент aRC</strong>подставить a,R,C и получить число перед log₂ → разделить t на этот коэффициент → получить log₂(34/U)=число → перейти к степени 34/U=2^число → выразить U.`,wrong:[`<strong>Сначала раскрыть логарифм частного</strong>записать log₂34 / log₂U → заменить log₂34 на 34 и решить пропорцию.`,`<strong>Перевести кВ в В внутри отношения</strong>умножить только U₀ на 1000, а U оставить в кВ → затем вычислять логарифм размерного отношения.`]}
];

function uuid(){return crypto?.randomUUID?.()||`id-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,10)}`}function nowIso(ms=Date.now()){return new Date(ms).toISOString()}function localDate(){const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`}function playerKey(id){return `student_${String(id).replace(/[^a-zA-Z0-9_-]/g,'_')}`}function shuffle(a,rng=Math.random){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function hashString(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19}return()=>{h=Math.imul(h^(h>>>16),2246822507);h=Math.imul(h^(h>>>13),3266489909);return(h^=h>>>16)>>>0}}function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}function seededRng(k){return mulberry32(hashString(k)())}
function getBrowserClientId(){let id=sessionStorage.getItem(CLIENT_ID_KEY);if(!id){id=uuid();sessionStorage.setItem(CLIENT_ID_KEY,id)}return id}
function storedStudent(){const studentId=localStorage.getItem('egeStudentId')||'',name=localStorage.getItem('egeStudentName')||'',code=localStorage.getItem('egeStudentCode')||'';if(studentId&&code)return{studentId:String(studentId),name:name||'Ученик',code:String(code)};try{const s=JSON.parse(localStorage.getItem(STUDENT_SAVE_KEY)||'null');if(s?.studentId&&s?.code)return s}catch{}return null}
function saveStudent(s){localStorage.setItem(STUDENT_SAVE_KEY,JSON.stringify(s));localStorage.setItem('egeStudentId',s.studentId);localStorage.setItem('egeStudentName',s.name);localStorage.setItem('egeStudentCode',s.code);student=s}function clearStoredStudent(){[STUDENT_SAVE_KEY,'egeStudentId','egeStudentName','egeStudentCode'].forEach(k=>localStorage.removeItem(k));student=null}
function studentFromResponse(data,code){if(!data)return null;if(data.ok===false)return null;const d=data.student||data.data||data;const studentId=d.studentId||d.id||d.studentID||'';const name=d.studentName||d.name||d.fullName||'Ученик';return studentId?{studentId:String(studentId),name:String(name),code:String(code)}:null}
function validateStudentCode(code){return new Promise((resolve,reject)=>{const callback='egeStudentCallback_'+Date.now()+'_'+Math.random().toString(36).slice(2),script=document.createElement('script'),timeout=setTimeout(()=>finish(new Error('Сервер не ответил в течение 60 секунд. Проверьте интернет.')),60000);function cleanup(){clearTimeout(timeout);delete window[callback];script.remove()}function finish(error,value){cleanup();error?reject(error):resolve(value)}window[callback]=data=>{const st=studentFromResponse(data,code);if(st)finish(null,st);else finish(new Error((data&&(data.error||data.message))||'Код ученика не найден'))};script.onerror=()=>finish(new Error('Не удалось связаться с сервером проверки кода'));script.src=`${API_URL}?action=validateStudent&code=${encodeURIComponent(code)}&callback=${encodeURIComponent(callback)}`;document.head.appendChild(script)})}
async function sha256(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function normalizeStats(x){return{firstTryCorrect:Number(x?.firstTryCorrect)||0,completed:Number(x?.completed)||0,wrong:Number(x?.wrong)||0,hints:Number(x?.hints)||0,attemptCount:Number(x?.attemptCount)||0}}
function newGameState(studentLimit=1){return{version:1,schemaVersion:SCHEMA_VERSION,boardEpoch:0,strokes:{},game:{status:'lobby',studentLimit:Number(studentLimit)===2?2:1,players:{},playerOrder:[],turnKey:'',deck:[],index:0,stats:{},eventIds:{},submissions:{},sessionId:uuid(),startedAt:0,finishedAt:0,endedEarly:false,feedback:null}}}
function normalizeState(input){const s=input&&typeof input==='object'?clone(input):newGameState(1);s.version=Number(s.version)||1;s.schemaVersion=Number(s.schemaVersion)||SCHEMA_VERSION;s.boardEpoch=Number(s.boardEpoch)||0;s.strokes=s.strokes||{};const g=s.game||(s.game={});g.status=g.status||'lobby';g.studentLimit=Number(g.studentLimit)===2?2:1;g.players=g.players||{};g.playerOrder=Array.isArray(g.playerOrder)?g.playerOrder:[];g.turnKey=g.turnKey||'';g.deck=Array.isArray(g.deck)?g.deck:[];g.index=Math.max(0,Number(g.index)||0);g.stats=g.stats||{};for(const pk of Object.keys(g.stats))g.stats[pk]=normalizeStats(g.stats[pk]);g.eventIds=g.eventIds||{};g.submissions=g.submissions||{};g.sessionId=g.sessionId||uuid();g.startedAt=Number(g.startedAt)||0;g.finishedAt=Number(g.finishedAt)||0;g.endedEarly=!!g.endedEarly;g.feedback=g.feedback||null;return s}
function buildStudentEntries(seed,pk){
  const rng=seededRng(seed+'|'+pk),ids=shuffle(QUESTIONS.map(q=>q.id),rng).slice(0,TASKS_PER_STUDENT);

let bx=80,by=40,vx=45,vy=30,lastMotion=0;function placeBubble(random=false){const a=$('arena'),b=$('problemBubble');if(!a||b.classList.contains('hidden'))return;const maxX=Math.max(5,a.clientWidth-b.offsetWidth-10),maxY=Math.max(5,a.clientHeight-b.offsetHeight-10);if(random){bx=Math.random()*maxX;by=Math.random()*maxY}bx=Math.max(5,Math.min(maxX,bx));by=Math.max(5,Math.min(maxY,by));b.style.left=bx+'px';b.style.top=by+'px'}function motionLoop(now){const b=$('problemBubble'),a=$('arena'),playing=serverState?.game?.status==='playing'&&!b.classList.contains('hidden');if(playing&&!currentEntry()?.resolved){const dt=Math.min(.04,Math.max(0,(now-lastMotion)/1000));const maxX=Math.max(5,a.clientWidth-b.offsetWidth-10),maxY=Math.max(5,a.clientHeight-b.offsetHeight-10);bx+=vx*dt;by+=vy*dt;if(bx<=5||bx>=maxX)vx*=-1;if(by<=5||by>=maxY)vy*=-1;bx=Math.max(5,Math.min(maxX,bx));by=Math.max(5,Math.min(maxY,by));b.style.left=bx+'px';b.style.top=by+'px'}lastMotion=now;requestAnimationFrame(motionLoop)}requestAnimationFrame(motionLoop);

async function hostStartGame(){if(role!=='teacher'||!serverState)return;const initial=clone(serverState);await runTransaction(stateRef(),current=>{const s=normalizeState(current||clone(initial)),g=s.game;if(g.status!=='lobby')return s;const onlineIds=new Set(Object.values(membersSnapshot).filter(m=>m?.online&&m.role==='student').map(m=>String(m.studentId)));const order=Object.keys(g.players).sort((a,b)=>(g.players[a]?.slot||9)-(g.players[b]?.slot||9)).slice(0,g.studentLimit);if(order.length<g.studentLimit||!order.every(pk=>onlineIds.has(String(g.players[pk]?.studentId))))return s;g.playerOrder=order;g.stats={};g.eventIds={};g.submissions={};order.forEach(pk=>{g.stats[pk]=normalizeStats();g.eventIds[pk]=uuid()});g.deck=buildDeck(order,g.sessionId);g.index=0;g.turnKey=g.deck[0]?.ownerKey||order[0];g.feedback=null;g.status='playing';g.startedAt=Date.now();g.finishedAt=0;g.endedEarly=false;s.version++;return s});SFX.tap()}
async function attemptChoice(choice){
  const e=currentEntry(),q=questionById(e?.questionId);if(role!=='student'||!e||!q||participantPlayerKey!==e.ownerKey||serverState?.game?.turnKey!==participantPlayerKey||e.resolved)return;
  const initial=clone(serverState),phase=e.phase||'method';
  await runTransaction(stateRef(),current=>{
    const s=normalizeState(current||clone(initial)),g=s.game,en=g.deck[g.index];if(g.status!=='playing'||!en||en.ownerKey!==participantPlayerKey||g.turnKey!==participantPlayerKey||en.resolved||en.id!==e.id||(en.phase||'method')!==phase)return s;
    const st=g.stats[participantPlayerKey]||(g.stats[participantPlayerKey]=normalizeStats());st.attemptCount++;
    if(phase==='method'){
      const ok=choice==='correct';
      if(!ok){en.firstTryEligible=false;st.wrong++;g.feedback={id:uuid(),type:'badMethod',ownerKey:participantPlayerKey,entryId:en.id,at:Date.now()}}
      else{en.phase='answer';g.feedback={id:uuid(),type:'methodGood',ownerKey:participantPlayerKey,entryId:en.id,at:Date.now()}}
    }else{
      const ok=choice===ANSWER_BANK[en.questionId].answer;
      if(!ok){en.firstTryEligible=false;st.wrong++;g.feedback={id:uuid(),type:'badAnswer',ownerKey:participantPlayerKey,entryId:en.id,at:Date.now()}}
      else{if(en.firstTryEligible&&!en.hintUsed)st.firstTryCorrect++;st.completed++;en.resolved=true;g.feedback={id:uuid(),type:'good',ownerKey:participantPlayerKey,entryId:en.id,at:Date.now()}}
    }
    s.version++;return s
  })
}

function openStudentLogin(){const saved=storedStudent(),prefill=saved?.code||'';openModal(`<button class="modal-x" id="modalClose">×</button><h2>ВХОД УЧЕНИКА</h2>${saved?.name?`<p>Сохранён: <b>${esc(saved.name)}</b>. Код подставлен автоматически, но будет снова проверен сервером.</p>`:''}<form class="code-form" id="studentForm"><input id="studentCodeInput" autocomplete="off" placeholder="ЛИЧНЫЙ КОД" value="${esc(prefill)}"><div class="status" id="studentStatus"></div><button class="sys-btn primary">ПРОВЕРИТЬ КОД И ВОЙТИ</button></form>`);$('modalClose').onclick=closeModal;$('studentForm').onsubmit=handleStudentLogin}

async function connectStudent(s){student=s;role='student';participantName=s.name;participantPlayerKey=playerKey(s.studentId);startListeners();await tryJoinStudent();syncConnectedUi(true)}

async function tryJoinStudent(){if(role!=='student'||!student||joinInFlight)return;joinInFlight=true;try{const snap=await get(stateRef());if(!snap.exists()){serverState=null;renderWaitingTeacher();updateSessionPanel();return}const serverStateSnapshot=normalizeState(snap.val());serverState=serverStateSnapshot;const activeIds=await activeStudentIds(),pkWanted=playerKey(student.studentId),now=Date.now(),candidateEventId=uuid();const tx=await runTransaction(stateRef(),current=>{const s=normalizeState(current||clone(serverStateSnapshot)),g=s.game;let existing=Object.keys(g.players||{}).find(k=>String(g.players[k]?.studentId)===String(student.studentId));if(existing){g.players[existing].name=student.name;g.players[existing].code=student.code||g.players[existing].code||'';g.players[existing].lastSeen=now;g.eventIds[existing]=g.eventIds[existing]||candidateEventId;s.version++;return s}if(g.status==='lobby'){for(const pk of Object.keys(g.players||{})){const p=g.players[pk];if(!p)continue;const stale=!activeIds.has(String(p.studentId))&&now-Number(p.lastSeen||p.joinedAt||0)>10000;if(stale){delete g.players[pk];delete g.stats[pk];delete g.eventIds[pk];delete g.submissions[pk];g.playerOrder=(g.playerOrder||[]).filter(x=>x!==pk)}}}if(g.status!=='lobby')return;if(Object.keys(g.players||{}).length>=g.studentLimit)return;const taken=new Set(Object.values(g.players||{}).map(p=>Number(p.slot)||0));let slot=1;while(taken.has(slot)&&slot<=g.studentLimit)slot++;if(slot>g.studentLimit)return;let pk=pkWanted;if(g.players[pk]&&String(g.players[pk].studentId)!==String(student.studentId))pk+='_'+Object.keys(g.players).length;g.players[pk]={studentId:String(student.studentId),name:student.name,code:student.code||'',slot,joinedAt:now,lastSeen:now};g.eventIds[pk]=g.eventIds[pk]||candidateEventId;s.version++;return s},{applyLocally:false});if(!tx.committed){const reread=await get(stateRef());if(!reread.exists()){serverState=null;renderWaitingTeacher();updateSessionPanel();return}const after=norm /* ===== presence/listeners ===== */
async function registerPresence(){if(!role)return;participantId=role==='teacher'?`teacher_${browserClientId}`:`student_${participantPlayerKey}_${browserClientId}`;const mr=memberRef(participantId),payload={id:browserClientId,userId:participantPlayerKey||'teacher',studentId:role==='student'?student?.studentId||'':'',name:role==='teacher'?'Учитель':student?.name||'Ученик',role,color:role==='teacher'?'#ffd83d':'#65dbe7',online:true,lastSeen:serverTimestamp()};try{await memberDisconnect?.cancel?.()}catch{}try{await set(mr,payload);memberDisconnect=onDisconnect(mr);await memberDisconnect.update({online:false,lastSeen:serverTimestamp()})}catch{}}

function startListeners(){if(stateUnsub)return;stateUnsub=onValue(stateRef(),snap=>{const incoming=snap.exists()?normalizeState(snap.val()):null,prevVersion=Number(serverState?.version)||0,nextVersion=Number(incoming?.version)||0,structural=!serverState||!incoming||prevVersion!==nextVersion;serverState=incoming;if(role==='student'&&serverState&&!serverState.game.players?.[participantPlayerKey])tryJoinStudent().catch(err=>showToast(err.message,true));if(structural)renderFromState();else updateTeacherCursor()});strokesUnsub=onValue(strokesRef(),snap=>{const incoming=snap.exists()?clone(snap.val()):{};if(activeStroke&&incoming[activeStroke.id]){const local=strokesCache[activeStroke.id];if(local&&Number(local.rev||0)>Number(incoming[activeStroke.id].rev||0))incoming[activeStroke.id]=local}strokesCache=incoming||{};renderBoardStrokes()});membersUnsub=onValue(membersRef(),snap=>{membersSnapshot=snap.exists()?snap.val()||{}:{};updateSessionPanel();if(!role||serverState?.game?.status==='lobby')renderFromState()});messagesUnsub=onValue(messagesRef(),snap=>{const x=snap.exists()?snap.val()||{}:{};remoteTeacherCursor=x.teacherCursor||null;updateTeacherCursor()})}

function updateSessionPanel(){const p=$('sessionPanel');if(!role){p.classList.remove('show');return}const onlineStudents=Object.values(membersSnapshot).filter(m=>m?.online&&m.role==='student').length,status=!online?'офлайн':serverState?.game?.status==='playing'?'игра идёт':serverState?.game?.status==='finished'?'завершено':serverState?'лобби':'ждём учителя';p.innerHTML=`<span class="session-dot ${online?'on':''}"></span><b>${role==='teacher'?'УЧИТЕЛЬ':esc(student?.name||'УЧЕНИК')}</b><small>${status} · учеников онлайн: ${onlineStudents}</small>${role==='teacher'&&serverState?.game?.status==='playing'?'<button class="danger" id="panelFinish">ЗАВЕРШИТЬ</button>':''}${role==='student'?'<button id="panelSwitch">СМЕНИТЬ</button>':''}`;p.classList.add('show');if($('panelFinish'))$('panelFinish').onclick=teacherFinishLesson;if($('panelSwitch'))$('panelSwitch').onclick=switchStudent}

/* ===== result submission ===== */
function readQueue(){try{const q=JSON.parse(localStorage.getItem(PENDING_RESULTS_KEY)||'[]');return Array.isArray(q)?q:[]}catch{return[]}}function writeQueue(q){localStorage.setItem(PENDING_RESULTS_KEY,JSON.stringify(q.slice(-50)))}function queueResult(payload,pk){const q=readQueue(),i=q.findIndex(x=>x?.payload?.eventId===payload.eventId);const item={payload,playerKey:pk};if(i>=0)q[i]=item;else q.push(item);writeQueue(q)}function removeQueued(eventId){writeQueue(readQueue().filter(x=>x?.payload?.eventId!==eventId))}
async function postResult(payload){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),60000);let response;try{response=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),redirect:'follow',signal:controller.signal})}catch(err){if(err?.name==='AbortError')throw new Error('Сервер результатов не ответил в течение 60 секунд.');throw err}finally{clearTimeout(timer)}let answer;try{answer=await response.json()}catch{throw new Error('Система результатов не ответила.')}if(!response.ok||!answer?.ok)throw new Error(answer?.error||'Результат не принят.');return answer}
function resultPayload(s,pk){const g=s.game,p=g.players[pk],st=normalizeStats(g.stats[pk]),max=g.endedEarly?st.completed:TASKS_PER_STUDENT,scorePercent=max?Math.round(st.firstTryCorrect/max*100):0,finished=g.finishedAt||Date.now(),started=g.startedAt||finished;return{action:'submitTest',eventId:g.eventIds[pk]||`${g.sessionId}-${pk}`,studentId:p?.studentId||'',testId:TEST_META.testId,testDate:localDate(),topicId:TEST_META.topicId,topicName:TEST_META.topicName,taskNumber:TEST_META.taskNumber,scorePercent,durationSeconds:Math.max(1,Math.round((finished-started)/1000)),schemaVersion:1,programId:'EGE_MATH'}}
async function claimSubmission(pk){const eventId=serverState?.game?.eventIds?.[pk];if(!eventId)return false;const r=ref(database,`${lessonRoot()}/state/game/submissions/${pk}`),res=await runTransaction(r,current=>{if(current?.status==='saved')return;if(current?.status==='sending'&&Date.now()-(Number(current.updatedAt)||0)<8000)return;return{eventId,status:'sending',updatedAt:Date.now()}});return res.committed}
async function markSubmission(pk,status,message=''){try{await update(ref(database,`${lessonRoot()}/state/game/submissions/${pk}`),{status,message,updatedAt:Date.now()})}catch{}}
async function ensureSubmission(pk){if(!pk||submissionInFlight.has(pk)||!serverState||serverState.game.status!=='finished'||serverState.game.submissions?.[pk]?.status==='saved')return;submissionInFlight.add(pk);const snapshot=clone(serverState),payload=resultPayload(snapshot,pk);try{if(!await claimSubmission(pk))return;if(!navigator.onLine)throw new Error('offline');const r=await postResult(payload);removeQueued(payload.eventId);await markSubmission(pk,'saved',r?.duplicate?'Уже было сохранено':'Подтверждено сервером')}catch(err){queueResult(payload,pk);await markSubmission(pk,'queued',String(err?.message||'Ждёт связи'))}finally{submissionInFlight.delete(pk)}}
async function flushPendingResults(){if(!navigator.onLine)return;for(const item of readQueue()){try{await postResult(item.payload);removeQueued(item.payload.eventId);if(serverState?.game?.eventIds?.[item.playerKey]===item.payload.eventId)await markSubmission(item.playerKey,'saved','Подтверждено сервером')}catch{}}}
function scheduleTeacherBackup(){if(role!=='teacher'||teacherBackupTimer)return;teacherBackupTimer=setTimeout(async()=>{teacherBackupTimer=null;if(serverState?.game?.status!=='finished')return;await Promise.all((serverState.game.playerOrder||[]).filter(pk=>serverState.game.submissions?.[pk]?.status!=='saved').map(ensureSubmission))},1500)}

/* ===== board, live pencil + real eraser ===== */
function attachBoardLayer(){const host=$('boardHost');let b=$('sharedBoard');if(!b){b=document.createElementNS('http://www.w3.org/2000/svg','svg');b.id='sharedBoard';b.setAttribute('viewBox','0 0 1000 1000');b.setAttribute('preserveAspectRatio','none');b.classList.add('shared-board');host.appendChild(b);b.addEventListener('pointerdown',boardPointerDown);b.addEventListener('pointermove',boardPointerMove);b.addEventListener('pointerup',boardPointerUp);b.addEventListener('pointercancel',boardPointerUp)}setBoardPointerMode();renderBoardStrokes()}
function setBoardPointerMode(){const host=$('boardHost'),b=$('sharedBoard');const draw=boardTool!=='cursor'&&!!role;if(host)host.style.pointerEvents=draw?'auto':'none';if(b)b.style.pointerEvents=draw?'auto':'none';document.querySelectorAll('[data-board-tool]').forEach(x=>x.classList.toggle('active',x.dataset.boardTool===boardTool))}
function pointFromEvent(e){return[e.clientX/innerWidth,e.clientY/innerHeight]}function boardPointerDown(e){if(boardTool==='cursor'||!serverState)return;e.preventDefault();e.currentTarget.setPointerCapture(e.pointerId);const p=pointFromEvent(e);if(boardTool==='eraser'){eraserActive=true;eraserPointerId=e.pointerId;lastEraserPoint=p;eraseAlong(p,p);return}activeStroke={id:'stroke-'+uuid(),anchorId:'page',authorId:participantId||role,authorName:participantName||role,color:boardColor,width:boardWidth,points:[p],done:false,epoch:serverState.boardEpoch||0,rev:Date.now()};strokesCache[activeStroke.id]=clone(activeStroke);renderBoardStrokes();pushStroke()}

async function pushStroke(){if(!activeStroke||!serverState)return;const snap=clone(activeStroke);try{await set(ref(database,`${lessonRoot()}/state/strokes/${snap.id}`),snap)}catch{}}
function renderBoardStrokes(){const b=$('sharedBoard');if(!b||!serverState)return;const epoch=serverState.boardEpoch||0;let strokes=Object.entries(strokesCache||{}).filter(([id,s])=>s&&s.epoch===epoch&&s.anchorId==='page'&&!optimisticDeleted.has(id)).map(([id,s])=>({id,...s}));if(activeStroke){const ix=strokes.findIndex(s=>s.id===activeStroke.id);if(ix<0||Number(strokes[ix]?.rev||0)<activeStroke.rev){if(ix>=0)strokes.splice(ix,1);strokes.push(activeStroke)}}b.innerHTML=strokes.map(s=>{const pts=(s.points||[]).map(([x,y])=>`${Math.max(0,Math.min(1,x))*1000},${Math.max(0,Math.min(1,y))*1000}`).join(' ');return pts?`<polyline points="${pts}" fill="none" stroke="${esc(s.color||'#e53935')}" stroke-width="${Math.max(1,Number(s.width)||5)*2.2}" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`:''}).join('')}
function pointSegDist(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay;if(dx===0&&dy===0)return Math.hypot(px-ax,py-ay);let t=((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy);t=Math.max(0,Math.min(1,t));return Math.hypot(px-(ax+t*dx),py-(ay+t*dy))}
function strokeHit(stroke,a,b){const pts=stroke.points||[];if(!pts.length)return false;const ax=a[0]*innerWidth,ay=a[1]*innerHeight,bx=b[0]*innerWidth,by=b[1]*innerHeight,travel=Math.max(1,Math.hypot(bx-ax,by-ay)),steps=Math.max(1,Math.ceil(travel/8)),radius=10+Math.max(2,Number(stroke.width)||5)/2;for(let k=0;k<=steps;k++){const t=k/steps,x=ax+(bx-ax)*t,y=ay+(by-ay)*t;if(pts.length===1){if(Math.hypot(x-pts[0][0]*innerWidth,y-pts[0][1]*innerHeight)<=radius)return true}else for(let i=1;i<pts.length;i++){if(pointSegDist(x,y,pts[i-1][0]*innerWidth,pts[i-1][1]*innerHeight,pts[i][0]*innerWidth,pts[i][1]*innerHeight)<=radius)return true}}return false}
async function eraseAlong(a,b){if(!serverState)return;const epoch=serverState.boardEpoch||0,entries=Object.entries(strokesCache||{}).filter(([id,s])=>s?.epoch===epoch&&s.anchorId==='page'&&!optimisticDeleted.has(id)),hits=entries.filter(([,s])=>strokeHit(s,a,b));if(!hits.length)return;const patch={};hits.forEach(([id,s])=>{optimisticDeleted.set(id,s);delete strokesCache[id];patch[id]=null});renderBoardStrokes();try{await update(strokesRef(),patch);hits.forEach(([id])=>optimisticDeleted.delete(id))}catch{hits.forEach(([id,s])=>{optimisticDeleted.delete(id);strokesCache[id]=s});renderBoardStrokes()}}
async function clearBoard(){if(role!=='teacher'||!serverState)return;const initial=clone(serverState);await runTransaction(stateRef(),current=>{const s=normalizeState(current||clone(initial));s.boardEpoch=(Number(s.boardEpoch)||0)+1;s.strokes={};s.version++;return s})}
function initBoardToolbar(){const tb=$('boardToolbar');let pos={right:14,bottom:14};try{pos={...pos,...JSON.parse(localStorage.getItem(TOOLBAR_POSITION_KEY)||'{}')}}catch{}tb.style.right=(pos.right??14)+'px';tb.style.bottom=(pos.bottom??14)+'px';tb.innerHTML=`<div class="board-head" id="boardDrag"><b>ДОСКА</b><button id="boardCollapse">−</button></div><div class="board-tools"><button data-board-tool="cursor">↖</button><button data-board-tool="pencil">✎</button><button data-board-tool="eraser">⌫</button><input id="boardColor" type="color" value="${boardColor}"><input id="boardWidth" type="range" min="2" max="14" value="${boardWidth}"><button class="board-clear" id="boardClear">🗑 ОЧИСТИТЬ ВСЁ</button></div>`;document.querySelectorAll('[data-board-tool]').forEach(b=>b.onclick=()=>{boardTool=b.dataset.boardTool;setBoardPointerMode()});$('boardColor').oninput=e=>boardColor=e.target.value;$('boardWidth').oninput=e=>boardWidth=Number(e.target.value);$('boardClear').onclick=()=>role==='teacher'?clearBoard():showToast('Полностью очищать доску может только учитель.',true);$('boardCollapse').onclick=()=>{toolbarCollapsed=!toolbarCollapsed;tb.classList.toggle('collapsed',toolbarCollapsed);$('boardCollapse').textContent=toolbarCollapsed?'+':'−'};makeToolbarDraggable(tb,$('boardDrag'));setBoardPointerMode();syncBoardToolbarRole()}
function syncBoardToolbarRole(){if($('boardClear'))$('boardClear').style.display=role==='teacher'?'block':'none'}function makeToolbarDraggable(tb,h){let sx=0,sy=0,sr=0,sb=0,m=false;h.addEventListener('pointerdown',e=>{if(e.target.tagName==='BUTTON')return;m=true;sx=e.clientX;sy=e.clientY;const r=tb.getBoundingClientRect();sr=innerWidth-r.right;sb=innerHeight-r.bottom;h.setPointerCapture(e.pointerId)});h.addEventListener('pointermove',e=>{if(!m)return;const nr=Math.max(0,Math.min(innerWidth-tb.offsetWidth,sr-(e.clientX-sx))),nb=Math.max(0,Math.min(innerHeight-tb.offsetHeight,sb-(e.clientY-sy)));tb.style.right=nr+'px';tb.style.bottom=nb+'px'});h.addEventListener('pointerup',()=>{if(!m)return;m=false;localStorage.setItem(TOOLBAR_POSITION_KEY,JSON.stringify({right:parseFloat(tb.style.right)||0,bottom:parseFloat(tb.style.bottom)||0}))})}
window.addEventListener('pointermove',e=>{if(role!=='teacher'||boardTool!=='cursor'||!serverState||Date.now()-lastCursorPush<75)return;lastCursorPush=Date.now();update(ref(database,`${lessonRoot()}/messages/teacherCursor`),{x:e.clientX/innerWidth,y:e.clientY/innerHeight,visible:true,at:Date.now()}).catch(()=>{})});window.addEventListener('blur',()=>{if(role==='teacher')update(ref(database,`${lessonRoot()}/messages/teacherCursor`),{visible:false,at:Date.now()}).catch(()=>{})});function updateTeacherCursor(){const c=$('teacherCursor');if(role!=='student'||!remoteTeacherCursor?.visible){c.classList.remove('show');return}c.style.left=remoteTeacherCursor.x*innerWidth+'px';c.style.top=remoteTeacherCursor.y*innerHeight+'px';c.classList.add('show')}

$('lessonJoinBtn').onclick=openRoleModal;window.addEventListener('online',async()=>{online=true;await flushPendingResults();if(role==='student')tryJoinStudent().catch(err=>showToast(err.message,true));renderFromState()});window.addEventListener('offline',()=>{online=false;renderFromState()});window.addEventListener('resize',()=>{placeBubble();updateTeacherCursor()});
startAtmosphere();initBoardToolbar();startListeners();renderPublic();flushPendingResults();
</script></body></html>
