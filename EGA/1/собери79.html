  function storedStudent(){const studentId=localStorage.getItem('egeStudentId');return studentId?{studentId,name:localStorage.getItem('egeStudentName')||'Ученик',code:localStorage.getItem('egeStudentCode')||''}:null}function saveStudent(s){localStorage.setItem('egeStudentId',s.studentId);localStorage.setItem('egeStudentName',s.name);localStorage.setItem('egeStudentCode',s.code)}

  function updateStudent(){const box=$('studentBox');box.style.display=student?'flex':'none';if(student)$('studentName').textContent=student.name;$('switchBtn').disabled=gameActive}function readQueue(){try{const q=JSON.parse(localStorage.getItem(PENDING_KEY)||'[]');return Array.isArray(q)?q:[]}catch(_){return[]}}function writeQueue(q){localStorage.setItem(PENDING_KEY,JSON.stringify(q))}function queueResult(p){const q=readQueue();if(!q.some(x=>x&&x.eventId===p.eventId))q.push(p);writeQueue(q)}function removeQueued(id){writeQueue(readQueue().filter(x=>!x||x.eventId!==id))}

  async function handleLogin(e){e.preventDefault();const input=$('codeInput'),btn=$('loginBtn'),status=$('loginStatus'),code=input.value.trim();if(!code){status.className='status bad';status.textContent='Введи личный код';return}input.disabled=btn.disabled=true;status.textContent='Стража проверяет код…';try{student=await validateStudent(code);saveStudent(student);updateStudent();await flushPending();renderStart()}catch(err){status.className='status bad';status.textContent=err.message||'Код не подтверждён';input.disabled=btn.disabled=false;input.focus()}}
  function changeStudent(){if(gameActive)return;['egeStudentId','egeStudentName','egeStudentCode'].forEach(k=>localStorage.removeItem(k));renderLogin()}function renderStart(){gameActive=false;updateStudent();$('app').innerHTML=`<section class="screen start"><div class="royal-scroll"><span class="tag">Главы 7–9 · синусы и косинусы</span><h1>Найди ошибку</h1><p class="lead">35 смешанных дел. Среди них 15 новых задач на теоремы синусов и косинусов. В каждом решении один шаг нарушает законы геометрии.</p><div class="rules"><div class="rule"><b>35</b>задач</div><div class="rule"><b>15</b>новых задач</div><div class="rule"><b>∞</b>без таймера</div></div><p>Нажми на <b>первый ошибочный шаг</b>. После промаха поиск продолжается, но задача уже не засчитывается с первой попытки.</p><button class="primary" id="startBtn">Открыть заседание</button></div>${scene()}</section>`;$('startBtn').addEventListener('click',startGame)}
  function startGame(){tasks=makeTasks();index=0;firstTryCorrect=0;startedAt=Date.now();attemptEventId=uuid();resultSubmitted=false;results=[];gameActive=true;updateStudent();sound('start');renderTask()}function leafBar(){return Array.from({length:TOTAL},(_,i)=>`<i class="leaf ${results[i]===true?'good':results[i]===false?'bad':i===index?'current':''}"></i>`).join('')}
  function renderTask(){questionAttempted=false;questionResolved=false;const t=tasks[index];$('app').innerHTML=`<section class="screen game"><div class="hud"><span class="counter">Дело ${index+1} / ${TOTAL}</span><div class="track"><i style="width:${index/TOTAL*100}%"></i></div><span class="score">Найдено сразу: <b id="liveScore">${firstTryCorrect}</b></span></div><div class="court"><section class="case"><div class="case-head"><span class="zone">${Z[t.c]}</span><span>Глава ${t.c} · ${esc(t.title)}</span></div><div class="problem">${esc(t.text)}</div><div class="drawing">${draw(t)}</div></section><aside class="verdict"><div class="speech" id="speech">Король Алекс: найди первый шаг, где решение свернуло не туда!</div><div class="steps">${t.steps.map((s,i)=>`<button class="step" data-i="${i}" data-n="${i+1}">${esc(s)}</button>`).join('')}</div><i class="mini-throne"></i>${lion('judge')}<div class="feedback" id="feedback"></div></aside></div><div class="leaves">${leafBar()}</div></section>`;document.querySelectorAll('.step').forEach(b=>b.addEventListener('click',()=>chooseStep(Number(b.dataset.i),b)))}
  function chooseStep(i,button){if(questionResolved)return;const t=tasks[index],first=!questionAttempted;questionAttempted=true;if(i!==t.wrong){button.disabled=true;button.classList.add('wrong-pick');$('speech').textContent='Этот шаг допустим. Ошибка спряталась в другом месте!';sound('bad');return}questionResolved=true;if(first)firstTryCorrect++;results[index]=first;$('liveScore').textContent=firstTryCorrect;document.querySelectorAll('.step').forEach((b,j)=>{b.disabled=true;b.classList.add(j===t.wrong?'error':'correct-step')});$('speech').textContent=first?'Вердикт точен с первого раза!':'Ошибка найдена после дополнительной проверки.';const box=$('feedback');box.innerHTML=`<span class="tag">${first?'Верно с первой попытки':'Найдено после ошибки'}</span><h2>Ошибка на шаге ${t.wrong+1}</h2><div class="correction">${esc(t.explain)}</div><button class="primary" id="nextBtn">${index===TOTAL-1?'Закрыть заседание':'Следующее дело →'}</button>`;box.classList.add('show');$('nextBtn').addEventListener('click',nextTask);sound('good')}
  function nextTask(){index++;if(index>=TOTAL)finish();else renderTask()}function finish(){gameActive=false;updateStudent();const seconds=elapsed(),score=Math.round(firstTryCorrect/TOTAL*100);$('app').innerHTML=`<section class="screen final"><div class="royal-scroll"><span class="tag">Суд завершён</span><h1>${score>=85?'Мудрый советник!':score>=60?'Вердикты вынесены!':'Нужен повторный суд'}</h1><div class="ring" style="background:conic-gradient(#e2b641 ${score}%,#cbbb83 0)"><b>${score}%</b></div><p><b>Успешность с первой попытки</b></p><div class="stats"><div class="stat">Ошибок найдено сразу<b>${firstTryCorrect} из ${TOTAL}</b></div><div class="stat">Время прохождения<b>${timeText(seconds)}</b></div></div><div class="save-status" id="saveStatus">Сохраняем результат…</div><div class="actions"><button class="primary" id="againBtn">Провести новый суд</button><button class="secondary" id="homeBtn">На старт</button></div></div>${scene()}</section>`;$('againBtn').addEventListener('click',startGame);$('homeBtn').addEventListener('click',renderStart);sound('finish');submitOnce(score,seconds)}
  function sound(type){if(muted)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ac=sound.ac||(sound.ac=new AC()),now=ac.currentTime,g=ac.createGain(),sets={start:[[120,.2],[240,.36]],good:[[390,.13],[690,.31]],bad:[[155,.2],[74,.38]],finish:[[250,.14],[390,.29],[630,.58]]},set=sets[type]||sets.good;g.connect(ac.destination);g.gain.setValueAtTime(.045,now);g.gain.exponentialRampToValueAtTime(.0001,now+set[set.length-1][1]+.1);set.forEach(([f,d],i)=>{const o=ac.createOscillator();o.type=type==='bad'?'sawtooth':'triangle';o.frequency.setValueAtTime(f,now+i*.04);o.connect(g);o.start(now+i*.04);o.stop(now+d+.1)})}catch(_){}}
  $('switchBtn').addEventListener('click',changeStudent);$('soundBtn').addEventListener('click',()=>{muted=!muted;$('soundBtn').textContent=muted?'🔇':'🔊'});window.addEventListener('online',flushPending);async function init(){const code=new URLSearchParams(location.search).get('code');if(code){renderLogin(code);return}student=storedStudent();if(student){updateStudent();await flushPending();renderStart()}else renderLogin()}init();
  </script>
