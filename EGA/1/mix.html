  function renderBoard(){const svgEl=$('boardLayer');if(!svgEl||!latestState)return;const epoch=Number(latestState.boardEpoch||0),strokes=Object.values(latestState.strokes||{}).filter(s=>Number(s.epoch)===epoch&&s.anchorId==='game-screen');if(drawingStroke&&!strokes.some(s=>s.id===drawingStroke.id))strokes.push(drawingStroke);svgEl.innerHTML=strokes.map(s=>`<polyline class="board-stroke" data-stroke-id="${esc(s.id)}" points="${(s.points||[]).map(p=>`${Number(p[0])*1000},${Number(p[1])*1000}`).join(' ')}" stroke="${esc(s.color||'#d84f45')}" stroke-width="${Math.max(2,Number(s.width)||6)}"/>`).join('');svgEl.classList.toggle('active',boardTool!=='cursor');svgEl.classList.toggle('eraser',boardTool==='eraser')}
  function bindBoardAnchor(){const svgEl=$('boardLayer');if(!svgEl||svgEl.dataset.bound==='1')return;svgEl.dataset.bound='1';const pt=e=>{const r=svgEl.getBoundingClientRect();return[Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))]};const segDist=(p,a,b)=>{const vx=b[0]-a[0],vy=b[1]-a[1],wx=p[0]-a[0],wy=p[1]-a[1],vv=vx*vx+vy*vy,t=vv?Math.max(0,Math.min(1,(wx*vx+wy*vy)/vv)):0;return Math.hypot(p[0]-(a[0]+t*vx),p[1]-(a[1]+t*vy))};const eraseAt=p=>{if(!latestState)return;const r=svgEl.getBoundingClientRect(),scale=Math.max(1,Math.min(r.width,r.height)),updates={};for(const[id,st]of Object.entries(latestState.strokes||{})){if(!st||Number(st.epoch)!==Number(latestState.boardEpoch||0))continue;const ps=st.points||[],rad=(14+Number(st.width||6)*1.4)/scale;let hit=ps.length===1&&Math.hypot(p[0]-ps[0][0],p[1]-ps[0][1])<=rad;for(let i=1;!hit&&i<ps.length;i++)hit=segDist(p,ps[i-1],ps[i])<=rad;if(hit){updates[id]=null;delete latestState.strokes[id]}}if(Object.keys(updates).length){renderBoard();update(ref(database,`${lessonRoot()}/state/strokes`),updates).catch(()=>{})}};const sweep=(a,b)=>{const r=svgEl.getBoundingClientRect(),px=Math.hypot((b[0]-a[0])*r.width,(b[1]-a[1])*r.height),steps=Math.max(1,Math.ceil(px/7));for(let i=0;i<=steps;i++){const t=i/steps;eraseAt([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t])}};svgEl.addEventListener('pointerdown',e=>{if(boardTool==='cursor'||!participantRole||!latestState)return;e.preventDefault();svgEl.setPointerCapture?.(e.pointerId);const p=pt(e);if(boardTool==='eraser'){eraseLastPoint=p;sweep(p,p);return}drawingStroke={id:'stroke-'+uuid(),anchorId:'game-screen',authorId:participantId,authorName:participantName,color:$('boardColor').value,width:Number($('boardWidth').value),points:[p],done:false,epoch:latestState.boardEpoch,rev:Date.now()};renderBoard();set(ref(database,`${lessonRoot()}/state/strokes/${drawingStroke.id}`),clone(drawingStroke)).catch(()=>{});drawingStroke.lastSend=performance.now()});svgEl.addEventListener('pointermove',e=>{const p=pt(e);if(boardTool==='eraser'){if(e.buttons||eraseLastPoint){sweep(eraseLastPoint||p,p);eraseLastPoint=p}return}if(!drawingStroke||boardTool!=='pen')return;const last=drawingStroke.points[drawingStroke.points.length-1];if(Math.hypot(p[0]-last[0],p[1]-last[1])<.002)return;drawingStroke.points.push(p);drawingStroke.rev=Date.now();renderBoard();if(performance.now()-(drawingStroke.lastSend||0)>55){drawingStroke.lastSend=performance.now();set(ref(database,`${lessonRoot()}/state/strokes/${drawingStroke.id}`),clone(drawingStroke)).catch(()=>{})}});const end=()=>{eraseLastPoint=null;if(!drawingStroke)return;const finalStroke=clone(drawingStroke);drawingStroke=null;delete finalStroke.lastSend;finalStroke.done=true;finalStroke.rev=Date.now();set(ref(database,`${lessonRoot()}/state/strokes/${finalStroke.id}`),finalStroke).catch(()=>{});renderBoard()};svgEl.addEventListener('pointerup',end);svgEl.addEventListener('pointercancel',end)}
  async function clearBoard(){if(participantRole!=='teacher')return;await runTransaction(stateRef(),current=>{const state=normalizeState(current);if(!state)return;state.boardEpoch++;state.strokes={};state.version++;return state})}
  function initBoardToolbar(){document.querySelectorAll('[data-board-tool]').forEach(b=>b.addEventListener('click',()=>{boardTool=b.dataset.boardTool;document.querySelectorAll('[data-board-tool]').forEach(x=>x.classList.toggle('active',x===b));renderBoard()}));$('clearBoardBtn').addEventListener('click',clearBoard);$('boardCollapseBtn').addEventListener('click',()=>{$('boardToolbar').classList.toggle('collapsed');$('boardCollapseBtn').textContent=$('boardToolbar').classList.contains('collapsed')?'+':'−'});const saved=(()=>{try{return JSON.parse(localStorage.getItem(TOOLBAR_POSITION_KEY)||'null')}catch(_){return null}})();if(saved){$('boardToolbar').style.left=saved.left+'px';$('boardToolbar').style.top=saved.top+'px';$('boardToolbar').style.bottom='auto'}$('boardDragHandle').addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;const tb=$('boardToolbar'),r=tb.getBoundingClientRect();toolbarDrag={dx:e.clientX-r.left,dy:e.clientY-r.top,id:e.pointerId};$('boardDragHandle').setPointerCapture(e.pointerId)});$('boardDragHandle').addEventListener('pointermove',e=>{if(!toolbarDrag)return;const tb=$('boardToolbar'),x=Math.max(0,Math.min(innerWidth-tb.offsetWidth,e.clientX-toolbarDrag.dx)),y=Math.max(0,Math.min(innerHeight-tb.offsetHeight,e.clientY-toolbarDrag.dy));tb.style.left=x+'px';tb.style.top=y+'px';tb.style.bottom='auto'});$('boardDragHandle').addEventListener('pointerup',()=>{if(!toolbarDrag)return;toolbarDrag=null;const r=$('boardToolbar').getBoundingClientRect();localStorage.setItem(TOOLBAR_POSITION_KEY,JSON.stringify({left:r.left,top:r.top}))})}
  function initTeacherCursorForCurrentScreen(){const game=document.querySelector('.game[data-board-anchor]');if(!game)return;game.addEventListener('pointermove',e=>{if(participantRole!=='teacher'||!latestState||latestState.game.status!=='playing'||boardTool!=='cursor')return;const now=Date.now();if(now-cursorLastSent<75)return;cursorLastSent=now;const r=game.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;set(ref(database,`${lessonRoot()}/messages/teacherCursor`),{anchorId:'game-screen',x:Math.max(0,Math.min(1,x)),y:Math.max(0,Math.min(1,y)),at:now}).catch(()=>{})})}
  function sound(type){if(muted||!type)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ac=sound.ac||(sound.ac=new AC()),now=ac.currentTime,g=ac.createGain(),sets={start:[[145,.18],[260,.38],[410,.62]],good:[[420,.12],[670,.28]],bad:[[145,.2],[82,.38]],finish:[[260,.12],[430,.28],[720,.52]]},set=sets[type]||sets.good;g.connect(ac.destination);g.gain.setValueAtTime(.045,now);g.gain.exponentialRampToValueAtTime(.0001,now+set[set.length-1][1]+.14);set.forEach(([f,d],i)=>{const o=ac.createOscillator();o.type=type==='bad'?'sawtooth':'triangle';o.frequency.value=f;o.connect(g);o.start(now+i*.045);o.stop(now+d+.1)})}catch(_){}}
  async function switchStudent(){if(latestState?.game?.status==='playing')return;verificationRun++;const oldKey=currentViewerKey(),old=clone(currentStudent),base=latestState?clone(latestState):null;participantRole='';participantId='';participantName='';studentJoined=false;studentJoinReady=false;verificationStatus='';clearStudent();[sessionUnsub,membersUnsub,cursorUnsub,connectionUnsub].forEach(fn=>{try{fn&&fn()}catch(_){}});sessionUnsub=membersUnsub=cursorUnsub=connectionUnsub=null;$('sessionPanel').classList.add('hidden');$('lessonLauncher').classList.remove('hidden');$('boardToolbar').classList.add('hidden');updateIdentity();showStudentCodeForm();update(ref(database,`${lessonRoot()}/members/${browserClientId}`),{online:false,lastSeen:serverTimestamp()}).catch(()=>{});if(base?.game?.status==='lobby'&&oldKey){runTransaction(stateRef(),current=>{const state=normalizeState(current||clone(base));if(!state?.game?.players?.[oldKey]||String(state.game.players[oldKey].studentId)!==String(old?.studentId||''))return state;delete state.game.players[oldKey];delete state.game.stats[oldKey];delete state.game.attempts[oldKey];delete state.game.eventIds[oldKey];delete state.game.submissions[oldKey];state.game.playerOrder=Object.entries(state.game.players).sort((a,b)=>Number(a[1].slot)-Number(b[1].slot)).map(([k])=>k);state.version++;return state},{applyLocally:false}).catch(()=>{})}}

  $('lessonLauncher').addEventListener('click',showRoleChoice);$('leaveSessionBtn').addEventListener('click',disconnectParticipant);$('newSessionBtn').addEventListener('click',showModeChoice);$('finishEarlyBtn').addEventListener('click',finishEarly);$('switchStudentBtn').addEventListener('click',switchStudent);$('switchBtn').addEventListener('click',switchStudent);$('soundBtn').addEventListener('click',()=>{muted=!muted;$('soundBtn').textContent=muted?'Без звука':'Звук'});$('lessonModal').addEventListener('pointerdown',e=>{if(e.target===$('lessonModal'))closeModal()});addEventListener('online',()=>{unloadHandled=false;flushPending()});addEventListener('pagehide',unloadSubmit);addEventListener('beforeunload',unloadSubmit);initBoardToolbar();atmosphere();renderLanding();currentStudent=savedStudent();flushPending();setInterval(flushPending,60000);
