ames leafFall{0%{transform:translate3d(0,-12vh,0) rotate(0)}25%{transform:translate3d(70px,28vh,0) rotate(190deg)}50%{transform:translate3d(-35px,56vh,0) rotate(390deg)}75%{transform:translate3d(85px,84vh,0) rotate(580deg)}100%{transform:translate3d(15px,118vh,0) rotate(760deg)}}@keyframes fly{0%{transform:translate(-40px,-25px);opacity:.2}40%{opacity:1}100%{transform:translate(85px,55px);opacity:.45}}@keyframes birdFly{to{transform:translateX(125vw)}}@keyframes wing{to{transform:rotateX(65deg) translateY(-4px)}}@keyframes mist{to{transform:translateX(18%) scale(1.08)}}

<body>
  <div class="weather" id="weather" aria-hidden="true"></div>
  <header class="top">
    <div class="brand"><span class="brand-logo"><i class="compass-model"></i></span><span>ЭКСПЕДИЦИЯ МАДАГАСКАР · ЕГЭ №1</span></div>
    <div class="student" id="studentBox"><span>Ученик: <b id="studentName"></b></span><button class="tiny" id="switchBtn">Сменить ученика</button><button class="tiny sound" id="soundBtn" aria-label="Звук">Звук</button></div>
  </header>
  <main id="app"></main>
  <script>
  'use strict';
  const API_URL='https://script.google.com/macros/s/AKfycbw6iYfojO8VgkHU63peD2vWLybGyDm9AsYZ6TaLA_EFD4j56nQlY5SqpRANPVeTwVsj/exec';
  const TEST_META={testId:'EGE-01-MADAGASCAR-EXPEDITION-MIX-27',topicId:'task-01',topicName:'Планиметрия: полный микс задания 1',taskNumber:1,schemaVersion:1};
  const TOTAL=27,PENDING_KEY='egePendingTestResults',$=id=>document.getElementById(id);
  let student=null,deck=[],index=0,firstTryCorrect=0,questionAttempted=false,solved=false,startedAt=0,attemptEventId='',resultSubmitted=false,gameActive=false,muted=false,wrongTasks=[];
  const rint=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,pick=a=>a[rint(0,a.length-1)];
  function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=rint(0,i);[x[i],x[j]]=[x[j],x[i]]}return x}
  function gcd(a,b){while(b)[a,b]=[b,a%b];return Math.abs(a)}
  function frac(a,b){const g=gcd(a,b);a/=g;b/=g;return b===1?String(a):a+'/'+b}
  function num(v){return String(Number(v.toFixed?Number(v.toFixed(2)):v)).replace('.',',')}
  function options(answer,wrongs){const out=[String(answer)];for(const w of wrongs){const s=String(w);if(s!==String(answer)&&!out.includes(s))out.push(s)}let n=1;while(out.length<4){const base=parseFloat(String(answer).replace(',','.'));const s=Number.isFinite(base)?num(base+n*2):String(n*10);if(!out.includes(s))out.push(s);n++}return shuffle(out.slice(0,4))}
  function make(section,title,prompt,answer,wrongs,key,d,solution){return{section,title,prompt,answer:String(answer),options:options(answer,wrongs),key,d,solution}}
  const S=['I. Углы и линии треугольника','II. Четырёхугольники и точки','III. Площадь и Пифагор','IV. Подобие','V. Тригонометрия','VI. Углы окружности','VII. Вписанная окружность','VIII. Описанная окружность','IX. Теорема синусов'];
  function gI1(){const a=rint(31,72),c=180-2*a;return make(S[0],'Равнобедренный треугольник',`В треугольнике ABC стороны AC и BC равны, ∠A = ${a}°. Найдите ∠C.`,c,[a,180-a,90-a],'iso',{a},`Так как AC = BC, углы A и B равны: ∠B = ${a}°. Тогда ∠C = 180° − ${a}° − ${a}° = ${c}°.`)}
  function gI2(){let h,c,b;do{h=rint(7,25);c=rint(65,112);b=180-c-2*h}while(b<16||b>95);return make(S[0],'Биссектриса',`В треугольнике ABC отрезок AD — биссектриса. ∠C = ${c}°, ∠CAD = ${h}°. Найдите ∠B.`,b,[180-c-h,180-c,c-2*h],'bisector',{h,c},`AD делит угол A пополам, поэтому ∠A = 2·${h}° = ${2*h}°. Тогда ∠B = 180° − ${c}° − ${2*h}° = ${b}°.`)}
  function gI3(){const d=rint(6,24),ans=45-d;return make(S[0],'Линии из прямого угла',`Угол между биссектрисой и медианой прямоугольного треугольника, проведёнными из вершины прямого угла, равен ${d}°. Найдите меньший острый угол треугольника.`,ans,[45+d,90-d,d],'rightLines',{d},`Биссектриса образует со стороной угол 45°. Направление медианы к середине гипотенузы связано с острым углом треугольника. Меньший угол равен 45° − ${d}° = ${ans}°.`)}
  function gII1(){const d=2*rint(12,39),ans=90+d/2;return make(S[1],'Параллелограмм',`Один угол параллелограмма больше соседнего на ${d}°. Найдите больший угол.`,ans,[180-d,90-d/2,d/2],'para',{d},`Соседние углы дают 180°. Пусть меньший x, тогда больший x + ${d}. Получаем 2x + ${d} = 180, поэтому больший угол равен ${ans}°.`)}
  function gII2(){const A=2*rint(33,76),ans=(180-A)/2;return make(S[1],'Ромб',`В ромбе ABCD угол DAB равен ${A}°. Найдите угол BDC.`,ans,[A/2,180-A,A],'rhombus',{A},`Соседний угол D равен 180° − ${A}° = ${180-A}°. Диагональ BD делит угол D пополам: ∠BDC = ${ans}°.`)}
  function gII3(){if(Math.random()<.5){const c=2*rint(22,58),ans=90+c/2;return make(S[1],'Пересечение биссектрис',`В треугольнике ABC угол C равен ${c}°. Биссектрисы AD и BE пересекаются в O. Найдите ∠AOB.`,ans,[90-c/2,180-c,c/2],'incenter',{c},`Углы при A и B в треугольнике AOB равны половинам исходных. Их сумма равна (180° − ${c}°)/2, поэтому ∠AOB = 180° − (180° − ${c}°)/2 = ${ans}°.`)}const a=rint(38,104),ans=180-a;return make(S[1],'Пересечение высот',`В остроугольном треугольнике ABC угол A равен ${a}°. Высоты BD и CE пересекаются в O. Найдите ∠DOE.`,ans,[a,90-a,90+a],'orthocenter',{a},`BD ⟂ AC и CE ⟂ AB. Угол между высотами дополнительный к углу A, поэтому ∠DOE = 180° − ${a}° = ${ans}°.`)}
  function gIII1(){const a=2*rint(5,13),b=2*a,h=2*rint(5,15),ans=h/2;return make(S[2],'Равные площади',`Стороны параллелограмма равны ${a} и ${b}. Высота к меньшей стороне равна ${h}. Найдите высоту к большей стороне.`,ans,[h,h*2,b/a],'paraHeight',{a,b,h},`Площадь одна и та же: ${a}·${h} = ${b}·x. Значит, x = ${a*h}/${b} = ${ans}.`)}
  function gIII2(){const k=rint(4,10),m=rint(3,9),small=3*k,big=4*k,hBig=3*m,ans=4*m;return make(S[2],'Высоты треугольника',`Две стороны треугольника равны ${small} и ${big}. Высота к большей стороне равна ${hBig}. Найдите высоту к меньшей стороне.`,ans,[hBig,3*m,small*hBig/big],'triHeight',{small,big,hBig},`Площадь через разные основания равна: ½·${big}·${hBig} = ½·${small}·x. Отсюда x = ${big*hBig}/${small} = ${ans}.`)}
  function gIII3(){if(Math.random()<.5){const k=rint(7,28),ans=2*k;return make(S[2],'Равносторонний треугольник',`Высота равностороннего треугольника равна ${k}√3. Найдите его сторону.`,ans,[k,3*k,4*k],'equilateral',{k},`Высота делит основание пополам. По теореме Пифагора для половины треугольника сторона получается равной 2·${k} = ${ans}.`)}const n=rint(6,18),side=2*n,ans=n*n;return make(S[2],'Площадь по двум сторонам',`Боковые стороны равнобедренного треугольника равны ${side}, а угол между ними равен 30°. Найдите площадь.`,ans,[2*ans,side*side,ans/2],'isoArea',{side},`Высота относительно одной боковой стороны равна ${side}·sin30° = ${n}. Площадь равна ½·${side}·${n} = ${ans}.`)}
  function gIV1(){const ans=rint(5,35),whole=4*ans;return make(S[3],'Площадь подобного треугольника',`Площадь треугольника ABC равна ${whole}. DE — средняя линия, параллельная AB. Найдите площадь треугольника CDE.`,ans,[whole/2,2*ans,whole],'midline',{whole},`Линейный масштаб малого треугольника равен 1/2, поэтому площадь уменьшается в 2·2 = 4 раза: ${whole}/4 = ${ans}.`)}
  function gIV2(){const small=rint(4,28),ans=4*small;return make(S[3],'Обратная задача на подобие',`EF — средняя линия треугольника ABC. Площадь малого треугольника у общей вершины равна ${small}. Найдите площадь ABC.`,ans,[2*small,small/4,8*small],'midline',{small},`Основание и высота большого треугольника вдвое больше, поэтому его площадь в 4 раза больше: ${small}·4 = ${ans}.`)}
  function gIV3(){const small=rint(4,12),big=2*rint(7,18),ans=big/2;return make(S[3],'Средняя линия трапеции',`Основания трапеции равны ${small} и ${big}. Найдите больший из отрезков, на которые диагональ делит среднюю линию.`,num(ans),[num(small/2),num((small+big)/2),num(big-small)],'trapMid',{small,big},`Диагональ создаёт два треугольника. Части средней линии равны половинам оснований; большая часть равна ${big}/2 = ${num(ans)}.`)}
  const triples=[[3,4,5],[5,12,13],[7,24,25],[8,15,17],[20,21,29]];
  function gV1(){const [p,q,c]=pick(triples);return make(S[4],'Дополнительные углы',`В прямоугольном треугольнике sin A = ${frac(p,c)}. Найдите sin B.`,frac(q,c),[frac(p,c),frac(p,q),frac(q,p)],'rightTrig',{p,q,c},`Острые углы A и B дополняют друг друга. Если sin A = ${p}/${c}, второй катет равен ${q}, поэтому sin B = ${q}/${c} = ${frac(q,c)}.`)}
  function gV2(){const [a,b,c]=pick(triples),k=rint(1,4),A=a*k,B=b*k,C=c*k;return make(S[4],'Синус в прямоугольном треугольнике',`В треугольнике ABC угол C равен 90°, AC = ${A}, BC = ${B}, AB = ${C}. Найдите sin B.`,frac(A,C),[frac(B,C),frac(A,B),frac(B,A)],'rightTrig',{a:A,b:B,c:C},`Для угла B противолежащий катет — AC, гипотенуза — AB. Поэтому sin B = ${A}/${C} = ${frac(A,C)}.`)}
  function gV3(){const [side,base]=pick([[20,8],[15,18],[13,10],[17,16],[25,30]]),ans=frac(base,2*side);return make(S[4],'Равнобедренный треугольник',`В треугольнике ABC стороны AC и BC равны ${side}, основание AB равно ${base}. Найдите cos A.`,ans,[frac(base,side),frac(side,base),frac(2*side,base)],'isoTrig',{side,base},`Высота из C делит основание пополам: AH = ${base}/2. В прямоугольном треугольнике ACH cos A = AH/AC = ${base/2}/${side} = ${ans}.`)}
  function gVI1(){const d=rint(16,68),askCentral=Math.random()<.5,ans=askCentral?2*d:d;return make(S[5],'Центральный и вписанный углы',`Центральный угол на ${d}° больше вписанного угла, опирающегося на ту же дугу. Найдите ${askCentral?'центральный':'вписанный'} угол.`,ans,[askCentral?d:2*d,180-d,90-d],'circleAngles',{d},`Центральный угол вдвое больше вписанного. Если вписанный равен x, разность 2x − x = x равна ${d}°. Значит, искомый угол равен ${ans}°.`)}
  function gVI2(){const [m,n,ans]=pick([[1,3,60],[2,5,72],[1,4,45],[1,5,36],[1,2,90]]);return make(S[5],'Дуга окружности',`Вписанный угол опирается на дугу, составляющую ${m}/${n} окружности. Найдите этот угол.`,ans,[360*m/n,180-ans,ans/2],'inscribed',{m,n},`Дуга равна 360°·${m}/${n} = ${2*ans}°. Вписанный угол равен половине дуги: ${ans}°.`)}
  function gVI3(){const arc=2*rint(24,72),ans=180-arc;return make(S[5],'Две касательные',`Из внешней точки проведены касательные к окружности. Меньшая дуга между точками касания равна ${arc}°. Найдите угол между касательными.`,ans,[arc,arc/2,180-arc/2],'twoTangents',{arc},`Радиусы к точкам касания дают два прямых угла. В четырёхугольнике угол между касательными равен 180° − ${arc}° = ${ans}°.`)}
  function gVII1(){let AB,BC,AD,CD;do{AB=rint(12,30);BC=rint(7,22);AD=rint(10,26);CD=BC+AD-AB}while(CD<4||CD>30);return make(S[6],'Касательный четырёхугольник',`В четырёхугольник ABCD вписана окружность. AB = ${AB}, BC = ${BC}, AD = ${AD}. Найдите CD.`,CD,[AB+BC-AD,AB+AD-BC,BC+AD],'tangentQuad',{AB,BC,AD},`Суммы противоположных сторон равны: AB + CD = BC + AD. Поэтому CD = ${BC} + ${AD} − ${AB} = ${CD}.`)}
  function gVII2(){const a=rint(6,15),b=a%2?rint(4,10)*2+1:rint(4,10)*2,ans=(a+b)/2;return make(S[6],'Описанная трапеция',`Боковые стороны трапеции, описанной около окружности, равны ${a} и ${b}. Найдите среднюю линию трапеции.`,num(ans),[num(a+b),num(Math.abs(a-b)/2),num((a*b)/2)],'tangentTrap',{a,b},`Сумма оснований равна сумме боковых сторон: ${a}+${b}. Средняя линия равна половине суммы оснований: (${a}+${b})/2 = ${num(ans)}.`)}

  async function handleLogin(e){e.preventDefault();const input=$('codeInput'),btn=$('loginBtn'),status=$('loginStatus'),code=input.value.trim();if(!code){status.className='status bad';status.textContent='Введи личный код';return}input.disabled=btn.disabled=true;status.textContent='Пингвины проверяют пропуск…';try{student=await validateStudent(code);saveStudent(student);updateStudent();await flushPending();renderStart()}catch(err){status.className='status bad';status.textContent=err.message||'Код не подтверждён';input.disabled=btn.disabled=false;input.focus()}}
  function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function renderStart(){gameActive=false;updateStudent();$('app').innerHTML=`<section class="screen start"><div class="scroll"><span class="tag">Полный микс ЕГЭ №1</span><h1>Экспедиция за 27 артефактами</h1><p class="lead">Все девять групп прототипов перемешиваются. При каждой новой экспедиции меняются числа, задания и порядок.</p><div class="rules"><div class="rule"><b>27</b>задач</div><div class="rule"><b>9 × 3</b>группы</div><div class="rule"><b>3</b>механики</div></div><p>Таймера нет. После ошибки можно исправиться, но успешность учитывает только первый выбор.</p><button class="primary" id="startBtn">Начать экспедицию</button></div>${hero()}</section>`;$('startBtn').addEventListener('click',startGame)}
  function startGame(){deck=shuffle(GENERATORS.map(g=>g()));index=0;firstTryCorrect=0;questionAttempted=false;solved=false;wrongTasks=[];startedAt=Date.now();attemptEventId=uuid();resultSubmitted=false;gameActive=true;updateStudent();sound('start');renderQuestion()}
  function renderQuestion(){questionAttempted=false;solved=false;const q=deck[index],mech=['cannon','jeep','temple'][index%3],m=MECH[mech];$('app').innerHTML=`<section class="screen game"><div class="hud"><span class="counter">Артефакт ${index+1} / ${TOTAL}</span><div class="track"><i style="width:${index/TOTAL*100}%"></i></div><span class="score">Верно сразу: <b id="liveScore">${firstTryCorrect}</b></span></div><div class="mission"><section class="task-card"><div><div class="chapter">${esc(q.section)}</div><h2 class="task-title">${esc(q.title)}</h2></div><div class="prompt">${esc(q.prompt)}</div><div class="diagram">${diagram(q)}</div></section><section class="action-card ${mech}" id="actionCard"><div class="mechanic-title">${m.title}<span class="drag-tip">${m.tip}</span></div><div class="playfield" id="playfield">${characters(mech)}<div class="reaction" id="reaction"></div><div class="next-wrap" id="nextWrap"><button class="primary" id="nextBtn">${index===TOTAL-1?'Завершить экспедицию':'Дальше →'}</button></div><div class="drag-token ${m.tokenClass}" id="dragToken" role="button" aria-label="${m.tip}" tabindex="0">${m.object}</div><div class="drop-grid">${q.options.map((o,i)=>`<div class="drop-zone" role="button" tabindex="0" data-value="${esc(o)}" data-index="${i}"><span>${esc(o)}</span></div>`).join('')}</div></div></section></div></section>`;setupInteraction(mech)}
  function setupInteraction(mech){const token=$('dragToken'),field=$('playfield');let active=false,pid=0,ox=0,oy=0;const reset=()=>{token.style.left='50%';token.style.top='40%';token.style.transform='';token.classList.remove('dragging')};token.addEventListener('pointerdown',e=>{if(solved)return;active=true;pid=e.pointerId;const r=token.getBoundingClientRect();ox=e.clientX-r.left;oy=e.clientY-r.top;token.setPointerCapture(pid);token.classList.add('dragging')});token.addEventListener('pointermove',e=>{if(!active||e.pointerId!==pid)return;const fr=field.getBoundingClientRect();token.style.left=(e.clientX-fr.left-ox+token.offsetWidth/2)+'px';token.style.top=(e.clientY-fr.top-oy+token.offsetHeight/2)+'px'});token.addEventListener('pointerup',e=>{if(!active)return;active=false;token.classList.remove('dragging');token.style.pointerEvents='none';const hit=document.elementFromPoint(e.clientX,e.clientY);token.style.pointerEvents='';const zone=hit&&hit.closest('.drop-zone');if(zone&&!zone.classList.contains('used'))choose(zone.dataset.value,zone,mech);if(!solved)setTimeout(reset,180)});document.querySelectorAll('.drop-zone').forEach(z=>{z.addEventListener('click',()=>{if(!z.classList.contains('used'))choose(z.dataset.value,z,mech)});z.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(z.dataset.value,z,mech)}})})}
  function choose(value,zone,mech){if(solved)return;const q=deck[index],correct=value===q.answer,first=!questionAttempted;questionAttempted=true;if(correct){solved=true;if(first)firstTryCorrect++;$('liveScore').textContent=firstTryCorrect;zone.classList.add('correct');document.querySelectorAll('.drop-zone').forEach(z=>z.classList.add('used'));const card=$('actionCard');card.classList.add(mech==='cannon'?'recoil':mech==='jeep'?'drive':'spark');showReaction(first?'Точно! Артефакт наш с первой попытки.':'Маршрут исправлен. Артефакт найден.','good');$('nextWrap').classList.add('show');$('nextBtn').addEventListener('click',nextQuestion);sound('good')}else{zone.classList.add('wrong','used');if(first)wrongTasks.push(q);showReaction('Ловушка! Первый выбор уже учтён. Попробуй другой маршрут.','bad');sound('bad')}}
  function showReaction(msg,type){const r=$('reaction');r.textContent=msg;r.className='reaction show '+type;setTimeout(()=>{if(!solved)r.classList.remove('show')},1500)}
  function nextQuestion(){index++;if(index>=TOTAL)finish();else renderQuestion()}
  function finish(){gameActive=false;updateStudent();const seconds=elapsed(),score=Math.round(firstTryCorrect/TOTAL*100),review=wrongTasks.length?`<button class="secondary" id="reviewBtn">Разобрать ошибки (${wrongTasks.length})</button>`:'';$('app').innerHTML=`<section class="screen final"><div class="scroll"><span class="tag">Экспедиция завершена</span><h1>${score>=85?'Все артефакты спасены!':score>=60?'Маршрут почти пройден':'Остров зовёт ещё раз'}</h1><div class="ring" style="background:conic-gradient(#55bd66 ${score}%,#d5c28c 0)"><b>${score}%</b></div><p><b>Успешность с первой попытки</b></p><div class="stats"><div class="stat">Верно сразу<b>${firstTryCorrect} из ${TOTAL}</b></div><div class="stat">Время<b>${timeText(seconds)}</b></div></div><div class="save-status" id="saveStatus">Сохраняем результат…</div><div class="actions"><button class="primary" id="againBtn">Новая экспедиция</button>${review}<button class="secondary" id="homeBtn">На старт</button></div><div class="review-list" id="reviewList" hidden></div></div>${hero()}</section>`;$('againBtn').addEventListener('click',startGame);$('homeBtn').addEventListener('click',renderStart);if($('reviewBtn'))$('reviewBtn').addEventListener('click',renderReview);sound('finish');submitOnce(score,seconds)}
  function renderReview(){const box=$('reviewList');box.hidden=!box.hidden;if(!box.hidden){box.innerHTML=wrongTasks.map((q,i)=>`<div class="review-item"><b>${i+1}. ${esc(q.title)} · ответ ${esc(q.answer)}</b><div>${esc(q.prompt)}</div><small>${esc(q.solution)}</small></div>`).join('');$('reviewBtn').textContent='Скрыть разбор'}else $('reviewBtn').textContent=`Разобрать ошибки (${wrongTasks.length})`}
  function changeStudent(){if(gameActive)return;['egeStudentId','egeStudentName','egeStudentCode'].forEach(k=>localStorage.removeItem(k));renderLogin()}
  function sound(type){if(muted)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ac=sound.ac||(sound.ac=new AC()),now=ac.currentTime,g=ac.createGain(),sets={start:[[145,.18],[260,.38],[410,.62]],good:[[420,.12],[670,.28]],bad:[[145,.2],[82,.38]],finish:[[260,.12],[430,.28],[720,.52]]},set=sets[type]||sets.good;g.connect(ac.destination);g.gain.setValueAtTime(.045,now);g.gain.exponentialRampToValueAtTime(.0001,now+set[set.length-1][1]+.14);set.forEach(([f,d],i)=>{const o=ac.createOscillator();o.type=type==='bad'?'sawtooth':'triangle';o.frequency.value=f;o.connect(g);o.start(now+i*.045);o.stop(now+d+.1)})}catch(_){}}
  $('switchBtn').addEventListener('click',changeStudent);$('soundBtn').addEventListener('click',()=>{muted=!muted;$('soundBtn').textContent=muted?'Без звука':'Звук'});window.addEventListener('online',flushPending);atmosphere();
  async function init(){const code=new URLSearchParams(location.search).get('code');if(code){renderLogin(code);return}student=storedStudent();if(student){updateStudent();await flushPending();renderStart()}else renderLogin()}init();
  </script>
