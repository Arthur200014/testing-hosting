  const facts=[
    ['triangle-sum','I. Треугольники',true,'Сумма внутренних углов любого треугольника равна 180°.','Базовый факт: сумма углов треугольника — 180°.','Это основное свойство любого треугольника.','tri'],
    ['triangle-sum','I. Треугольники',false,'Сумма внутренних углов треугольника зависит от длин его сторон.','Базовый факт: сумма углов треугольника всегда одинакова.','Форма и размеры треугольника не изменяют сумму его внутренних углов.','tri'],
    ['iso-base','I. Треугольники',true,'В равнобедренном треугольнике углы при основании равны.','Базовое свойство равнобедренного треугольника.','Равным боковым сторонам противолежат равные углы при основании.','iso'],
    ['iso-base','I. Треугольники',false,'В каждом равнобедренном треугольнике равны все три угла.','Равны только углы при основании.','Все три угла равны у равностороннего треугольника.','iso'],
    ['adjacent-exterior','I. Углы',true,'Внешний угол треугольника и смежный с ним внутренний угол в сумме дают 180°.','Базовый факт о смежных углах.','Стороны этих углов образуют развёрнутый угол.','exterior'],
    ['adjacent-exterior','I. Углы',false,'Внешний угол треугольника и смежный с ним внутренний угол всегда равны.','Смежные углы образуют развёрнутый угол, но не обязаны быть равны.','Равенство возможно только в отдельном случае, а не всегда.','exterior'],
    ['bisector-definition','I. Отрезки треугольника',true,'Биссектриса угла делит его на два равных угла.','Определение биссектрисы.','Главный признак биссектрисы — две равные части исходного угла.','bisector'],
    ['bisector-definition','I. Отрезки треугольника',false,'Биссектриса угла обязательно делит противоположную сторону пополам.','Биссектриса делит пополам угол.','Деление стороны пополам не входит в определение биссектрисы.','bisector'],
    ['median-definition','I. Отрезки треугольника',true,'Медиана соединяет вершину треугольника с серединой противоположной стороны.','Определение медианы.','Конец медианы на стороне делит эту сторону на два равных отрезка.','rightMedian'],
    ['median-definition','I. Отрезки треугольника',false,'Любая медиана треугольника перпендикулярна противоположной стороне.','Перпендикулярность не входит в определение медианы.','Медиана обязана проходить через середину стороны, но не обязана быть высотой.','rightMedian'],
    ['altitude-definition','I. Отрезки треугольника',true,'Высота треугольника перпендикулярна стороне, к которой она проведена.','Определение высоты треугольника.','Высота проводится из вершины под прямым углом к противоположной стороне или её продолжению.','rightAltitude'],
    ['altitude-definition','I. Отрезки треугольника',false,'Высота треугольника обязательно делит противоположную сторону пополам.','Высота задаёт прямой угол со стороной.','Деление стороны пополам не является обязательным свойством высоты.','rightAltitude'],
    ['orthocenter-definition','II. Замечательные точки',true,'Три высоты треугольника пересекаются в одной точке — ортоцентре.','Базовый факт о высотах треугольника.','Общая точка пересечения высот называется ортоцентром.','orthocenter'],
    ['orthocenter-definition','II. Замечательные точки',false,'Ортоцентр — это точка пересечения трёх медиан треугольника.','Ортоцентр образуют высоты.','Медианы пересекаются в другой замечательной точке.','orthocenter'],
    ['incenter-definition','II. Замечательные точки',true,'Три биссектрисы треугольника пересекаются в одной точке — инцентре.','Базовый факт о биссектрисах треугольника.','Общая точка пересечения биссектрис является центром вписанной окружности.','incenter'],
    ['incenter-definition','II. Замечательные точки',false,'Инцентр — это точка пересечения трёх высот треугольника.','Инцентр образуют биссектрисы.','Высоты пересекаются в ортоцентре.','incenter'],
    ['parallelogram-definition','II. Четырёхугольники',true,'У параллелограмма противоположные стороны попарно параллельны.','Определение параллелограмма.','Обе пары противоположных сторон параллельны.','parallelogram'],
    ['parallelogram-definition','II. Четырёхугольники',false,'Для параллелограмма достаточно, чтобы только одна пара противоположных сторон была параллельна.','У параллелограмма параллельны обе пары противоположных сторон.','Одна пара параллельных сторон ещё не задаёт параллелограмм.','parallelogram'],
    ['rhombus-definition','II. Четырёхугольники',true,'Ромб — это параллелограмм, у которого все стороны равны.','Определение ромба.','Равенство всех четырёх сторон — основной признак ромба в этом определении.','rhombus'],
    ['rhombus-definition','II. Четырёхугольники',false,'У ромба обязательно равны только противоположные стороны, а соседние могут отличаться.','У ромба равны все четыре стороны.','Если равны только противоположные стороны, перед нами может быть обычный параллелограмм.','rhombus']

  function diagram(k){const src=diagramPng[k]||diagramPng.tri;return `<img src="${src}" alt="Точный геометрический чертёж" width="780" height="600">`}
  function uuid(){if(window.crypto&&typeof crypto.randomUUID==='function')return crypto.randomUUID();return'evt-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)+'-'+Math.random().toString(36).slice(2)}
  function localDate(ts=Date.now()){const d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  function timeText(s){s=Math.max(0,Number(s)||0);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
  function penguin(n=1){return `<div class="penguins">${Array.from({length:n},(_,i)=>`<div class="penguin" style="--p:${i?0:0}"><i class="body"></i><i class="belly"></i><i class="eye l"></i><i class="eye r"></i><i class="beak"></i><i class="wing l"></i><i class="wing r"></i></div>`).join('')}</div>`}
  function scene(){return `<div class="scene"><i class="sun"></i><i class="river"></i><i class="cliff l"></i><i class="cliff r"></i><div class="bridge"><i class="rope"></i><div class="planks">${Array.from({length:11},(_,i)=>`<i class="plank on" style="--rot:${i%2?2:-2}deg"></i>`).join('')}</div><i class="rope"></i></div>${penguin(3)}</div>`}
  function storedStudent(){const studentId=localStorage.getItem('egeStudentId');return studentId?{studentId,name:localStorage.getItem('egeStudentName')||'Ученик',code:localStorage.getItem('egeStudentCode')||''}:null}
  function saveStudent(s){localStorage.setItem('egeStudentId',s.studentId);localStorage.setItem('egeStudentName',s.name);localStorage.setItem('egeStudentCode',s.code)}
  function parseStudent(data,code){const src=(data&&(data.student||data.data))||data||{},studentId=src.studentId||src.id||(data&&data.studentId),name=src.studentName||src.name||src.fullName||(data&&(data.studentName||data.name)),bad=data&&(data.success===false||data.valid===false||data.ok===false);if(bad||!studentId)throw new Error((data&&(data.message||data.error))||'Личный код не найден');return{studentId:String(studentId),name:String(name||'Ученик'),code:String(code)}}
  function validateStudentAttempt(code,attempt){return new Promise((resolve,reject)=>{const cb='egeValidate_'+Date.now()+'_'+attempt+'_'+Math.random().toString(36).slice(2),s=document.createElement('script');let done=false;const clean=()=>{delete window[cb];s.remove()},finishError=message=>{if(done)return;done=true;clearTimeout(timer);clean();reject(new Error(message))},timer=setTimeout(()=>finishError('Сервер проверки отвечает слишком долго'),30000);window[cb]=data=>{if(done)return;done=true;clearTimeout(timer);clean();try{resolve(parseStudent(data,code))}catch(e){reject(e)}};s.onerror=()=>finishError('Не удалось загрузить ответ сервера');s.src=API_URL+'?'+new URLSearchParams({action:'validateStudent',code,callback:cb,_:String(Date.now())});document.head.appendChild(s)})}
  async function validateStudent(code){let lastError;for(let attempt=1;attempt<=2;attempt++){try{return await validateStudentAttempt(code,attempt)}catch(error){lastError=error;const retryable=/отвечает слишком долго|Не удалось загрузить ответ сервера/.test(String(error?.message||error));if(!retryable||attempt===2)break;await new Promise(resolve=>setTimeout(resolve,700))}}throw lastError||new Error('Не удалось проверить код ученика')}

  function newGameState(limit=1){return{version:1,schemaVersion:SCHEMA_VERSION,boardEpoch:0,strokes:{},ui:{screen:'lobby'},game:{status:'lobby',studentLimit:Number(limit)===2?2:1,players:{},deck:[],index:0,turnKey:'',playerOrder:[],stats:{},attempts:{},question:{},feedback:null,sessionId:uuid(),eventIds:{},submissions:{},startedAt:0,finishedAt:0,earlyEnded:false}}}

  function chooseDeck(limit){if(Number(limit)===2)return shuffle(facts.map((_,i)=>i));const groups={};facts.forEach((f,i)=>(groups[f.id]||(groups[f.id]=[])).push(i));return shuffle(Object.values(groups).map(pair=>pair[Math.floor(Math.random()*pair.length)]))}

  function resultCard(key,g){const p=g.players[key],s=g.stats[key]||{},completed=Number(s.completed||0),correct=Number(s.firstTryCorrect||0),percent=completed?Math.round(correct/completed*100):0,duration=Math.max(1,Math.round(((s.finishedAt||g.finishedAt||now())-(s.startedAt||g.startedAt||now()))/1000)),sub=g.submissions[key]||{};return`<article class="final-player"><span class="tag">Ученик №${p.slot}</span><h2>${esc(p.name)}</h2><div class="ring" style="background:conic-gradient(#55b768 ${percent}%,#c8b887 0)"><b>${percent}%</b></div><div class="stats"><div class="stat">Верно сразу<b>${correct} из ${completed}</b></div><div class="stat">Время<b>${timeText(duration)}</b></div></div><div class="save-pill ${sub.status==='saved'?'ok':sub.status==='queued'?'bad':''}">${sub.status==='saved'?'✓ Результат сохранён':sub.status==='queued'?'Нет связи — отправим позже':'Сохраняем результат…'}</div></article>`}
  function renderFinal(){setLessonPanelExpanded(true);const g=sharedState.game,keys=g.playerOrder.length?g.playerOrder:Object.keys(g.players);$('app').innerHTML=`<section class="screen final"><div class="scroll" style="grid-column:1/-1"><span class="tag">${g.earlyEnded?'Досрочное завершение':'Операция завершена'}</span><h1>Результаты переправы</h1><p class="lead">Процент рассчитан только по уже пройденным заданиям. Непройденные задания в расчёт не входят.</p><div class="final-two" style="grid-template-columns:repeat(${Math.min(2,keys.length)},1fr)">${keys.map(k=>resultCard(k,g)).join('')}</div>${role==='teacher'?'<div class="actions"><button class="primary" id="newFromFinal">Начать новое занятие</button></div>':''}</div></section>`;if($('newFromFinal'))$('newFromFinal').onclick=showLimitChoice;const token=g.sessionId+'|'+g.finishedAt;if(finalSoundToken!==token){finalSoundToken=token;sound('finish')}if(role==='student')ensureSubmission(playerIdKey);if(role==='teacher'){clearTimeout(resultFallbackTimer);resultFallbackTimer=setTimeout(()=>keys.forEach(ensureSubmission),4500)}}
  function resultPayload(key,state=sharedState){const g=state.game,p=g.players[key],s=g.stats[key]||{},completed=Number(s.completed||0),score=Number(s.firstTryCorrect||0),percent=completed?Math.round(score/completed*100):0,finished=Number(g.finishedAt||now()),started=Number(s.startedAt||g.startedAt||finished);return{action:'submitTest',programId:'EGE_MATH',eventId:g.eventIds[key]||`${g.sessionId}-${key}`,studentId:String(p.id),studentName:p.name,studentCode:p.code||'',testId:TEST_META.testId,testName:TEST_META.testName,topicId:TEST_META.topicId,topicName:TEST_META.topicName,taskNumber:TEST_META.taskNumber,testDate:localDate(finished),score,maxScore:completed,percent,scorePercent:percent,durationSec:Math.max(1,Math.round((finished-started)/1000)),durationSeconds:Math.max(1,Math.round((finished-started)/1000)),startedAt:new Date(started).toISOString(),finishedAt:new Date(finished).toISOString(),completedAt:new Date(finished).toISOString(),answeredCount:completed,wrongAttempts:Number(s.wrongAttempts||0),mode:g.studentLimit===2?'two_students':'one_student',schemaVersion:TEST_META.schemaVersion}}
  async function sendResult(payload){const response=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),redirect:'follow'});let answer;try{answer=await response.json()}catch{throw new Error('Система результатов не ответила.')}if(!response.ok||!answer?.ok)throw new Error(answer?.error||'Результат не принят.');return answer}
  function readQueue(){try{const q=JSON.parse(localStorage.getItem(PENDING_RESULTS_KEY)||'[]');return Array.isArray(q)?q:[]}catch{return[]}}
  function writeQueue(q){localStorage.setItem(PENDING_RESULTS_KEY,JSON.stringify(q))}
  function queueResult(payload,key){const q=readQueue();if(!q.some(x=>x.payload?.eventId===payload.eventId))q.push({payload,key});writeQueue(q)}
  function removeQueued(eventId){writeQueue(readQueue().filter(x=>x.payload?.eventId!==eventId))}
  async function ensureSubmission(key){if(!sharedState?.game.players[key])return;const submissionRef=ref(database,`${lessonRoot()}/state/game/submissions/${key}`),stamp=now(),claim=await runTransaction(submissionRef,current=>{if(current?.status==='saved')return;if((current?.status==='sending'||current?.status==='queued')&&stamp-Number(current.updatedAt||0)<10000)return;return{status:'sending',eventId:sharedState.game.eventIds[key],updatedAt:stamp,by:role}});if(!claim.committed)return;const payload=resultPayload(key);try{if(!navigator.onLine)throw new Error('offline');await sendResult(payload);removeQueued(payload.eventId);await update(submissionRef,{status:'saved',eventId:payload.eventId,updatedAt:now()})}catch(err){queueResult(payload,key);await update(submissionRef,{status:'queued',eventId:payload.eventId,updatedAt:now()})}}
  async function flushPending(){if(!navigator.onLine)return;for(const item of readQueue()){try{await sendResult(item.payload);removeQueued(item.payload.eventId);if(sharedState?.game.eventIds[item.key]===item.payload.eventId)await update(ref(database,`${lessonRoot()}/state/game/submissions/${item.key}`),{status:'saved',eventId:item.payload.eventId,updatedAt:now()})}catch{break}}}
  function sendProgressOnClose(){if(role!=='student'||!sharedState?.game.players[playerIdKey]||!sharedState.game.startedAt)return;const s=sharedState.game.stats[playerIdKey]||{};if(!s.completed)return;const payload=resultPayload(playerIdKey);try{navigator.sendBeacon(API_URL,new Blob([JSON.stringify(payload)],{type:'text/plain;charset=utf-8'}))}catch{}queueResult(payload,playerIdKey)}
  function renderBoard(){const layer=$('boardLayer');if(!sharedState){layer.innerHTML='';return}const epoch=sharedState.boardEpoch;layer.innerHTML=Object.values(sharedState.strokes||{}).filter(s=>s&&s.epoch===epoch).map(s=>`<polyline data-stroke-id="${esc(s.id)}" points="${(s.points||[]).map(([x,y])=>`${x*innerWidth},${y*innerHeight}`).join(' ')}" fill="none" stroke="${esc(s.color)}" stroke-width="${Number(s.width)||6}" stroke-linecap="round" stroke-linejoin="round"/>`).join('')}
  let boardTool='cursor',drawing=null,lastStrokeWrite=0;
  function setBoardTool(tool){boardTool=tool;document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('on',b.dataset.tool===tool));$('boardLayer').classList.toggle('active',tool!=='cursor')}
  async function boardPointerDown(e){if(!role||!sharedState||boardTool==='cursor')return;if(boardTool==='eraser'){const id=e.target?.dataset?.strokeId;if(id)await remove(ref(database,`${lessonRoot()}/state/strokes/${id}`));return}e.preventDefault();const id='stroke-'+uuid(),point=[e.clientX/innerWidth,e.clientY/innerHeight];drawing={id,anchorId:'game-screen',authorId:role==='teacher'?identity.id:identity.studentId,authorName:role==='teacher'?'Учитель':identity.name,color:$('boardColor').value,width:Number($('boardWidth').value),points:[point],done:false,epoch:sharedState.boardEpoch,rev:now()};e.currentTarget.setPointerCapture(e.pointerId);await set(ref(database,`${lessonRoot()}/state/strokes/${id}`),drawing)}
  function boardPointerMove(e){if(!drawing)return;drawing.points.push([e.clientX/innerWidth,e.clientY/innerHeight]);const stamp=now();if(stamp-lastStrokeWrite>70){lastStrokeWrite=stamp;set(ref(database,`${lessonRoot()}/state/strokes/${drawing.id}`),drawing)}}
  function boardPointerUp(){if(!drawing)return;drawing.done=true;drawing.rev=now();set(ref(database,`${lessonRoot()}/state/strokes/${drawing.id}`),drawing);drawing=null}
  async function clearAllBoard(){if(role!=='teacher'||!sharedState)return;await transactState(state=>{state.boardEpoch+=1;state.strokes={};state.version+=1;return state})}
  function initToolbar(){const toolbar=$('boardToolbar'),saved=JSON.parse(localStorage.getItem(TOOLBAR_POSITION_KEY)||'null'),save=()=>localStorage.setItem(TOOLBAR_POSITION_KEY,JSON.stringify({x:toolbar.offsetLeft,y:toolbar.offsetTop,collapsed:toolbar.classList.contains('collapsed')}));if(saved){toolbar.style.left=Math.max(0,Math.min(innerWidth-160,Number(saved.x)||0))+'px';toolbar.style.top=Math.max(0,Math.min(innerHeight-45,Number(saved.y)||0))+'px';toolbar.classList.toggle('collapsed',Boolean(saved.collapsed));$('boardCollapse').textContent=saved.collapsed?'+':'−'}document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>setBoardTool(b.dataset.tool));$('clearBoard').onclick=clearAllBoard;$('boardCollapse').onclick=e=>{e.stopPropagation();toolbar.classList.toggle('collapsed');$('boardCollapse').textContent=toolbar.classList.contains('collapsed')?'+':'−';save()};$('boardCollapse').onpointerdown=e=>e.stopPropagation();let drag=null;$('boardGrip').onpointerdown=e=>{if(e.target.closest('button'))return;drag={dx:e.clientX-toolbar.offsetLeft,dy:e.clientY-toolbar.offsetTop};$('boardGrip').setPointerCapture(e.pointerId)};$('boardGrip').onpointermove=e=>{if(!drag)return;const x=Math.max(0,Math.min(innerWidth-toolbar.offsetWidth,e.clientX-drag.dx)),y=Math.max(0,Math.min(innerHeight-toolbar.offsetHeight,e.clientY-drag.dy));toolbar.style.left=x+'px';toolbar.style.top=y+'px';toolbar.style.bottom='auto'};$('boardGrip').onpointerup=()=>{if(!drag)return;save();drag=null}}
  let cursorStamp=0;function teacherMouseMove(e){if(role!=='teacher'||!navigator.onLine||now()-cursorStamp<75)return;cursorStamp=now();update(ref(database,`${lessonRoot()}/messages/teacherCursor`),{x:e.clientX/innerWidth,y:e.clientY/innerHeight,at:serverTimestamp()})}
  function renderTeacherCursor(data){const c=$('teacherCursor');if(!data||now()-Number(data.at||0)>5000){c.classList.remove('show');return}c.style.left=(data.x*innerWidth)+'px';c.style.top=(data.y*innerHeight)+'px';c.classList.add('show')}
  function sound(type){if(muted)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ac=sound.ac||(sound.ac=new AC()),now=ac.currentTime,g=ac.createGain(),sets={start:[[130,.2],[250,.4]],good:[[400,.12],[650,.3]],bad:[[150,.2],[82,.38]],finish:[[250,.13],[420,.3],[680,.55]]},set=sets[type]||sets.good;g.connect(ac.destination);g.gain.setValueAtTime(.04,now);g.gain.exponentialRampToValueAtTime(.0001,now+set[set.length-1][1]+.12);set.forEach(([f,d],i)=>{const o=ac.createOscillator();o.type=type==='bad'?'sawtooth':'triangle';o.frequency.value=f;o.connect(g);o.start(now+i*.04);o.stop(now+d+.1)})}catch(_){}}
  $('lessonLaunch').onclick=showRoleChoice;$('modalBackdrop').onclick=e=>{if(e.target===$('modalBackdrop'))closeModal()};$('soundBtn').onclick=()=>{muted=!muted;$('soundBtn').textContent=muted?'🔇':'🔊'};$('panelToggle').onclick=()=>{const body=$('panelBody'),hidden=body.hidden;body.hidden=!hidden;$('panelToggle').textContent=hidden?'−':'+'};$('boardLayer').addEventListener('pointerdown',boardPointerDown);$('boardLayer').addEventListener('pointermove',boardPointerMove);$('boardLayer').addEventListener('pointerup',boardPointerUp);$('boardLayer').addEventListener('pointercancel',boardPointerUp);window.addEventListener('mousemove',teacherMouseMove);window.addEventListener('online',flushPending);window.addEventListener('pagehide',sendProgressOnClose);
  initToolbar();renderLanding();flushPending();
