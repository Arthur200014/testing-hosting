  <script>
  'use strict';
  const API_URL='https://script.google.com/macros/s/AKfycbw6iYfojO8VgkHU63peD2vWLybGyDm9AsYZ6TaLA_EFD4j56nQlY5SqpRANPVeTwVsj/exec';
  const TEST_META={testId:'EGE-01-MADAGASCAR-VINE-PAIRS-15-OF-32',topicId:'task-01',topicName:'Планиметрия: базовые свойства',taskNumber:1,schemaVersion:1};
  const TOTAL=15,ROUND_SIZE=5,PENDING_KEY='egePendingTestResults',$=id=>document.getElementById(id);
  let student=null,session=[],rounds=[],roundIndex=0,selectedId=null,matched=new Set(),attempted=new Set(),wrongIds=new Set(),firstTryCorrect=0,startedAt=0,attemptEventId='',resultSubmitted=false,gameActive=false,muted=false,permanentIds=[];
  const DB=[
    {id:'tri-sum',s:1,title:'Сумма углов',start:'∠A + ∠B + ∠C',end:'равно 180° для любого треугольника.',why:'Три внутренних угла образуют развёрнутый угол.',pic:'tri'},
    {id:'iso',s:1,title:'Равнобедренный треугольник',start:'AC = BC',end:'значит, ∠A = ∠B: равным сторонам противолежат равные углы.',why:'Сначала переносим равенство со сторон на противоположные углы.',pic:'iso'},
    {id:'exterior',s:1,title:'Внешний угол',start:'Внешний угол треугольника',end:'равен сумме двух внутренних углов, не смежных с ним.',why:'Это следует из суммы 180° и смежных углов.',pic:'exterior'},
    {id:'bisector',s:1,title:'Биссектриса',start:'AD — биссектриса ∠A',end:'поэтому ∠BAD = ∠DAC.',why:'Биссектриса делит угол на две равные части.',pic:'bisector'},
    {id:'right-median',s:1,title:'Медиана к гипотенузе',start:'M — середина гипотенузы AB',end:'тогда MA = MB = MC в прямоугольном треугольнике.',why:'M является центром описанной окружности.',pic:'rightMedian'},
    {id:'right-altitude',s:1,title:'Высота к гипотенузе',start:'CH ⟂ AB в прямоугольном △ABC',end:'треугольники ACH, CBH и ABC подобны.',why:'В каждой паре находятся прямой и общий острый угол.',pic:'rightAltitude'},
    {id:'orthocenter',s:2,title:'Высоты треугольника',start:'Три высоты треугольника',end:'пересекаются в одной точке — ортоцентре.',why:'Высота проходит через вершину перпендикулярно противоположной стороне.',pic:'orthocenter'},
    {id:'incenter',s:2,title:'Биссектрисы треугольника',start:'Три биссектрисы треугольника',end:'пересекаются в центре вписанной окружности.',why:'Эта точка равноудалена от всех трёх сторон.',pic:'incenter'},
    {id:'parallelogram',s:2,title:'Параллелограмм',start:'ABCD — параллелограмм',end:'противоположные стороны и углы равны, соседние углы дают 180°.',why:'Свойства следуют из двух пар параллельных сторон.',pic:'para'},

    {id:'para-area',s:3,title:'Площадь параллелограмма',start:'Для параллелограмма: основание a и высота hₐ',end:'дают площадь параллелограмма S = a·hₐ.',why:'Параллелограмм перестраивается в равновеликий прямоугольник.',pic:'paraHeight'},
    {id:'tri-area',s:3,title:'Площадь треугольника',start:'Для треугольника: основание a и высота hₐ',end:'дают площадь треугольника S = ½a·hₐ.',why:'Треугольник занимает половину параллелограмма.',pic:'triHeight'},

  function cardPoint(card,side){const zone=document.querySelector('.vine-zone').getBoundingClientRect(),r=card.getBoundingClientRect();return{x:r.left+r.width/2-zone.left,y:(side==='start'?r.bottom:r.top)-zone.top}}
  function curve(a,b){const dy=(b.y-a.y)*.48;return`M${a.x} ${a.y} C${a.x} ${a.y+dy},${b.x} ${b.y-dy},${b.x} ${b.y}`}
  function bezier(a,b,t){const dy=(b.y-a.y)*.48,p0=a,p1={x:a.x,y:a.y+dy},p2={x:b.x,y:b.y-dy},p3=b,u=1-t;return{x:u*u*u*p0.x+3*u*u*t*p1.x+3*u*t*t*p2.x+t*t*t*p3.x,y:u*u*u*p0.y+3*u*u*t*p1.y+3*u*t*t*p2.y+t*t*t*p3.y}}
  function vineMarkup(id,animate){const l=document.querySelector(`.start-card[data-id="${id}"]`),r=document.querySelector(`.answer-card[data-id="${id}"]`);if(!l||!r)return'';const a=cardPoint(l,'start'),b=cardPoint(r,'end'),d=curve(a,b),leaves=[.24,.48,.72].map((t,i)=>{const p=bezier(a,b,t);return`<ellipse class="vine-leaf" cx="${p.x}" cy="${p.y}" rx="11" ry="5" transform="rotate(${i%2?145:25} ${p.x} ${p.y})" style="animation-delay:${.34+i*.13}s"/>`}).join('');return`<g data-vine="${id}"><path pathLength="1" class="vine-main ${animate?'vine-grow':''}" d="${d}"/><path pathLength="1" class="vine-highlight ${animate?'vine-grow':''}" d="${d}"/>${leaves}</g>`}
  function redrawPermanent(animate=false){const svg=$('vineSvg'),zone=document.querySelector('.vine-zone');if(!svg||!zone)return;svg.setAttribute('viewBox',`0 0 ${zone.clientWidth} ${zone.clientHeight}`);svg.innerHTML=permanentIds.map(id=>vineMarkup(id,animate)).join('')}
  function drawWrong(left,right){const svg=$('vineSvg'),a=cardPoint(left,'start'),b=cardPoint(right,'end'),d=curve(a,b),mid=bezier(a,b,.5),g=document.createElementNS('http://www.w3.org/2000/svg','g');g.innerHTML=`<path class="vine-wrong" d="${d}"/><path class="thorn" d="M${mid.x-8} ${mid.y+2}l8-14l8 14Z"/>`;svg.appendChild(g);setTimeout(()=>g.remove(),720)}
  function showToast(msg,type){const t=$('toast');t.textContent=msg;t.className='toast show '+type;setTimeout(()=>t.classList.remove('show'),1450)}
  function nextRound(){roundIndex++;if(roundIndex>=rounds.length)finish();else renderRound()}
  function finish(){gameActive=false;updateStudent();const seconds=elapsed(),score=Math.round(firstTryCorrect/TOTAL*100),review=wrongIds.size?`<button class="secondary" id="reviewBtn">Разобрать ошибки (${wrongIds.size})</button>`:'';$('app').innerHTML=`<section class="screen final"><div class="scroll"><span class="tag">Все лианы соединены</span><h1>${score>=85?'Хранитель свойств!':score>=60?'Джунгли почти пройдены':'Нужен новый маршрут'}</h1><div class="ring" style="background:conic-gradient(#59bd66 ${score}%,#d3c18b 0)"><b>${score}%</b></div><p><b>Успешность с первой попытки</b></p><div class="stats"><div class="stat">Верно сразу<b>${firstTryCorrect} из ${TOTAL}</b></div><div class="stat">Время<b>${timeText(seconds)}</b></div></div><div class="save-status" id="saveStatus">Сохраняем результат…</div><div class="actions"><button class="primary" id="againBtn">Новый набор из базы</button>${review}<button class="secondary" id="homeBtn">На старт</button></div><div class="review" id="review" hidden></div></div>${hero()}</section>`;$('againBtn').addEventListener('click',startGame);$('homeBtn').addEventListener('click',renderStart);if($('reviewBtn'))$('reviewBtn').addEventListener('click',renderReview);sound('finish');submitOnce(score,seconds)}
  function renderReview(){const box=$('review');box.hidden=!box.hidden;if(!box.hidden){box.innerHTML=[...wrongIds].map(id=>{const p=DB.find(x=>x.id===id);return`<div class="review-item"><b>${esc(p.start)} → ${esc(p.end)}</b><small>${esc(p.why)}</small></div>`}).join('');$('reviewBtn').textContent='Скрыть разбор'}else $('reviewBtn').textContent=`Разобрать ошибки (${wrongIds.size})`}
  function changeStudent(){if(gameActive)return;['egeStudentId','egeStudentName','egeStudentCode'].forEach(k=>localStorage.removeItem(k));renderLogin()}
  function sound(type){if(muted)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ac=sound.ac||(sound.ac=new AC()),now=ac.currentTime,g=ac.createGain(),sets={select:[[270,.1]],good:[[410,.12],[660,.29]],bad:[[145,.18],[85,.36]],start:[[145,.15],[265,.35]],finish:[[250,.12],[440,.28],[720,.5]]},set=sets[type]||sets.select;g.connect(ac.destination);g.gain.setValueAtTime(.04,now);g.gain.exponentialRampToValueAtTime(.0001,now+set[set.length-1][1]+.12);set.forEach(([f,d],i)=>{const o=ac.createOscillator();o.type=type==='bad'?'sawtooth':'triangle';o.frequency.value=f;o.connect(g);o.start(now+i*.04);o.stop(now+d+.08)})}catch(_){}}
  $('switchBtn').addEventListener('click',changeStudent);$('soundBtn').addEventListener('click',()=>{muted=!muted;$('soundBtn').textContent=muted?'Без звука':'Звук'});window.addEventListener('online',flushPending);window.addEventListener('resize',()=>redrawPermanent());atmosphere();
  async function init(){const code=new URLSearchParams(location.search).get('code');if(code){renderLogin(code);return}student=storedStudent();if(student){updateStudent();await flushPending();renderStart()}else renderLogin()}init();
  </script>
