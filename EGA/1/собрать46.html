    .grid{display:grid;grid-template-columns:minmax(430px,1.12fr) minmax(400px,.88fr);gap:18px;min-height:615px}.task{min-width:0;background:#fff9dc;border:4px solid #634024;border-radius:20px;padding:18px;box-shadow:inset 0 0 0 4px #e4c36a;display:grid;grid-template-rows:auto auto minmax(250px,1fr) auto;gap:10px}.task-head{display:flex;justify-content:space-between;gap:12px;align-items:center;color:#326143;font-size:13px;font-weight:1000;text-transform:uppercase}.zone{padding:5px 9px;border-radius:8px;background:#dff0b9;border:1px solid #659049}.task-text{background:linear-gradient(100deg,#e5c677,#fff8d6 9% 91%,#d9b45a);border:3px solid #7a4d24;border-radius:11px;padding:15px 18px;text-align:center;font-size:clamp(17px,1.65vw,22px);line-height:1.3;font-weight:1000}.drawing{border:2px solid #a88651;border-radius:15px;background:#fffef5;overflow:hidden;display:grid;place-items:center;min-height:250px}.drawing svg{width:100%;height:100%;max-height:300px}.drawing .edge{stroke:#234b37;stroke-width:5;fill:#8ed16b24}.drawing .aux{stroke:#268da3;stroke-width:4;fill:none;stroke-dasharray:9 7}.drawing .hot{stroke:#db4d3d;stroke-width:6;fill:none}.drawing text{font:900 17px Trebuchet MS,system-ui;fill:#173528}.pulse{animation:linePulse 1.5s ease-in-out infinite}.mission{text-align:center;font-size:14px;font-weight:900}.mission b{color:#a4372d}

    .signs{position:absolute;left:15px;right:15px;bottom:270px;display:grid;grid-template-columns:1fr 1fr;gap:9px;z-index:9}.sign{min-height:79px;border:4px solid #52331e;border-radius:8px;background:linear-gradient(#f2d17a,#dca548);box-shadow:0 7px 0 #4a2e1c;padding:8px;font-size:12px;font-weight:1000;line-height:1.13;color:#203629;transition:.17s transform}.sign:before{content:"";position:absolute}.sign span{display:block;margin-top:5px;color:#963a2c;font-size:14px}.sign:hover:not(:disabled){transform:translateY(-3px) rotate(-1deg)}.sign.wrong{animation:wrongSign .55s;background:#ffcdb7}.sign.placed{animation:placeSign .45s forwards}

    .final{text-align:center}.ring{width:190px;height:190px;border-radius:50%;display:grid;place-items:center;margin:16px auto;border:5px solid #4e301e;box-shadow:0 9px 0 #4e301e;position:relative}.ring:before{content:"";position:absolute;inset:22px;border-radius:50%;background:#fff5cf;border:3px solid #65452b}.ring b{position:relative;font-size:47px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0}.stat{padding:11px;border:2px solid #8f6638;background:#fff9;border-radius:12px}.stat b{display:block;font-size:22px}.save-status{min-height:24px;margin:13px 0;font-weight:1000}.save-status.ok{color:#08734f}.save-status.bad{color:#a3382e}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
    @keyframes clouds{to{background-position:310px 20px}}@keyframes jeepCruise{50%{transform:translateY(-6px) rotate(1deg)}}@keyframes dust{to{background-position:95px 0}}@keyframes headBob{50%{transform:translateY(-5px) rotate(4deg)}}@keyframes linePulse{50%{filter:drop-shadow(0 0 6px #e7c239);opacity:.64}}@keyframes jeepMud{20%,60%{transform:scale(.56) translateX(var(--jx)) rotate(-7deg)}40%,80%{transform:scale(.56) translateX(var(--jx)) rotate(7deg)}}@keyframes jeepGo{45%{transform:scale(.56) translateX(calc(var(--jx) + 55px)) translateY(-18px) rotate(-3deg)}}@keyframes wrongSign{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}@keyframes placeSign{to{transform:translate(100px,-155px) scale(.18) rotate(9deg);opacity:0}}@keyframes pop{from{opacity:0;transform:scale(.85)}}
    @media(max-width:930px){.login,.start,.final{grid-template-columns:1fr;padding:45px}.grid{grid-template-columns:1fr}.route{min-height:650px}.screen{min-height:0}.hero{min-height:530px}}
    @media(max-width:580px){.brand span:last-child{display:none}.student{border-radius:17px;flex-wrap:wrap;justify-content:flex-end}.screen:before,.screen:after{width:12px}.login,.start,.final{padding:36px 24px}.scroll{padding:27px 20px}h1{font-size:40px}.rules{grid-template-columns:1fr}.hero{transform:scale(.82);margin:-50px;min-height:620px}.game{padding:18px}.hud{grid-template-columns:1fr auto}.track{grid-column:1/-1;grid-row:2}.grid{display:block}.task{margin-bottom:13px;padding:13px}.task-text{font-size:17px}.route{min-height:720px}.signs{grid-template-columns:1fr;bottom:250px}.route .jeep{transform:scale(.46) translateX(var(--jx))}.stats{grid-template-columns:1fr}}

<body>
  <header class="top"><div class="brand"><span class="logo">🚙</span><span>ДЖИП ФОРМУЛ · ЕГЭ №1</span></div><div class="student" id="studentBox"><span>Ученик: <b id="studentName"></b></span><button class="tiny" id="switchBtn">Сменить ученика</button><button class="tiny sound" id="soundBtn">🔊</button></div></header>
  <main id="app"></main>
  <script>
  'use strict';
  const API_URL='https://script.google.com/macros/s/AKfycbw6iYfojO8VgkHU63peD2vWLybGyDm9AsYZ6TaLA_EFD4j56nQlY5SqpRANPVeTwVsj/exec';
  const TEST_META={testId:'EGE-01-MADAGASCAR-JEEP-CHAINS-CH4-6',topicId:'task-01',topicName:'Планиметрия: главы 4–6',taskNumber:1,schemaVersion:1};
  const TOTAL=24,PENDING_KEY='egePendingTestResults',$=id=>document.getElementById(id);
  let student=null,tasks=[],index=0,stepIndex=0,firstTryCorrect=0,questionAttempted=false,taskHadMistake=false,questionResolved=false,choiceLocked=false,startedAt=0,attemptEventId='',resultSubmitted=false,gameActive=false,muted=false,results=[],draggingId='';
  const F={
    midline:{n:'Средняя линия треугольника',f:'MN ∥ BC; MN = BC/2'},
    areaScale:{n:'Площади подобных фигур',f:'S₁/S₂ = k²'},
    trapMidline:{n:'Диагональ и средняя линия трапеции',f:'части равны a/2 и b/2'},
    trigDefs:{n:'Определения sin, cos, tg',f:'отношения сторон прямоугольного треугольника'},
    complements:{n:'Дополнительные углы',f:'sin A = cos B; cos A = sin B'},
    trigIdentity:{n:'Основное тождество',f:'sin²α + cos²α = 1'},
    pythagoras:{n:'Теорема Пифагора',f:'c² = a² + b²'},
    isoAltitude:{n:'Высота равнобедренного треугольника',f:'это также медиана и биссектриса'},
    triArea:{n:'Площадь по основанию и высоте',f:'S = a·h/2'},
    sineArea:{n:'Площадь через синус',f:'S = ab·sin C/2'},
    centralArc:{n:'Центральный угол и дуга',f:'∠AOB = ⌒AB'},
    inscribed:{n:'Вписанный угол',f:'равен половине дуги'},
    sameArc:{n:'Углы на одной дуге',f:'вписанные углы равны'},
    tangentRadius:{n:'Радиус к касательной',f:'OA ⟂ касательной'},
    twoTangents:{n:'Угол между касательными',f:'∠C = 180° − ∠AOB'},
    arcSum:{n:'Сумма дуг окружности',f:'все дуги вместе дают 360°'},
    diameter:{n:'Диаметр образует развёрнутый угол',f:'дуга полуокружности = 180°'},
    rightAcute:{n:'Острые углы прямоугольного треугольника',f:'A + B = 90°'},
    similarity:{n:'Подобие по двум углам',f:'соответственные стороны пропорциональны'},
    cosine:{n:'Теорема косинусов',f:'c²=a²+b²−2ab cos C'},
    heron:{n:'Формула Герона',f:'S=√(p(p−a)(p−b)(p−c))'},
    tangentsEqual:{n:'Касательные из одной точки',f:'PA = PB'}
  };
  const Z={4:'Лемурья переправа',5:'Болотный серпантин',6:'Берег попугаев'};
  function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
  function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a}function pick(a){return a[Math.floor(Math.random()*a.length)]}function even(a,b){return ri(Math.ceil(a/2),Math.floor(b/2))*2}
  function uuid(){if(window.crypto&&typeof crypto.randomUUID==='function')return crypto.randomUUID();return'evt-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)+'-'+Math.random().toString(36).slice(2)}
  function localDate(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function elapsed(){return Math.max(1,Math.round((Date.now()-startedAt)/1000))}function timeText(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
  function jeep(extra=''){return `<div class="jeep ${extra}" id="${extra==='agent'?'agent':''}"><div class="passengers"><i class="head lion"><i class="mouth"></i></i><i class="head zebra"><i class="mouth"></i></i></div><i class="glass"></i><i class="car"></i><i class="hood"></i><i class="wheel l"></i><i class="wheel r"></i></div>`}
  function hero(){return `<div class="hero"><i class="dust"></i>${jeep()}</div>`}
  function triSvg(d={}){
    const mid=d.mid?`<path class="aux pulse" d="M119 120H270"/><circle cx="119" cy="120" r="4" fill="#d94f3e"/><circle cx="270" cy="120" r="4" fill="#d94f3e"/><text x="102" y="116">${d.mid[0]}</text><text x="276" y="116">${d.mid[1]}</text>`:'';
    return `<svg viewBox="0 0 390 250" role="img" aria-label="Треугольник ABC"><path class="edge" d="M55 210H335L195 35Z"/>${mid}<text x="38" y="232">A</text><text x="340" y="232">B</text><text x="187" y="27">C</text>${d.s?`<text x="167" y="238">S=${d.s}</text>`:''}</svg>`

  function trapSvg(d){return `<svg viewBox="0 0 390 250" role="img" aria-label="Трапеция ABCD"><path class="edge" d="M48 210H340L280 48H110Z"/><path class="aux pulse" d="M79 129H310M48 210L280 48"/><circle cx="79" cy="129" r="4" fill="#d94f3e"/><circle cx="310" cy="129" r="4" fill="#d94f3e"/><text x="30" y="232">A</text><text x="345" y="232">B</text><text x="285" y="42">C</text><text x="98" y="42">D</text><text x="183" y="232">${d.a}</text><text x="185" y="41">${d.b}</text><text x="66" y="124">M</text><text x="315" y="124">N</text><text x="194" y="126">K</text></svg>`}
  function rightSvg(d={}){
    return `<svg viewBox="0 0 390 250" role="img" aria-label="Прямоугольный треугольник ABC"><path class="edge" d="M62 210H335L62 35Z"/><path class="hot" d="M62 193h17v17"/><text x="40" y="232">C 90°</text><text x="340" y="232">B</text><text x="40" y="29">A</text><text x="172" y="238">${d.bc||''}</text><text x="25" y="125">${d.ac||''}</text><text x="205" y="108">${d.ab||''}</text>${d.angle?`<path class="hot" d="M62 62A28 28 0 0 1 82 51"/><text x="85" y="54">${d.angle}</text>`:''}</svg>`

    tr=pick(triples);k=ri(1,3);q.push({c:5,title:'Синус после Пифагора',text:`В прямоугольном треугольнике ABC гипотенуза AB равна ${tr[2]*k}, катет AC равен ${tr[1]*k}. Найдите sin A.`,seq:['pythagoras','trigDefs'],why:'По Пифагору находится катет BC, после чего sin A=BC/AB.',fig:{type:'right',ac:tr[1]*k,ab:tr[2]*k,angle:'A'}});
    tr=pick(triples);k=ri(1,3);q.push({c:5,title:'Косинус после Пифагора',text:`В прямоугольном треугольнике ABC гипотенуза AB равна ${tr[2]*k}, катет BC равен ${tr[1]*k}. Найдите cos A.`,seq:['pythagoras','trigDefs'],why:'Сначала восстанавливается AC, затем cos A=AC/AB.',fig:{type:'right',bc:tr[1]*k,ab:tr[2]*k,angle:'A'}});
    tr=pick(triples);k=ri(1,3);q.push({c:5,title:'Тангенс и гипотенуза',text:`В прямоугольном треугольнике ABC катет AC равен ${tr[0]*k}, tg A = ${tr[1]}/${tr[0]}. Найдите AB.`,seq:['trigDefs','pythagoras'],why:'Тангенс даёт второй катет BC, затем гипотенуза находится по теореме Пифагора.',fig:{type:'right',ac:tr[0]*k,angle:'A'}});
    tr=pick(triples);k=ri(1,3);q.push({c:5,title:'Равнобедренный треугольник',text:`В треугольнике ABC стороны AC и BC равны ${tr[2]*k}, основание AB равно ${2*tr[0]*k}. Найдите cos A.`,seq:['isoAltitude','trigDefs'],why:'Высота из C делит основание пополам, после чего косинус берётся в прямоугольном треугольнике ACH.',fig:{type:'iso',base:2*tr[0]*k}});
    tr=pick(triples);k=ri(1,3);q.push({c:5,title:'Высота равнобедренного треугольника',text:`В треугольнике ABC стороны AC и BC равны, высота CH равна ${tr[1]*k}, cos A = ${tr[0]}/${tr[2]}. Найдите AC.`,seq:['isoAltitude','trigIdentity','trigDefs'],why:'Высота создаёт прямоугольный треугольник. По косинусу находится синус, а затем гипотенуза AC.',fig:{type:'iso',h:tr[1]*k}});

    d=ri(15,70);q.push({c:6,title:'Центральный и вписанный углы',text:`Центральный угол на ${d}° больше острого вписанного угла той же дуги. Найдите центральный угол.`,seq:['inscribed'],why:'Если вписанный угол равен x, центральный равен 2x. Их разность равна x.',fig:{type:'circle'}});
    let frac=pick([[1,3],[1,4],[2,5],[3,10]]);q.push({c:6,title:'Доля окружности',text:`Найдите вписанный угол, опирающийся на дугу, равную ${frac[0]}/${frac[1]} окружности.`,seq:['arcSum','inscribed'],why:'Сначала доля полного круга переводится в градусы, затем дуга делится пополам.',fig:{type:'circle'}});
    let ang=even(104,158);q.push({c:6,title:'Два диаметра',text:`AC и BD — диаметры окружности с центром O. Угол AOD равен ${ang}°. Найдите вписанный угол ACB.`,seq:['diameter','centralArc','inscribed'],why:'Диаметр дополняет центральный угол до 180°, затем вписанный угол равен половине найденной дуги AB.',fig:{type:'circle',kind:'diameter'}});
    ang=ri(22,72);q.push({c:6,title:'Два диаметра',text:`AC и BD — диаметры окружности. Угол ACB равен ${ang}°. Найдите угол AOD.`,seq:['inscribed','diameter'],why:'Вписанный угол удваивается до центрального AOB, а соседний центральный угол AOD дополняет его до 180°.',fig:{type:'circle',kind:'diameter'}});
    let arc=ri(45,135);q.push({c:6,title:'Две касательные',text:`Через концы A и B меньшей дуги проведены касательные AC и BC. Дуга AB равна ${arc}°. Найдите угол ACB.`,seq:['centralArc','twoTangents'],why:'Мера меньшей дуги равна центральному углу AOB, а угол между касательными дополняет его до 180°.',fig:{type:'circle',kind:'twoTangents'}});
    ang=ri(21,67);q.push({c:6,title:'Касательная и радиус',text:`Угол ACO равен ${ang}°. CA касается окружности с центром O, а CO пересекает её в точке B. Найдите меньшую дугу AB.`,seq:['tangentRadius','rightAcute','centralArc'],why:'Радиус OA перпендикулярен касательной. В прямоугольном треугольнике находится угол AOB, равный дуге AB.',fig:{type:'circle',kind:'tangent'}});

    ang=ri(22,58);q.push({c:6,title:'Касательная и диаметр',text:`Угол ACO равен ${ang}°. CA касается окружности, а прямая CO пересекает её в B и D. Найдите дугу AD внутри угла.`,seq:['tangentRadius','rightAcute','diameter'],why:'Из прямоугольного треугольника находится дуга AB, а полуокружность BD позволяет получить оставшуюся дугу AD.',fig:{type:'circle',kind:'tangent'}});

  function storedStudent(){const studentId=localStorage.getItem('egeStudentId');return studentId?{studentId,name:localStorage.getItem('egeStudentName')||'Ученик',code:localStorage.getItem('egeStudentCode')||''}:null}function saveStudent(s){localStorage.setItem('egeStudentId',s.studentId);localStorage.setItem('egeStudentName',s.name);localStorage.setItem('egeStudentCode',s.code)}
  function parseStudent(data,code){const src=(data&&(data.student||data.data))||data||{},studentId=src.studentId||src.id||(data&&data.studentId),name=src.studentName||src.name||src.fullName||(data&&(data.studentName||data.name)),bad=data&&(data.success===false||data.valid===false||data.ok===false);if(bad||!studentId)throw new Error((data&&(data.message||data.error))||'Личный код не найден');return{studentId:String(studentId),name:String(name||'Ученик'),code:String(code)}}
  function validateStudent(code){return new Promise((resolve,reject)=>{const cb='egeValidate_'+Date.now()+'_'+Math.random().toString(36).slice(2),s=document.createElement('script');let done=false;const clean=()=>{delete window[cb];s.remove()},timer=setTimeout(()=>{if(done)return;done=true;clean();reject(new Error('Сервер не ответил. Проверь интернет'))},12000);window[cb]=data=>{if(done)return;done=true;clearTimeout(timer);clean();try{resolve(parseStudent(data,code))}catch(e){reject(e)}};s.onerror=()=>{if(done)return;done=true;clearTimeout(timer);clean();reject(new Error('Не удалось проверить код'))};s.src=API_URL+'?'+new URLSearchParams({action:'validateStudent',code,callback:cb});document.head.appendChild(s)})}
  function updateStudent(){const box=$('studentBox');box.style.display=student?'flex':'none';if(student)$('studentName').textContent=student.name;$('switchBtn').disabled=gameActive}
  function readQueue(){try{const q=JSON.parse(localStorage.getItem(PENDING_KEY)||'[]');return Array.isArray(q)?q:[]}catch(_){return[]}}function writeQueue(q){localStorage.setItem(PENDING_KEY,JSON.stringify(q))}function queueResult(p){const q=readQueue();if(!q.some(x=>x&&x.eventId===p.eventId))q.push(p);writeQueue(q)}function removeQueued(id){writeQueue(readQueue().filter(x=>!x||x.eventId!==id))}
  async function postResult(p){const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p),redirect:'follow'});if(!r.ok)throw new Error('submit')}async function flushPending(){if(!navigator.onLine)return;for(const p of readQueue()){if(!p||!p.eventId)continue;try{await postResult(p);removeQueued(p.eventId)}catch(_){}}}
  function setSave(cls,text){const e=$('saveStatus');if(e){e.className='save-status '+cls;e.textContent=text}}async function submitOnce(scorePercent,durationSeconds){if(resultSubmitted||!student)return;resultSubmitted=true;const payload={action:'submitTest',eventId:attemptEventId,studentId:student.studentId,testId:TEST_META.testId,testDate:localDate(),topicId:TEST_META.topicId,topicName:TEST_META.topicName,taskNumber:TEST_META.taskNumber,scorePercent,durationSeconds,schemaVersion:TEST_META.schemaVersion};setSave('','Сохраняем результат…');try{if(!navigator.onLine)throw new Error('offline');await postResult(payload);removeQueued(payload.eventId);setSave('ok','✓ Результат сохранён')}catch(_){queueResult(payload);setSave('bad','Нет связи: результат сохранён на устройстве и отправится позже')}}
  function renderLogin(prefill=''){gameActive=false;student=null;updateStudent();$('app').innerHTML=`<section class="screen login"><div class="scroll"><span class="tag">Экспедиционный пропуск</span><h1>Джип формул</h1><p class="lead">Введи личный код ученика. Имя загрузится автоматически.</p><form class="code-form" id="loginForm"><input class="code" id="codeInput" maxlength="40" autocomplete="one-time-code" placeholder="ЛИЧНЫЙ КОД" value="${esc(prefill)}"><button class="primary" id="loginBtn">Проверить код</button><div class="status" id="loginStatus"></div></form></div>${hero()}</section>`;$('loginForm').addEventListener('submit',handleLogin);if(prefill)setTimeout(()=>$('loginForm').requestSubmit(),0)}
  async function handleLogin(e){e.preventDefault();const input=$('codeInput'),btn=$('loginBtn'),status=$('loginStatus'),code=input.value.trim();if(!code){status.className='status bad';status.textContent='Введи личный код';return}input.disabled=btn.disabled=true;status.textContent='Проверяем пропуск…';try{student=await validateStudent(code);saveStudent(student);updateStudent();await flushPending();renderStart()}catch(err){status.className='status bad';status.textContent=err.message||'Код не подтверждён';input.disabled=btn.disabled=false;input.focus()}}
  function changeStudent(){if(gameActive)return;['egeStudentId','egeStudentName','egeStudentCode'].forEach(k=>localStorage.removeItem(k));renderLogin()}
  function renderStart(){gameActive=false;updateStudent();$('app').innerHTML=`<section class="screen start"><div class="scroll"><span class="tag">Главы 4–6 задания №1</span><h1>Маршрут формул</h1><p class="lead">Проложи путь через 24 перемешанные задачи: подобие, тригонометрию и окружности.</p><div class="rules"><div class="rule"><b>24</b>задачи</div><div class="rule"><b>1–3</b>развилки</div><div class="rule"><b>∞</b>без таймера</div></div><p>На каждой развилке установи правильный дорожный знак с формулой. Можно перетащить знак в свободную ячейку или нажать на него.</p><button class="primary" id="startBtn">Завести джип</button></div>${hero()}</section>`;$('startBtn').addEventListener('click',startGame)}
  function startGame(){tasks=makeTasks();index=0;stepIndex=0;firstTryCorrect=0;startedAt=Date.now();attemptEventId=uuid();resultSubmitted=false;results=[];gameActive=true;updateStudent();sound('start');renderTask()}
  function leafBar(){return Array.from({length:TOTAL},(_,i)=>`<i class="leaf ${results[i]===true?'good':results[i]===false?'bad':i===index?'current':''}"></i>`).join('')}
  function junctions(t){return Array.from({length:3},(_,i)=>`<div class="junction ${i<stepIndex?'done':i>=t.seq.length?'off':''}">${i<stepIndex?`${i+1}. ${esc(F[t.seq[i]].n)}`:i<t.seq.length?'Развилка '+(i+1):'—'}</div>`).join('')}
  function optionIds(t){const correct=t.seq[stepIndex],exclude=new Set(t.seq),pool=Object.keys(F).filter(id=>id!==correct&&!exclude.has(id));return shuffle([correct,...shuffle(pool).slice(0,3)])}
  function optionMarkup(t){return optionIds(t).map(id=>`<button class="sign" draggable="true" data-id="${id}">${esc(F[id].n)}<span>${esc(F[id].f)}</span></button>`).join('')}
  function renderTask(){stepIndex=0;questionAttempted=false;taskHadMistake=false;questionResolved=false;choiceLocked=false;const t=tasks[index];$('app').innerHTML=`<section class="screen game"><div class="hud"><span class="counter">Задача ${index+1} / ${TOTAL}</span><div class="track"><i style="width:${index/TOTAL*100}%"></i></div><span class="score">Без ошибок: <b id="liveScore">${firstTryCorrect}</b></span></div><div class="grid"><section class="task"><div class="task-head"><span class="zone">${Z[t.c]}</span><span>Глава ${t.c} · ${esc(t.title)}</span></div><div class="task-text">${esc(t.text)}</div><div class="drawing">${draw(t)}</div><div class="mission" id="mission">Выбери знак для <b>развилки 1 из ${t.seq.length}</b>. Порядок важен.</div></section><aside class="route"><i class="trees"></i><div class="speech" id="speech">Марти, сверяемся с картой формул!</div><div class="junctions" id="junctions">${junctions(t)}</div><div class="signs" id="signs">${optionMarkup(t)}</div>${jeep('agent')}<div class="result-box" id="resultBox"></div></aside></div><div class="leaves">${leafBar()}</div></section>`;bindOptions();updateJeep()}
  function bindOptions(){document.querySelectorAll('.sign').forEach(card=>{card.addEventListener('click',()=>choose(card.dataset.id,card));card.addEventListener('dragstart',e=>{draggingId=card.dataset.id;e.dataTransfer.effectAllowed='move'});card.addEventListener('dragend',()=>draggingId='')});const targets=document.querySelectorAll('.junction');targets.forEach(j=>{j.addEventListener('dragover',e=>e.preventDefault());j.addEventListener('drop',e=>{e.preventDefault();const card=document.querySelector(`.sign[data-id="${draggingId}"]`);if(card)choose(draggingId,card)})})}
  function registerSelection(correct){questionAttempted=true;if(!correct)taskHadMistake=true;return{clean:correct&&!taskHadMistake}}
  function updateJeep(){const car=$('agent');if(car)car.style.setProperty('--jx',(stepIndex*125)+'px')}
  function choose(id,card){if(choiceLocked||questionResolved)return;choiceLocked=true;const t=tasks[index],correct=id===t.seq[stepIndex],state=registerSelection(correct),car=$('agent'),speech=$('speech');car.classList.remove('mud','go');void car.offsetWidth;if(!correct){card.classList.add('wrong');card.disabled=true;car.classList.add('mud');speech.textContent='Тупик! Этот знак не является следующим шагом.';sound('bad');setTimeout(()=>choiceLocked=false,560);return}card.classList.add('placed');car.classList.add('go');speech.textContent='Верный поворот! Маршрут продолжается.';sound('good');setTimeout(()=>{stepIndex++;$('junctions').innerHTML=junctions(t);updateJeep();if(stepIndex>=t.seq.length){completeTask(state.clean);return}$('mission').innerHTML=`Теперь выбери знак для <b>развилки ${stepIndex+1} из ${t.seq.length}</b>.`;$('signs').innerHTML=optionMarkup(t);choiceLocked=false;bindOptions()},460)}
  function completeTask(clean){questionResolved=true;if(clean)firstTryCorrect++;results[index]=clean;$('liveScore').textContent=firstTryCorrect;const t=tasks[index],chain=t.seq.map((id,i)=>`<div><b>${i+1}.</b> ${esc(F[id].n)} — ${esc(F[id].f)}</div>`).join(''),box=$('resultBox');box.innerHTML=`<span class="tag">${clean?'Маршрут без ошибок':'Доехали после исправления'}</span><h2>${clean?'Задача засчитана!':'Задача пройдена'}</h2><div class="chain">${chain}</div><p>${esc(t.why)}</p><button class="primary" id="nextBtn">${index===TOTAL-1?'Финиш экспедиции':'Следующая задача →'}</button>`;box.classList.add('show');$('nextBtn').addEventListener('click',nextTask)}
  function nextTask(){index++;if(index>=TOTAL)finish();else renderTask()}
  function finish(){gameActive=false;updateStudent();const seconds=elapsed(),score=Math.round(firstTryCorrect/TOTAL*100);$('app').innerHTML=`<section class="screen final"><div class="scroll"><span class="tag">Экспедиция завершена</span><h1>${score>=85?'Короли маршрута!':score>=60?'Джип добрался!':'Нужен ещё один заезд'}</h1><div class="ring" style="background:conic-gradient(#65c950 ${score}%,#d1bd82 0)"><b>${score}%</b></div><p><b>Успешность с первой попытки</b></p><div class="stats"><div class="stat">Маршруты без ошибок<b>${firstTryCorrect} из ${TOTAL}</b></div><div class="stat">Время прохождения<b>${timeText(seconds)}</b></div></div><div class="save-status" id="saveStatus">Сохраняем результат…</div><div class="actions"><button class="primary" id="againBtn">Пройти ещё раз</button><button class="secondary" id="homeBtn">На старт</button></div></div>${hero()}</section>`;$('againBtn').addEventListener('click',startGame);$('homeBtn').addEventListener('click',renderStart);sound('finish');submitOnce(score,seconds)}
  function sound(type){if(muted)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ac=sound.ac||(sound.ac=new AC()),now=ac.currentTime,g=ac.createGain(),sets={start:[[110,.22],[220,.36]],good:[[380,.12],[650,.28]],bad:[[150,.2],[70,.38]],finish:[[260,.14],[390,.29],[610,.55]]},set=sets[type]||sets.good;g.connect(ac.destination);g.gain.setValueAtTime(.045,now);g.gain.exponentialRampToValueAtTime(.0001,now+set[set.length-1][1]+.1);set.forEach(([f,d],i)=>{const o=ac.createOscillator();o.type=type==='bad'?'sawtooth':'triangle';o.frequency.setValueAtTime(f,now+i*.04);o.connect(g);o.start(now+i*.04);o.stop(now+d+.1)})}catch(_){}}
  $('switchBtn').addEventListener('click',changeStudent);$('soundBtn').addEventListener('click',()=>{muted=!muted;$('soundBtn').textContent=muted?'🔇':'🔊'});window.addEventListener('online',flushPending);async function init(){const code=new URLSearchParams(location.search).get('code');if(code){renderLogin(code);return}student=storedStudent();if(student){updateStudent();await flushPending();renderStart()}else renderLogin()}init();
  </script>
