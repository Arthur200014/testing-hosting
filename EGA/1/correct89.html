  <script>
  'use strict';
  const API_URL='https://script.google.com/macros/s/AKfycbw6iYfojO8VgkHU63peD2vWLybGyDm9AsYZ6TaLA_EFD4j56nQlY5SqpRANPVeTwVsj/exec';
  const TEST_META={testId:'EGE-01-MADAGASCAR-JULIEN-THEORY-GAME-2-SINE-COSINE',topicId:'task-01',topicName:'Планиметрия: окружности и теоремы синусов и косинусов, игра 2',taskNumber:1,schemaVersion:1};
  const TOTAL=22,PENDING_KEY='egePendingTestResults',$=id=>document.getElementById(id);
  let student=null,deck=[],index=0,firstTryCorrect=0,questionAttempted=false,startedAt=0,attemptEventId='',resultSubmitted=false,gameActive=false,muted=false;
  const facts=[
    ['chords-inside','VI. Пересекающиеся хорды',true,'Угол между хордами внутри окружности равен половине суммы двух противоположных дуг.','∠ = ½(⌒AC + ⌒BD)','Берутся дуги, стягиваемые углом и вертикальным ему углом.','intersectChords'],
    ['chords-inside','VI. Пересекающиеся хорды',false,'Угол между хордами внутри окружности равен половине разности противоположных дуг.','∠ = ½(сумма противоположных дуг)','Разность дуг используется для угла с вершиной вне окружности.','intersectChords'],
    ['secants-outside','VI. Угол вне окружности',true,'Угол между двумя секущими с вершиной вне окружности равен половине разности большей и меньшей дуг.','∠P = ½(большая дуга − меньшая дуга)','Для внешнего угла из большей дуги вычитают меньшую.','externalSecants'],
    ['secants-outside','VI. Угол вне окружности',false,'Угол между двумя секущими вне окружности равен половине суммы пересекаемых дуг.','∠P = ½(большая дуга − меньшая дуга)','Полусумма относится к пересечению хорд внутри окружности.','externalSecants'],
    ['cyclic-quad','VIII. Вписанный четырёхугольник',true,'Сумма противоположных углов четырёхугольника, вписанного в окружность, равна 180°.','∠A + ∠C = 180°;  ∠B + ∠D = 180°','Противоположные углы опираются на дуги, которые вместе образуют окружность.','cyclicQuad'],
    ['cyclic-quad','VIII. Вписанный четырёхугольник',false,'Противоположные углы любого вписанного четырёхугольника равны.','∠A + ∠C = 180°','Они обычно не равны, а являются дополнительными.','cyclicQuad'],
    ['tangent-quad','VII. Вписанная окружность',true,'Если в четырёхугольник вписана окружность, суммы длин противоположных сторон равны.','AB + CD = BC + AD','Равные касательные от каждой вершины попарно складываются.','tangentQuad'],
    ['tangent-quad','VII. Вписанная окружность',false,'В описанном около окружности четырёхугольнике произведения противоположных сторон равны.','AB + CD = BC + AD','Для касательного четырёхугольника равны суммы, а не произведения.','tangentQuad'],
    ['tangent-trap','VII. Описанная трапеция',true,'В трапеции, описанной около окружности, сумма оснований равна сумме боковых сторон.','a + b = c + d;  m = (c+d)/2','Это частный случай свойства описанного четырёхугольника.','tangentTrap'],
    ['tangent-trap','VII. Описанная трапеция',false,'В трапеции, описанной около окружности, разность оснований равна сумме боковых сторон.','a + b = c + d','Используется сумма обоих оснований, а не их разность.','tangentTrap'],
    ['right-tangent-trap','VII. Прямоугольная трапеция',true,'Высота прямоугольной трапеции, описанной около окружности, равна диаметру этой окружности.','h = 2r','Окружность касается двух параллельных оснований, расстояние между ними равно диаметру.','rightTangentTrap'],
    ['right-tangent-trap','VII. Прямоугольная трапеция',false,'Высота прямоугольной трапеции, описанной около окружности, равна её радиусу.','h = 2r','Между параллельными основаниями помещается полный диаметр.','rightTangentTrap'],
    ['extended-sine','IX. Расширенная теорема синусов',true,'Отношение стороны треугольника к синусу противолежащего угла равно диаметру описанной окружности.','a/sin A = b/sin B = c/sin C = 2R','Справа стоит именно 2R, а не R.','extendedSine'],
    ['extended-sine','IX. Расширенная теорема синусов',false,'По расширенной теореме синусов a/sin A равно радиусу описанной окружности R.','a/sin A = 2R','Отношение равно диаметру окружности, то есть удвоенному радиусу.','extendedSine'],
    ['sine-law','IX. Теорема синусов',true,'В любом треугольнике отношения сторон к синусам противолежащих углов равны.','a/sin A = b/sin B = c/sin C','Каждой стороне соответствует угол, лежащий напротив неё.','sineLaw'],
    ['sine-law','IX. Теорема синусов',false,'По теореме синусов сторону нужно делить на синус прилежащего к ней угла.','a/sin A = b/sin B = c/sin C','В знаменателе берут синус противолежащего угла, а не прилежащего.','sineLaw'],
    ['sine-pairs','IX. Теорема синусов',true,'Если сторона a лежит напротив угла A, а сторона b — напротив угла B, то a/b = sin A/sin B.','a/b = sin A/sin B','Пропорция получается из равенства a/sin A = b/sin B.','sineLaw'],
    ['sine-pairs','IX. Теорема синусов',false,'Из теоремы синусов всегда следует a/b = sin B/sin A.','a/b = sin A/sin B','При делении равенств порядок соответствующих сторон и углов сохраняется.','sineLaw'],
    ['cosine-law','IX. Теорема косинусов',true,'Квадрат стороны c равен a² + b² − 2ab·cos C, где C — угол между сторонами a и b.','c² = a² + b² − 2ab·cos C','Угол C лежит напротив стороны c и заключён между сторонами a и b.','cosineLaw'],
    ['cosine-law','IX. Теорема косинусов',false,'Теорема косинусов имеет вид c² = a² + b² + 2ab·cos C для любого угла C.','c² = a² + b² − 2ab·cos C','Перед удвоенным произведением стоит знак «минус».','cosineLaw'],
    ['cosine-obtuse','IX. Теорема косинусов',true,'Если угол C тупой, то cos C < 0, поэтому слагаемое −2ab·cos C увеличивает значение c².','C > 90° ⇒ cos C < 0 ⇒ c² > a² + b²','Поэтому сторона напротив тупого угла является наибольшей.','cosineLaw'],
    ['cosine-obtuse','IX. Теорема косинусов',false,'Если угол C тупой, то cos C > 0 и сторона c обязательно меньше обеих остальных сторон.','C > 90° ⇒ cos C < 0','Косинус тупого угла отрицателен, а противолежащая сторона — наибольшая.','cosineLaw']
  ].map(([id,chapter,truth,text,formula,explain,diagram])=>({id,chapter,truth,text,formula,explain,diagram}));
  function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}

    if(k==='diameter')return svg(circle+`<path class="hot" d="M83 155H307"/><path class="shape" d="M83 155L195 43L307 155"/><path class="right" d="M184 54l11 11l11-11"/>${dots([[83,155],[307,155],[195,43]])}${labels([[65,160,'A'],[313,160,'B'],[189,34,'C']])}`);
    if(k==='sameChord')return svg(circle+`<path class="shape" d="M${A[0]} ${A[1]}L${C[0]} ${C[1]}L${B[0]} ${B[1]}M${A[0]} ${A[1]}L${D[0]} ${D[1]}L${B[0]} ${B[1]}"/>${dots([A,B,C,D])}${labels([[A[0]-18,A[1]+18,'A'],[B[0]+8,B[1]+18,'B'],[C[0]-6,C[1]-9,'C'],[D[0]-20,D[1]+5,'D']])}`);
    if(k==='arcSum')return svg(circle+`<path class="hot" d="M195 155L${C[0]} ${C[1]}M195 155L${A[0]} ${A[1]}M195 155L${B[0]} ${B[1]}"/><path class="arc" d="M${C[0]} ${C[1]}A112 112 0 0 1 ${B[0]} ${B[1]}"/><path class="arc" style="stroke:#a95ad0" d="M${B[0]} ${B[1]}A112 112 0 0 1 ${A[0]} ${A[1]}"/><path class="arc" style="stroke:#44a76d" d="M${A[0]} ${A[1]}A112 112 0 0 1 ${C[0]} ${C[1]}"/>${dots([A,B,C])}`);
    if(k==='radiusTangent'||k==='tangentChord'){const T=[195,43],Q=pt(20);return svg(circle+`<path class="tangent" d="M54 43H350"/><path class="hot" d="M195 155V43"/>${k==='tangentChord'?`<path class="shape" d="M195 43L${Q[0]} ${Q[1]}"/><path class="arc" d="M195 43A112 112 0 0 1 ${Q[0]} ${Q[1]}"/>`:''}<path class="right" d="M195 60h17V43"/>${dots([[195,43],...(k==='tangentChord'?[Q]:[])])}<circle class="point" cx="195" cy="155" r="4"/>${labels([[202,151,'O'],[187,33,'T'],[327,35,'P'],...(k==='tangentChord'?[[Q[0]+7,Q[1]+8,'B']]:[])])}`)}
    if(k==='twoTangents'){const O=[155,155],P=[342,155],T1=[185.1,86.3],T2=[185.1,223.7];return svg(`<circle class="circle" cx="155" cy="155" r="75"/><path class="tangent" d="M342 155L185.1 86.3M342 155L185.1 223.7"/><path class="aux" d="M155 155L185.1 86.3M155 155L185.1 223.7M155 155H342"/><path class="right" d="M178.2 102.1l15.8 6.9l6.9-15.8M178.2 207.9l15.8-6.9l6.9 15.8"/>${dots([T1,T2,P])}<circle class="point" cx="155" cy="155" r="4"/>${labels([[143,151,'O'],[347,160,'P'],[166,80,'A'],[166,240,'B']])}`)}
    if(k==='intersectChords'){const p1=pt(205),p2=pt(325),p3=pt(245),p4=pt(35);return svg(circle+`<path class="shape" d="M${p1[0]} ${p1[1]}L${p4[0]} ${p4[1]}M${p2[0]} ${p2[1]}L${p3[0]} ${p3[1]}"/>${dots([p1,p2,p3,p4])}${labels([[p1[0]-18,p1[1]+8,'A'],[p2[0]+7,p2[1]+10,'B'],[p3[0]-19,p3[1]+3,'C'],[p4[0]+7,p4[1]+5,'D']])}`)}
    if(k==='externalSecants'){const P=[365,155],N1=[304.84,176.90],F1=[124.93,242.38],N2=[304.84,133.10],F2=[124.93,67.62];return svg(circle+`<path class="shape" d="M365 155L124.93 242.38M365 155L124.93 67.62"/>${dots([N1,F1,N2,F2,P])}${labels([[369,160,'P']])}`)}
    if(k==='cyclicQuad'){const q=[pt(150),pt(235),pt(310),pt(30)];return svg(circle+`<path class="shape" d="M${q[0][0]} ${q[0][1]}L${q[1][0]} ${q[1][1]}L${q[2][0]} ${q[2][1]}L${q[3][0]} ${q[3][1]}Z"/>${dots(q)}${labels([[q[0][0]-19,q[0][1]+16,'A'],[q[1][0]-18,q[1][1],'B'],[q[2][0]+7,q[2][1],'C'],[q[3][0]+7,q[3][1]+15,'D']])}`)}
    if(k==='tangentQuad')return svg(`<path class="shape" d="M109.8 105.3L147.7 246.5L290.7 179.8L229.8 49.3Z"/><circle class="circle" cx="195" cy="145" r="72"/><path class="aux" d="M195 145L125.45 163.63M195 145L225.43 210.25M195 145L260.25 114.57M195 145L164.57 79.75"/>${dots([[125.45,163.63],[225.43,210.25],[260.25,114.57],[164.57,79.75]])}${labels([[91,103,'A'],[140,269,'B'],[298,186,'C'],[225,40,'D'],[202,141,'O']])}`);
    if(k==='tangentTrap')return svg(`<path class="shape" d="M56.15 250L333.85 250L260 60L130 60Z"/><circle class="circle" cx="195" cy="155" r="95"/><path class="aux" d="M195 155V60M195 155V250M195 155L106.45 120.58M195 155L283.55 120.58"/><path class="hot" d="M93.08 155H296.92"/>${dots([[195,60],[195,250],[106.45,120.58],[283.55,120.58]])}${labels([[39,272,'A'],[339,272,'B'],[265,52,'C'],[114,52,'D'],[201,151,'O'],[188,146,'m']])}`);
    if(k==='rightTangentTrap')return svg(`<path class="shape" d="M95 250L354.09 250L245 60L95 60Z"/><circle class="circle" cx="190" cy="155" r="95"/><path class="aux" d="M190 155H95M190 155V60M190 155L272.39 107.70M190 155V250"/><path class="right" d="M95 230h20v20M95 80h20V60"/><path class="hot" d="M73 60V250"/><path class="right" d="M73 60h14M73 250h14"/>${dots([[95,155],[190,60],[272.39,107.70],[190,250]])}${labels([[77,272,'A'],[359,272,'B'],[250,52,'C'],[77,52,'D'],[197,151,'O'],[49,160,'h=2r']])}`);
    if(k==='extendedSine'){const a=pt(150),b=pt(30),c=pt(-90);return svg(circle+`<path class="shape" d="M${a[0]} ${a[1]}L${b[0]} ${b[1]}L${c[0]} ${c[1]}Z"/><path class="hot" d="M${a[0]} ${a[1]}L${b[0]} ${b[1]}"/><path class="aux" d="M195 155L${b[0]} ${b[1]}"/>${dots([a,b,c])}<circle class="point" cx="195" cy="155" r="4"/>${labels([[a[0]-18,a[1]+18,'A'],[b[0]+8,b[1]+18,'B'],[c[0]-7,c[1]-9,'C'],[202,151,'O'],[245,203,'R'],[188,267,'c']])}`)}
    if(k==='sineLaw')return svg(`<path class="shape" d="M63 250L327 250L226 51Z"/><path class="hot" d="M63 250L327 250"/><path class="arc" d="M91 250A28 28 0 0 0 78 226M299 250A28 28 0 0 1 310 225"/>${dots([[63,250],[327,250],[226,51]])}${labels([[45,272,'A'],[333,272,'B'],[221,41,'C'],[190,272,'c'],[128,142,'b'],[282,143,'a'],[84,230,'A'],[296,230,'B']])}`);
    if(k==='cosineLaw')return svg(`<path class="shape" d="M67 250L326 250L151 66Z"/><path class="hot" d="M67 250L326 250M67 250L151 66"/><path class="arc" d="M98 250A31 31 0 0 0 80 222"/>${dots([[67,250],[326,250],[151,66]])}${labels([[49,272,'C'],[332,272,'A'],[145,56,'B'],[194,272,'b'],[93,151,'a'],[247,148,'c'],[87,229,'C']])}`);

  }
  function uuid(){if(window.crypto&&typeof crypto.randomUUID==='function')return crypto.randomUUID();return'evt-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)+'-'+Math.random().toString(36).slice(2)}
  function localDate(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  function elapsed(){return Math.max(1,Math.round((Date.now()-startedAt)/1000))}function timeText(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
  function julien(){return `<div class="julien"><i class="tail"></i><i class="body"></i><div class="head"><i class="eye l"></i><i class="eye r"></i><i class="nose"></i><i class="mouth"></i></div><i class="crown"></i></div>`}
  function scene(){return `<div class="temple-scene"><i class="moon"></i><div class="columns"><i class="column"></i><i class="column"></i></div><i class="steps-bg"></i><i class="throne"></i>${julien()}</div>`}
  function storedStudent(){const studentId=localStorage.getItem('egeStudentId');return studentId?{studentId,name:localStorage.getItem('egeStudentName')||'Ученик',code:localStorage.getItem('egeStudentCode')||''}:null}
  function saveStudent(s){localStorage.setItem('egeStudentId',s.studentId);localStorage.setItem('egeStudentName',s.name);localStorage.setItem('egeStudentCode',s.code)}
  function parseStudent(data,code){const src=(data&&(data.student||data.data))||data||{},studentId=src.studentId||src.id||(data&&data.studentId),name=src.studentName||src.name||src.fullName||(data&&(data.studentName||data.name)),bad=data&&(data.success===false||data.valid===false||data.ok===false);if(bad||!studentId)throw new Error((data&&(data.message||data.error))||'Личный код не найден');return{studentId:String(studentId),name:String(name||'Ученик'),code:String(code)}}
  function validateStudent(code){return new Promise((resolve,reject)=>{const cb='egeValidate_'+Date.now()+'_'+Math.random().toString(36).slice(2),s=document.createElement('script');let done=false;const clean=()=>{delete window[cb];s.remove()},timer=setTimeout(()=>{if(done)return;done=true;clean();reject(new Error('Сервер не ответил. Проверь интернет'))},12000);window[cb]=data=>{if(done)return;done=true;clearTimeout(timer);clean();try{resolve(parseStudent(data,code))}catch(e){reject(e)}};s.onerror=()=>{if(done)return;done=true;clearTimeout(timer);clean();reject(new Error('Не удалось проверить код'))};s.src=API_URL+'?'+new URLSearchParams({action:'validateStudent',code,callback:cb});document.head.appendChild(s)})}
  function updateStudent(){const box=$('studentBox');box.style.display=student?'flex':'none';if(student)$('studentName').textContent=student.name;$('switchBtn').disabled=gameActive}
  function readQueue(){try{const q=JSON.parse(localStorage.getItem(PENDING_KEY)||'[]');return Array.isArray(q)?q:[]}catch(_){return[]}}function writeQueue(q){localStorage.setItem(PENDING_KEY,JSON.stringify(q))}function queueResult(p){const q=readQueue();if(!q.some(x=>x&&x.eventId===p.eventId))q.push(p);writeQueue(q)}function removeQueued(id){writeQueue(readQueue().filter(x=>!x||x.eventId!==id))}
  async function postResult(p){const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p),redirect:'follow'});if(!r.ok)throw new Error('submit')}
  async function flushPending(){if(!navigator.onLine)return;for(const p of readQueue()){if(!p||!p.eventId)continue;try{await postResult(p);removeQueued(p.eventId)}catch(_){}}}
  function setSave(cls,text){const e=$('saveStatus');if(e){e.className='save-status '+cls;e.textContent=text}}
  async function submitOnce(scorePercent,durationSeconds){if(resultSubmitted||!student)return;resultSubmitted=true;const payload={action:'submitTest',eventId:attemptEventId,studentId:student.studentId,testId:TEST_META.testId,testDate:localDate(),topicId:TEST_META.topicId,topicName:TEST_META.topicName,taskNumber:TEST_META.taskNumber,scorePercent,durationSeconds,schemaVersion:TEST_META.schemaVersion};setSave('','Сохраняем результат…');try{if(!navigator.onLine)throw new Error('offline');await postResult(payload);removeQueued(payload.eventId);setSave('ok','✓ Результат сохранён')}catch(_){queueResult(payload);setSave('bad','Нет связи: результат сохранён на устройстве и отправится позже')}}
  function renderLogin(prefill=''){gameActive=false;student=null;updateStudent();$('app').innerHTML=`<section class="screen login"><div class="tablet"><span class="tag">Допуск в королевский храм</span><h1>Суд Джулиана</h1><p class="lead">Введи личный код ученика. Имя загрузится автоматически.</p><form class="code-form" id="loginForm"><input class="code" id="codeInput" maxlength="40" autocomplete="one-time-code" placeholder="ЛИЧНЫЙ КОД" value="${esc(prefill)}"><button class="primary" id="loginBtn">Проверить код</button><div class="status" id="loginStatus"></div></form></div>${scene()}</section>`;$('loginForm').addEventListener('submit',handleLogin);if(prefill)setTimeout(()=>$('loginForm').requestSubmit(),0)}
  async function handleLogin(e){e.preventDefault();const input=$('codeInput'),btn=$('loginBtn'),status=$('loginStatus'),code=input.value.trim();if(!code){status.className='status bad';status.textContent='Введи личный код';return}input.disabled=btn.disabled=true;status.textContent='Стража проверяет код…';try{student=await validateStudent(code);saveStudent(student);updateStudent();await flushPending();renderStart()}catch(err){status.className='status bad';status.textContent=err.message||'Код не подтверждён';input.disabled=btn.disabled=false;input.focus()}}
  function renderStart(){gameActive=false;updateStudent();$('app').innerHTML=`<section class="screen start"><div class="tablet"><span class="tag">Игра 2 · окружности, синусы и косинусы</span><h1>Закон или миф?</h1><p class="lead">22 перемешанные таблички: оставшиеся свойства окружностей, теорема синусов и теорема косинусов.</p><div class="rules"><div class="rule"><b>22</b>утверждения</div><div class="rule"><b>11 × 2</b>свойств</div><div class="rule"><b>↔</b>тащи или нажимай</div></div><p>Отправляй табличку в «Миф» или «Закон». Сразу после ответа появится правильная формула.</p><button class="primary" id="startBtn">Открыть заседание</button></div>${scene()}</section>`;$('startBtn').addEventListener('click',startGame)}
  function startGame(){deck=shuffle(facts);index=0;firstTryCorrect=0;questionAttempted=false;startedAt=Date.now();attemptEventId=uuid();resultSubmitted=false;gameActive=true;updateStudent();sound('start');renderQuestion()}
  function gems(){const on=Math.ceil(index/TOTAL*11);return Array.from({length:11},(_,i)=>`<i class="gem ${i<on?'on':''}"></i>`).join('')}
  function renderQuestion(){questionAttempted=false;const q=deck[index];$('app').innerHTML=`<section class="screen game"><div class="hud"><span class="counter">Табличка ${index+1} / ${TOTAL}</span><div class="track"><i style="width:${index/TOTAL*100}%"></i></div><span class="score">Верно сразу: <b id="liveScore">${firstTryCorrect}</b></span></div><div class="court"><section class="arena"><div class="chapter">${esc(q.chapter)}</div><div class="zones"><div class="zone myth">МИФ ←</div><div class="zone law">→ ЗАКОН</div></div><div class="claim" id="claim">${esc(q.text)}</div><div class="buttons"><button class="answer false" data-value="false">✕ МИФ</button><button class="answer true" data-value="true">✓ ЗАКОН</button></div></section><section class="visual"><div class="visual-title">Чертёж к свойству</div><div class="diagram">${diagram(q.diagram)}</div><div class="feedback" id="feedback"></div></section></div><div class="gems">${gems()}</div></section>`;document.querySelectorAll('.answer').forEach(b=>b.addEventListener('click',()=>answer(b.dataset.value==='true',b)));setupDrag()}
  function setupDrag(){const card=$('claim');let startX=0,dx=0,drag=false;card.addEventListener('pointerdown',e=>{if(questionAttempted)return;drag=true;startX=e.clientX;dx=0;card.setPointerCapture(e.pointerId);card.classList.add('dragging')});card.addEventListener('pointermove',e=>{if(!drag)return;dx=e.clientX-startX;card.style.transform=`translateX(${dx}px) rotate(${dx/25}deg)`;card.style.opacity=String(Math.max(.55,1-Math.abs(dx)/600))});card.addEventListener('pointerup',()=>{if(!drag)return;drag=false;card.classList.remove('dragging');if(Math.abs(dx)>85){const value=dx>0;const btn=document.querySelector(`.answer[data-value="${value}"]`);answer(value,btn)}else{card.style.transform='';card.style.opacity=''}})}
  function answer(value,button){if(questionAttempted)return;questionAttempted=true;const q=deck[index],correct=value===q.truth;if(correct)firstTryCorrect++;$('liveScore').textContent=firstTryCorrect;document.querySelectorAll('.answer').forEach(b=>b.disabled=true);button.classList.add(correct?'selected-good':'selected-bad');const claim=$('claim');claim.style.transform=value?'translateX(42px) rotate(3deg)':'translateX(-42px) rotate(-3deg)';const box=$('feedback');box.innerHTML=`<span class="tag">${correct?'Вердикт принят':'Король требует разбор'}</span><h2>${q.truth?'Это закон геометрии':'Это математический миф'}</h2><div class="formula">${esc(q.formula)}</div><div class="explain">${esc(q.explain)}</div><button class="primary" id="nextBtn">${index===TOTAL-1?'Закрыть суд':'Следующая табличка →'}</button>`;box.classList.add('show');$('nextBtn').addEventListener('click',nextQuestion);sound(correct?'good':'bad')}
  function nextQuestion(){index++;if(index>=TOTAL)finish();else renderQuestion()}
  function finish(){gameActive=false;updateStudent();const seconds=elapsed(),score=Math.round(firstTryCorrect/TOTAL*100);$('app').innerHTML=`<section class="screen final"><div class="tablet"><span class="tag">Королевский суд завершён</span><h1>${score>=85?'Хранитель законов!':score>=60?'Достойный советник':'Нужен новый суд'}</h1><div class="ring" style="background:conic-gradient(#a45bd0 ${score}%,#b7a782 0)"><b>${score}%</b></div><p><b>Успешность с первой попытки</b></p><div class="stats"><div class="stat">Верных решений<b>${firstTryCorrect} из ${TOTAL}</b></div><div class="stat">Время прохождения<b>${timeText(seconds)}</b></div></div><div class="save-status" id="saveStatus">Сохраняем результат…</div><div class="actions"><button class="primary" id="againBtn">Провести новый суд</button><button class="secondary" id="homeBtn">На старт</button></div></div>${scene()}</section>`;$('againBtn').addEventListener('click',startGame);$('homeBtn').addEventListener('click',renderStart);sound('finish');submitOnce(score,seconds)}
  function changeStudent(){if(gameActive)return;['egeStudentId','egeStudentName','egeStudentCode'].forEach(k=>localStorage.removeItem(k));renderLogin()}
  function sound(type){if(muted)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ac=sound.ac||(sound.ac=new AC()),now=ac.currentTime,g=ac.createGain(),sets={start:[[150,.18],[310,.4]],good:[[430,.12],[720,.3]],bad:[[145,.2],[73,.38]],finish:[[270,.13],[450,.3],[760,.56]]},set=sets[type]||sets.good;g.connect(ac.destination);g.gain.setValueAtTime(.04,now);g.gain.exponentialRampToValueAtTime(.0001,now+set[set.length-1][1]+.12);set.forEach(([f,d],i)=>{const o=ac.createOscillator();o.type=type==='bad'?'sawtooth':'triangle';o.frequency.value=f;o.connect(g);o.start(now+i*.04);o.stop(now+d+.1)})}catch(_){}}
  $('switchBtn').addEventListener('click',changeStudent);$('soundBtn').addEventListener('click',()=>{muted=!muted;$('soundBtn').textContent=muted?'🔇':'🔊'});window.addEventListener('online',flushPending);
  async function init(){const code=new URLSearchParams(location.search).get('code');if(code){renderLogin(code);return}student=storedStudent();if(student){updateStudent();await flushPending();renderStart()}else renderLogin()}init();
