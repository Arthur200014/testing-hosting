function makeDeck(limit){
  const ordered=shuffle(FACT_PAIRS),pickA=ordered.map((pair,i)=>pair[i<5?0:1]),pickB=ordered.map((pair,i)=>pair[i<5?1:0]);
  if(Number(limit)===2){const deck=[];for(let i=0;i<ordered.length;i++)deck.push(pickA[i].id,pickB[i].id);return deck}
  return pickA.map(x=>x.id);
}

async function hostStartGame(){
  if(role!=='teacher')return;
  const snap=await get(stateRef());if(!snap.exists())return;
  const initial=normalizeState(snap.val());
  const ms=await get(membersRef()),members=ms.exists()?ms.val()||{}:{},onlineIds=activeMemberCodes(members);
  const ordered=Object.entries(initial.game.players).sort((a,b)=>(a[1].slot||9)-(b[1].slot||9)).slice(0,initial.game.studentLimit);
  if(ordered.length<initial.game.studentLimit||!ordered.every(([,p])=>onlineIds.has(String(p.code||p.studentId||'')))){showToast('Начать можно только после подключения всех учеников выбранного режима.');return}
  await runTransaction(stateRef(),current=>{
    const s=normalizeState(current||clone(initial));if(s.game.status!=='lobby')return s;
    const players=Object.entries(s.game.players).sort((a,b)=>(a[1].slot||9)-(b[1].slot||9));if(players.length<s.game.studentLimit)return;
    s.game.playerOrder=players.slice(0,s.game.studentLimit).map(([pk])=>pk);
    s.game.turnKey=s.game.playerOrder[0]||'';s.game.index=0;s.game.question={id:s.game.deck[0]||'',index:0};s.game.feedback=null;s.game.status='playing';s.ui.screen='game';s.game.startedAt=Date.now();s.game.finishedAt=0;s.game.endedEarly=false;
    for(const pk of s.game.playerOrder){s.game.stats[pk]=s.game.stats[pk]||{firstTryCorrect:0,completed:0,attemptCount:0};s.game.attempts[pk]=s.game.attempts[pk]||{}}
    s.version++;return s
  });sound('start')
}
async function submitAnswer(value){
  if(role!=='student'||!serverState)return;
  const initial=clone(serverState),q=currentFact(initial);if(!q)return;
  try{
    const result=await runTransaction(stateRef(),current=>{
      const s=normalizeState(current||clone(initial)),g=s.game;if(g.status!=='playing'||g.turnKey!==participantPlayerKey)return;
      if((g.question?.id||g.deck[g.index])!==q.id)return;
      const prev=g.attempts[participantPlayerKey]?.[g.index]||{firstAttempted:false,firstCorrect:false,tries:0,resolved:false};if(prev.resolved)return;
      const correct=Boolean(value)===Boolean(q.truth);const first=!prev.firstAttempted;
      const attempt={...prev,firstAttempted:true,firstCorrect:first?correct:prev.firstCorrect,tries:(Number(prev.tries)||0)+1,resolved:correct,lastValue:Boolean(value),updatedAt:Date.now()};
      g.attempts[participantPlayerKey]=g.attempts[participantPlayerKey]||{};g.attempts[participantPlayerKey][g.index]=attempt;
      g.stats[participantPlayerKey]=g.stats[participantPlayerKey]||{firstTryCorrect:0,completed:0,attemptCount:0};g.stats[participantPlayerKey].attemptCount=(Number(g.stats[participantPlayerKey].attemptCount)||0)+1;
      if(first&&correct)g.stats[participantPlayerKey].firstTryCorrect=(Number(g.stats[participantPlayerKey].firstTryCorrect)||0)+1;
      if(correct)g.stats[participantPlayerKey].completed=(Number(g.stats[participantPlayerKey].completed)||0)+1;
      g.feedback={index:g.index,questionId:q.id,by:participantPlayerKey,chosen:Boolean(value),correct,resolved:correct,at:Date.now(),firstCorrect:first&&correct};s.version++;return s
    });
    if(!result.committed){showToast('Ответ не принят: состояние изменилось.');return}sound(result.snapshot.val()?.game?.feedback?.correct?'good':'bad')
  }catch(e){showToast(online?'Не удалось отправить ответ. Повтори попытку.':'Нет сети. Ответ отправится после восстановления связи.')}
}
async function advanceAfterCorrect(){
  if(role!=='student'||!serverState)return;const initial=clone(serverState);
  await runTransaction(stateRef(),current=>{
    const s=normalizeState(current||clone(initial)),g=s.game;if(g.status!=='playing'||g.turnKey!==participantPlayerKey||!g.feedback?.resolved||g.feedback.by!==participantPlayerKey)return;
    const next=g.index+1;g.feedback=null;

    g.index=next;g.turnKey=g.playerOrder[next%g.playerOrder.length]||g.playerOrder[0]||'';g.question={id:g.deck[next],index:next};s.version++;return s
  })
}

async function tryJoinStudent(){
  if(joinInFlight||role!=='student'||!student)return false;joinInFlight=true;
  try{
    const enteredCode=String(student.code||student.studentId||''),defaultPk=playerKey(enteredCode),candidateEventId=uuid(),stamp=Date.now();
    let fallback=studentSessionCache||serverState||await primeStudentSession();
    if(!fallback){fallback=await primeStudentSession(true)}
    if(!fallback){serverState=null;renderWaitingTeacher();return false}
    const findPk=s=>Object.keys(s.game.players||{}).find(k=>k===defaultPk||String(s.game.players[k]?.code||s.game.players[k]?.studentId||'')===enteredCode)||'';
    const mutate=(seed,activeCodes=null,cleanupStale=false)=>{
      const s=normalizeState(seed),g=s.game;let existingKey=findPk(s);
      if(cleanupStale&&g.status==='lobby'&&activeCodes){
        for(const[key,p]of Object.entries(g.players||{})){if(key===existingKey)continue;const code=String(p?.code||p?.studentId||''),stale=!activeCodes.has(code)&&stamp-(Number(p.lastSeen)||Number(p.joinedAt)||0)>=10000;if(stale){delete g.players[key];delete g.stats[key];delete g.attempts[key];delete g.eventIds[key];delete g.submissions[key];g.playerOrder=(g.playerOrder||[]).filter(x=>x!==key)}}
        existingKey=findPk(s)
      }
      if(existingKey){
        const p=g.players[existingKey],slot=Number(p.slot)||1;p.studentId=enteredCode;p.code=enteredCode;p.name=student.verified&&student.name?student.name:(p.name&&!/^Ученик$/i.test(p.name)?p.name:`Ученик ${slot}`);p.verifiedStudentId=student.verifiedStudentId||p.verifiedStudentId||'';p.verified=Boolean(student.verified||p.verified);p.lastSeen=stamp;g.eventIds[existingKey]=g.eventIds[existingKey]||candidateEventId;s.version++;return s
      }
      if(g.status!=='lobby'||Object.keys(g.players).length>=g.studentLimit)return;
      const used=new Set(Object.values(g.players).map(p=>Number(p.slot)));let slot=1;while(used.has(slot)&&slot<=g.studentLimit)slot++;if(slot>g.studentLimit)return;
      g.players[defaultPk]={studentId:enteredCode,verifiedStudentId:student.verifiedStudentId||'',verified:Boolean(student.verified),name:student.verified&&student.name?student.name:`Ученик ${slot}`,code:enteredCode,slot,joinedAt:stamp,lastSeen:stamp};g.stats[defaultPk]=g.stats[defaultPk]||{firstTryCorrect:0,completed:0,attemptCount:0};g.attempts[defaultPk]=g.attempts[defaultPk]||{};g.eventIds[defaultPk]=g.eventIds[defaultPk]||candidateEventId;g.submissions[defaultPk]=g.submissions[defaultPk]||{status:'pending'};s.version++;return s
    };
    const attempt=async(seed,activeCodes=null,cleanup=false)=>runTransaction(stateRef(),current=>{const source=current||clone(seed);if(!source)return;return mutate(source,activeCodes,cleanup)},{applyLocally:false});
    let result=await attempt(fallback);
    if(result.committed){
      const after=normalizeState(result.snapshot.val()),found=findPk(after);serverState=after;studentSessionCache=after;
      if(found){participantPlayerKey=found;const p=after.game.players[found];student.name=p.name||student.name;participantName=student.name;return true}
    }
    const [latestSnap,membersSnap]=await Promise.all([get(stateRef()).catch(()=>null),get(membersRef()).catch(()=>null)]);
    if(!latestSnap?.exists()){serverState=null;renderWaitingTeacher();return false}
    let latest=normalizeState(latestSnap.val()),found=findPk(latest);serverState=latest;studentSessionCache=latest;
    if(found){participantPlayerKey=found;const p=latest.game.players[found];student.name=p.name||student.name;participantName=student.name;return true}
    if(latest.game.status!=='lobby'){showToast('Игра уже началась. Войти новым участником сейчас нельзя.');return false}
    const activeCodes=activeMemberCodes(membersSnap?.exists()?membersSnap.val():{});
    const hasStale=Object.values(latest.game.players||{}).some(p=>{const code=String(p?.code||p?.studentId||'');return !activeCodes.has(code)&&stamp-(Number(p.lastSeen)||Number(p.joinedAt)||0)>=10000});
    if(hasStale){
      result=await attempt(latest,activeCodes,true);
      if(result.committed){
        latest=normalizeState(result.snapshot.val());found=findPk(latest);serverState=latest;studentSessionCache=latest;
        if(found){participantPlayerKey=found;const p=latest.game.players[found];student.name=p.name||student.name;participantName=student.name;return true}
      }
    }
    if(Object.keys(latest.game.players).length>=latest.game.studentLimit){showToast('Все места действительно заняты.');return false}
    showToast('Не удалось занять место. Повтори вход.');showRetryJoin();return false
  }catch(e){showToast(online?'Не удалось подключиться к занятию. Можно повторить вход.':'Нет сети. Подключение продолжится после восстановления.');showRetryJoin();return false}
  finally{joinInFlight=false}
}

async function boardPointerUp(e){

  if(activeStroke){const finalStroke=clone({...activeStroke,done:true,rev:Number(activeStroke.rev||0)+1});boardLocalStrokes[finalStroke.id]=finalStroke;renderBoardStrokes();set(ref(database,`${lessonRoot()}/state/strokes/${finalStroke.id}`),finalStroke).catch(()=>{});activeStroke=null}
  boardErasing=false;lastErasePoint=null;boardPointerId=null
}
async function pushStroke(){if(!activeStroke||!serverState)return;try{await set(ref(database,`${lessonRoot()}/state/strokes/${activeStroke.id}`),clone(activeStroke))}catch{}}
function renderBoardStrokes(){
  const b=$('sharedBoard');if(!b||!serverState)return;const epoch=serverState.boardEpoch||0,all={...(serverState.strokes||{}),...boardLocalStrokes};if(activeStroke)all[activeStroke.id]=activeStroke;
  const strokes=Object.values(all).filter(s=>s&&!boardHiddenStrokes.has(s.id)&&Number(s.epoch||0)===Number(epoch)&&Array.isArray(s.points)&&s.points.length);
  b.innerHTML=strokes.map(s=>{const pts=s.points.map(([x,y])=>`${Math.max(0,Math.min(1,x))*1000},${Math.max(0,Math.min(1,y))*1000}`).join(' ');return`<polyline data-stroke-id="${esc(s.id)}" points="${pts}" fill="none" stroke="${esc(s.color||'#e53935')}" stroke-width="${Math.max(1,Number(s.width)||6)*2.2}" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`}).join('')
}
async function eraseNearest(p){await eraseAt(p)}
async function clearBoard(){
  if(role!=='teacher'||!serverState)return;boardLocalStrokes={};boardHiddenStrokes.clear();const initial=clone(serverState);await runTransaction(stateRef(),current=>{const s=normalizeState(current||clone(initial));s.boardEpoch=(Number(s.boardEpoch)||0)+1;s.strokes={};s.version++;return s})
}
function initBoardToolbar(){
  const tb=$('boardToolbar');let pos={right:18,bottom:18};try{pos={...pos,...JSON.parse(localStorage.getItem(TOOLBAR_POSITION_KEY)||'{}')}}catch{}tb.style.right=(pos.right??18)+'px';tb.style.bottom=(pos.bottom??18)+'px';
  tb.innerHTML=`<div class="board-head" id="boardDragHandle"><b>Доска</b><button class="tiny" id="boardCollapse">−</button></div><div class="board-tools"><button data-board-tool="cursor" title="Курсор">↖</button><button data-board-tool="pencil" title="Карандаш">✎</button><button data-board-tool="eraser" title="Ластик">⌫</button><input id="boardColor" type="color" value="${boardColor}" title="Цвет"><input id="boardWidth" type="range" min="2" max="12" value="${boardWidth}" title="Толщина"><button class="board-clear" id="boardClear" title="Очистить всю общую доску">🗑 Очистить всё</button></div>`;
  document.querySelectorAll('[data-board-tool]').forEach(b=>b.onclick=()=>{boardTool=b.dataset.boardTool;setBoardPointerMode()});$('boardColor').oninput=e=>boardColor=e.target.value;$('boardWidth').oninput=e=>boardWidth=Number(e.target.value);$('boardClear').onclick=()=>{if(role==='teacher')clearBoard();else showToast('Полностью очищать доску может только учитель.')};$('boardCollapse').onclick=()=>{toolbarCollapsed=!toolbarCollapsed;tb.classList.toggle('collapsed',toolbarCollapsed);$('boardCollapse').textContent=toolbarCollapsed?'+':'−'};makeToolbarDraggable(tb,$('boardDragHandle'));setBoardPointerMode()
}
function makeToolbarDraggable(tb,handle){let sx=0,sy=0,startR=0,startB=0,drag=false;handle.addEventListener('pointerdown',e=>{if(e.target.tagName==='BUTTON')return;drag=true;sx=e.clientX;sy=e.clientY;const r=tb.getBoundingClientRect();startR=innerWidth-r.right;startB=innerHeight-r.bottom;handle.setPointerCapture(e.pointerId)});handle.addEventListener('pointermove',e=>{if(!drag)return;const nr=Math.max(0,Math.min(innerWidth-tb.offsetWidth,startR-(e.clientX-sx))),nb=Math.max(0,Math.min(innerHeight-tb.offsetHeight,startB-(e.clientY-sy)));tb.style.right=nr+'px';tb.style.bottom=nb+'px'});handle.addEventListener('pointerup',()=>{if(!drag)return;drag=false;localStorage.setItem(TOOLBAR_POSITION_KEY,JSON.stringify({right:parseFloat(tb.style.right)||0,bottom:parseFloat(tb.style.bottom)||0}))})}
function installTeacherCursorTracking(anchor){anchor.onpointermove=role==='teacher'?e=>{if(boardTool!=='cursor'||Date.now()-lastCursorPush<75)return;lastCursorPush=Date.now();const r=anchor.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;update(ref(database,`${lessonRoot()}/messages/teacherCursor`),{x,y,at:Date.now(),visible:true}).catch(()=>{})}:null;anchor.onpointerleave=role==='teacher'?()=>update(ref(database,`${lessonRoot()}/messages/teacherCursor`),{visible:false,at:Date.now()}).catch(()=>{}):null}
function updateTeacherCursor(){const c=$('teacherCursor');if(!c)return;if(role!=='student'||!remoteTeacherCursor?.visible){c.classList.remove('show');return}const anchor=document.querySelector('[data-board-anchor="main-screen"]');if(!anchor)return;const r=anchor.getBoundingClientRect();c.style.left=(r.left+remoteTeacherCursor.x*r.width)+'px';c.style.top=(r.top+remoteTeacherCursor.y*r.height)+'px';c.classList.add('show')}

function sound(type){if(muted)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ac=sound.ac||(sound.ac=new AC()),now=ac.currentTime,g=ac.createGain(),sets={start:[[150,.18],[310,.4]],good:[[430,.12],[720,.3]],bad:[[145,.2],[73,.38]],finish:[[270,.13],[450,.3],[760,.56]]},set=sets[type]||sets.good;g.connect(ac.destination);g.gain.setValueAtTime(.04,now);g.gain.exponentialRampToValueAtTime(.0001,now+set[set.length-1][1]+.12);set.forEach(([f,d],i)=>{const o=ac.createOscillator();o.type=type==='bad'?'sawtooth':'triangle';o.frequency.value=f;o.connect(g);o.start(now+i*.04);o.stop(now+d+.1)})}catch{}}

$('lessonJoinBtn').addEventListener('click',openRoleModal);
$('soundBtn').addEventListener('click',()=>{muted=!muted;$('soundBtn').textContent=muted?'🔇':'🔊'});
window.addEventListener('online',async()=>{online=true;updateSessionPanel();await flushPendingResults();if(role==='student'&&serverState&&!serverState.game.players[participantPlayerKey])tryJoinStudent().catch(()=>{});renderFromState(true)});
window.addEventListener('offline',()=>{online=false;updateSessionPanel();renderFromState(true)});
window.addEventListener('resize',updateTeacherCursor);
window.addEventListener('pagehide',bestEffortPartialSubmit);
window.addEventListener('beforeunload',bestEffortPartialSubmit);

initBoardToolbar();renderPublic();flushPendingResults();setInterval(flushPendingResults,60000);

  </script>
