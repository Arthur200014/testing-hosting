  async function submitAnswer(value){if(role!=='student'||!sharedState)return;await runTransaction(stateRef(),current=>{const state=normalizeState(current),g=state.game;if(g.status!=='playing'||g.turnKey!==playerIdKey||g.feedback)return;const q=facts[g.deck[g.index]],correct=value===q.truth,by=g.turnKey,attempts=g.attempts[by]||(g.attempts[by]={}),a=attempts[g.index]||(attempts[g.index]={firstAttempted:false,firstCorrect:false,wrongAttempts:0,completed:false});if(!a.firstAttempted){a.firstAttempted=true;a.firstCorrect=correct}if(!correct){a.wrongAttempts+=1;g.stats[by].wrongAttempts=(g.stats[by].wrongAttempts||0)+1;g.feedback={token:uuid(),questionIndex:g.index,answeredBy:by,correct:false,answer:value,at:now()}}else{if(a.completed)return;a.completed=true;g.stats[by].completed=(g.stats[by].completed||0)+1;if(a.firstCorrect)g.stats[by].firstTryCorrect=(g.stats[by].firstTryCorrect||0)+1;g.feedback={token:uuid(),questionIndex:g.index,answeredBy:by,correct:true,answer:value,at:now()};g.status='feedback'}state.version+=1;return state})}

  function scheduleAdvance(feedback){clearTimeout(advanceTimer);advanceTimer=setTimeout(()=>advanceQuestion(feedback),2600)}

  async function finishEarly(){if(!sharedState||!['playing','feedback'].includes(sharedState.game.status))return;if(!confirm('Завершить игру сейчас и сохранить уже заработанный прогресс?'))return;await runTransaction(stateRef(),current=>{const state=normalizeState(current),g=state.game;if(!['playing','feedback'].includes(g.status))return;g.status='finished';g.earlyEnded=true;g.finishedAt=now();Object.values(g.stats).forEach(s=>s.finishedAt=g.finishedAt);g.feedback=null;state.version+=1;return state})}
  function resultCard(key,g){const p=g.players[key],s=g.stats[key]||{},completed=Number(s.completed||0),correct=Number(s.firstTryCorrect||0),percent=completed?Math.round(correct/completed*100):0,duration=Math.max(1,Math.round(((s.finishedAt||g.finishedAt||now())-(s.startedAt||g.startedAt||now()))/1000)),sub=g.submissions[key]||{};return`<article class="final-player"><span class="tag">Ученик №${p.slot}</span><h2>${esc(p.name)}</h2><div class="ring" style="background:conic-gradient(#a45bd0 ${percent}%,#b7a782 0)"><b>${percent}%</b></div><div class="stats"><div class="stat">Верно сразу<b>${correct} из ${completed}</b></div><div class="stat">Время<b>${timeText(duration)}</b></div></div><div class="save-pill ${sub.status==='saved'?'ok':sub.status==='queued'?'bad':''}">${sub.status==='saved'?'✓ Результат сохранён':sub.status==='queued'?'Нет связи — отправим позже':'Сохраняем результат…'}</div></article>`}
  function renderFinal(){setLessonPanelExpanded(true);const g=sharedState.game,keys=g.playerOrder.length?g.playerOrder:Object.keys(g.players);$('app').innerHTML=`<section class="screen final"><div class="tablet" style="grid-column:1/-1"><span class="tag">${g.earlyEnded?'Досрочное завершение':'Королевский суд завершён'}</span><h1>Вердикты вынесены</h1><p class="lead">Процент считается только по реально завершённым карточкам. Непройденные задания результат не снижают.</p><div class="final-two" style="grid-template-columns:repeat(${Math.min(2,keys.length)},1fr)">${keys.map(k=>resultCard(k,g)).join('')}</div>${role==='teacher'?'<div class="actions"><button class="primary" id="newFromFinal">Начать новое заседание</button></div>':''}</div></section>`;if($('newFromFinal'))$('newFromFinal').onclick=showLimitChoice;const token=g.sessionId+'|'+g.finishedAt;if(finalSoundToken!==token){finalSoundToken=token;sound('finish')}if(role==='student')ensureSubmission(playerIdKey);if(role==='teacher'){clearTimeout(resultFallbackTimer);resultFallbackTimer=setTimeout(()=>keys.forEach(ensureSubmission),4500)}}
  function resultPayload(key,state=sharedState){const g=state.game,p=g.players[key],s=g.stats[key]||{},completed=Number(s.completed||0),score=Number(s.firstTryCorrect||0),percent=completed?Math.round(score/completed*100):0,finished=Number(g.finishedAt||now()),started=Number(s.startedAt||g.startedAt||finished);return{action:'submitTest',programId:'EGE_MATH',eventId:g.eventIds[key]||`${g.sessionId}-${key}`,studentId:String(p.id),studentName:p.name,studentCode:p.code||'',testId:TEST_META.testId,testName:TEST_META.testName,topicId:TEST_META.topicId,topicName:TEST_META.topicName,taskNumber:TEST_META.taskNumber,testDate:localDate(finished),score,maxScore:completed,percent,scorePercent:percent,durationSec:Math.max(1,Math.round((finished-started)/1000)),durationSeconds:Math.max(1,Math.round((finished-started)/1000)),startedAt:new Date(started).toISOString(),finishedAt:new Date(finished).toISOString(),completedAt:new Date(finished).toISOString(),answeredCount:completed,wrongAttempts:Number(s.wrongAttempts||0),mode:g.studentLimit===2?'two_students':'one_student',schemaVersion:TEST_META.schemaVersion}}
  async function sendResult(payload){const response=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),redirect:'follow'});let answer;try{answer=await response.json()}catch{throw new Error('Система результатов не ответила.')}if(!response.ok||!answer?.ok)throw new Error(answer?.error||'Результат не принят.');return answer}
  function readQueue(){try{const q=JSON.parse(localStorage.getItem(PENDING_RESULTS_KEY)||'[]');return Array.isArray(q)?q:[]}catch{return[]}}
  function writeQueue(q){localStorage.setItem(PENDING_RESULTS_KEY,JSON.stringify(q))}
  function queueResult(payload,key){const q=readQueue();if(!q.some(x=>x.payload?.eventId===payload.eventId))q.push({payload,key});writeQueue(q)}
  function removeQueued(eventId){writeQueue(readQueue().filter(x=>x.payload?.eventId!==eventId))}
  async function ensureSubmission(key){if(!sharedState?.game.players[key])return;const submissionRef=ref(database,`${lessonRoot()}/state/game/submissions/${key}`),stamp=now(),claim=await runTransaction(submissionRef,current=>{if(current?.status==='saved')return;if((current?.status==='sending'||current?.status==='queued')&&stamp-Number(current.updatedAt||0)<10000)return;return{status:'sending',eventId:sharedState.game.eventIds[key],updatedAt:stamp,by:role}});if(!claim.committed)return;const payload=resultPayload(key);try{if(!navigator.onLine)throw new Error('offline');await sendResult(payload);removeQueued(payload.eventId);await update(submissionRef,{status:'saved',eventId:payload.eventId,updatedAt:now()})}catch(err){queueResult(payload,key);await update(submissionRef,{status:'queued',eventId:payload.eventId,updatedAt:now()})}}
  async function flushPending(){if(!navigator.onLine)return;for(const item of readQueue()){try{await sendResult(item.payload);removeQueued(item.payload.eventId);if(sharedState?.game.eventIds[item.key]===item.payload.eventId)await update(ref(database,`${lessonRoot()}/state/game/submissions/${item.key}`),{status:'saved',eventId:item.payload.eventId,updatedAt:now()})}catch{break}}}
  function sendProgressOnClose(){if(role!=='student'||!sharedState?.game.players[playerIdKey]||!sharedState.game.startedAt)return;const s=sharedState.game.stats[playerIdKey]||{};if(!s.completed)return;const payload=resultPayload(playerIdKey);try{navigator.sendBeacon(API_URL,new Blob([JSON.stringify(payload)],{type:'text/plain;charset=utf-8'}))}catch{}queueResult(payload,playerIdKey)}
  function renderBoard(){const layer=$('boardLayer');if(!sharedState){layer.innerHTML='';return}const epoch=sharedState.boardEpoch;layer.innerHTML=Object.values(sharedState.strokes||{}).filter(s=>s&&s.epoch===epoch).map(s=>`<polyline data-stroke-id="${esc(s.id)}" points="${(s.points||[]).map(([x,y])=>`${x*innerWidth},${y*innerHeight}`).join(' ')}" fill="none" stroke="${esc(s.color)}" stroke-width="${Number(s.width)||6}" stroke-linecap="round" stroke-linejoin="round"/>`).join('')}
  let boardTool='cursor',drawing=null,lastStrokeWrite=0;
  function setBoardTool(tool){boardTool=tool;document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('on',b.dataset.tool===tool));$('boardLayer').classList.toggle('active',tool!=='cursor')}
  async function boardPointerDown(e){if(!role||!sharedState||boardTool==='cursor')return;if(boardTool==='eraser'){const id=e.target?.dataset?.strokeId;if(id)await remove(ref(database,`${lessonRoot()}/state/strokes/${id}`));return}e.preventDefault();const id='stroke-'+uuid(),point=[e.clientX/innerWidth,e.clientY/innerHeight];drawing={id,anchorId:'game-screen',authorId:role==='teacher'?identity.id:identity.studentId,authorName:role==='teacher'?'Учитель':identity.name,color:$('boardColor').value,width:Number($('boardWidth').value),points:[point],done:false,epoch:sharedState.boardEpoch,rev:now()};e.currentTarget.setPointerCapture(e.pointerId);await set(ref(database,`${lessonRoot()}/state/strokes/${id}`),drawing)}
  function boardPointerMove(e){if(!drawing)return;drawing.points.push([e.clientX/innerWidth,e.clientY/innerHeight]);const stamp=now();if(stamp-lastStrokeWrite>70){lastStrokeWrite=stamp;set(ref(database,`${lessonRoot()}/state/strokes/${drawing.id}`),drawing)}}
  function boardPointerUp(){if(!drawing)return;drawing.done=true;drawing.rev=now();set(ref(database,`${lessonRoot()}/state/strokes/${drawing.id}`),drawing);drawing=null}
  async function clearAllBoard(){if(role!=='teacher'||!sharedState)return;await runTransaction(stateRef(),current=>{const state=normalizeState(current);state.boardEpoch+=1;state.strokes={};state.version+=1;return state})}
  function initToolbar(){const toolbar=$('boardToolbar'),saved=JSON.parse(localStorage.getItem(TOOLBAR_POSITION_KEY)||'null'),save=()=>localStorage.setItem(TOOLBAR_POSITION_KEY,JSON.stringify({x:toolbar.offsetLeft,y:toolbar.offsetTop,collapsed:toolbar.classList.contains('collapsed')}));if(saved){toolbar.style.left=Math.max(0,Math.min(innerWidth-160,Number(saved.x)||0))+'px';toolbar.style.top=Math.max(0,Math.min(innerHeight-45,Number(saved.y)||0))+'px';toolbar.classList.toggle('collapsed',Boolean(saved.collapsed));$('boardCollapse').textContent=saved.collapsed?'+':'−'}document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>setBoardTool(b.dataset.tool));$('clearBoard').onclick=clearAllBoard;$('boardCollapse').onclick=e=>{e.stopPropagation();toolbar.classList.toggle('collapsed');$('boardCollapse').textContent=toolbar.classList.contains('collapsed')?'+':'−';save()};$('boardCollapse').onpointerdown=e=>e.stopPropagation();let drag=null;$('boardGrip').onpointerdown=e=>{if(e.target.closest('button'))return;drag={dx:e.clientX-toolbar.offsetLeft,dy:e.clientY-toolbar.offsetTop};$('boardGrip').setPointerCapture(e.pointerId)};$('boardGrip').onpointermove=e=>{if(!drag)return;const x=Math.max(0,Math.min(innerWidth-toolbar.offsetWidth,e.clientX-drag.dx)),y=Math.max(0,Math.min(innerHeight-toolbar.offsetHeight,e.clientY-drag.dy));toolbar.style.left=x+'px';toolbar.style.top=y+'px';toolbar.style.bottom='auto'};$('boardGrip').onpointerup=()=>{if(!drag)return;save();drag=null}}
  let cursorStamp=0;function teacherMouseMove(e){if(role!=='teacher'||!navigator.onLine||now()-cursorStamp<75)return;cursorStamp=now();update(ref(database,`${lessonRoot()}/messages/teacherCursor`),{x:e.clientX/innerWidth,y:e.clientY/innerHeight,at:serverTimestamp()})}

  function sound(type){if(muted)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ac=sound.ac||(sound.ac=new AC()),now=ac.currentTime,g=ac.createGain(),sets={start:[[130,.2],[250,.4]],good:[[400,.12],[650,.3]],bad:[[150,.2],[82,.38]],finish:[[250,.13],[420,.3],[680,.55]]},set=sets[type]||sets.good;g.connect(ac.destination);g.gain.setValueAtTime(.04,now);g.gain.exponentialRampToValueAtTime(.0001,now+set[set.length-1][1]+.12);set.forEach(([f,d],i)=>{const o=ac.createOscillator();o.type=type==='bad'?'sawtooth':'triangle';o.frequency.value=f;o.connect(g);o.start(now+i*.04);o.stop(now+d+.1)})}catch(_){}}
  $('lessonLaunch').onclick=showRoleChoice;$('modalBackdrop').onclick=e=>{if(e.target===$('modalBackdrop'))closeModal()};$('soundBtn').onclick=()=>{muted=!muted;$('soundBtn').textContent=muted?'🔇':'🔊'};$('panelToggle').onclick=()=>{const body=$('panelBody'),hidden=body.hidden;body.hidden=!hidden;$('panelToggle').textContent=hidden?'−':'+'};$('boardLayer').addEventListener('pointerdown',boardPointerDown);$('boardLayer').addEventListener('pointermove',boardPointerMove);$('boardLayer').addEventListener('pointerup',boardPointerUp);$('boardLayer').addEventListener('pointercancel',boardPointerUp);window.addEventListener('mousemove',teacherMouseMove);window.addEventListener('online',flushPending);window.addEventListener('pagehide',sendProgressOnClose);
