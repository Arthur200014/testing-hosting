<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#173e2b">
  <title>Рюкзак пингвинов — формулы задания №1</title>
  <style>
    :root{
      --jungle:#173e2b;--leaf:#2f8750;--lime:#9bd44e;--sun:#ffd75c;
      --wood:#704125;--paper:#fff6cf;--red:#da4e3d;--blue:#39a7b9;--ink:#183326;
      --shadow:0 18px 50px #061c1466;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Trebuchet MS,Segoe UI,system-ui,sans-serif;color:var(--ink)}
    body{
      min-height:100vh;overflow-x:hidden;
      background:
        radial-gradient(ellipse at 50% 15%,#f9f3b7 0 4%,#75c47c 30%,transparent 50%),
        linear-gradient(#56aa68 0 27%,#215f3f 28% 100%);
    }
    body:before,body:after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none}
    body:before{
      background:
        radial-gradient(ellipse at 5% 30%,#123d27 0 10%,transparent 11%),
        radial-gradient(ellipse at 95% 40%,#123d27 0 13%,transparent 14%),
        radial-gradient(ellipse at 13% 92%,#0c301f 0 22%,transparent 23%),
        radial-gradient(ellipse at 91% 91%,#0b311f 0 27%,transparent 28%);
    }
    body:after{
      opacity:.22;
      background:
        repeating-linear-gradient(63deg,transparent 0 53px,#d8ff9a 54px 56px,transparent 57px 110px);
      animation:mist 20s linear infinite
    }
    button,input{font:inherit}button{cursor:pointer}
    .topbar{width:min(1280px,calc(100% - 24px));min-height:58px;margin:10px auto 0;display:flex;justify-content:space-between;align-items:center;gap:12px;color:#fff;position:relative;z-index:20}
    .brand{display:flex;align-items:center;gap:10px;font-weight:1000;text-shadow:0 2px 5px #0d2e20}
    .brand-logo{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(#fff,#c9e2db);border:4px solid #111d1a;box-shadow:0 4px 0 #07120f;font-size:25px}
    .student-box{display:none;align-items:center;gap:9px;background:#092b1fd9;border:1px solid #dfffb877;padding:7px 8px 7px 13px;border-radius:999px;backdrop-filter:blur(9px)}
    .student-box b{max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .tiny{border:1px solid #fff5;background:#fff1;color:#fff;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:1000}
    .tiny:disabled{opacity:.35;cursor:not-allowed}.sound{width:37px;height:37px;padding:0;font-size:17px}
    #app{width:min(1280px,calc(100% - 24px));margin:8px auto 18px;position:relative;z-index:2}
    .screen{
      min-height:720px;position:relative;overflow:hidden;border:5px solid #392418;border-radius:28px;
      box-shadow:var(--shadow),inset 0 0 0 5px #deb454;
      background:
        linear-gradient(#e8ffd7df,#fff3bee8),
        repeating-linear-gradient(90deg,transparent 0 75px,#4b2d1712 76px 79px);
    }
    .screen:before,.screen:after{content:"";position:absolute;top:0;bottom:0;width:25px;background:repeating-linear-gradient(#734125 0 34px,#bc7831 35px 42px);z-index:8}
    .screen:before{left:0}.screen:after{right:0}
    .login,.start,.final{display:grid;grid-template-columns:1.05fr .95fr;align-items:center;gap:34px;padding:54px 65px}
    .leaf-card{position:relative;background:linear-gradient(105deg,#e6c978,#fff8cf 9% 91%,#d7b45a);border:4px solid #684021;border-radius:16px;padding:34px;box-shadow:0 13px 0 #5e3a23,0 24px 45px #1f412b44}
    .leaf-card:before,.leaf-card:after{content:"";position:absolute;left:-18px;right:-18px;height:17px;border-radius:20px;background:linear-gradient(#bd732d,#f1ba54 45%,#75401e 50%);border:2px solid #5b321d}
    .leaf-card:before{top:-10px}.leaf-card:after{bottom:-10px}
    .tag{display:inline-flex;padding:6px 10px;border-radius:7px;background:#183e2d;color:#ffe381;font-size:12px;font-weight:1000;letter-spacing:.12em;text-transform:uppercase}
    h1{font-size:clamp(38px,5vw,68px);line-height:.9;letter-spacing:-.055em;margin:18px 0}
    .lead{font-size:18px;line-height:1.52;margin:0 0 20px}
    .primary,.secondary{border-radius:14px;padding:14px 20px;font-weight:1000;border:2px solid #163a29;box-shadow:0 6px 0 #392317;transition:.16s transform,.16s filter}
    .primary{background:linear-gradient(#86cf4c,#3a944d);color:#102d20}.secondary{background:linear-gradient(#ffe276,#e79e31);color:#3d2415}
    .primary:hover,.secondary:hover{transform:translateY(-2px);filter:brightness(1.06)}.primary:active,.secondary:active{transform:translateY(4px);box-shadow:0 2px 0 #392317}
    .code-form{display:grid;gap:11px}.code-input{width:100%;border:3px solid #5d3923;border-radius:14px;padding:15px 16px;background:#fffdf0;font-size:20px;font-weight:1000;text-transform:uppercase;outline:none}
    .code-input:focus{border-color:#2d8c50;box-shadow:0 0 0 4px #58b96e3f}.status{min-height:22px;font-size:14px;font-weight:1000}.status.bad{color:#aa2e27}
    .hero-jungle{position:relative;min-height:570px;display:grid;place-items:center}
    .sun{position:absolute;width:350px;height:350px;border-radius:50%;background:radial-gradient(circle,#fffbc9 0 22%,#ffd664 52%,#ffbb3555 70%,transparent 71%);animation:sunPulse 3s ease-in-out infinite}
    .palm{position:absolute;bottom:12px;width:24px;height:330px;background:repeating-linear-gradient(8deg,#5b321f 0 26px,#89512b 27px 34px);border-radius:40%;transform-origin:bottom}
    .palm:before{content:"";position:absolute;left:-90px;top:-32px;width:205px;height:104px;border-radius:100% 0 100% 0;background:radial-gradient(ellipse at 75% 68%,#4eaa4c 0 28%,#1d6a37 30% 60%,transparent 62%);box-shadow:-55px 8px 0 #277d3d,45px 15px 0 #368f42;transform:rotate(-9deg)}
    .palm.l{left:3%;transform:rotate(-8deg)}.palm.r{right:3%;transform:rotate(9deg) scaleX(-1)}
    .crew{position:absolute;left:3%;right:3%;bottom:5px;display:flex;align-items:end;justify-content:space-around;z-index:5}
    .animal{--fur:#d99b3e;position:relative;width:94px;height:150px;filter:drop-shadow(0 9px 5px #0b2b1b88);animation:bob 2.5s ease-in-out infinite}
    .animal:nth-child(2){animation-delay:-.6s}.animal:nth-child(3){animation-delay:-1.2s}.animal:nth-child(4){animation-delay:-1.8s}
    .animal .body{position:absolute;left:22px;bottom:0;width:52px;height:88px;border-radius:48% 48% 28% 28%;background:var(--fur);border:4px solid #35251c}
    .animal .head{position:absolute;left:13px;top:11px;width:70px;height:67px;border-radius:48%;background:var(--fur);border:4px solid #35251c}
    .animal .head:before,.animal .head:after{content:"";position:absolute;top:21px;width:13px;height:17px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 5px #26352e}
    .animal .head:before{left:12px}.animal .head:after{right:12px}
    .animal .mouth{position:absolute;left:27px;top:49px;width:20px;height:8px;border-bottom:4px solid #5a2b20;border-radius:50%}
    .animal .ear{position:absolute;top:5px;width:24px;height:27px;border-radius:50%;background:var(--fur);border:3px solid #35251c;z-index:-1}.animal .ear.l{left:9px}.animal .ear.r{right:9px}
    .animal .limb{position:absolute;bottom:9px;width:18px;height:62px;border-radius:16px;background:var(--fur);border:3px solid #35251c;transform-origin:50% 8%;z-index:-1}.animal .limb.l{left:13px}.animal .limb.r{right:10px}
    .animal .tail{position:absolute;right:2px;bottom:46px;width:45px;height:18px;border-radius:50%;border-top:7px solid var(--fur);transform-origin:left center;z-index:-2}
    .animal.lion{--fur:#dda147}.animal.lion .head{box-shadow:0 0 0 16px #8b4e28}
    .animal.zebra{--fur:#f5f3df}.animal.zebra .body,.animal.zebra .head{background:repeating-linear-gradient(75deg,#f5f3df 0 10px,#26302d 11px 15px)}
    .animal.giraffe{--fur:#e7b955;height:225px}.animal.giraffe .body{height:150px}.animal.giraffe .head{top:2px;background:radial-gradient(circle,#73421f 0 5px,transparent 6px) 0 0/23px 24px,#e7b955}
    .animal.hippo{--fur:#9a7aaa;width:125px}.animal.hippo .body{left:24px;width:78px}.animal.hippo .head{left:16px;width:94px;border-radius:46% 46% 38% 38%}
    .animal.lion .head{animation:lionLook 3.3s ease-in-out infinite}.animal.lion .limb.r{animation:lionWave 1.8s ease-in-out infinite}.animal.lion .mouth{animation:smileTalk 2.2s ease-in-out infinite}
    .animal.zebra{animation:zebraDance 1.7s ease-in-out infinite}.animal.zebra .limb.l{animation:hoofL 1.7s ease-in-out infinite}.animal.zebra .limb.r{animation:hoofR 1.7s ease-in-out infinite}.animal.zebra .tail{animation:tailSwing 1.1s ease-in-out infinite}
    .animal.giraffe .head{animation:giraffeLook 3.2s ease-in-out infinite;transform-origin:50% 100%}.animal.giraffe .body{animation:neckSway 3.2s ease-in-out infinite;transform-origin:50% 100%}
    .animal.hippo{animation:hippoBounce 2.1s ease-in-out infinite}.animal.hippo .limb{animation:hippoClap 2.1s ease-in-out infinite}.animal.hippo .mouth{animation:hippoLaugh 1.05s ease-in-out infinite}
    .penguin{--ps:1;position:relative;width:190px;height:285px;z-index:7;filter:drop-shadow(0 15px 8px #102c1f77);animation:penguinIdle 2s ease-in-out infinite;transform:scale(var(--ps));transform-origin:center bottom}
    .penguin .body{position:absolute;left:33px;top:37px;width:128px;height:210px;border-radius:49% 49% 43% 43%;background:#17201e;border:5px solid #0a0f0e}
    .penguin .belly{position:absolute;left:51px;top:85px;width:92px;height:146px;border-radius:52% 52% 44% 44%;background:#f5f2d9;border:3px solid #c9c4aa}
    .penguin .eye{position:absolute;top:61px;width:35px;height:43px;border-radius:50%;background:#fff;border:3px solid #121a18;z-index:3}
    .penguin .eye:after{content:"";position:absolute;width:13px;height:16px;border-radius:50%;background:#1d2b25;left:11px;top:12px;box-shadow:inset 0 0 0 4px #5f995d}
    .penguin .eye.l{left:54px}.penguin .eye.r{right:52px}
    .penguin .beak{position:absolute;left:69px;top:99px;width:57px;height:36px;background:#efa837;clip-path:polygon(0 0,100% 50%,0 100%);z-index:4}
    .penguin .wing{position:absolute;top:105px;width:43px;height:128px;border-radius:50%;background:#131b19;border:4px solid #090e0d;transform-origin:50% 10%}
    .penguin .wing.l{left:13px;transform:rotate(20deg)}.penguin .wing.r{right:7px;transform:rotate(-25deg)}
    .penguin .foot{position:absolute;bottom:13px;width:68px;height:29px;border-radius:55% 55% 38% 38%;background:#e9a22f;border:3px solid #6c421d}
    .penguin .foot.l{left:26px;transform:rotate(-8deg)}.penguin .foot.r{right:18px;transform:rotate(8deg)}
    .penguin .cap{position:absolute;left:54px;top:18px;width:90px;height:35px;border-radius:60% 60% 15% 15%;background:#355c48;border:4px solid #15291f;z-index:4}.penguin .cap:after{content:"";position:absolute;left:65px;bottom:-9px;width:49px;height:13px;border-radius:50%;background:#355c48;border:3px solid #15291f}
    .penguin:not(.wrong):not(.right) .wing.l{animation:flipperL 2.4s ease-in-out infinite}.penguin:not(.wrong):not(.right) .wing.r{animation:flipperR 2.4s ease-in-out infinite}.penguin .eye{animation:penguinBlink 4.7s ease-in-out infinite}
    .hero-jungle .penguin{--ps:1.12}
    .rules{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:21px 0}.rule{border:2px solid #6f4c2b44;background:#fff9;border-radius:13px;padding:12px 8px;text-align:center;font-size:13px;font-weight:1000}.rule b{font-size:23px;display:block}
    .game{padding:27px 36px 30px;display:grid;grid-template-rows:auto 1fr auto;gap:13px}
    .hud{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:13px;margin:0 9px}.counter,.score-now{font-weight:1000;background:#183e2d;color:#fff2a8;border-radius:999px;padding:8px 12px;white-space:nowrap}.score-now{background:#fff3c9;color:#21422f;border:2px solid #574025}
    .track{height:16px;border:3px solid #4e321f;border-radius:999px;background:#c5aa69;overflow:hidden}.track i{display:block;height:100%;background:linear-gradient(90deg,#6acb54,#f5d54c);transition:.35s width}
    .game-grid{display:grid;grid-template-columns:minmax(430px,1.13fr) minmax(390px,.87fr);gap:18px;min-height:610px}
    .task-panel{min-width:0;background:#fff9dc;border:4px solid #624024;border-radius:20px;padding:19px;box-shadow:inset 0 0 0 4px #e5c46b;display:grid;grid-template-rows:auto auto minmax(225px,1fr) auto;gap:11px}
    .task-head{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;font-weight:1000;text-transform:uppercase;color:#326344}
    .zone{padding:5px 9px;border-radius:8px;background:#dff0b9;border:1px solid #659049}
    .task-text{background:linear-gradient(100deg,#e5c677,#fff8d6 9% 91%,#d9b45a);border:3px solid #7a4d24;border-radius:11px;padding:15px 19px;font-size:clamp(17px,1.7vw,23px);font-weight:1000;line-height:1.3;text-align:center}
    .drawing{min-height:225px;border:2px solid #ac8953;border-radius:15px;background:#fffef6;overflow:hidden;display:grid;place-items:center}
    .drawing svg{width:100%;height:100%;max-height:290px;display:block}.drawing .hot{stroke:#dd4e3e;stroke-width:6;fill:none}.drawing .edge{stroke:#254d39;stroke-width:5;fill:#9dd67625}.drawing .aux{stroke:#268fab;stroke-width:4;stroke-dasharray:9 7;fill:none}.drawing text{font:900 18px Trebuchet MS,system-ui;fill:#183326}.drawing .pulse{animation:pulseLine 1.4s ease-in-out infinite}
    .mission{font-size:14px;font-weight:900;text-align:center;color:#56462f}.mission b{color:#9d322b}
    .pack-panel{position:relative;border:4px solid #4e311d;border-radius:20px;overflow:hidden;background:linear-gradient(#7fc177 0 48%,#916039 49% 100%);box-shadow:inset 0 0 0 5px #d6ad56;min-height:610px;padding:18px}
    .pack-panel:before{content:"";position:absolute;left:0;right:0;bottom:0;height:43%;background:repeating-linear-gradient(90deg,#87522f 0 58px,#6d3e25 59px 62px);opacity:.7}
    .canopy{position:absolute;left:-4%;right:-4%;top:-22px;height:105px;background:radial-gradient(ellipse at 15% 50%,#1a6937 0 27%,transparent 29%),radial-gradient(ellipse at 48% 35%,#297d3e 0 30%,transparent 32%),radial-gradient(ellipse at 81% 50%,#155b31 0 30%,transparent 32%)}
    .pack-panel .penguin{--ps:.82;position:absolute;left:13px;bottom:53px;transform-origin:left bottom}
    .pack-panel .penguin.wrong{animation:penguinWrong .7s ease}.pack-panel .penguin.right{animation:penguinRight .7s ease}
    .speech{position:absolute;left:15px;right:15px;top:72px;background:#fffbe1;border:3px solid #4d321f;border-radius:16px;padding:10px 12px;text-align:center;font-size:13px;font-weight:1000;box-shadow:0 7px 0 #4d321f;z-index:7}
    .speech:after{content:"";position:absolute;left:70px;bottom:-16px;border:9px solid transparent;border-top-color:#4d321f}
    .backpack{
      position:absolute;right:24px;bottom:65px;width:205px;height:245px;border-radius:58px 58px 34px 34px;
      background:linear-gradient(90deg,#613520,#a8642d 16% 84%,#613520);border:7px solid #3e271b;box-shadow:0 12px 0 #2c1b13;z-index:5;
      transition:.2s transform,.2s box-shadow
    }
    .backpack:before{content:"";position:absolute;left:37px;right:37px;top:-48px;height:70px;border:12px solid #3d291c;border-bottom:0;border-radius:50px 50px 0 0}
    .backpack:after{content:"ФОРМУЛЫ";position:absolute;left:19px;right:19px;bottom:24px;border-radius:16px;background:#d9a144;border:4px solid #54351f;padding:11px 5px;text-align:center;color:#3d2416;font-weight:1000;letter-spacing:.06em}
    .backpack.over{transform:scale(1.04);box-shadow:0 12px 0 #2c1b13,0 0 35px #f5e65c}
    .slots{position:absolute;left:16px;right:16px;top:38px;display:grid;gap:7px}
    .slot{height:43px;border:3px dashed #e4bd78;border-radius:10px;background:#2c1a1166;color:#fbe3a0;display:grid;place-items:center;font-size:12px;font-weight:1000;text-align:center;padding:3px}.slot.filled{border-style:solid;background:#f3d479;color:#392417}
    .options{position:absolute;left:14px;right:14px;top:158px;display:grid;grid-template-columns:1fr 1fr;gap:9px;z-index:8}
    .formula-card{min-height:78px;border:3px solid #4e321f;border-radius:13px;background:linear-gradient(105deg,#eff5ce,#fff9df);box-shadow:0 6px 0 #4d311e;padding:8px;color:#173b2a;font-weight:1000;line-height:1.13;font-size:12px;touch-action:manipulation;transition:.18s transform,.18s filter}
    .formula-card span{display:block;margin-top:5px;color:#9a3a2d;font-size:14px}.formula-card:hover:not(:disabled){transform:translateY(-3px);filter:brightness(1.04)}.formula-card:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 #4d311e}.formula-card.wrong{animation:cardWrong .55s;background:#ffd9c8}.formula-card.packed{animation:flyPack .48s ease forwards}
    .explain{position:absolute;inset:68px 18px 24px;background:#fff8d9;border:4px solid #5e3b22;border-radius:18px;padding:22px;z-index:12;display:none;align-content:center;text-align:center;box-shadow:0 16px 45px #13271999}.explain.show{display:grid;animation:pop .35s ease}.explain h2{font-size:28px;margin:7px}.explain p{line-height:1.45}.route-list{text-align:left;background:#fff;border:2px solid #c29a54;border-radius:12px;padding:11px 13px;margin:8px 0;font-size:13px}.route-list div+div{margin-top:7px}.next{margin-top:8px}
    .leaves{display:grid;grid-template-columns:repeat(20,1fr);gap:5px;margin:0 8px}.leaf{height:12px;border-radius:100% 0 100% 0;background:#aa9760;border:1px solid #4d3b25;transform:rotate(-8deg);transition:.3s}.leaf.current{background:#ffe25b;box-shadow:0 0 10px #ffd73e}.leaf.good{background:#51c966}.leaf.bad{background:#d95343}
    .final{text-align:center}.score-ring{width:190px;height:190px;border-radius:50%;display:grid;place-items:center;margin:16px auto;border:5px solid #4e301e;box-shadow:0 9px 0 #4e301e;position:relative}.score-ring:before{content:"";position:absolute;inset:22px;border-radius:50%;background:#fff5cf;border:3px solid #65452b}.score-ring b{position:relative;font-size:47px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0}.stat{padding:11px;border:2px solid #8f6638;background:#fff9;border-radius:12px}.stat b{display:block;font-size:22px;margin-top:4px}.save-status{min-height:24px;margin:13px 0;font-weight:1000}.save-status.ok{color:#08734f}.save-status.bad{color:#a3382e}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
    .final-scene{position:relative;min-height:540px;display:grid;place-items:center}.final-scene .penguin{--ps:1.25}.final-scene .backpack{right:5%;bottom:35px;transform:scale(.72)}
    @keyframes mist{to{background-position:220px 0}}
    @keyframes sunPulse{50%{transform:scale(1.05);filter:brightness(1.08)}}
    @keyframes bob{50%{translate:0 -6px}}
    @keyframes lionLook{25%{transform:rotate(-4deg)}65%{transform:rotate(5deg)}}
    @keyframes lionWave{0%,100%{transform:rotate(-8deg)}45%,65%{transform:rotate(-72deg)}55%{transform:rotate(-50deg)}}
    @keyframes smileTalk{50%{height:14px;border-radius:0 0 50% 50%;background:#6b2f25}}
    @keyframes zebraDance{0%,100%{transform:translateY(0) rotate(-2deg)}25%{transform:translateY(-8px) rotate(5deg)}50%{transform:translateY(0) rotate(2deg)}75%{transform:translateY(-8px) rotate(-5deg)}}
    @keyframes hoofL{25%{transform:rotate(24deg)}75%{transform:rotate(-12deg)}}@keyframes hoofR{25%{transform:rotate(-12deg)}75%{transform:rotate(24deg)}}
    @keyframes tailSwing{50%{transform:rotate(-35deg)}}
    @keyframes giraffeLook{25%{transform:translateX(-6px) rotate(-5deg)}70%{transform:translateX(7px) rotate(6deg)}}@keyframes neckSway{50%{transform:skewX(3deg)}}
    @keyframes hippoBounce{0%,100%{transform:translateY(0) scaleY(1)}45%{transform:translateY(-10px) scaleY(1.03)}65%{transform:translateY(3px) scaleY(.97)}}@keyframes hippoClap{45%{transform:rotate(38deg)}65%{transform:rotate(-20deg)}}@keyframes hippoLaugh{50%{height:17px;background:#6b3347;border-radius:0 0 50% 50%}}
    @keyframes penguinIdle{0%,100%{transform:scale(var(--ps)) translateY(0) rotate(-1deg)}50%{transform:scale(var(--ps)) translateY(-7px) rotate(2deg)}}
    @keyframes flipperL{0%,100%{transform:rotate(20deg)}45%{transform:rotate(55deg)}60%{transform:rotate(38deg)}}@keyframes flipperR{0%,100%{transform:rotate(-25deg)}45%{transform:rotate(-58deg)}60%{transform:rotate(-40deg)}}@keyframes penguinBlink{0%,45%,49%,100%{transform:scaleY(1)}47%{transform:scaleY(.08)}}
    @keyframes pulseLine{50%{filter:drop-shadow(0 0 6px #e7c239);opacity:.63}}
    @keyframes penguinWrong{20%{transform:scale(.82) rotate(-10deg)}50%{transform:scale(.82) translateY(15px) rotate(11deg)}80%{transform:scale(.82) rotate(-4deg)}}
    @keyframes penguinRight{30%{transform:scale(.82) translateY(-24px) rotate(-5deg)}70%{transform:scale(.82) rotate(7deg)}}
    @keyframes cardWrong{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

    return `<svg viewBox="0 0 390 245" role="img" aria-label="Треугольник с высотами BD и CE"><path class="edge" d="M55 205H330L205 35Z"/><path class="aux pulse" d="M330 205L175 69M205 35V205"/><path class="hot" d="M169 73l8 8M197 197h8v8"/><circle cx="175" cy="69" r="4" fill="#dd4e3e"/><circle cx="205" cy="205" r="4" fill="#dd4e3e"/><text x="158" y="62">D</text><text x="211" y="225">E</text><circle cx="198" cy="101" r="7" fill="#dd4e3e"/><text x="208" y="99">O</text><path class="hot" d="M70 194A31 31 0 0 1 82 176"/><text x="78" y="168" fill="#b72f28">∠A = ${angle}°</text><text x="188" y="28">C</text><text x="28" y="225">A</text><text x="334" y="225">B</text></svg>`

    }

    }
    if(d.kind==='paraMid'){
      return `<svg viewBox="0 0 390 245" role="img" aria-label="Параллелограмм ABCD, H — середина AB"><path class="edge" d="M45 205H290L345 45H100Z"/><circle cx="168" cy="205" r="6" fill="#dd4e3e"/><path class="hot pulse" d="M168 205L345 45"/><path class="hot" d="M103 198v14M229 198v14"/><text x="158" y="231">H</text><text x="104" y="188" fill="#b72f28">AH = HB</text><text x="30" y="226">A</text><text x="294" y="226">B</text><text x="350" y="42">C</text><text x="88" y="38">D</text></svg>`

    }
    return triangleSvg(d)
  }
  function draw(t){

    let C=even(42,118);list.push({c:1,title:'Равнобедренный треугольник',text:`В треугольнике ABC стороны AC и BC равны, угол C равен ${C}°. Найдите угол A.`,seq:['triangleSum','isoAngles'],why:'Сначала находим сумму двух углов при основании, затем делим её пополам, потому что эти углы равны.',fig:{type:'tri',equal:true,labels:{C:C+'°'}}});
    C=ri(75,115);let half=ri(8,Math.min(28,Math.floor((169-C)/2)));list.push({c:1,title:'Биссектриса',text:`В треугольнике ABC отрезок AD — биссектриса, угол C равен ${C}°, угол CAD равен ${half}°. Найдите угол B.`,seq:['bisector','triangleSum'],why:'Биссектриса удваивает известную половину угла A, а затем применяется сумма углов треугольника.',fig:{type:'tri',line:'bisectorA',bisectorHalf:half,labels:{C:C+'°'}}});
    let ext=ri(101,149);list.push({c:1,title:'Внешний угол',text:`В треугольнике ABC стороны AC и BC равны. Внешний угол при вершине B равен ${ext}°. Найдите угол C.`,seq:['exterior','isoAngles','triangleSum'],why:'Внешний угол связывает A и C, равные стороны дают A=B, а сумма внутренних углов завершает цепочку.',fig:{type:'tri',equal:true,external:ext}});
    let B=ri(22,68);list.push({c:1,title:'Медиана к гипотенузе',text:`В прямоугольном треугольнике ABC угол C равен 90°, угол B равен ${B}°. CD — медиана к гипотенузе AB. Найдите угол ACD.`,seq:['rightAcute','hypMedian','isoAngles'],why:'Медиана к гипотенузе создаёт равнобедренный треугольник: CD=AD. Его углы при основании и вершине C связываются с острыми углами исходного треугольника.',fig:{type:'tri',right:true,line:'medianD',labels:{B:B+'°'}}});
    let A=ri(56,79);B=90-A;list.push({c:1,title:'Высота и медиана',text:`Острые углы прямоугольного треугольника равны ${A}° и ${B}°. Найдите угол между высотой CH и медианой CM, проведёнными из вершины прямого угла C.`,seq:['rightAltitude','hypMedian','isoAngles'],why:'Высота и медиана создают два угла, равные острым углам исходного треугольника. Искомый угол получается как их разность.',fig:{type:'tri',right:true,line:'heightMedian',labels:{A:A+'°',B:B+'°'}}});
    B=ri(18,38);list.push({c:1,title:'Высота и медиана',text:`Острый угол B прямоугольного треугольника ABC равен ${B}°. Найдите угол между высотой CH и медианой CM из вершины прямого угла C.`,seq:['rightAcute','rightAltitude','hypMedian'],why:'Сначала восстанавливаем второй острый угол. Высота и медиана откладывают от катета углы, связанные с двумя острыми углами.',fig:{type:'tri',right:true,line:'heightMedian',labels:{B:B+'°'}}});
    let d=ri(7,24);list.push({c:1,title:'Высота и биссектриса',text:`Угол между высотой CH и биссектрисой CD, проведёнными из вершины прямого угла C, равен ${d}°. Найдите меньший острый угол треугольника.`,seq:['rightBisector','rightAltitude'],why:'Биссектриса прямого угла образует 45°, а высота откладывает один из острых углов. Их разность дана в условии.',fig:{type:'tri',right:true,line:'heightBisector',betweenAngle:d,betweenLabel:'∠HCD'}});
    d=ri(7,24);list.push({c:1,title:'Биссектриса и медиана',text:`Угол между биссектрисой CD и медианой CM прямоугольного треугольника, проведёнными из вершины прямого угла C, равен ${d}°. Найдите меньший острый угол.`,seq:['rightBisector','hypMedian','isoAngles'],why:'Биссектриса задаёт направление 45°, а медиана к гипотенузе создаёт равнобедренный треугольник.',fig:{type:'tri',right:true,line:'bisectorMedian',betweenAngle:d,betweenLabel:'∠DCM'}});
    B=ri(12,39);list.push({c:1,title:'Биссектриса и медиана',text:`Острый угол B прямоугольного треугольника ABC равен ${B}°. Найдите угол между биссектрисой CD и медианой CM из вершины прямого угла C.`,seq:['rightBisector','hypMedian','isoAngles'],why:'Направление биссектрисы известно сразу, а направление медианы определяется через равнобедренный треугольник у середины гипотенузы.',fig:{type:'tri',right:true,line:'bisectorMedian',labels:{B:B+'°'}}});

    d=even(24,78);list.push({c:2,title:'Углы параллелограмма',text:`Один угол параллелограмма больше другого на ${d}°. Найдите больший угол.`,seq:['paraAngles'],why:'Соседние углы параллелограмма в сумме дают 180°. Вместе с известной разностью это определяет оба угла.',fig:{type:'quad',kind:'para',diff:d}});
    A=even(104,158);list.push({c:2,title:'Диагональ ромба',text:`В ромбе ABCD угол DAB равен ${A}°. Найдите угол BDC.`,seq:['paraAngles','rhombusDiag'],why:'Сначала восстанавливается соседний угол ромба как угол параллелограмма, затем диагональ делит его пополам.',fig:{type:'quad',kind:'rhomb',angle:A,angleAt:'A'}});
    C=even(36,92);list.push({c:2,title:'Диагональ ромба',text:`В ромбе ABCD угол BCD равен ${C}°. Найдите угол DBA.`,seq:['paraAngles','rhombusDiag'],why:'Ромб является параллелограммом, поэтому находим угол B, а диагональ BD делит его пополам.',fig:{type:'quad',kind:'rhomb',angle:C,angleAt:'C'}});
    A=ri(36,78);list.push({c:2,title:'Ортоцентр',text:`В остроугольном треугольнике ABC угол A равен ${A}°. Высоты BD и CE пересекаются в точке O. Найдите угол DOE.`,seq:['orthocenter'],why:'Угол при пересечении высот является дополнительным к третьему углу треугольника.',fig:{type:'center',kind:'orthocenter',angle:A}});
    C=even(40,100);list.push({c:2,title:'Центр вписанной окружности',text:`В треугольнике ABC угол C равен ${C}°. Биссектрисы AD и BE пересекаются в точке O. Найдите угол AOB.`,seq:['incenter'],why:'Для точки пересечения внутренних биссектрис используется готовое свойство: 90° плюс половина третьего угла.',fig:{type:'center',kind:'incenter',angle:C}});

    let k=ri(12,45);list.push({c:3,title:'Равносторонний треугольник',text:`В равностороннем треугольнике ABC высота CH равна ${k}√3. Найдите сторону AB.`,seq:['equilateral'],why:'Высота равностороннего треугольника выражается через сторону формулой h=a√3/2.',fig:{type:'area',kind:'equilateral',h:k+'√3'}});
    a=ri(7,16);let big=2*a,h=even(10,30);list.push({c:3,title:'Высоты параллелограмма',text:`Стороны параллелограмма равны ${a} и ${big}. Высота к меньшей стороне равна ${h}. Найдите высоту к большей стороне.`,seq:['paraArea','sameArea'],why:'Площадь одного параллелограмма записывается через каждое основание и соответствующую высоту. Эти произведения равны.',fig:{type:'area',kind:'para',a:a,h:h,b:big}});
    k=ri(6,11);a=3*k;big=4*k;let n=ri(3,k-1);h=3*n;list.push({c:3,title:'Высоты треугольника',text:`Две стороны треугольника равны ${a} и ${big}. Высота к большей стороне равна ${h}. Найдите высоту к меньшей стороне.`,seq:['triArea','sameArea'],why:'Одна и та же площадь выражается через две пары «основание — соответствующая высота».',fig:{type:'area',kind:'triangleHeights',base:big,h:h,side:a}});
    let S=4*ri(18,42);list.push({c:3,title:'Часть площади',text:`Площадь параллелограмма ABCD равна ${S}. Точка H — середина стороны AB. Найдите площадь трапеции AHCD.`,seq:['areaRatio','subtractArea'],why:'Треугольник HBC и параллелограмм имеют общую высоту. Середина стороны задаёт отношение оснований, после чего площадь треугольника вычитается из площади параллелограмма.',fig:{type:'area',kind:'paraMid'}});
    let side=ri(8,22),angle=pick([30,60,90,120]);list.push({c:3,title:'Площадь через синус',text:`Угол при вершине равнобедренного треугольника равен ${angle}°, боковая сторона равна ${side}. Найдите площадь треугольника.`,seq:['sineArea'],why:'Даны две стороны и угол именно между ними — это прямой сигнал использовать формулу площади через синус.',fig:{type:'area',kind:'isoscelesSine',side,angle}});

  }

  function playerKey(id){return 'p_'+String(id).replace(/[^a-zA-Z0-9_-]/g,'_')}
  function totalForLimit(limit){return Number(limit)===2?20:10}
  function questionFor(task,stepIndex=0,mistake=false){return{stepIndex,taskHadMistake:!!mistake,resolved:false,optionIds:buildOptionIds(task,stepIndex),wrongIds:[],lastChoice:'',lastCorrect:null,updatedAtMs:Date.now()}}
  function buildOptionIds(task,step){if(!task||!task.seq?.length)return[];const correct=task.seq[step],exclude=new Set(task.seq),pool=Object.keys(F).filter(id=>id!==correct&&!exclude.has(id));return shuffle([correct,...shuffle(pool).slice(0,3)])}
  function newGameState(studentLimit=1){const limit=Number(studentLimit)===2?2:1,deck=makeTasks().slice(0,totalForLimit(limit));return{version:1,schemaVersion:SCHEMA_VERSION,boardEpoch:0,strokes:{},ui:{screen:'lobby'},game:{status:'lobby',studentLimit:limit,players:{},playerOrder:[],deck,index:0,turnKey:'',stats:{},attempts:{},question:{stepIndex:0,taskHadMistake:false,resolved:false,optionIds:[],wrongIds:[]},eventIds:{},submissions:{},sessionId:uuid(),startedAt:0,finishedAt:0,endedEarly:false}}}
  function normalizeState(s){if(!s||typeof s!=='object')return null;s.version=Number(s.version||1);s.schemaVersion=Number(s.schemaVersion||SCHEMA_VERSION);s.boardEpoch=Number(s.boardEpoch||0);s.strokes=s.strokes||{};s.ui=s.ui||{screen:'lobby'};s.game=s.game||{};const g=s.game;g.players=g.players||{};g.playerOrder=Array.isArray(g.playerOrder)?g.playerOrder:[];g.stats=g.stats||{};g.attempts=g.attempts||{};g.eventIds=g.eventIds||{};g.submissions=g.submissions||{};g.deck=Array.isArray(g.deck)?g.deck:[];g.question=g.question||{stepIndex:0,taskHadMistake:false,resolved:false,optionIds:[],wrongIds:[]};g.question.wrongIds=Array.isArray(g.question.wrongIds)?g.question.wrongIds:[];return s}
  function localDate(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  function savedStudent(){
    try{const app=JSON.parse(localStorage.getItem(STUDENT_SAVE_KEY)||'null'),realId=String(app?.studentId||localStorage.getItem('egeStudentId')||'').trim(),name=String(app?.name||localStorage.getItem('egeStudentName')||'').trim(),code=String(app?.code||localStorage.getItem('egeStudentCode')||'').trim();if(realId&&name&&code&&!/^Ученик(?:\s+\d+)?$/i.test(name))return{studentId:code,verifiedStudentId:realId,name,code,verified:true};if(code)return{studentId:code,verifiedStudentId:'',name:'Ученик',code,verified:false}}catch(_){}const realId=String(localStorage.getItem('egeStudentId')||'').trim(),name=String(localStorage.getItem('egeStudentName')||'').trim(),code=String(localStorage.getItem('egeStudentCode')||'').trim();if(realId&&name&&code&&!/^Ученик(?:\s+\d+)?$/i.test(name))return{studentId:code,verifiedStudentId:realId,name,code,verified:true};return code?{studentId:code,verifiedStudentId:'',name:'Ученик',code,verified:false}:null}
  function saveStudent(s){const code=String(s?.code||'').trim(),name=String(s?.name||'').trim(),realId=String(s?.verifiedStudentId||'').trim();if(!code||!name||!realId||/^Ученик(?:\s+\d+)?$/i.test(name))return false;localStorage.setItem('egeStudentId',realId);localStorage.setItem('egeStudentName',name);localStorage.setItem('egeStudentCode',code);localStorage.setItem(STUDENT_SAVE_KEY,JSON.stringify({studentId:realId,name,code}));currentStudent=s;return true}
  function clearStudent(){['egeStudentId','egeStudentName','egeStudentCode',STUDENT_SAVE_KEY].forEach(k=>localStorage.removeItem(k));currentStudent=null}
  function parseStudent(data,code){const src=(data&&(data.student||data.data||data.result))||data||{},studentId=src.studentId??src.id??data?.studentId,name=src.studentName??src.name??src.fullName??data?.studentName??data?.name,bad=data&&(data.success===false||data.valid===false||data.ok===false);if(bad||studentId===undefined||studentId===null||studentId===''){const e=new Error((data&&(data.message||data.error))||'Личный код не найден');e.terminal=true;throw e}return{studentId:String(studentId),name:String(name||'Ученик'),code:String(code)}}
  function validateStudent(code){return new Promise((resolve,reject)=>{const cb='egePenguin_'+Date.now()+'_'+Math.random().toString(36).slice(2),s=document.createElement('script');let done=false;const timer=setTimeout(()=>finish(Object.assign(new Error('Сервер не ответил'),{transient:true})),60000);function clean(){clearTimeout(timer);try{delete window[cb]}catch(_){window[cb]=undefined}s.remove()}function finish(err,val){if(done)return;done=true;clean();err?reject(err):resolve(val)}window[cb]=data=>{try{finish(null,parseStudent(data,code))}catch(e){finish(e)}};s.onerror=()=>finish(Object.assign(new Error('Сервер не ответил'),{transient:true}));s.async=true;s.src=API_URL+'?'+new URLSearchParams({action:'validateStudent',code,callback:cb,_:Date.now()}).toString();document.head.appendChild(s)})}

  async function createFreshSession(limit){
    const state=newGameState(limit),fresh={meta:{sessionId:state.game.sessionId,appId:APP_ID,schemaVersion:SCHEMA_VERSION,openedAt:Date.now()},state,pads:{},interactions:{},members:{},messages:{}};

    stopWaitingForTeacher();
    [sessionUnsub,membersUnsub,cursorUnsub,connectionUnsub].forEach(fn=>{try{fn&&fn()}catch(_){}});sessionUnsub=membersUnsub=cursorUnsub=connectionUnsub=null;
    latestState=state;membersSnapshot={};sessionCreationStatus='создаём занятие…';
    closeModal();showConnectedPanel();$('boardToolbar').classList.remove('hidden');renderSharedState(true);
    // По инструкции: без чтения старой игры, одна атомарная запись currentSession.
    // Чистое лобби уже отрисовано локально. Сначала создаём ВЕСЬ currentSession
    // одним set(); только после подтверждения запускаем listeners/presence.

    // частичную сессию до корневой атомарной записи.
    const finishCreate=async()=>{
      if(run!==creationRun||participantRole!=='teacher')return false;
      latestState=state;sessionCreationStatus='';
      subscribeConnection();subscribeMembers();subscribeSession();subscribeTeacherCursor();
      await registerPresence().catch(()=>{});
      renderParticipants();
      return true;
    };

    try{
      await atomicWrite();
      await finishCreate();

        await new Promise(r=>setTimeout(r,2500));
        try{await atomicWrite();await finishCreate();return}catch(_err){}
      }
    }
  }

  async function clearBoard(){if(participantRole!=='teacher')return;await runTransaction(stateRef(),current=>{const state=normalizeState(current);if(!state)return;state.boardEpoch++;state.strokes={};state.version++;return state})}
  function initBoardToolbar(){document.querySelectorAll('[data-board-tool]').forEach(b=>b.addEventListener('click',()=>{boardTool=b.dataset.boardTool;document.querySelectorAll('[data-board-tool]').forEach(x=>x.classList.toggle('active',x===b));renderBoard()}));$('clearBoardBtn').addEventListener('click',clearBoard);$('boardCollapseBtn').addEventListener('click',()=>{$('boardToolbar').classList.toggle('collapsed');$('boardCollapseBtn').textContent=$('boardToolbar').classList.contains('collapsed')?'+':'−'});const saved=(()=>{try{return JSON.parse(localStorage.getItem(TOOLBAR_POSITION_KEY)||'null')}catch(_){return null}})();if(saved){$('boardToolbar').style.left=saved.left+'px';$('boardToolbar').style.top=saved.top+'px';$('boardToolbar').style.bottom='auto'}$('boardDragHandle').addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;const tb=$('boardToolbar'),r=tb.getBoundingClientRect();toolbarDrag={dx:e.clientX-r.left,dy:e.clientY-r.top,id:e.pointerId};$('boardDragHandle').setPointerCapture(e.pointerId)});$('boardDragHandle').addEventListener('pointermove',e=>{if(!toolbarDrag)return;const tb=$('boardToolbar'),x=Math.max(0,Math.min(innerWidth-tb.offsetWidth,e.clientX-toolbarDrag.dx)),y=Math.max(0,Math.min(innerHeight-tb.offsetHeight,e.clientY-toolbarDrag.dy));tb.style.left=x+'px';tb.style.top=y+'px';tb.style.bottom='auto'});$('boardDragHandle').addEventListener('pointerup',()=>{if(!toolbarDrag)return;toolbarDrag=null;const r=$('boardToolbar').getBoundingClientRect();localStorage.setItem(TOOLBAR_POSITION_KEY,JSON.stringify({left:r.left,top:r.top}))})}
  function initTeacherCursorForCurrentScreen(){const game=document.querySelector('.game[data-board-anchor]');if(!game)return;game.addEventListener('pointermove',e=>{if(participantRole!=='teacher'||!latestState||latestState.game.status!=='playing'||boardTool!=='cursor')return;const now=Date.now();if(now-cursorLastSent<75)return;cursorLastSent=now;const r=game.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;set(ref(database,`${lessonRoot()}/messages/teacherCursor`),{anchorId:'game-screen',x:Math.max(0,Math.min(1,x)),y:Math.max(0,Math.min(1,y)),at:now}).catch(()=>{})})}

  function sound(type){if(muted||!type)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ac=sound.ac||(sound.ac=new AC()),now=ac.currentTime,g=ac.createGain(),sets={start:[[180,.15],[360,.3]],good:[[430,.13],[720,.28]],bad:[[170,.18],[80,.34]],finish:[[300,.16],[450,.3],[680,.55]]},set=sets[type]||sets.good;g.connect(ac.destination);g.gain.setValueAtTime(.045,now);g.gain.exponentialRampToValueAtTime(.0001,now+set[set.length-1][1]+.1);set.forEach(([f,d],i)=>{const o=ac.createOscillator();o.type=type==='bad'?'sawtooth':'triangle';o.frequency.setValueAtTime(f,now+i*.04);o.connect(g);o.start(now+i*.04);o.stop(now+d+.1)})}catch(_){}}
  async function switchStudent(){if(latestState?.game?.status==='playing')return;const oldKey=currentViewerKey();if(participantRole==='student'&&oldKey&&latestState?.game?.status==='lobby'){try{await runTransaction(stateRef(),current=>{const state=normalizeState(current);if(!state||state.game.status!=='lobby'||!state.game.players[oldKey])return state;delete state.game.players[oldKey];delete state.game.stats[oldKey];delete state.game.attempts[oldKey];delete state.game.eventIds[oldKey];delete state.game.submissions[oldKey];state.game.playerOrder=Object.entries(state.game.players).sort((a,b)=>Number(a[1].slot)-Number(b[1].slot)).map(([k])=>k);state.version++;return state})}catch(_){}}await disconnectParticipant();clearStudent();showStudentCodeForm()}

  $('lessonLauncher').addEventListener('click',showRoleChoice);$('leaveSessionBtn').addEventListener('click',disconnectParticipant);$('newSessionBtn').addEventListener('click',showModeChoice);$('finishEarlyBtn').addEventListener('click',finishEarly);$('switchStudentBtn').addEventListener('click',switchStudent);$('switchBtn').addEventListener('click',switchStudent);$('soundBtn').addEventListener('click',()=>{muted=!muted;$('soundBtn').textContent=muted?'🔇':'🔊'});$('lessonModal').addEventListener('pointerdown',e=>{if(e.target===$('lessonModal'))closeModal()});addEventListener('online',()=>{unloadHandled=false;flushPending()});addEventListener('pagehide',unloadSubmit);addEventListener('beforeunload',unloadSubmit);initBoardToolbar();renderLanding();currentStudent=savedStudent();
  setInterval(()=>flushPending().catch(()=>{}),60000);
  </script>
