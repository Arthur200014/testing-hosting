<body>
  <header class="top"><div class="brand"><span class="brand-logo">🐧</span><span>ПЕРЕПРАВА ПИНГВИНОВ · ПРОТОТИПЫ 1–2</span></div><div class="student" id="studentBox"><span>Ученик: <b id="studentName"></b></span><button class="tiny" id="switchBtn">Сменить ученика</button><button class="tiny sound" id="soundBtn">🔊</button></div></header>
  <main id="app"></main>
  <script>
  'use strict';
  const API_URL='https://script.google.com/macros/s/AKfycbw6iYfojO8VgkHU63peD2vWLybGyDm9AsYZ6TaLA_EFD4j56nQlY5SqpRANPVeTwVsj/exec';
  const TEST_META={testId:'EGE-01-MADAGASCAR-PENGUIN-BRIDGE-PROTOTYPES-1-2',topicId:'task-01',topicName:'Планиметрия: прототипы 1–2',taskNumber:1,schemaVersion:1};
  const TOTAL=20,PENDING_KEY='egePendingTestResults',$=id=>document.getElementById(id);
  let student=null,deck=[],index=0,firstTryCorrect=0,questionAttempted=false,startedAt=0,attemptEventId='',resultSubmitted=false,gameActive=false,muted=false;
  const facts=[
    ['triangle-sum','I. Треугольники',true,'Сумма внутренних углов любого треугольника равна 180°.','∠A + ∠B + ∠C = 180°','Это свойство выполняется для любого треугольника.','tri'],
    ['triangle-sum','I. Треугольники',false,'Сумма внутренних углов любого треугольника равна 360°.','∠A + ∠B + ∠C = 180°','360° — сумма углов четырёхугольника, а не треугольника.','tri'],
    ['iso-base','I. Треугольники',true,'В равнобедренном треугольнике углы при основании равны.','AC = BC ⇒ ∠A = ∠B','Равным сторонам противолежат равные углы.','iso'],
    ['iso-base','I. Треугольники',false,'В любом равнобедренном треугольнике все три угла равны.','AC = BC ⇒ ∠A = ∠B','Все три угла равны только в равностороннем треугольнике.','iso'],
    ['exterior','I. Треугольники',true,'Внешний угол треугольника равен сумме двух внутренних углов, не смежных с ним.','∠внеш = ∠A + ∠C','Внешний угол и смежный внутренний дают 180°.','exterior'],
    ['exterior','I. Треугольники',false,'Внешний угол треугольника равен сумме двух внутренних углов, один из которых смежен с ним.','∠внеш = сумма двух несмежных внутренних углов','Смежный с внешним внутренний угол в эту сумму не входит.','exterior'],
    ['bisector','I. Треугольники',true,'Биссектриса делит угол на две равные части.','∠BAD = ∠DAC','Это определение биссектрисы угла.','bisector'],
    ['bisector','I. Треугольники',false,'Биссектриса треугольника всегда делит противоположную сторону пополам.','BD/DC = AB/AC','Пополам сторону делит медиана; биссектриса делит её в отношении прилежащих сторон.','bisector'],
    ['median-hyp','I. Прямоугольный треугольник',true,'Медиана к гипотенузе равна половине гипотенузы.','CM = AB/2','Середина гипотенузы равноудалена от всех трёх вершин.','rightMedian'],
    ['median-hyp','I. Прямоугольный треугольник',false,'Медиана к гипотенузе равна всей гипотенузе.','CM = AB/2','Медиана равна радиусу описанной окружности, то есть половине гипотенузы.','rightMedian'],
    ['alt-sim','I. Прямоугольный треугольник',true,'Высота, проведённая к гипотенузе, образует два треугольника, подобных исходному.','△ACH ∼ △CBH ∼ △ABC','Равенство острых углов даёт подобие по двум углам.','rightAltitude'],
    ['alt-sim','I. Прямоугольный треугольник',false,'Высота к гипотенузе всегда разбивает прямоугольный треугольник на два равных треугольника.','Полученные треугольники подобны, но не обязаны быть равны','Равенство появляется только в частном равнобедренном случае.','rightAltitude'],
    ['orthocenter','II. Замечательные точки',true,'Если высоты треугольника пересекаются в H, то ∠BHC = 180° − ∠A.','∠BHC = 180° − ∠A','BH ⟂ AC и CH ⟂ AB, поэтому углы являются дополнительными.','orthocenter'],
    ['orthocenter','II. Замечательные точки',false,'Если высоты треугольника пересекаются в H, то ∠BHC всегда равен ∠A.','∠BHC = 180° − ∠A','Эти углы не равны вообще; их сумма равна 180°.','orthocenter'],
    ['incenter','II. Замечательные точки',true,'Если биссектрисы пересекаются в I, то ∠AIB = 90° + ∠C/2.','∠AIB = 90° + ½∠C','В треугольнике AIB углы при A и B равны половинам исходных.','incenter'],
    ['incenter','II. Замечательные точки',false,'Если биссектрисы пересекаются в I, то ∠AIB = 90° − ∠C/2.','∠AIB = 90° + ½∠C','Для внутреннего центра используется знак «плюс».','incenter'],
    ['para-angles','II. Четырёхугольники',true,'В параллелограмме противоположные углы равны, а соседние в сумме дают 180°.','∠A = ∠C;  ∠A + ∠B = 180°','Это следует из параллельности противоположных сторон.','parallelogram'],
    ['para-angles','II. Четырёхугольники',false,'В любом параллелограмме соседние углы равны.','∠A + ∠B = 180°','Соседние углы равны только в прямоугольнике и квадрате.','parallelogram'],
    ['rhombus','II. Четырёхугольники',true,'Диагонали ромба перпендикулярны и делят его углы пополам.','AC ⟂ BD; диагонали — биссектрисы','Обе характеристики используются в задачах на углы ромба.','rhombus'],
    ['rhombus','II. Четырёхугольники',false,'Диагонали любого ромба равны.','AC ⟂ BD, но обычно AC ≠ BD','Равные диагонали у ромба появляются только тогда, когда он является квадратом.','rhombus']
  ].map(([id,chapter,truth,text,formula,explain,diagram])=>({id,chapter,truth,text,formula,explain,diagram}));
  function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
  const svg=b=>`<svg viewBox="0 0 390 300" role="img" aria-label="Точный геометрический чертёж">${b}</svg>`;
  const labels=a=>a.map(([x,y,t])=>`<text x="${x}" y="${y}">${t}</text>`).join('');
  function diagram(k){
    const tri=`<path class="shape" d="M62 244L326 244L208 48Z"/>${labels([[45,264,'A'],[331,264,'B'],[202,38,'C']])}`;
    const right=`<path class="shape" d="M76 246L324 246L76 55Z"/><path class="right" d="M76 226H96V246"/>${labels([[57,266,'C'],[330,266,'B'],[57,48,'A']])}`;
    if(k==='tri')return svg(tri+`<path class="aux" d="M197 231A29 29 0 0 1 221 231"/>`);
    if(k==='iso'||k==='isoAltitude')return svg(`<path class="shape" d="M62 244L326 244L194 47Z"/><path class="equal" d="M118 157l12 7M270 157l-12 7"/>${k==='isoAltitude'?'<path class="hot" d="M194 47V244"/><path class="right" d="M194 224H214V244"/><path class="equal" d="M132 238v12M256 238v12"/>':''}${labels([[45,264,'A'],[331,264,'B'],[188,37,'C'],[190,266,k==='isoAltitude'?'H':'']])}`);
    if(k==='exterior')return svg(tri+`<path class="hot" d="M326 244H372"/>${labels([[342,232,'внешний']])}`);
    if(k==='bisector')return svg(tri+`<path class="hot" d="M62 244L264.73 142.22"/><path class="equal" d="M88 227l7 8M91 214l8 7"/>${labels([[271,139,'D']])}`);
    if(k==='rightMedian')return svg(right+`<path class="hot" d="M76 55L200 246"/><path class="equal" d="M136 240v12M264 240v12"/>${labels([[194,269,'M']])}`);
    if(k==='rightAltitude')return svg(right+`<path class="hot" d="M76 246L168.33 126.11"/><path class="right" d="M156.65 135.11l11.68 9l9-11.68"/>${labels([[173,123,'H']])}`);
    if(k==='orthocenter')return svg(tri+`<path class="aux" d="M62 244L255.77 127.34M326 244L156.21 117.52M208 48V244"/><circle class="point" cx="208" cy="156.10" r="5"/>${labels([[214,153,'H']])}`);
    if(k==='incenter')return svg(tri+`<path class="hot" d="M62 244L201.81 173.81M326 244L201.81 173.81M208 48L201.81 173.81"/><circle class="point" cx="201.81" cy="173.81" r="5"/>${labels([[208,170,'I']])}`);
    if(k==='parallelogram'||k==='paraHeight')return svg(`<path class="shape" d="M58 235L290 235L338 70L108 70Z"/>${k==='paraHeight'?'<path class="hot" d="M108 70V235"/><path class="right" d="M108 215h20v20"/><text x="115" y="158">h</text>':''}${labels([[41,255,'A'],[294,255,'B'],[343,68,'C'],[92,62,'D']])}`);
    if(k==='rhombus')return svg(`<path class="shape" d="M45 150L195 38L345 150L195 262Z"/><path class="hot" d="M45 150H345M195 38V262"/><path class="right" d="M195 150h18v18"/>${labels([[27,155,'A'],[190,30,'B'],[351,155,'C'],[190,282,'D']])}`);
    if(k==='triHeight')return svg(tri+`<path class="hot" d="M208 48V244"/><path class="right" d="M208 224h20v20"/><text x="215" y="151">hₐ</text>`);
    if(k==='triSine')return svg(`<path class="shape" d="M62 244L326 244L208 48Z"/><path class="hot" d="M62 244L208 48M62 244H326"/><path class="aux" d="M93 240A34 34 0 0 0 82 218"/>${labels([[45,264,'C'],[331,264,'A'],[202,38,'B'],[89,224,'C'],[127,147,'a'],[194,263,'b']])}`);
    if(k==='rightTriangle')return svg(right+labels([[170,264,'a'],[52,158,'b'],[194,143,'c']]));
    if(k==='equilateral')return svg(`<path class="shape" d="M65 244L325 244L195 19Z"/><path class="hot" d="M195 19V244"/><path class="right" d="M195 224h20v20"/><path class="equal" d="M122 135l12 7M268 135l-12 7M186 238v12M204 238v12"/>${labels([[49,264,'A'],[331,264,'B'],[190,16,'C'],[201,143,'h']])}`);
    if(k==='similar')return svg(`<path class="shape" d="M35 240L175 240L95 120Z"/><path class="shape" d="M235 240L340 240L280 150Z"/>${labels([[85,110,'△₁'],[270,140,'△₂'],[72,260,'k'],[260,260,'k² для площадей']])}`);
    if(k==='triMidline')return svg(tri+`<path class="hot" d="M135 146H267"/>${labels([[121,144,'D'],[272,144,'E']])}`);
    if(k==='trapMid')return svg(`<path class="shape" d="M48 244L342 244L281 66L112 66Z"/><path class="hot" d="M80 155H312"/><path class="aux" d="M48 244L281 66"/>${labels([[31,264,'A'],[347,264,'B'],[286,61,'C'],[96,61,'D'],[188,147,'m']])}`);
    if(k==='trigRight')return svg(right+`<path class="aux" d="M282 242A42 42 0 0 0 291 219"/>${labels([[284,221,'α'],[188,266,'прилежащий'],[47,158,'противолежащий'],[192,143,'гипотенуза']])}`);
    if(k==='unitCircle')return svg(`<circle class="circle" cx="195" cy="150" r="104"/><path class="aux" d="M195 28V272M73 150H317"/><path class="hot" d="M195 150L274 82M274 82V150M195 150H274"/><path class="right" d="M257 150v-17h17"/><circle class="point" cx="274" cy="82" r="5"/>${labels([[278,78,'P(cos α; sin α)'],[229,168,'cos α'],[280,119,'sin α'],[211,137,'α']])}`);
    return svg(tri)
  }
  function uuid(){if(window.crypto&&typeof crypto.randomUUID==='function')return crypto.randomUUID();return'evt-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)+'-'+Math.random().toString(36).slice(2)}
  function localDate(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  function elapsed(){return Math.max(1,Math.round((Date.now()-startedAt)/1000))}function timeText(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
  function penguin(n=1){return `<div class="penguins">${Array.from({length:n},(_,i)=>`<div class="penguin" style="--p:${i?0:0}"><i class="body"></i><i class="belly"></i><i class="eye l"></i><i class="eye r"></i><i class="beak"></i><i class="wing l"></i><i class="wing r"></i></div>`).join('')}</div>`}
  function scene(){return `<div class="scene"><i class="sun"></i><i class="river"></i><i class="cliff l"></i><i class="cliff r"></i><div class="bridge"><i class="rope"></i><div class="planks">${Array.from({length:11},(_,i)=>`<i class="plank on" style="--rot:${i%2?2:-2}deg"></i>`).join('')}</div><i class="rope"></i></div>${penguin(3)}</div>`}
  function storedStudent(){const studentId=localStorage.getItem('egeStudentId');return studentId?{studentId,name:localStorage.getItem('egeStudentName')||'Ученик',code:localStorage.getItem('egeStudentCode')||''}:null}
  function saveStudent(s){localStorage.setItem('egeStudentId',s.studentId);localStorage.setItem('egeStudentName',s.name);localStorage.setItem('egeStudentCode',s.code)}
  function parseStudent(data,code){const src=(data&&(data.student||data.data))||data||{},studentId=src.studentId||src.id||(data&&data.studentId),name=src.studentName||src.name||src.fullName||(data&&(data.studentName||data.name)),bad=data&&(data.success===false||data.valid===false||data.ok===false);if(bad||!studentId)throw new Error((data&&(data.message||data.error))||'Личный код не найден');return{studentId:String(studentId),name:String(name||'Ученик'),code:String(code)}}
  function validateStudent(code){return new Promise((resolve,reject)=>{const cb='egeValidate_'+Date.now()+'_'+Math.random().toString(36).slice(2),s=document.createElement('script');let done=false;const clean=()=>{delete window[cb];s.remove()},timer=setTimeout(()=>{if(done)return;done=true;clean();reject(new Error('Сервер не ответил. Проверь интернет'))},12000);window[cb]=data=>{if(done)return;done=true;clearTimeout(timer);clean();try{resolve(parseStudent(data,code))}catch(e){reject(e)}};s.onerror=()=>{if(done)return;done=true;clearTimeout(timer);clean();reject(new Error('Не удалось проверить код'))};s.src=API_URL+'?'+new URLSearchParams({action:'validateStudent',code,callback:cb});document.head.appendChild(s)})}
  function updateStudent(){const box=$('studentBox');box.style.display=student?'flex':'none';if(student)$('studentName').textContent=student.name;$('switchBtn').disabled=gameActive}
  function readQueue(){try{const q=JSON.parse(localStorage.getItem(PENDING_KEY)||'[]');return Array.isArray(q)?q:[]}catch(_){return[]}}function writeQueue(q){localStorage.setItem(PENDING_KEY,JSON.stringify(q))}function queueResult(p){const q=readQueue();if(!q.some(x=>x&&x.eventId===p.eventId))q.push(p);writeQueue(q)}function removeQueued(id){writeQueue(readQueue().filter(x=>!x||x.eventId!==id))}
  async function postResult(p){const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p),redirect:'follow'});if(!r.ok)throw new Error('submit')}
  async function flushPending(){if(!navigator.onLine)return;for(const p of readQueue()){if(!p||!p.eventId)continue;try{await postResult(p);removeQueued(p.eventId)}catch(_){}}}
  function setSave(cls,text){const e=$('saveStatus');if(e){e.className='save-status '+cls;e.textContent=text}}
  async function submitOnce(scorePercent,durationSeconds){if(resultSubmitted||!student)return;resultSubmitted=true;const payload={action:'submitTest',eventId:attemptEventId,studentId:student.studentId,testId:TEST_META.testId,testDate:localDate(),topicId:TEST_META.topicId,topicName:TEST_META.topicName,taskNumber:TEST_META.taskNumber,scorePercent,durationSeconds,schemaVersion:TEST_META.schemaVersion};setSave('','Сохраняем результат…');try{if(!navigator.onLine)throw new Error('offline');await postResult(payload);removeQueued(payload.eventId);setSave('ok','✓ Результат сохранён')}catch(_){queueResult(payload);setSave('bad','Нет связи: результат сохранён на устройстве и отправится позже')}}
  function renderLogin(prefill=''){gameActive=false;student=null;updateStudent();$('app').innerHTML=`<section class="screen login"><div class="scroll"><span class="tag">Пропуск на секретную операцию</span><h1>Переправа пингвинов</h1><p class="lead">Введи личный код ученика. Имя загрузится автоматически.</p><form class="code-form" id="loginForm"><input class="code" id="codeInput" maxlength="40" autocomplete="one-time-code" placeholder="ЛИЧНЫЙ КОД" value="${esc(prefill)}"><button class="primary" id="loginBtn">Проверить код</button><div class="status" id="loginStatus"></div></form></div>${scene()}</section>`;$('loginForm').addEventListener('submit',handleLogin);if(prefill)setTimeout(()=>$('loginForm').requestSubmit(),0)}
  async function handleLogin(e){e.preventDefault();const input=$('codeInput'),btn=$('loginBtn'),status=$('loginStatus'),code=input.value.trim();if(!code){status.className='status bad';status.textContent='Введи личный код';return}input.disabled=btn.disabled=true;status.textContent='Пингвины проверяют код…';try{student=await validateStudent(code);saveStudent(student);updateStudent();await flushPending();renderStart()}catch(err){status.className='status bad';status.textContent=err.message||'Код не подтверждён';input.disabled=btn.disabled=false;input.focus()}}
  function renderStart(){gameActive=false;updateStudent();$('app').innerHTML=`<section class="screen start"><div class="scroll"><span class="tag">Прототипы 1–2</span><h1>Построй переправу</h1><p class="lead">20 перемешанных утверждений по первым двум прототипам. Каждое свойство встретится в верной и неверной версии.</p><div class="rules"><div class="rule"><b>20</b>утверждений</div><div class="rule"><b>10 × 2</b>свойств</div><div class="rule"><b>∞</b>без таймера</div></div><p>После каждого ответа сразу откроются правильная формула и короткое объяснение.</p><button class="primary" id="startBtn">Начать операцию</button></div>${scene()}</section>`;$('startBtn').addEventListener('click',startGame)}
  function startGame(){deck=shuffle(facts);index=0;firstTryCorrect=0;questionAttempted=false;startedAt=Date.now();attemptEventId=uuid();resultSubmitted=false;gameActive=true;updateStudent();sound('start');renderQuestion()}
  function miniBridge(){const on=Math.ceil(index/TOTAL*11);return Array.from({length:11},(_,i)=>`<i class="${i<on?'on':''}"></i>`).join('')}
  function renderQuestion(){questionAttempted=false;const q=deck[index];$('app').innerHTML=`<section class="screen game"><div class="hud"><span class="counter">Доска ${index+1} / ${TOTAL}</span><div class="track"><i style="width:${index/TOTAL*100}%"></i></div><span class="score">Верно сразу: <b id="liveScore">${firstTryCorrect}</b></span></div><div class="quiz"><section class="statement-card"><div class="chapter">${esc(q.chapter)}</div><div class="statement">${esc(q.text)}</div><div class="answers"><button class="answer true" data-value="true">✓ ВЕРНО</button><button class="answer false" data-value="false">✕ НЕВЕРНО</button></div></section><section class="visual-card"><div class="visual-title">Чертёж к свойству</div><div class="diagram">${diagram(q.diagram)}</div><div class="feedback" id="feedback"></div></section></div><div class="bridge-mini">${miniBridge()}</div></section>`;document.querySelectorAll('.answer').forEach(b=>b.addEventListener('click',()=>answer(b.dataset.value==='true',b)))}
  function answer(value,button){if(questionAttempted)return;questionAttempted=true;const q=deck[index],correct=value===q.truth;if(correct)firstTryCorrect++;$('liveScore').textContent=firstTryCorrect;document.querySelectorAll('.answer').forEach(b=>b.disabled=true);button.classList.add(correct?'selected-good':'selected-bad');const box=$('feedback');box.innerHTML=`<span class="tag">${correct?'Точный расчёт':'Разбираем свойство'}</span><h2>${q.truth?'Утверждение верное':'Утверждение неверное'}</h2><div class="formula">${esc(q.formula)}</div><div class="explain">${esc(q.explain)}</div><button class="primary" id="nextBtn">${index===TOTAL-1?'Завершить переправу':'Следующая доска →'}</button>`;box.classList.add('show');$('nextBtn').addEventListener('click',nextQuestion);sound(correct?'good':'bad')}
  function nextQuestion(){index++;if(index>=TOTAL)finish();else renderQuestion()}
  function finish(){gameActive=false;updateStudent();const seconds=elapsed(),score=Math.round(firstTryCorrect/TOTAL*100);$('app').innerHTML=`<section class="screen final"><div class="scroll"><span class="tag">Операция завершена</span><h1>${score>=85?'Переправа готова!':score>=60?'Почти без потерь':'Нужна новая операция'}</h1><div class="ring" style="background:conic-gradient(#55b768 ${score}%,#c8b887 0)"><b>${score}%</b></div><p><b>Успешность с первой попытки</b></p><div class="stats"><div class="stat">Верных решений<b>${firstTryCorrect} из ${TOTAL}</b></div><div class="stat">Время прохождения<b>${timeText(seconds)}</b></div></div><div class="save-status" id="saveStatus">Сохраняем результат…</div><div class="actions"><button class="primary" id="againBtn">Пройти ещё раз</button><button class="secondary" id="homeBtn">На старт</button></div></div>${scene()}</section>`;$('againBtn').addEventListener('click',startGame);$('homeBtn').addEventListener('click',renderStart);sound('finish');submitOnce(score,seconds)}
  function changeStudent(){if(gameActive)return;['egeStudentId','egeStudentName','egeStudentCode'].forEach(k=>localStorage.removeItem(k));renderLogin()}
  function sound(type){if(muted)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ac=sound.ac||(sound.ac=new AC()),now=ac.currentTime,g=ac.createGain(),sets={start:[[130,.2],[250,.4]],good:[[400,.12],[650,.3]],bad:[[150,.2],[82,.38]],finish:[[250,.13],[420,.3],[680,.55]]},set=sets[type]||sets.good;g.connect(ac.destination);g.gain.setValueAtTime(.04,now);g.gain.exponentialRampToValueAtTime(.0001,now+set[set.length-1][1]+.12);set.forEach(([f,d],i)=>{const o=ac.createOscillator();o.type=type==='bad'?'sawtooth':'triangle';o.frequency.value=f;o.connect(g);o.start(now+i*.04);o.stop(now+d+.1)})}catch(_){}}
  $('switchBtn').addEventListener('click',changeStudent);$('soundBtn').addEventListener('click',()=>{muted=!muted;$('soundBtn').textContent=muted?'🔇':'🔊'});window.addEventListener('online',flushPending);
  async function init(){const code=new URLSearchParams(location.search).get('code');if(code){renderLogin(code);return}student=storedStudent();if(student){updateStudent();await flushPending();renderStart()}else renderLogin()}init();
  </script>
